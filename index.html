window.XM_PROLOGUE_CHAPTER={"index":0,"title":"序章　山门问心","meta":{"前置条件":["完成初始命格、出身、灵根与立绘选择"],"地点":["太清山门—问心台—灵鉴台—栖云院"],"出场角色":["你、阿阮、登记弟子、唐知夏、许守安"]},"nodes":[{"type":"text","text":"春雨初歇，青石山阶浸着凉意。山门前排起长队，湿透的纸伞挨在一处，水珠顺着伞骨滴进石缝，草木清气混着泥土味漫上来。"},{"type":"text","text":"（扬声）“今日酉时封册，尚未登记的人快些。”","speaker":"守门弟子"},{"type":"text","text":"你沿队尾向前走，路旁忽然响起一串竹篓磕碰声。几包药材滚下石阶，浅褐纸包擦过积水，苦涩药香立刻散了出来。"},{"type":"text","text":"（焦急）“劳烦帮我拦一拦！青叶根一沾水就坏，我先去捡上面的，最下面那包也别让它滚远了。”","speaker":"阿阮"},{"type":"choice","prompt":"选择","options":[{"key":"1","text":"帮阿阮收药","nodes":[{"type":"text","text":"你俯身按住滚到脚边的药包，又从浅草间找回最后一包苦叶根。"},{"type":"text","text":"（松了口气）“还好封口没散，不然这一篓药就要先少三成。谢谢你，我叫阿阮，也是今日来入门的。”","speaker":"阿阮"},{"type":"text","text":"“我也要去登记，我们正好同路。”","speaker":"我"},{"type":"text","text":"（明快）“那可太好了。我认得满山药草，山路一多便犯糊涂，方才已经绕回原地一趟了。”","speaker":"阿阮"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"2","text":"替阿阮背药","nodes":[{"type":"text","text":"你提起药篓。竹带压上肩头，浓郁的苦药香随风散开。"},{"type":"text","text":"（连忙）“是不是很沉？底下还压着两块药石。到了登记处便还我，我可不能入门第一天就欠你一整段山路。”","speaker":"阿阮"},{"type":"text","text":"“先赶上封册吧，到了山门再慢慢分。”","speaker":"我"},{"type":"text","text":"（笑）“好，那我替你看路。前面青苔滑，你踩右边那块浅色石头。”","speaker":"阿阮"}],"effects":[{"type":"stamina","value":-1},{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false}]},{"type":"text","text":"两条选择在山门前重新汇合。阿阮把药包按叶性重新码好，又取一段棉布垫在竹带下，免得药篓磨伤肩膀。远处封册钟敲过第一遍，檐下等候的人群随之向前挪动。"},{"type":"text","text":"（低头系紧药篓）“青叶根救回来了，时辰也赶得上。等入了门，我请你尝一颗新晒的甜草丸，入口先苦，过一会儿才甜。”","speaker":"阿阮"},{"type":"text","text":"（看向长阶尽头）“先记下这颗糖。若我们都分到栖云院，你再慢慢还我。”","speaker":"我"},{"type":"text","text":"阿阮笑着应下。两人随队伍穿过山门，湿石上的水声渐远，问心台悬在云雾之上，四周只剩风吹衣袂的轻响。\n\n问心台悬在山门之后。石面凉意透过鞋底，周围人声逐渐远去。"},{"type":"text","text":"“下一位弟子上前。手按问心石，回答心中所求。”","speaker":"登记弟子"},{"type":"text","text":"掌下石面缓缓发热，一道平静声音从识海深处响起。"},{"type":"text","text":"“你为何求仙？”","speaker":"问心石"},{"type":"choice","prompt":"选择","options":[{"key":"1","text":"想保护重要的人","nodes":[{"type":"text","text":"“我想拥有保护重要之人的能力。”","speaker":"我"},{"type":"text","text":"暖意沿掌心流入经脉，停在心口附近。"}],"effects":[{"type":"maxStamina","value":1}],"ending":false},{"key":"2","text":"想让家人过得更好","nodes":[{"type":"text","text":"“我想让家人过得更好。”","speaker":"我"},{"type":"text","text":"问心石亮起柔和微光，山下炊烟与旧屋灯火从眼前一闪而过。"}],"effects":[{"type":"stones","value":2}],"ending":false},{"key":"3","text":"想亲自选择以后","nodes":[{"type":"text","text":"“我想亲自决定往后要走的路。”","speaker":"我"},{"type":"text","text":"石面传来清越轻响，缠在腕间的雾气自行散开。"}],"effects":[{"type":"maxActions","value":1}],"ending":false},{"key":"4","text":"想走到更高处","nodes":[{"type":"text","text":"“我想走到更高处，看看自己究竟能走多远。”","speaker":"我"},{"type":"text","text":"一道灵光自石面升起，顺着山阶指向云中群峰。"}],"effects":[{"type":"cultivation","value":1}],"ending":false}]},{"type":"text","text":"通过问心后，新弟子依次在灵鉴台登记。青玉镜面映出灵根颜色，登记弟子将姓名录入弟子令。"},{"type":"text","text":"“下一位弟子，上前验灵。”","speaker":"登记弟子"},{"type":"text","text":"你将手按上灵鉴。镜中灵光停顿片刻，“新录”二字刚刚出现，便被一层水纹覆盖。\n\n【灵鉴显示：旧籍】"},{"type":"text","text":"（神色微变）“先把手从灵鉴上移开。”","speaker":"登记弟子"},{"type":"text","text":"他迅速翻转灵鉴，将异常水纹压进镜底。"},{"type":"text","text":"“灵鉴受潮，记录稍有迟滞。弟子令收好，往后遗失需到执事堂补办。”","speaker":"登记弟子"},{"type":"choice","prompt":"选择","options":[{"key":"1","text":"收下弟子令","nodes":[{"type":"text","text":"你接过弟子令，指腹触到背面一道尚未散去的凉意。"},{"type":"text","text":"（压低声音）“刚才镜面是不是闪了一下？我像是看见两个字，又被水纹盖住了。”","speaker":"阿阮"},{"type":"text","text":"“这里人多，我们先去栖云院，路上再说。”","speaker":"我"},{"type":"text","text":"（从队伍前方回头）“灵鉴台今日只在你登记时停过。”","speaker":"唐知夏"},{"type":"text","text":"她低头记下时辰与站位，笔尖在纸上沙沙掠过，随后收拢册页，跟上了队伍。"},{"type":"text","text":"“我只记亲眼看见的事。灵鉴先显新录，水纹覆上以后才变成旧籍，前后约有三次呼吸。”","speaker":"唐知夏"},{"type":"text","text":"（护住声音）“登记弟子在遮掩。咱们先收好弟子令，等离开灵鉴台再核对，省得又被叫进石门里。”","speaker":"阿阮"},{"type":"text","text":"下一名弟子的灵光顺利映上镜面，青玉镜恢复得过分平静。你把弟子令收入袖中，冰凉触感隔着布料贴在腕侧，直至走下石阶仍未散去。"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"当场追问旧籍","nodes":[{"type":"text","text":"“方才的“旧籍”是什么意思？”","speaker":"我"},{"type":"text","text":"登记弟子的手停在名册上。他抬眼看你，随后朝灵鉴台内侧招了招手。"},{"type":"text","text":"“名籍异常，需要复核。随我进去。”","speaker":"登记弟子"},{"type":"text","text":"石门在身后闭合，弟子令上的姓名被灰蓝水纹逐笔覆盖。\n\n【触发特殊失败结局：旧籍复核】"}],"effects":[{"type":"heartDemon","value":1}],"ending":true}]},{"type":"text","text":"正常登记完成后，你随新弟子来到栖云院。古松、山壁与药圃围出三处住区，檐下铜铃被晚风吹得轻响。雨水沿瓦当滴落，药架上的薄荷叶一阵阵送来清凉气味。"},{"type":"text","text":"（兴致勃勃）“我想住药圃旁边。天亮能看药苗，夜里闻着薄荷也好睡。你要是住得近，我采到新鲜药草就分你一份。”","speaker":"阿阮"},{"type":"text","text":"“古松侧离公用书架近，风势也小。若要誊抄功法，夜里会方便些。”","speaker":"唐知夏"},{"type":"text","text":"“山壁侧的地基最稳，雨天也少受风。屋顶若有漏处，告诉我一声，我带工具来补。”","speaker":"许守安"},{"type":"choice","prompt":"选择住处","options":[{"key":"1","text":"住在古松侧","nodes":[{"type":"text","text":"你选了古松旁的灵居。夜风穿过松针，屋内只余细密沙响。"},{"type":"text","text":"“明日登记册会送到公用书架。我准备按院号核一遍，你若早起，可以一起看看灵鉴台那一页。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"2","text":"住在山壁侧","nodes":[{"type":"text","text":"灵居背靠石壁，屋角还堆着几片新瓦。"},{"type":"text","text":"“左侧窗框有些松，夜里起风会响。我明早带木楔来，半刻钟便能修好，不会耽误你上课。”","speaker":"许守安"}],"effects":[{"type":"relation","name":"许守安","kind":"信任","value":1}],"ending":false},{"key":"3","text":"住在药圃侧","nodes":[{"type":"text","text":"推开窗便能看见成排药架，清苦香气随暮色飘入屋中。"},{"type":"text","text":"（在院外招手）“我就住隔壁！以后你若闻见焦味，先来敲门；我应得快，多半在烤药，半天不应，你再帮我端水。”","speaker":"阿阮"},{"type":"text","text":"夜色落下，弟子令在枕边泛着微光。那道灰蓝水纹已经消失，背面仍残留一丝潮冷。"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false}]},{"type":"text","text":"院门落锁以后，三处住区依次安静。药圃侧传来阿阮整理瓷罐的轻响，山壁侧偶有木楔敲入窗框，古松下的纸页被夜风翻过一角。\n\n你点亮案灯，将弟子令放在白纸上。正面的名字清晰如常，背面靠近系绳的位置多出一道极浅水痕，形状像被擦去一半的旧字。"},{"type":"text","text":"（提笔记下时辰）“今日才入山门，灵鉴便认错了我的名籍。它若还会出现，总会留下第二次痕迹。”","speaker":"我"},{"type":"text","text":"窗外晚钟越过群峰，弟子令随钟声微微发热。你写下自己的姓名，又在旁边添了一行：明日先查灵鉴台登记册。\n\n【主线线索：灵鉴旧籍】"}]};

window.XM_CHAPTERS=[{"index":1,"title":"第一章　栖云初课","meta":{"前置条件":["完成序章正常路线"],"地点":["栖云院—引气室—外门试法场"],"出场角色":["你、阿阮、唐知夏、许守安、裴青萝、周执"]},"nodes":[{"type":"text","text":"清晨钟声穿过栖云院，窗纸随余音轻轻发颤。引气室内铺着十二只蒲团，檀香与新削木料的气味混在一处，石砖还留着夜里的凉气。"},{"type":"text","text":"“今日先学感知灵气，能辨出一缕便算入门。经脉若有刺痛或灼热，立刻停下，举手示意。”","speaker":"周执"},{"type":"text","text":"你闭上眼，先听见窗外竹叶相擦，随后察觉一缕微凉气息停在指尖。"},{"type":"choice","prompt":"选择引气方式","options":[{"key":"1","text":"稳妥接引灵气","nodes":[{"type":"text","text":"你放慢呼吸，任那缕灵气随吐纳一点点靠近。数次散开后，微凉气息终于进入经脉。"},{"type":"text","text":"“气息已经入脉，走得也稳。记住方才的吐纳节奏，先别急着加快。”","speaker":"周执"}],"effects":[{"type":"cultivation","value":1}],"ending":false},{"key":"2","text":"主动多引灵气","nodes":[{"type":"text","text":"你牵动周围灵气一同入体。经脉传来短促刺痛，你及时收束气流，额角已经渗出薄汗。"},{"type":"text","text":"（小声）“你脸色都白了，指尖也凉。下课后先坐一会儿，我给你拿颗甜草丸，再配一口温水。”","speaker":"阿阮"}],"effects":[{"type":"cultivation","value":2},{"type":"stamina","value":-1}],"ending":false},{"key":"3","text":"借阵纹聚灵","nodes":[{"type":"text","text":"你循着蒲团下的纹路调整坐姿。三道散乱灵气在阵纹中央汇合，顺着掌心进入丹田。"},{"type":"text","text":"“第三道阵纹往外偏了半寸，你挪动蒲团后正好补上。等下课了，我把松动的石缝重新压实。”","speaker":"许守安"}],"effects":[{"type":"cultivation","value":1},{"type":"contribution","value":1}],"ending":false}]},{"type":"text","text":"午钟响过，引气室重新热闹起来。阿阮把甜草丸从最后一排递来，唐知夏在窗边补记每个人引气时的异常，许守安则蹲到蒲团下，把松动的石缝一块块压平。"},{"type":"text","text":"（抱剑倚在门边）“引进一缕灵气只是起点。半月后的试法课要让术法落到实处，木傀可不会坐着等人慢慢找感觉。”","speaker":"裴青萝"},{"type":"text","text":"（接过甜草丸）“那便半月后见。到时谁先点亮木傀胸前的铜片，谁请另一人喝茶。”","speaker":"我"},{"type":"text","text":"（扬眉）“说定了。茶要最好的，输的人也别赖账。”","speaker":"裴青萝"},{"type":"text","text":"众人从引气室散去时，周执将当日记录锁进木匣。匣角的铜钉与灵鉴台同样泛着灰蓝冷光，只在日色下闪了一瞬。\n\n半月后，外门弟子第一次进入试法场。午后的石台被晒得发烫，木傀沿阵轨缓慢移动，关节转动时发出枯涩摩擦声。裴青萝率先将引火术落在木傀胸口。"},{"type":"text","text":"“火星亮起才算起手。等你能把火落在木傀胸前的铜片上，这一式才算真正稳住。”","speaker":"裴青萝"},{"type":"text","text":"（举起熏黑的袖角）“容我先保住这只袖子吧。方才火星贴着布料过去，我闻见焦味才反应过来。”","speaker":"阿阮"},{"type":"text","text":"第二轮试法开始时，木傀底座忽然倾斜，供灵纹路越过界线，朝几名新弟子撞去。\n\n木轮碾过石面，刺耳摩擦声骤然拔高。最前方弟子的衣摆被阵风卷住，另两人慌忙后退，反倒堵住了出口。木傀胸前的铜片由红转青，抬起的木臂直指人群。"},{"type":"text","text":"（迅速退到阵外）“底座向右偏了三寸，供灵纹还在加速。周执，东侧节点亮了两次！”","speaker":"唐知夏"},{"type":"text","text":"“所有人沿墙退开，别跨过发光阵纹！裴青萝守住木傀左侧，许守安去找断灵钉。”","speaker":"周执"},{"type":"choice","prompt":"选择处理方式","options":[{"key":"1","text":"关闭供灵阵纹","nodes":[{"type":"text","text":"你沿地面寻找供灵节点，拔出嵌在阵纹中央的小灵石。木傀胸前光芒熄灭，停在石阶前。"},{"type":"text","text":"“先断灵源，方向选得对。木傀停稳后再查阵轮，别急着靠近。”","speaker":"周执"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"同裴青萝稳傀","nodes":[{"type":"text","text":"你与裴青萝分立两侧，同时扶住倾倒的木傀。她以剑鞘卡住底座，你将错位阵轮推回轨道。"},{"type":"text","text":"“你补的是右侧阵轮，判断很准。下次再早半步，木傀连石阶都碰不到。”","speaker":"裴青萝"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false},{"key":"3","text":"以术法拦木傀","nodes":[{"type":"text","text":"你将尚未散去的术法推向木傀双腿。灵光撞上阵轮，木傀在界线前偏转半圈，重重倒地。"},{"type":"text","text":"（眼睛发亮）“你方才那一下真准，木傀再往前半步便要撞上人了。等回去以后，你得教我怎么找它的落脚处。”","speaker":"阿阮"},{"type":"text","text":"周执封闭试法场，许守安留下检查底座。木傀脚下的铜钉泛着灰蓝色，边缘刻有模糊的“四”字。"}],"effects":[{"type":"cultivation","value":2}],"ending":false}]},{"type":"text","text":"受惊的新弟子被带到廊下缓气。阿阮替擦伤者洗去掌心砂砾，苦药水碰上伤口时，那人疼得倒吸一口凉气。裴青萝收起练习剑，独自回到阵线旁查看木傀留下的深痕。"},{"type":"text","text":"（用封条缠住铜钉）“今日事故会如实记入外门册。木傀在启用前验过三次，铜钉却在试法途中变色，问题出在阵材，不在任何一名新弟子。”","speaker":"周执"},{"type":"text","text":"“四字只剩右半边，钉尾还沾着水砂。它原先应当装在水阵附近，被人磨短以后才塞进木傀底座。”","speaker":"许守安"},{"type":"text","text":"（蹲下看向石面）“灵鉴台也出现过同样颜色的水纹。两处相隔这么远，未必只是巧合。”","speaker":"我"},{"type":"text","text":"晚风穿过封闭的试法场，倾倒木傀的关节仍在轻轻作响。周执将灰蓝铜钉收入证物袋，在封口处写下日期与在场者姓名。\n\n【主线线索更新：灰蓝铜钉·四】"}]},{"index":2,"title":"第二章　后山剑声","meta":{"前置条件":["完成第一章《栖云初课》"],"地点":["后山旧剑坪"],"出场角色":["你、裴青萝、周执、沈砚"]},"nodes":[{"type":"text","text":"夏日午后，旧剑坪被日光晒得发白。松脂气味从石缝间蒸起，埋在土里的断刃受风震动，低鸣沿着鞋底传来。"},{"type":"text","text":"“还是三招。你若能接住最后一剑，我便把昨日那处收势错位拆给你看。”","speaker":"裴青萝"},{"type":"text","text":"她的第一剑压向肩侧，第二剑封住退路。你借石台边缘转身，练习剑在第三招时撞上她的剑脊。"},{"type":"text","text":"（收剑）“第二步比上次稳，最后收腕还是快了半拍。再来一遍，你自己也能听出差别。”","speaker":"裴青萝"},{"type":"text","text":"一道剑光从高处落下，击散石台边缘残留的乱流。沈砚站在旧碑旁，剑鞘上沾着松针。\n\n松林忽然静了一层，埋在土中的断刃也止住低鸣。沈砚一身白衣立在碑影下，眉目清冷，日光从肩侧落过去，照不暖他握剑的手。\n\n他未走近，只以剑气将地上一截断刃推回石缝。你方才后退时，鞋跟离那截锋刃只差半步。"},{"type":"text","text":"“沈师兄在此查旧剑坪裂痕。你们先停手。”","speaker":"周执"},{"type":"text","text":"“不必停太久。她方才那一剑若再急半分，灵气会逆冲腕脉，先把收势调顺。”","speaker":"沈砚"},{"type":"text","text":"“你方才一直在听我们练剑吗？”","speaker":"我"},{"type":"text","text":"“旧剑坪回声清楚。剑锋破风与灵气回转的声音不同，闭着眼也能分辨。”","speaker":"沈砚"},{"type":"text","text":"他走下石阶，剑尖点在你方才落脚的位置。"},{"type":"text","text":"“先松肩，再收腕。你回剑时惯于提前收力，今日更快了半拍，腕脉才会发紧。”","speaker":"沈砚"},{"type":"text","text":"他的话落在断刃余鸣里，熟悉得近乎反常。你抬眼时，他已经将视线移向石台边缘。"},{"type":"text","text":"（活动发紧的手腕）“我自己只觉得收剑快了些，沈师兄连回剑的习惯也听得出来？”","speaker":"我"},{"type":"text","text":"“你的剑声轻，收势时会向右偏。今日偏得更多。”","speaker":"沈砚"},{"type":"text","text":"沈砚答得平静，视线在你腕间停了一瞬。他从袖中取出一条冷巾，放在旧碑旁的干净石面上，位置恰好伸手可及。"},{"type":"text","text":"“先敷腕脉。练完再走。”","speaker":"沈砚"},{"type":"text","text":"话音落下，沈砚已经退回碑侧。冷巾带着淡淡竹叶气，避开了旧剑坪上最浓的松脂味。"},{"type":"choice","prompt":"选择练剑方式","options":[{"key":"1","text":"请沈砚示范","nodes":[{"type":"text","text":"“沈师兄，可以劳烦你示范一次吗？”","speaker":"我"},{"type":"text","text":"沈砚接过练习剑。剑锋起落间只带起一阵清风，碎石上的松针齐齐向外滑开。"},{"type":"text","text":"“看清灵气回转的位置，再照自己的习惯练一遍，不必勉强模仿我的剑路。”","speaker":"沈砚"},{"type":"text","text":"你照着他指出的轨迹出剑。收势落定时，他按在旧剑鞘上的手指微微松开，眼底也淡去几分倦色。"}],"effects":[{"type":"relation","name":"沈砚","kind":"好感","value":1}],"ending":false},{"key":"2","text":"请沈砚指经脉","nodes":[{"type":"text","text":"“沈砚师兄，这一式最容易伤到哪处经脉？”","speaker":"我"},{"type":"text","text":"“腕脉其次，肩后的灵枢更要紧。疼痛传到肘间时便该停手。”","speaker":"沈砚"},{"type":"text","text":"他以剑鞘点出三处灵气节点，讲得清楚而克制。"}],"effects":[{"type":"cultivation","value":1}],"ending":false},{"key":"3","text":"自行复练剑招","nodes":[{"type":"text","text":"你退回剑坪中央，按自己的理解重练三次。第四次收剑时，灵气终于顺着手臂平稳退回丹田。"},{"type":"text","text":"“这一遍稳住了。记住方才第三息的呼吸，腕脉便不会再被剑势拖走。”","speaker":"沈砚"},{"type":"text","text":"离开前，你在旧碑下发现一道新鲜剑痕。它与沈砚方才的剑式同源，刻痕深处积着多年尘灰，新旧痕迹叠在了一处。"}],"effects":[{"type":"cultivation","value":2}],"ending":false}]},{"type":"text","text":"夕阳沉到松林背后，剑坪边缘渐渐起了凉风。裴青萝先行送还练习剑，周执抱着裂痕记录下山，石台上只剩你与沈砚隔着几步距离。"},{"type":"text","text":"（收好冷巾）“沈师兄，这条冷巾我洗净以后还给你。”","speaker":"我"},{"type":"text","text":"“你留着用。练剑后腕脉容易发热。”","speaker":"沈砚"},{"type":"text","text":"沈砚停了停，又将一瓶气味清淡的活络药放在石面。药瓶旁压着一张窄纸，只写着用量与时辰，字迹冷峻整齐。"},{"type":"text","text":"“你还记得我不喜欢药味太重？”","speaker":"我"},{"type":"text","text":"林风拂过沈砚的发带。他垂眼收剑，神情依旧淡得像远山薄雪。"},{"type":"text","text":"“这件事我记得。”","speaker":"沈砚"},{"type":"text","text":"沈砚先一步走下石阶，剑鞘沿路拨开两处松动碎石。两人的距离始终隔着几步，你下山时，每一处容易踩空的地方都已经清了出来。"}]},{"index":3,"title":"第三章　百草外巡","meta":{"前置条件":["完成第二章《后山剑声》"],"地点":["百草园外谷"],"出场角色":["你、阿阮、谢临川"]},"nodes":[{"type":"text","text":"秋日山谷积着昨夜的雨，靴底踩过腐叶，湿润草木气便从石缝里漫出来。你与阿阮沿溪采药，竹篓里已经铺了半层青露叶。"},{"type":"text","text":"（拨开花叶）“前面还有一片月白花，花根旁常伴生止血藤。咱们采够两把便往回走，今日灵膳堂有桂花米糕，去晚了准要被抢光。”","speaker":"阿阮"},{"type":"text","text":"溪水忽然泛起腥甜气味。上游灌木接连折断，一只泽角兽撞开药圃围栏，前腿缠满发黑藤蔓，粗重喘息压过了水声。"},{"type":"text","text":"（皱眉）“它的腿伤得很深，伤口里还灌了污水。那条黑藤会钻灵脉，你先别用手碰，我找药粉压住毒性。”","speaker":"阿阮"},{"type":"text","text":"一枚巡防箭钉在妖兽前方。谢临川从山坡跃下，抬手将第二枚箭搭上弦。"},{"type":"text","text":"（沉声）“先退到高处，别站在它右腿后面！我来引开它，你们护住药篓。”","speaker":"谢临川"},{"type":"text","text":"谢临川侧身避过兽角，转眼看清你的脸。绷紧的眉眼倏地亮了，唇角压了又扬起来；箭锋仍稳稳指着泽角兽前方，脚下已经换到更利于救援的位置。\n\n谢临川比你年幼些，幼时常同你翻山认路。如今他已经高过你半头，眉眼一弯，仍有故城春日里明亮的模样。"},{"type":"text","text":"（惊喜）“真的是你！我前几日听见新弟子的名册里有个名字像你，跑去看了两回，每回都跟你错开。”","speaker":"谢临川"},{"type":"text","text":"谢临川眼里的欢喜明晃晃落在你身上，像雨后忽然照进山谷的日光。他还想再说什么，泽角兽猛地踏碎溪边石块，飞溅泥水打上巡防衣摆。"},{"type":"text","text":"（立刻回身）“等我把这边处理好。师姐站在白石后面，别让黑藤碰到袖口。”","speaker":"谢临川"},{"type":"text","text":"谢临川吹出两声短哨，先报方位，再把巡防绳绕过树根。方才藏不住的笑意收进眼底，手中每一道绳结都打得稳而快。"},{"type":"text","text":"“临川，先把它救下来。等回去以后，我再听你慢慢说。”","speaker":"我"},{"type":"text","text":"（立即应声）“好，听你的。你带阿阮往高处走，我引它转身。它右后腿还能发力，小心扫尾。”","speaker":"谢临川"},{"type":"choice","prompt":"选择应对方式","options":[{"key":"1","text":"护住阿阮药篓","nodes":[{"type":"text","text":"你带阿阮退到岩石后，将散落药材全部收回。妖兽扫来的污水被护身灵光挡在外侧。"},{"type":"text","text":"（飞快翻开药囊）“药材都在，我也能帮忙。给我三息，我把安神粉和止血藤配在一起，你看它什么时候张口。”","speaker":"阿阮"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"2","text":"与谢临川截兽","nodes":[{"type":"text","text":"你迎上谢临川的目光，抬手指向泽角兽右侧。他立刻收起弓箭，巡防绳贴地甩出，你的术法同时封住兽后退路。"},{"type":"text","text":"“临川，照我们从前赶山兽的法子来。我守右边，你截住它的前腿。”","speaker":"我"},{"type":"text","text":"（笑意更盛）“我就知道你还记得。有你守着右边，我这根绳可比平日听话多了。”","speaker":"谢临川"},{"type":"text","text":"他笑归笑，手上丝毫不慢。绳扣掠过兽角，第二道雷光紧跟着封住黑藤，稳稳避开了它受伤的腿。"}],"effects":[{"type":"relation","name":"谢临川","kind":"好感","value":1}],"ending":false},{"key":"3","text":"追查溪水污染","nodes":[{"type":"text","text":"你沿溪向上，找到一只破裂的灰蓝药罐。罐底刻着“四”字，黑水正从裂口渗入溪中。"},{"type":"text","text":"（赶来查看）“罐口还留着蚀灵粉，碰到皮肤会发麻。你站到上风处，我拓下印记，再交巡防堂封溪。”","speaker":"谢临川"},{"type":"text","text":"阿阮将安神粉送入风口，清苦药香压住水腥气。泽角兽的喘息渐渐平缓，谢临川蹲在泥水里割开黑藤，替它缠好伤腿，才将它引回林间。\n\n黑藤根须钻得很深，刀锋每往下半寸，泽角兽便疼得抽动。谢临川用膝侧稳住兽角，声音放得很轻，另一只手始终避开伤口。"},{"type":"text","text":"“再忍一会儿，最后一截藤根就出来了。你往林子里走，别再喝这段溪水。”","speaker":"谢临川"},{"type":"text","text":"最后一截黑藤落地，腥甜汁液蚀得湿泥冒出白烟。谢临川迅速覆上封毒砂，又沿上游钉下三枚红色警标，封住其他灵兽可能靠近的水路。"},{"type":"text","text":"（擦着额角的汗）“幸好它肯安静下来。再挣两次，这条腿真要保不住了。”","speaker":"阿阮"},{"type":"text","text":"（回头看你）“西谷还差一段路，我巡完便去栖云院找你。你可别早早睡下，我攒了好多话，今日怎么也要说给你听。”","speaker":"谢临川"},{"type":"text","text":"他退开两步，又像想起什么似的折回来，将一枚外巡传讯符塞进你手里。符纸还带着掌心的热度。"},{"type":"text","text":"“山里若再闻见这股水腥气，立刻唤我。无论我巡到哪一段，都会赶过来。”","speaker":"谢临川"}],"effects":[{"type":"contribution","value":1}],"ending":false}]},{"type":"text","text":"巡防弟子赶到后接管封溪。谢临川逐一交代污染位置、泽角兽去向与黑藤毒性，直到记录上的人数、药篓与伤员全都对上，他才重新走到你身边。\n\n你掌心被碎石划开一道细口，他一眼便看见了。谢临川取出随身药布，半蹲在石边，先用清水冲净泥砂，再把布条绕得松紧合宜。"},{"type":"text","text":"（抬眼看你）“师姐还是这样，一忙起来就顾不上自己。伤口不深，回去也得换药，今夜别碰冷水。”","speaker":"谢临川"},{"type":"text","text":"（看着他湿透的衣袖）“你自己也在泥水里滚了一身，先把气喘匀再说我。”","speaker":"我"},{"type":"text","text":"谢临川听得眼睛一弯，很自然地在你身旁坐下。肩膀刚挨近衣袖，他又想起自己满身湿泥，立刻往外让了半寸。"},{"type":"text","text":"（笑着放轻声音）“那师姐陪我坐一会儿。等呼吸稳了，我替你背药篓回去，路上再讲这一年宗门里发生的事。”","speaker":"谢临川"},{"type":"text","text":"回程山路仍湿滑。谢临川背着药篓走在外侧，每逢溪石难落脚便先踩稳一步，又回头等你跟上。暮色降到谷口时，他说了一路的话，遇见巡防哨音仍能立刻辨清方向。"}]},{"index":4,"title":"第四章　灵墟初市","meta":{"前置条件":["完成第三章《百草外巡》"],"地点":["灵墟坊市"],"出场角色":["你、林惊雨、墨无咎"]},"nodes":[{"type":"text","text":"灵墟坊市临水而建。药香、烤栗与符纸烧过的焦味裹在潮风里，铜铃与叫卖声从长街一路响到码头。"},{"type":"text","text":"（拨着钱袋）“传讯符在前面第三摊，照明符还要再往右。先说好，价我来谈，货你来验；若还买到假货，这顿烤栗便算摊主赔咱们的。”","speaker":"林惊雨"},{"type":"text","text":"一名摊主正兜售低价护身符。符纸边缘泛白，朱砂中夹着不该出现的黑屑。"},{"type":"text","text":"“符纸受过潮，朱砂里又混了黑屑。这批符用上一次，护身灵光便会散。”","speaker":"我"},{"type":"text","text":"“太清宗弟子也不能空口坏人买卖。”","speaker":"摊主"},{"type":"text","text":"（带笑）“既然各执一词，借试符石说话最省事。真货照价卖，假货也别急着收，留给坊市管事认一认来路。”","speaker":"墨无咎"},{"type":"text","text":"墨无咎说得温和，手指却恰好压住摊主准备收回的押货单。摊主抽了两次未能抽动，额角很快见汗。"},{"type":"text","text":"（看向摊主）“你方才说货是今早从东码头来的，押货单却沾着西仓的蓝漆。两处隔着半条河，总得有一句是真的。”","speaker":"墨无咎"},{"type":"text","text":"“我只负责摆摊，仓里的事一概不知。”","speaker":"摊主"},{"type":"text","text":"（笑意未变）“那便更好。你只需说出谁让你把太清宗弟子带到这摊前，余下的账与阁下无关。”","speaker":"墨无咎"},{"type":"text","text":"周围叫卖声仍旧热闹，摊主的手却悄悄摸向袖中传讯符。林惊雨横过一步挡住街口，铜铃在她肩侧叮地一响。\n\n他取起一张残符，旧铜钱在指间转了半圈，随后压住纸角轻轻一捻，褪色的路线印便从夹层里露了出来。"},{"type":"text","text":"“这枚印停用了十多年。有人借旧商路送新货，还特意挑了太清弟子常来的摊位，算盘打得很细。”","speaker":"墨无咎"},{"type":"choice","prompt":"选择处理方式","options":[{"key":"1","text":"当众验符","nodes":[{"type":"text","text":"坊市管事取来试符石。护身符贴上石面，只亮起半道灵光便冒出焦味。"},{"type":"text","text":"“这下连口舌都省了。后面排队的二十来双眼睛看得清楚，摊主想赖账也得先问大家答不答应。”","speaker":"林惊雨"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"私下要求退货","nodes":[{"type":"text","text":"你指出符纸与朱砂的问题，要求摊主退还灵石并收回同批残符。"},{"type":"text","text":"（脸色难看）“这批货也是别人押来的。”","speaker":"摊主"},{"type":"text","text":"“押货凭据还在吗？交给坊市管事查清来路，也免得下一摊继续收进同批残符。”","speaker":"我"}],"effects":[{"type":"stones","value":2}],"ending":false},{"key":"3","text":"与墨无咎核印","nodes":[{"type":"text","text":"“墨无咎，看你的神色，这枚旧印背后还藏着别的路吧？”","speaker":"我"},{"type":"text","text":"（指间铜钱一停）“眼力不错。我认得它，也在这条路上吃过亏。陪我核一遍货单，旧路通向何处、谁还在用，我都如实告诉你。”","speaker":"墨无咎"},{"type":"text","text":"你们对照三张货单，发现旧路线最终都指向坊市西仓。"},{"type":"text","text":"（将其中一张反扣）“先别急着封路。西仓若真有人守着，他看见坊市管事过去，只会烧账本。咱们照常买完传讯符，再从河堤后门进去。”","speaker":"墨无咎"},{"type":"text","text":"（看向被反扣的货单）“这张单子是你故意留给摊主看的？”","speaker":"我"},{"type":"text","text":"“上面写着东仓。肯替他送信的人，会替我们把假消息送到真正的主家手里。”","speaker":"墨无咎"},{"type":"text","text":"墨无咎抛给摊主两枚灵石，仍像寻常客人般挑了一包烤栗。转过街角后，他将温热纸袋递来，自己沿河堤走向西仓，步子从容得像赴一场早已算清的约。\n\n西仓中藏着几只双层木箱。潮木气味从夹板下涌出，上层堆着残符，下层残留灰蓝砂石与问天石粉末。"},{"type":"text","text":"“货既从我熟悉的路上经过，这笔账便绕不开我。西仓今夜先封，明日我再顺着担保印往下查，免得证据趁夜长出脚来。”","speaker":"墨无咎"}],"effects":[{"type":"relation","name":"墨无咎","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"话音刚落，仓后传来木窗落地的闷响。一名灰衣伙计抱着账匣翻上河堤，脚下才沾到湿石，两张缚行符便从暗处亮起。"},{"type":"text","text":"（从船篷后探头）“东仓的假消息送得真快。墨公子这张网，连给人逃跑的缝都量过了。”","speaker":"林惊雨"},{"type":"text","text":"（俯身拾起账匣）“缝当然要留。看不见出口的人只会拼命守着秘密，看见出口的人才会替我把秘密带出来。”","speaker":"墨无咎"},{"type":"text","text":"账匣里藏着两套货单。明账写残符，暗账只记箱号、旧路线印与一个模糊的庄字。墨无咎将暗账原封交给坊市管事，又亲手在西仓门上落下封签。"},{"type":"text","text":"“你若早就怀疑西仓，方才为何还要问我怎么处理？”","speaker":"我"},{"type":"text","text":"（抬眸看你）“我想知道你看见假货时，先护买货的人，先追灵石，还是先找货路。如今知道了，往后与姑娘合作，我便少算错一项。”","speaker":"墨无咎"},{"type":"text","text":"河风吹散烤栗甜香，墨无咎脸上仍带着笑，眼底却清醒得近乎锋利。封签落定以后，他把未拆的那包烤栗留给你，转身去核每一名经手人。"}]},{"index":5,"title":"第五章　天衡问剑","meta":{"前置条件":["完成第四章《灵墟初市》"],"地点":["天衡峰问剑台"],"出场角色":["你、裴青萝、周执、顾长清"]},"nodes":[{"type":"text","text":"问剑台立在云海边缘，九面阵旗沿石路展开。高处风声割过旗角，剑影受阵法牵引，落在护身灵光上时迸出细碎鸣响。"},{"type":"text","text":"“通过三道剑门便算完成考核。若阵旗异响，先离开阵线，再等教习处置；试炼名次不值得拿经脉去换。”","speaker":"周执"},{"type":"text","text":"第二道剑门开启后，一面阵旗忽然偏转。剑影越过限定石路，朝倒地弟子连续落下。"},{"type":"text","text":"“左侧阵旗错位了！”","speaker":"裴青萝"},{"type":"text","text":"顾长清从高台落下，袖间金纹令牌一闪，原本封闭的主阵权限随之开启。"},{"type":"text","text":"（声音沉稳）“周执，断开东侧供灵。其余弟子沿白石线撤出剑门，医修在第三阶接应伤者。”","speaker":"顾长清"},{"type":"text","text":"风声与剑鸣撞在一处，他的声音仍清晰落进每个人耳中。阵台上的教习各自领命，混乱很快收拢成几条撤离路线。\n\n顾长清先落到伤者身前，以灵力托住不断下坠的剑影。碎光擦过他的袖角，金线被割开数道，他仍稳稳报出每一条撤离路的方向。"},{"type":"text","text":"“裴青萝守左侧，不必追入主阵。周执清点离场人数，少一人便立刻报我。其余人沿白石线走，听见第三声钟再过剑门。”","speaker":"顾长清"},{"type":"text","text":"一名年幼弟子被剑鸣震得腿软，顾长清没有催促。他侧身挡住迎面阵风，等那名弟子重新站稳，才将人交给赶来的医修。"},{"type":"choice","prompt":"选择处理方式","options":[{"key":"1","text":"先救受伤弟子","nodes":[{"type":"text","text":"你折回剑门，将受伤弟子扶离剑影范围。护身灵光被余波撞得一晃，周执及时切断了外侧供灵。"},{"type":"text","text":"（扶稳伤者肩背）“医修就在第三阶。你右臂方才受了余震，先调匀气息，确认经脉无碍再回阵中。”","speaker":"顾长清"},{"type":"text","text":"顾长清将伤者交给医修，仍留在阶前等你活动右臂。确认手指与腕脉都能正常用力，他才转身接住下一道坠落剑影。"},{"type":"text","text":"“右臂无碍。我送完这一人，再回来帮周执清点阵外弟子。”","speaker":"我"},{"type":"text","text":"“好。白石线外已经安全，你按自己的步子走，阵内由我守住。”","speaker":"顾长清"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"自行破开剑影","nodes":[{"type":"text","text":"你迎着剑影向前，以术法击散最靠近的两道灵光。第三道剑影偏向阵旗，露出错位的固定钉。"},{"type":"text","text":"“错位钉在旗座下面！你压住剑影，我来拔钉，三息足够。”","speaker":"裴青萝"},{"type":"text","text":"你将两道剑影引向石柱，裴青萝贴地滑到旗座旁。错位钉拔出的刹那，阵旗猛地反转，碎光擦着她的肩背扫过。"},{"type":"text","text":"“西侧还有一道回流，我压住它。裴青萝，退到白石线后再收剑。”","speaker":"我"},{"type":"text","text":"裴青萝借你的术法落稳，反手将错位钉掷到阵外。顾长清接住证物，随即封闭旗座下的空槽。"}],"effects":[{"type":"cultivation","value":2}],"ending":false},{"key":"3","text":"与顾长清定阵","nodes":[{"type":"text","text":"“顾师兄，西侧阵线还缺一人吗？我可以随你定阵。”","speaker":"我"},{"type":"text","text":"“正缺一人压住回流。你守西侧第二道纹，第三声钟响时与我一同收灵；若腕脉发麻，立即松手。”","speaker":"顾长清"},{"type":"text","text":"两股灵力沿阵纹合拢，错位阵旗被重新拉回原位。\n\n阵纹回流比预想更重，麻意顺着掌心窜到手肘。顾长清先分走大半阵压，等你的灵力平稳后才一同收势。"},{"type":"text","text":"“西侧已经定住。你方才主动入阵，我记得；此刻先顾好经脉，余下的风险由我承担。”\n\n（向你颔首）“收灵时机很准，多谢。余下的阵纹由我处理，你先去看看方才受伤的弟子。”","speaker":"顾长清"},{"type":"text","text":"阵旗底部嵌着灰蓝石粉，碰上风便散出淡淡水腥气。顾长清将其封入证物袋，金纹令牌在指间一转，重新收敛成普通亲传调令。"}],"effects":[{"type":"relation","name":"顾长清","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"剑门彻底停下后，顾长清没有宣布考核作废，也未让弟子立即散去。他请医修当场记录伤势，再将每个人走过的阵线分别画在三张图上。"},{"type":"text","text":"（将一盏温茶递给受惊弟子）“今日所见照实说即可。记不清的地方空着，别为了补全记录勉强猜测。”","speaker":"顾长清"},{"type":"text","text":"“顾师兄的令牌能直接开启主阵，这不是普通亲传弟子的权限。”","speaker":"我"},{"type":"text","text":"云海从问剑台下翻涌而过。顾长清看向你，神情仍温和，避开这个问题只会显得敷衍，他也清楚这一点。"},{"type":"text","text":"“这枚令牌能在危急时接管三峰试阵，来历暂时不便公开。今日的阵材、伤者与调令记录，我都可以给你看。等权限一事能够说明，我会亲口回答。”","speaker":"顾长清"},{"type":"text","text":"（接过记录）“好。我先看眼下能查清的部分。”","speaker":"我"},{"type":"text","text":"顾长清颔首，将证物袋与阵图一并放到你面前。他没有靠近催问，只守在迎风一侧，替案上的纸页挡住不断卷来的湿雾。\n\n【主线线索更新：问剑台灰蓝石粉】"}]},{"index":6,"title":"第六章·上　丹火初燃","meta":{"前置条件":["完成第五章《天衡问剑》"],"地点":["丹霞峰丹房"],"出场角色":["你、阿阮、唐知夏、温鹤丹"]},"nodes":[{"type":"text","text":"丹房窗棂被热气熏得发白，药草苦香压过炉炭气味，铜炉里的火声细密如雨。温鹤丹将今日药材分成三份，逐一核对封签。"},{"type":"text","text":"（熟练地翻开叶片）“青梗草得先烘软，再顺着叶脉切。直接丢进炉里，会炸出一屋子苦汁，我头一回试的时候连头发都是苦的。”","speaker":"阿阮"},{"type":"text","text":"（笔尖停住）“你上个月告诉我，这个法子是温师兄亲手教的，我还记了日期。”","speaker":"唐知夏"},{"type":"text","text":"（迟疑）“我应当是在医案上见过他的批注……也许记混了。”","speaker":"阿阮"},{"type":"text","text":"（看向她）“我怎么记得你没有见过温师兄？那日你还问过，他的字迹为何与医案末页不同。”","speaker":"唐知夏"},{"type":"text","text":"阿阮愣在炉火前，药刀悬在半空。丹火映着她骤然发白的指节，青梗草的汁液顺着刀口滴落。"},{"type":"text","text":"（语调放缓）“先把药封起来，别让气味继续散。阿阮，放下药刀，缓一缓呼吸。这一批青梗草的颜色也有异样。”","speaker":"温鹤丹"},{"type":"text","text":"一株灰蓝药草被投入邻炉，丹火骤然反卷，火舌沿炉壁窜向木架。\n\n铜炉发出一声沉闷爆响，炉盖被气浪顶起半尺。滚烫药液泼上青砖，刺鼻白烟贴地散开，靠近门边的弟子一时看不清出口。"},{"type":"text","text":"“所有人掩住口鼻，沿北墙离开！阿阮关药柜，唐知夏报出入炉次序，别让第二座炉子再添药。”","speaker":"温鹤丹"},{"type":"text","text":"阿阮用湿布裹住手臂，扑到药柜前扣紧铜锁。唐知夏退到白烟之外，一项项报出药名与时辰，声音快而清楚。"},{"type":"text","text":"（咳嗽着回头）“东侧架上还有两盒引火砂，热浪再过去一次就会炸。谁能腾出手，把架子推到隔火槽后面！”","speaker":"阿阮"},{"type":"choice","prompt":"选择应对方式","options":[{"key":"1","text":"压低失控丹火","nodes":[{"type":"text","text":"你将灵气压入控火纹，灼热火浪舔过手背，炉底传出接连闷响。温鹤丹逐一关闭供灵石，最后一缕火舌擦过木架，缩回炉腹。\n\n控火纹烫得发红，你撤手时掌心已经起了一层水泡。阿阮立刻泼下冷药水，温鹤丹则用隔火罩封住炉口，防止残余药气再次引燃。"},{"type":"text","text":"“丹火已经压住，先处理烫伤。炉中残渣待温度降下再取，谁都别为抢证据把手伸进去。”","speaker":"温鹤丹"}],"effects":[{"type":"cultivation","value":1}],"ending":false},{"key":"2","text":"同阿阮辨药","nodes":[{"type":"text","text":"你与阿阮将混入的药草逐株挑出。她捻开灰蓝叶脉，闻到一缕熟悉的水腥气。"},{"type":"text","text":"（神色凝住）“就是百草外谷那股水腥气，连叶汁入口后的麻意都一样。那只泽角兽腿上的黑藤，多半也沾过这种东西。”","speaker":"阿阮"},{"type":"text","text":"阿阮用银夹取出叶芯，灰蓝汁液沿瓷盘聚成细线，遇到火气便自行朝炉底爬去。她把自己的发现说完，又主动在证物签上写下姓名。"},{"type":"text","text":"“我认得这股气味，也接触过同批药草。后续若要验毒，先从我的脉象查起，省得漏掉已经出现的反应。”","speaker":"阿阮"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"3","text":"请唐知夏记序","nodes":[{"type":"text","text":"唐知夏按投入顺序记录药材，迅速圈出引起逆火的灰蓝药草。"},{"type":"text","text":"“它在第三息开始吸走炉火，叶片只焦了边缘，内部留着完整的灵力回路。叶形仿作药草，实质是阵材。”","speaker":"唐知夏"},{"type":"text","text":"唐知夏将第三息前后的火色分开描下，又把邻炉每一次闷响标在图上。十三株药草中，灰蓝叶脉的排列全都指向同一个位置。"},{"type":"text","text":"“它们被切成药草形状，阵纹仍能拼回完整一圈。送药的人清楚丹房投料顺序，也知道哪一炉离木架最近。”","speaker":"唐知夏"},{"type":"text","text":"温鹤丹将问题药材封入寒玉匣。"},{"type":"text","text":"“今夜留意三件事：记忆突然断开、耳鸣不止、睡梦中自行走动。只要出现一项，先唤醒同伴，再来丹霞峰寻我。时辰、症状与闻到的气味都要记清。”","speaker":"温鹤丹"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false}]},{"type":"text","text":"最后一缕白烟散尽，丹房的窗纸已经被热浪烤黄。温鹤丹逐一检查在场弟子的眼瞳与脉象，烫伤者先敷冷膏，其余人也要留下姓名与接触过的药材。"},{"type":"text","text":"“灰蓝药草共十三株，十二株已经封存，一株投入邻炉。送药封签写着百草园，纸纤维却来自外门档房。”","speaker":"唐知夏"},{"type":"text","text":"（按着发疼的太阳穴）“我能记得十三株，也记得封签。温师兄方才问我是谁送来的，我脑子里只剩一扇关上的门。”","speaker":"阿阮"},{"type":"text","text":"（扶住阿阮的手肘）“先回栖云院。今晚我住得离你近些，窗外有任何动静都能听见。”","speaker":"我"},{"type":"text","text":"阿阮想说自己能照顾好自己，指尖碰到药刀留下的浅痕，又把话咽了回去。她将记录纸仔细折进袖中，同你一起离开焦黑的丹房。\n\n山风迎面吹来，衣袖上的焦苦味仍散不去。丹霞峰下方，通往栖云院的石灯依次亮起，其中第四盏灯忽然泛出一线灰蓝。"}]},{"index":7,"title":"第六章·下　忘却之夜","meta":{"前置条件":["完成第六章·上《丹火初燃》"],"地点":["栖云院药圃—第四阵眼"],"出场角色":["你、阿阮、唐知夏、许守安、沈砚"]},"nodes":[{"type":"text","text":"子时过后，药圃传来铁器反复刮过石面的刺响。你从睡梦中惊醒，推门便踩进冰凉雨水。阿阮赤着脚站在湿土中，指缝沾满泥，手里的药锄仍在一下下凿向地底。"},{"type":"text","text":"（握住她的手腕）“阿阮，听得见我说话吗？先松开药锄，看看我。”","speaker":"我"},{"type":"text","text":"阿阮浑身一颤，药锄落进泥里。她看着脚边挖开的深坑，脸色一点点发白。"},{"type":"text","text":"（急促）“我记得自己关了窗，也记得躺下，点灯之后的事全空了。我的脚上有泥，掌心还有新磨出的血口……先让我看看，我究竟挖出了什么。”","speaker":"阿阮"},{"type":"text","text":"坑底露出一块旧阵石，灰蓝水线沿石面排列成四道与五道。"},{"type":"text","text":"（蹲下拂去泥土）“阵石边缘的土已经压实，埋了至少十五年。新水痕只在表层，重新引灵应当就在近日。”","speaker":"许守安"},{"type":"text","text":"（展开纸条）“阿阮房中留着一句“第四处该醒了”。落笔习惯与她相反，纸也来自院外。”","speaker":"唐知夏"},{"type":"text","text":"一道清寒剑意落进坑底，切断正向阿阮腕间游动的水线。沈砚站在药圃外，剑锋仍指着阵石。\n\n夜雨顺着沈砚的伞沿落下，他立在药圃篱门之外，白衣未沾湿泥。剑意越过数丈切入坑底，水线断开时，阿阮腕上的凉意也随之退了半寸。\n\n沈砚没有靠近阿阮，只把一只装有温水的瓷瓶放在篱门边。瓶塞松开一线，水汽里闻不见定魂香的甜苦味。"},{"type":"text","text":"“先暖手。她今夜闻过定魂香，再用同类安神物会加重牵引。”","speaker":"沈砚"},{"type":"text","text":"（抬头看他）“你连丹房用了什么香也查过？”","speaker":"我"},{"type":"text","text":"“温鹤丹送了记录。”","speaker":"沈砚"},{"type":"text","text":"沈砚答完便看回阵石。清冷剑光映着他的侧脸，眉目疏远，压在坑底的剑意却始终避开阿阮与站在泥水中的你。"},{"type":"text","text":"“先带她离开阵石三步。水线已经缠过手腕，这块阵石记住了她的魂息，继续靠近只会让牵引更深。”","speaker":"沈砚"},{"type":"text","text":"（咬住发白的唇）“我会退到安全处，也会把今夜记得的每件事说清。它能把我引来一次，便可能再引来第二次，我得知道该防什么。”","speaker":"阿阮"},{"type":"choice","prompt":"选择调查方式","options":[{"key":"1","text":"陪阿阮核记忆","nodes":[{"type":"text","text":"你替阿阮披上外衣，陪她从晚饭开始逐件回想。她记得烧水时烫过指尖，记得把药分成四包，话到点灯处忽然停住。"},{"type":"text","text":"（攥紧衣角）“窗缝里飘进过一股定魂香。我还嫌味道太浓，起身关过一次窗。再往后……连自己什么时候脱了鞋都想不起来。”","speaker":"阿阮"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"2","text":"请唐知夏查院册","nodes":[{"type":"text","text":"唐知夏按纸张年份翻出十五年前的修缮册。第四阵眼那一页被人贴着装订线割走，断口整齐，只留下半个“玄”字。"},{"type":"text","text":"“缺页前后都用同一种墨，说明册子装订完整后才被割开。动手的人知道自己要找哪一页。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与沈砚查阵痕","nodes":[{"type":"text","text":"“沈砚，这道剑痕与旧剑坪那一式很像。你能看出它原先斩断了什么吗？”","speaker":"我"},{"type":"text","text":"“同属断引一式。旧痕曾切断魂息，新痕正沿断口接回。”","speaker":"沈砚"},{"type":"text","text":"“这件事已经牵到阿阮身上。若你知道旧痕的来历，我想请你与我一同查下去。”","speaker":"我"},{"type":"text","text":"沈砚看向你腕间尚未消退的水光。"},{"type":"text","text":"“我会同行。查到旧殿之前，别单独触碰阵石；若再见到这种水光，先退到我能赶到的地方。”","speaker":"沈砚"},{"type":"text","text":"“好。你查到的线索也告诉我，我们按同一份记录往下走。”","speaker":"我"},{"type":"text","text":"“查到以后，我会告诉你。”","speaker":"沈砚"},{"type":"text","text":"沈砚的回答很轻，字句清楚。他俯身以剑鞘量过阵石周围的水痕，又在三处安全位置钉下白色标记，留给巡夜弟子辨认。\n\n许守安从坑底取出第九枚断裂阵钉。远处山壁随即传来四声轻叩，短暂沉寂后，又响起五声。"}],"effects":[{"type":"relation","name":"沈砚","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"阿阮被暂时安置到唐知夏房中，窗边的浓香全部撤下，只留一盏无味石灯。许守安封住药圃深坑，唐知夏把每个人今夜所见分栏记清。"},{"type":"text","text":"（裹着干毯）“我会睡，也会让你们轮流守着。等天亮以后，我想亲自去丹房核那扇记不起来的门。”","speaker":"阿阮"},{"type":"text","text":"“先把今夜熬过去。天亮后我陪你去，唐知夏带记录，许守安查门上的阵钉。”","speaker":"我"},{"type":"text","text":"众人商定轮值，沈砚独自守在院外。竹影被雨打得凌乱，他的身影始终停在灯照不到的廊口，既未靠近，也未离开。"},{"type":"text","text":"“水光再亮，叫我。”","speaker":"沈砚"},{"type":"text","text":"后半夜，药圃又响过一次极轻的水声。水线才从土中露头，院外剑鸣便先一步将它截断。屋内的阿阮终于沉沉睡去。"}]},{"index":8,"title":"第七章　山庄来信","meta":{"前置条件":["完成第六章·下《忘却之夜》"],"地点":["裴氏山庄"],"出场角色":["你、裴青萝、谢临川、裴照河"]},"nodes":[{"type":"text","text":"裴氏山庄建在赤岩山腰。长明灯沿石阶排开，灯芯混着铁锈般的气味。山风穿堂而过，案上留籍玉牌轻轻磕着木面。"},{"type":"text","text":"“宗门外门资源有限，四年所得未必抵得上族中一季。你留在山庄，裴氏会替你请剑师、开灵库，也省得继续与人争一份筑基名额。”","speaker":"裴照河"},{"type":"text","text":"（指腹压住玉牌）“我回来修护祖阵，也会承担该担的族务。至于退宗，今日不在议事之列。”","speaker":"裴青萝"},{"type":"text","text":"“剑师、灵库与祖契都已备好。族中替你算过得失，这条路最稳。”","speaker":"裴照河"},{"type":"text","text":"裴照河推来留籍玉牌，玉面映着裴青萝紧抿的唇。门外候着数名族老，衣料摩擦声细碎不断，仿佛所有人都在等她点头。"},{"type":"text","text":"“你们算过灵石、名额与婚契，唯独没问我愿不愿意。宗门的路难走，我也走得起。”","speaker":"裴青萝"},{"type":"text","text":"（看向裴青萝）“你今日带我回来，是想让我替你说话，还是陪你把话说完？”","speaker":"我"},{"type":"text","text":"“陪我听完，再看着我自己回答。若我一开口，他们又要说我意气用事。”","speaker":"裴青萝"},{"type":"text","text":"你在她身旁坐下。裴青萝的指节从玉牌上慢慢松开，正要继续开口，院外守阵铃忽然乱成一片。\n\n院外阵旗忽然剧烈震动。山庄护阵受旧水脉冲击，灵光从东角开始熄灭。"},{"type":"text","text":"（从传讯阵赶来）“北坡水线正在逆流，我去封山道。阵心交给你们，先把老人和孩子送离灯阶，白石标记以内都别进。”","speaker":"谢临川"},{"type":"text","text":"谢临川跨进院门时肩头还沾着山雨，见到你的一刻眼睛明显亮了起来。他来不及走近，只朝你扬了扬手中的白石标，笑意在急促铃声里仍藏不住。"},{"type":"text","text":"“师姐也在，正好替我看着东侧灯阶。我封完北坡就回来，咱们回程再好好说话。”","speaker":"谢临川"},{"type":"text","text":"一名孩童被骤暗的长明灯吓哭，谢临川俯身把自己的巡防哨挂到他颈边，教他听一长两短的平安讯号，随后才提绳奔向北坡。"},{"type":"text","text":"（拔剑）“先护阵。等灯火重新亮起来，我会亲口说清自己的去留。”","speaker":"裴青萝"},{"type":"choice","prompt":"选择行动","options":[{"key":"1","text":"同裴青萝护阵","nodes":[{"type":"text","text":"你与裴青萝分守阵心两侧。她斩断逆流灵线，你将倒下的阵旗重新压入石槽。"},{"type":"text","text":"“方才若少你压住阵旗，我这一剑斩不稳。这个人情我记下，回宗门后再用一场认真的比试还你。”","speaker":"裴青萝"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false},{"key":"2","text":"替裴青萝陈情","nodes":[{"type":"text","text":"“青萝在宗门通过问剑考核，也在阵台失控时救过同门。她选的剑道能护住裴氏族人，方才这一阵已经证明了。”","speaker":"我"},{"type":"text","text":"“这些能证明她适合修行，还不足以证明宗门比裴氏更适合她。”","speaker":"裴照河"},{"type":"text","text":"“我留下修行，正因为这条路适合我。往后得失由我亲自承担，这已经足够。”","speaker":"裴青萝"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"3","text":"同谢临川标路","nodes":[{"type":"text","text":"你随谢临川绕到北坡。风里水腥气越来越重，他俯身摸过湿冷石面，很快找出逆流方向，又将白石标记逐一钉进三条岔路。"},{"type":"text","text":"“我还得沿北坡封住两道水线，不能一直守在院里。若阵心再响，你照白石标记往东撤，我会从山道接人。”","speaker":"谢临川"},{"type":"text","text":"“临川，水线贴着山石走，脚下很难看清。你别只顾着赶路，护腕松了也要重新系好。”","speaker":"我"},{"type":"text","text":"（笑着抬起手腕）“已经系紧了，你看。小时候上山迷路，你在后面一喊，我便知道该回头；如今也一样，我会平安回来见你。”","speaker":"谢临川"},{"type":"text","text":"谢临川说完便沿山壁落下巡绳。他先把两名腿脚不便的老人送过湿滑石阶，再折回去搬开堵住东门的灯架，笑意收得干干净净，只按巡防次序报出每一处水线。"},{"type":"text","text":"“东坡撤完十二人，北坡还剩三名守阵弟子。师姐带这一队到白石外，我去接最后三人。”","speaker":"谢临川"},{"type":"text","text":"“一长两短报平安。听见你的哨声以前，我们守在白石外接人。”","speaker":"我"},{"type":"text","text":"（眼睛弯起来）“好师姐，替我守住这边。我很快回来。”","speaker":"谢临川"},{"type":"text","text":"长明灯重新燃起，焦苦灯油味渐渐散去。裴青萝将留籍玉牌放回桌上，玉石碰出一声轻响。"},{"type":"text","text":"“明日辰时，我回太清宗。祖阵后续所需灵材，我会按族中规矩补齐。”","speaker":"裴青萝"},{"type":"text","text":"谢临川的身影很快消失在北侧山林。\n\n裴青萝收回目光，按住腰间的练习剑，继续走向渡口。"},{"type":"text","text":"（望向你）“回宗门后，试锋台见。方才被水线打断的那一场，我们从第一剑重新比。”","speaker":"裴青萝"}],"effects":[{"type":"relation","name":"谢临川","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"山道最后响起一长两短的哨声。谢临川带着三名守阵弟子穿过雨幕，人数与名册一一对上，自己手背却被断裂灯架划出一道长口。"},{"type":"text","text":"（见你迎来便笑）“都带回来了。我答应过会平安回来见你，自然不能少一个人。”","speaker":"谢临川"},{"type":"text","text":"你取出药布，谢临川很配合地伸手，目光亮亮地落在你脸上。伤口清洗时疼得指尖一缩，他也只把手腕放得更稳。"},{"type":"text","text":"“师姐替我包好，我再去写巡防记录。今日这条撤离路绕得太远，下次得在东坡多立两块白石。”","speaker":"谢临川"},{"type":"text","text":"院内争执并未因护阵结束而消失。裴青萝重新坐回原位，这一次，族老们先看见了她守住阵心的剑，也听见了她亲口作出的选择。"}]},{"index":9,"title":"第八章·上　灵矿归途","meta":{"前置条件":["完成第七章《山庄来信》"],"地点":["灵矿山道"],"出场角色":["你、许守安、林惊雨、周执"]},"nodes":[{"type":"text","text":"运送问天石的车队沿山道返宗。雨云贴着峰腰压下来，湿冷风从衣领钻入，矿石箱上的铁环一路撞得人心发紧。"},{"type":"text","text":"（拍了拍箱板）“十三号箱落地比出库时沉，十七号箱的回声又空了一层。押运单若没写错，动手脚的人便藏在箱底。”","speaker":"林惊雨"},{"type":"text","text":"“先停头车，只说检查车轴，别惊动后队。箱号、押运人和封条时辰都要当场记下。”","speaker":"周执"},{"type":"text","text":"许守安用小锤敲过四角，选中受力最轻的一处撬开箱板。上层铺着普通问天石，下层压着灰蓝石块，旧封条藏在夹板内侧。"},{"type":"text","text":"“封条上的矿尘是真的，箱底木板更新。有人保留旧封条，又在装车后换过夹层。”","speaker":"许守安"},{"type":"text","text":"雷声滚过山谷，前方车架忽然断裂。一名弟子被木梁压住，十七号箱正向坡边滑去。\n\n断裂声从第一根横梁一路传到后车，惊兽扬蹄，湿泥被踏得四处飞溅。十七号箱撞断护栏，半边悬在坡外，铁环摩擦石面，发出令人牙酸的锐响。"},{"type":"text","text":"“后队解下驮兽，所有人退到岩壁内侧！先报伤员人数，再报箱号，别在雨里各喊各的。”","speaker":"周执"},{"type":"text","text":"（将传讯符贴上车板）“伤员一人，意识清醒；十七号箱悬坡，十三号箱封条开裂。前方山道暂时无人，可封路半刻钟。”","speaker":"林惊雨"},{"type":"text","text":"“主轴是从内侧锯断的，断口泡过药水，方才受力才会一起裂。给我两根阵绳和三枚石楔。”","speaker":"许守安"},{"type":"choice","prompt":"选择处理方式","options":[{"key":"1","text":"先救受伤弟子","nodes":[{"type":"text","text":"你撑起浸透雨水的木梁，许守安垫入石楔，你们将受伤弟子拖到岩壁下。林惊雨咬住绳端固定矿车，十七号箱在坡沿晃了两下，终于停住。\n\n伤者右腿已经失去知觉，你与许守安没有立即搬动，先用两根木条固定小腿，再连人带雨披移到干燥处。周执记下救援时辰，也在伤者腕上系好身份木牌。"},{"type":"text","text":"“人已离开断梁，呼吸清楚。十七号箱由林惊雨看守，任何人都别越过她画的证物线。”","speaker":"周执"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"同许守安稳车","nodes":[{"type":"text","text":"你与许守安将阵绳绕过车轴。他看准山石受力处，掌心压下土系灵光，你同时钉入固定钉。矿车贴着坡沿停住，箱角只磕出一道浅痕。"},{"type":"text","text":"“这块山石能承住车重。先别松绳，我去给伤员垫住断木。”","speaker":"许守安"},{"type":"text","text":"许守安沿受力点又补入两枚石楔，直到阵绳不再震颤才松开手。他先去确认伤者情况，回头时仍记得在车轮下留一块可拆的活动楔，方便雨停后转运。"},{"type":"text","text":"“车轴、山石与阵绳都留一份图。若还要走这条路，下一队不必重新冒险试承重。”","speaker":"我"}],"effects":[{"type":"relation","name":"许守安","kind":"信任","value":1}],"ending":false},{"key":"3","text":"请林惊雨护证","nodes":[{"type":"text","text":"“惊雨，雨势越来越大，封条和箱号先交给你，别让证据泡坏。”","speaker":"我"},{"type":"text","text":"（扯开防水袋）“放心，我连押运人的鞋印都拓了一份。雨能冲走路上的泥，冲不掉我袋里的账。”","speaker":"林惊雨"},{"type":"text","text":"林惊雨把防水袋缠在胸前，又用传讯符照亮夹板内侧。有人趁乱靠近矿箱，她抬手便报出对方姓名与负责车次，逼得来人停在证物线外。"},{"type":"text","text":"“想帮忙便去扶伤员。箱子已经有人看，谁再碰，我连手印一起记进押运册。”","speaker":"林惊雨"},{"type":"text","text":"她将回执、封条与箱号拓印一并塞进防水袋。\n\n风雨停歇后，周执重新核对全部箱号。"},{"type":"text","text":"“十三号与十七号的品级被人互换。出库记录里还少了一箱，半个时辰前已经送入九峰问道台，必须立即追查。”","speaker":"周执"}],"effects":[{"type":"relation","name":"林惊雨","kind":"信任","value":1}],"ending":false}]},{"type":"text","text":"众人将车队移进避雨山亭。伤员的小腿被木梁压出大片青紫，阿阮留给任务队的止痛散派上了用场。许守安重新固定车轴，林惊雨则把被雨打湿的证纸一张张铺在炭盆外沿。"},{"type":"text","text":"“箱子经过矿场、山道与宗门三处，每次交接都有人签名。先把时辰排出来，缺失的一箱总会落在某一段空白里。”","speaker":"我"},{"type":"text","text":"“矿场出库时十九箱，山口验封仍是十九箱，宗门提前接走一箱后，车队应余十八箱。现在箱号齐全，品级与重量对不上，说明有人用空箱号替换了实物。”","speaker":"周执"},{"type":"text","text":"“提前接货的传讯写着九峰急用，落款像教习，传讯母符却来自外门。有人怕咱们赶不上，特意替线索跑得快些。”","speaker":"林惊雨"},{"type":"text","text":"风雨尚未停稳，周执便重新封好证物。众人留下两人照看伤员与车队，其余人携带拓印直奔九峰问道台，山道上的水一路追着靴底向下流。"}]},{"index":10,"title":"第八章·下　九峰问道","meta":{"前置条件":["完成第八章·上《灵矿归途》"],"地点":["九峰问道台"],"出场角色":["你、裴青萝、周执、顾长清"]},"nodes":[{"type":"text","text":"问道台启阵时，第三座石台先亮起灰蓝水光。尖锐水鸣穿透阵钟，被换入阵中的问天石疯狂吸走周围灵气，台上弟子捂着手臂跪倒，皮肤下的经脉灼出赤红纹路。水镜随即从石面升起。"},{"type":"text","text":"“关闭供灵阵！相邻石台从南侧撤离，受伤弟子先送医修。”","speaker":"周执"},{"type":"text","text":"（落在阵前）“水镜已经连上第四阵眼。此刻击碎镜面，回冲灵流会穿过台中弟子的经脉。先封三处石缝，我来稳住主阵。”","speaker":"顾长清"},{"type":"text","text":"水镜中伸出数道模糊手影，裴青萝挥剑将其逼回镜面。\n\n手影碰到剑锋便化作黑水，落地后又沿阵纹爬向伤者。第二座石台随之震动，围观弟子惊慌后退，窄桥一时挤满了人。"},{"type":"text","text":"“北桥只出不进，南桥分两列。能自行行走的人扶住左侧绳索，伤者留在原位，我会把阵压移开。”","speaker":"顾长清"},{"type":"text","text":"顾长清抬手落下三道金色界线，将黑水与人群隔开。最靠近阵心的弟子疼得发抖，他俯身问清手臂知觉，再以自己的护腕垫住灼伤处。"},{"type":"text","text":"（对伤者）“先看着我。手指能动便握一下，失去知觉也如实告诉我，医修会按你的反应用药。”","speaker":"顾长清"},{"type":"choice","prompt":"选择处理方式","options":[{"key":"1","text":"关闭供灵阵","nodes":[{"type":"text","text":"你随周执切断三道供灵线。失控问天石失去外援，水镜升起的速度随之放缓。"},{"type":"text","text":"（扶起最近的弟子）“还能走便沿白线撤，手臂失去知觉的人留在原处，我逐一带出去。”","speaker":"周执"},{"type":"text","text":"你切断最后一道供灵线，石台仍在余力中震动。周执把自己的名册垫在伤者手臂下，一面报姓名，一面沿白线把人送到医修手中。"},{"type":"text","text":"“南侧供灵已经断开。东侧石缝还有水光，我去封住入口，免得它重新接上阵心。”","speaker":"我"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"检查玄水四","nodes":[{"type":"text","text":"你避开水中手影，翻转阵心石块。石底刻着“玄水四”，刻痕里残留旧水纹铜粉。\n\n玄水四石块比同批问天石更冷，掌心隔着护具仍被冻得发麻。你拓下刻痕，又在安装槽里找到半截新断的蓝漆木签。"},{"type":"text","text":"“手影又在聚。证物拿到了便退，我替你斩开右侧水线。”","speaker":"裴青萝"},{"type":"text","text":"裴青萝的剑光贴着石面掠过，你借势退回金色界线后。蓝漆木签与灵矿箱底颜色相同，断口仍带着新鲜木屑。"}],"effects":[{"type":"cultivation","value":1}],"ending":false},{"key":"3","text":"与顾长清封阵","nodes":[{"type":"text","text":"“顾师兄，我来守西侧石缝。水声停下时，你提醒我收灵。”","speaker":"我"},{"type":"text","text":"“第五声落定便收，早一息会牵动伤者经脉，晚一息水镜会再抬一尺。我与你一同数。”","speaker":"顾长清"},{"type":"text","text":"你们同时压住两处阵线。第五声落定，水镜重新沉入石台。\n\n第五声水鸣将尽时，顾长清先看向你确认。两人一同收灵，阵线严丝合缝地落回石槽，伤者皮肤下的赤红纹路也缓缓退去。"},{"type":"text","text":"“多谢你守住西侧。请先让医修看手腕，封存记录由我与周执完成，你随时可以回来核对。”","speaker":"顾长清"},{"type":"text","text":"顾长清封存全部问天石，又从安装册中找到一段空白。"},{"type":"text","text":"（合上安装册）“记录中少了整整一个时辰，值守名册也被抽走一页。玄水四正是在这段空白里被换进阵心。”","speaker":"顾长清"}],"effects":[{"type":"relation","name":"顾长清","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"最后一名伤者被送下问道台，石桥上仍留着被灵力灼出的焦痕。顾长清请周执当众核点问天石，箱号、品级、封条与安装位置逐项唱报，任何人都能听见。"},{"type":"text","text":"“今日事故牵涉九峰教习，若只由峰内自查，缺失的名册还可能再少一页。”","speaker":"我"},{"type":"text","text":"“你担心得有道理。证物由外门档房、戒律院与天衡峰各存一份，伤者口述也分别封签。少掉任何一份，其余两份都能追查。”","speaker":"顾长清"},{"type":"text","text":"他说话仍温和，递出的封存令却封死了私下更改记录的余地。一名教习试图先取走安装册，顾长清抬眸看去，对方的手便停在半空。"},{"type":"text","text":"“册中有伤者姓名，今夜留在公证台。要查阅，请三方一同到场。”","speaker":"顾长清"},{"type":"text","text":"夜风掠过熄灭的阵旗，水腥气仍未散尽。顾长清最后离开问道台，走前替每名伤者留下复诊玉牌，也把查到的空白时辰抄了一份交给你。"}]},{"index":11,"title":"第九章　人间灯火","meta":{"前置条件":["完成第八章·下《九峰问道》"],"地点":["清河镇灯市"],"出场角色":["你、林惊雨、墨无咎"]},"nodes":[{"type":"text","text":"清河镇灯市刚入夜，河面便浮满暖黄灯影。甜酒香裹着灯油气味贴在冷风里，孩童提着纸灯穿过人群，桥边铜鼓正敲到第三遍。\n\n第一盏灵灯炸开时，火星沿油线窜上整排灯架。纸罩爆裂的脆响接连逼近，热浪掀翻小摊。林惊雨扯下传讯符，踩上石栏，声音压过哭喊与木架倒地声。\n\n火舌借着灯油越过绳索，眨眼烧到桥中。有人逆着人流寻找孩子，有人抱着货箱堵在窄巷，河边拴着的驮兽受惊嘶鸣，蹄声与哭喊搅成一片。"},{"type":"text","text":"（扶起摔倒的老人）“先松开桥边灯绳！燃着的纸灯落进河里，别让火线继续牵到东街。”","speaker":"我"},{"type":"text","text":"（摘下商号铜铃）“听三声铃。第一声开河滩仓门，第二声抬伤者，第三声清空东街。墨家伙计若听不懂，明日便不用回来领工钱。”","speaker":"墨无咎"},{"type":"text","text":"铜铃接连响过三次，原本护着货物的商号伙计迅速拆下门板，搭成两副担架。墨无咎将总账与钱匣一起丢给管事，自己转身劈开锁死的药仓。"},{"type":"text","text":"“东街封路，西街的人往河滩撤！桥口别挤，带孩子的先走外侧。”","speaker":"林惊雨"},{"type":"text","text":"（俯身查看油桶）“这批灯油走过我的商路。先把人送出去，商号的人到河滩登记伤情，药费与损失今晚便付。”","speaker":"墨无咎"},{"type":"choice","prompt":"选择行动","options":[{"key":"1","text":"先疏散灯市","nodes":[{"type":"text","text":"你击断燃烧的灯架，火星擦过袖口，焦味立刻贴上衣料。通往河滩的路刚露出来，你便抱起摔倒的孩子，引着几名老人避开倾倒油桶。"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"2","text":"请林惊雨传讯","nodes":[{"type":"text","text":"“惊雨，北街可能也用了同批灯油，先让他们停灯。河滩这边还缺烫伤药。”","speaker":"我"},{"type":"text","text":"（扬起手中符纸）“停灯的消息早发出去了。我再催医馆送药，顺带叫坊市把油商的后门堵上。”","speaker":"林惊雨"}],"effects":[{"type":"relation","name":"林惊雨","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与墨无咎核货","nodes":[{"type":"text","text":"“墨无咎，我替你核桶号与封漆，你来查担保印。货单先摊开，省得漏过夹页。”","speaker":"我"},{"type":"text","text":"（递来账册）“这分法正合我意。今夜若揪出那条假路，算我欠你一次不收利息的人情。”","speaker":"墨无咎"},{"type":"text","text":"你们在三只空桶底部发现夹层，里面残留玄水砂与问天石粉。\n\n火势熄灭后，墨无咎当众召回同批灯油，退还货款并承担伤药费用。\n\n河滩上铺满被水浸透的纸灯。医馆逐一登记烫伤，墨家账房就在旁边照单付药钱；摊位损失尚未核清，第一笔安置灵石已经送到受灾住户手中。"},{"type":"text","text":"“北街停灯及时，只烧了两座空架。东街共伤七人，最重的一人灼伤肩背，医修说能救治。走失的三个孩子也都找回来了。”","speaker":"林惊雨"},{"type":"text","text":"（合上伤情册）“每个名字后面添上住处，三日后再复诊一次。今夜领过药钱的人，后续也照付，别让他们拿着收据挨家求账房认。”\n\n（笑意淡了）“货从我的路上过，责任便记在我的账上。赔偿与伤药先付，至于谁借我的印害人，我会顺着这张单子讨回来。”","speaker":"墨无咎"},{"type":"text","text":"假货单末尾盖着一个模糊的“庄”字，运送路线指向云泽渡口。"}],"effects":[{"type":"relation","name":"墨无咎","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"夜深以后，墨无咎故意留下半车未烧尽的灯油，车上挂着召回封条。半个时辰后，一名戴斗笠的人果然绕到后巷，试图割掉桶底的担保印。"},{"type":"text","text":"（从暗处走出）“你留这半车油，不是忘了收。”","speaker":"我"},{"type":"text","text":"（倚着墙笑）“真账已经封好，剩下这点破绽，自然留给心里有鬼的人。”","speaker":"墨无咎"},{"type":"text","text":"斗笠人转身欲逃，巷口早被坊市管事封住。墨无咎没有追，只抛出一张空白供词，让对方自己选先写商号、渡口，还是那个庄字。"},{"type":"text","text":"“三处线索总要交代一处。阁下写得越早，能推给别人的账便越多。”","speaker":"墨无咎"},{"type":"text","text":"那人握笔良久，最终写下云泽渡口的交货时辰。墨无咎收起供词，脸上笑意淡淡，指节却在焦黑墙面压出一道白痕。"},{"type":"text","text":"“清河镇的赔偿由我担，追货也由我来。姑娘若去云泽，带上这张担保印，它能打开渡口旧仓。”","speaker":"墨无咎"}]},{"index":12,"title":"第十章·上　云泽入境","meta":{"前置条件":["完成第九章《人间灯火》"],"地点":["云泽秘境"],"出场角色":["你、阿阮、唐知夏、裴青萝、沈砚"]},"nodes":[{"type":"text","text":"云泽终年笼着薄雾。腐叶气味沉在水面，芦苇根部不时冒出冰凉水泡，远处水鸟受惊飞起，扑翅声很快被雾吞没。"},{"type":"text","text":"“后山的断引剑痕一路延伸到云泽，我来查它的尽头。你们仍按原定路线行动，发现旧剑痕或灰灯时先停下，我会过去确认。”","speaker":"沈砚"},{"type":"text","text":"“既然追的是同一条线，入泽后每隔半个时辰互通一次发现。水雾遮路，失联便回上一处石标会合。”","speaker":"裴青萝"},{"type":"text","text":"众人把传讯绳系在各自腕上。阿阮检查清神丸，唐知夏给九枚石标编号，裴青萝先行试过水深。沈砚独自站在队尾，剑意沿来路铺开一条极淡白线。\n\n你接过阿阮递来的清神丸，药气甜得发闷。沈砚看了一眼，另取一枚气味清淡的薄荷丸放在石标上。"},{"type":"text","text":"“你闻久了浓甜药气会头疼。换这一枚。”","speaker":"沈砚"},{"type":"text","text":"（拿起薄荷丸）“沈师兄连这个也记得。”","speaker":"我"},{"type":"text","text":"“你不喜欢浓甜药气。”","speaker":"沈砚"},{"type":"text","text":"沈砚只应了一声，便退回雾中三步之外。薄荷清凉从舌尖散开，恰好压住水泽里腐叶沉闷的气味。\n\n前方分出三条路：芦苇水道、旧石桥与半埋水中的石标。"},{"type":"choice","prompt":"选择入泽路线","options":[{"key":"1","text":"走芦苇水道","nodes":[{"type":"text","text":"阿阮拨开芦苇，在背阴石缝中发现一片成熟定魂苔。"},{"type":"text","text":"（屏住呼吸蹲下）“先把位置记好，别让衣角扫到苔面。定魂苔能替离魂未散的人留住一线生机，根须断一寸，药性便少一半；采坏了，这片石缝还得再养百年。”","speaker":"阿阮"}],"effects":[{"type":"cultivation","value":1}],"ending":false},{"key":"2","text":"穿过旧石桥","nodes":[{"type":"text","text":"旧桥中央横着一道断引剑痕。沈砚的剑落入凹槽，尺寸严丝合缝。"},{"type":"text","text":"（拇指压住剑鞘）“旧剑痕已经留了许多年，凹槽里的水痕仍新。近日有人循着这一式重新接过阵线，还带走了桥下的阵钉。”","speaker":"沈砚"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false},{"key":"3","text":"沿着石标走","nodes":[{"type":"text","text":"唐知夏数过九枚石标。前八枚朝向旧桥，第九枚被人挪动，原位只剩一圈新泥。"},{"type":"text","text":"（俯身比对泥痕）“共有九个节点。前八枚石标的朝向一致，第九枚被人移开三尺，原处刻痕也被湿砂磨平。”","speaker":"唐知夏"},{"type":"text","text":"众人在断桥下遭遇泽鳞兽。妖兽眼中覆着灰蓝水光，背后的阵线一直通向沉水石门。\n\n泽鳞兽从水下掀起长尾，浪头拍上断桥，石面瞬间滑得站不住脚。唐知夏抱紧拓纸退到石标后，阿阮将驱兽粉抛向下风，裴青萝迎着水线拔剑。"},{"type":"text","text":"“它听不见，也看不清。阵线控制后颈，别伤眼睛。”","speaker":"沈砚"},{"type":"text","text":"“裴青萝压住左侧，我引它抬头。沈师兄斩线，阿阮准备止血散。”","speaker":"我"},{"type":"text","text":"泽鳞兽扑来的瞬间，你的术法擦过水面，将它引向露出的石滩。裴青萝一剑截住长尾，沈砚的剑光从两人之间穿过，准确切断后颈细如发丝的水线。\n\n妖兽重重伏进浅水，鳞片上的灰蓝光逐层退去。阿阮靠近检查，确认只伤到被水线勒破的皮肉，才挥手让众人继续前行。"},{"type":"text","text":"“水线从它后颈入体，眼睛受了灵光侵染。斩线即可，剑锋都避开头部。”","speaker":"裴青萝"},{"type":"text","text":"沈砚一剑截断控制线，泽鳞兽沉回深水。水位退下，露出通往石门的九级石阶。\n\n石门上分布着碑纹、探阶痕与断引剑痕。"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false}]},{"type":"choice","prompt":"选择开门方法","options":[{"key":"1","text":"请唐知夏拓纹","nodes":[{"type":"text","text":"唐知夏拓下石门碑纹，发现最底层藏着“玄水旧殿”四字。"},{"type":"text","text":"“上层碑文新刻了两遍，最底下的“玄水旧殿”从未被磨尽。这里原本就有名字。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"2","text":"同裴青萝探阶","nodes":[{"type":"text","text":"你与裴青萝逐级试探承重。第九阶下方传来空响，门枢由水道控制。"},{"type":"text","text":"“前八阶都能落脚，第九阶是空的。门枢藏在水下，你守住石阶，我下去斩开淤藤。”","speaker":"裴青萝"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与沈砚核剑痕","nodes":[{"type":"text","text":"“沈砚，这道旧痕与你的剑式分毫不差，连收锋处的缺口都一样。”","speaker":"我"},{"type":"text","text":"“断引一式只传过一脉。门后若亮起灰灯，先闭息守住识海，再听水声辨认阵眼。”","speaker":"沈砚"},{"type":"text","text":"“门后的阵势已经开始运转。沈师兄还看出了什么，请现在告诉我们。”","speaker":"我"},{"type":"text","text":"沈砚看着剑痕，片刻后收剑。"},{"type":"text","text":"“门内有九座石龛，右壁留着退路。灰灯转青时守住识海。先开门，水位已经回涨。”","speaker":"沈砚"},{"type":"text","text":"石门内部先响四声轻叩，短暂沉寂后又接五声。门缝缓缓张开，八盏灰蓝灯火在黑暗中依次亮起。"}],"effects":[{"type":"relation","name":"沈砚","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"门开至半尺，身后的水位骤然上涨。淤泥没过第一级石阶，来路上的白色剑线被水冲淡，九枚石标只剩最靠近门口的两枚可见。"},{"type":"text","text":"“回程石标正在下沉，传讯绳还连着。若进门，必须先留一条新的退路。”","speaker":"唐知夏"},{"type":"text","text":"沈砚将剑鞘横在门缝，清寒剑意沿右壁刻出连续浅痕。裴青萝在每道痕迹旁钉入铜片，阿阮把驱水药粉分给众人。"},{"type":"text","text":"“右壁的剑痕通向后门。水没过膝盖便撤，谁也别独自留下。”","speaker":"沈砚"},{"type":"text","text":"众人确认传讯绳与药物后依次进入。最后一人越过门槛，石门在身后发出低沉摩擦声，水泽的鸟鸣彻底被隔绝。"}]},{"index":13,"title":"第十章·下　旧殿留字","meta":{"前置条件":["完成第十章·上《云泽入境》"],"地点":["玄水旧殿"],"出场角色":["你、阿阮、唐知夏、裴青萝、沈砚"]},"nodes":[{"type":"text","text":"潮冷空气从门内涌出，腐朽药草的苦味贴上舌根。殿外水位漫过第一层石阶，水声从门缝追入幽暗长廊。"},{"type":"text","text":"“贴着右壁走，地面水纹会牵动魂息。灯火转青时闭息守住识海，听见有人唤名字也别回头。”","speaker":"沈砚"},{"type":"text","text":"（看向他）“门还未全开，你已经知道灯会变色。剑痕里连这些都刻得出来吗？”","speaker":"裴青萝"},{"type":"text","text":"“门枢上的剑痕留下了破阵次序，灰灯与水声都在其中。刻痕很旧，逃生的路仍能用。”","speaker":"沈砚"},{"type":"text","text":"殿内共有九座石龛，八座存有名简，最右一座留着密集刀凿痕。\n\n长廊每隔九步便有一道浅水槽，水流方向与众人的脚步相反。灰灯映在积水里，明明只有八盏，倒影中却多出一团模糊青火。"},{"type":"text","text":"“倒影比实物多一盏。第九盏灯藏在水槽下方，石龛一旦认出姓名，它就会亮。”","speaker":"唐知夏"},{"type":"text","text":"“我守门与退路。水线越过第三道铜片便叫你们，不管查到哪一步都先撤。”","speaker":"裴青萝"},{"type":"text","text":"阿阮在石龛间放下三只药铃。魂息靠近时，银铃会先发闷响；沈砚则停在最右石龛外，剑尖始终压着流向众人的水槽。"},{"type":"text","text":"（用指腹捻过墙灰）“这里以前是一间药室。寒水藤、苦参，还有烧过的定魂香，三种气味都渗进石缝了。药炉应当就在东墙附近。”","speaker":"阿阮"},{"type":"text","text":"（举灯照向石龛）“第九座石龛刻过字。凿痕从右向左叠了三层，刻字后又被人反复削平。”","speaker":"唐知夏"},{"type":"choice","prompt":"选择调查方向","options":[{"key":"1","text":"请唐知夏抄碑","nodes":[{"type":"text","text":"你替唐知夏照亮碑角。她从水垢下分出两层旧字。"},{"type":"text","text":"“碑文被改过两次，最旧一层少了末句。水垢下面还留着半行，我先拓下笔画，回去再按旧字形复原。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"2","text":"同阿阮查药室","nodes":[{"type":"text","text":"阿阮从墙缝中挑出半块青色陶签。"},{"type":"text","text":"（轻声念出残字）““定魂苔，百年方成。离魂未散，可护一线生机。”这块陶签沾着泽泥，外面的芦苇水泽多半就是旧药圃。幸好咱们方才没动那片药。”","speaker":"阿阮"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"3","text":"同裴青萝探门","nodes":[{"type":"text","text":"裴青萝以剑鞘敲过九道铜闩，第九道只传回钝响。"},{"type":"text","text":"“前八道铜闩回声完整，最后一道从殿内被割断。后门仍能开启，我守在门枢旁；水位若再涨，你们先撤。”","speaker":"裴青萝"},{"type":"text","text":"八座石龛依次开启，名简从玄水一排列至玄水八。黑碑上的旧字也随灯火显现。"},{"type":"text","text":"（声音发紧）“碑上写着“归者九人，名简八枚”。第九人的名简从一开始就不在石龛里。”","speaker":"唐知夏"},{"type":"text","text":"阿阮腕间的灰蓝细痕随之浮起。"},{"type":"text","text":"（按住腕间细痕）“丹房那晚也是这种凉意，从指尖一直爬到肩口。它每靠近心脉一寸，我便少记得一件事。”","speaker":"阿阮"},{"type":"text","text":"你的弟子令自行翻转。第九石龛开始刻写你的姓名，青色灵线从水槽缠向手腕。\n\n石屑一笔一笔落进水中，每落一笔，灰灯便亮一分。寒意顺着腕骨向上攀爬，你耳边响起许多重叠脚步，像有人正沿着看不见的长廊朝这里赶来。"},{"type":"text","text":"（压住弟子令）“我还能听见你们。名字写到第二个字，水线已经过腕。”","speaker":"我"},{"type":"text","text":"“看着我，别数水声。你的呼吸一乱，牵引会跟着加深。”","speaker":"阿阮"},{"type":"text","text":"沈砚的剑意贴着你腕侧落下，隔开水线，始终未碰到皮肤。他站在一步之外，清冷眉眼映着青火，声音很稳。"},{"type":"text","text":"“先守住自己的名字。阵法写的是旧籍，落笔的人仍是你。”\n\n（剑锋压住水槽）“它以姓名为引，再循魂印认人。最后一笔一旦落下，旧殿会将你记作第九归者，名籍与魂印都会被阵法扣住。”","speaker":"沈砚"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false}]},{"type":"choice","prompt":"选择破阵方式","options":[{"key":"1","text":"自行斩断灵线","nodes":[{"type":"text","text":"你找出四声与五声之间的停滞，以弟子令边缘斩断灵线。石龛上的姓名停在最后一笔。"},{"type":"text","text":"“你找准了阵声的空隙。守住最后一道断口，水线还会再试着接回一次。”","speaker":"沈砚"}],"effects":[{"type":"cultivation","value":2}],"ending":false},{"key":"2","text":"请阿阮封住脉门","nodes":[{"type":"text","text":"（抽出银针）“手腕伸过来，你压住令牌，别跟着水声换气。我用三根针封住灵脉，落针时会有些疼。”","speaker":"阿阮"},{"type":"text","text":"银针落下，青色灵线寸寸冻结，姓名停在最后一笔。"}],"effects":[{"type":"relation","name":"阿阮","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与沈砚封名","nodes":[{"type":"text","text":"“沈砚，我跟着你的剑意走。你告诉我阵声落到哪一息时出剑。”","speaker":"我"},{"type":"text","text":"“随我的剑意走。第四声落时收灵，第五声起时斩线。”","speaker":"沈砚"},{"type":"text","text":"两股灵力同时切入阵纹，收势时机分毫未差。"},{"type":"text","text":"“方才那一剑，出手的时机对了吗？”","speaker":"我"},{"type":"text","text":"（目光落在你腕间）“时机正好，收势也稳住了。水线已经断开，先把手给阿阮看看。”","speaker":"沈砚"},{"type":"text","text":"后门开启，众人沿窄道离开旧殿。被水浸湿的拓纸上显出一行隐藏旧字。\n\n第九灯被强行压回水槽，整座旧殿随之震动。石龛接连合拢，顶壁碎石砸进长廊，裴青萝用剑鞘敲响门边铜片，催众人沿右壁撤离。"},{"type":"text","text":"“后门还能撑二十步。唐知夏先走，阿阮在中间，别回头看石龛！”","speaker":"裴青萝"},{"type":"text","text":"回水已经漫到腰间，阿阮的药铃沉进黑水。沈砚守在队伍最后，每当石龛伸出新的水线，剑光便从身后掠过，将它截断在众人脚边。"},{"type":"text","text":"（踏上最后一级窄阶）“沈师兄，人都出来了。”","speaker":"我"},{"type":"text","text":"沈砚这才退出后门。石门合拢前，第九石龛又落下半笔，你的姓名停在尚未写完的位置。"},{"type":"text","text":"“拓纸上写着：‘第九名简，待水镜开阶。’”","speaker":"唐知夏"},{"type":"text","text":"紧闭的旧殿深处，重新亮起第九盏灯。"}],"effects":[{"type":"relation","name":"沈砚","kind":"好感","value":1}],"ending":false}]},{"type":"text","text":"众人回到雾岸时天色将明。湿衣贴在身上发冷，阿阮逐一检查腕脉，唐知夏把拓纸夹进防水木板，裴青萝重新清点传讯绳与铜片。"},{"type":"text","text":"（握住你的手腕）“牵引断开了，皮肤下还留着冷意。今日别再引气，我回去配一副温脉药，味道会淡些。”","speaker":"阿阮"},{"type":"text","text":"沈砚站在更远的水边，低头擦去剑上的黑水。你看过去时，他停了停，把一只装有温水的瓷瓶放在身侧石面。"},{"type":"text","text":"“水是温的。先喝。”","speaker":"沈砚"},{"type":"text","text":"晨雾被风吹开一道缝，旧殿石门重新沉入泽底。水下青光仍亮着，九次轻叩隔着很远传上岸来。\n\n【主线线索更新：第九名简·待水镜开阶】"}]},{"index":14,"title":"第十一章　外门旧账","meta":{"前置条件":["完成第十章·下《旧殿留字》"],"地点":["外门档房"],"出场角色":["你、唐知夏、周执、顾长清"]},"nodes":[{"type":"text","text":"云泽拓纸晾了三日，墨迹才彻底干透。周执领着你们进入外门旧库，潮湿纸张与陈木气味从门内涌出，书架深处传来蛀虫啃咬木屑的细响。"},{"type":"text","text":"“今日先查玄水旧殿、问天石与第四阵眼。卷册离架便登记，谁经手、放在何处都要记清，免得再给人留下换页的机会。”","speaker":"周执"},{"type":"text","text":"“九峰问道台的领料账也有一段空白。我带了天衡峰调令，与诸位同查；找到的证据仍由周执依旧库规程封存。”","speaker":"顾长清"},{"type":"text","text":"他的金云令牌掠过内门，普通调卷令无法开启的甲字库自行解锁。\n\n甲字库门锁弹开时，周执先一步挡在门前。他核过令牌编号，又请顾长清在调卷簿上补齐用途、时辰与同行者，规程一项也未省。"},{"type":"text","text":"（接过笔）“理当如此。权限越高，留下的记录越该完整。”","speaker":"顾长清"},{"type":"text","text":"顾长清签完姓名，将调卷簿转向你们。甲字库内积尘很厚，旧纸气味里混着新封蜡的甜香，显然有人近日来过。"},{"type":"text","text":"“先看新封蜡，再按账册年份往前查。动过旧卷的人留下了新的东西。”","speaker":"我"},{"type":"text","text":"“门轴尘印断过两次。最近一次就在三日内。”","speaker":"唐知夏"},{"type":"choice","prompt":"选择调查方式","options":[{"key":"1","text":"请唐知夏对账","nodes":[{"type":"text","text":"唐知夏将近三年的领料册按月份铺开。"},{"type":"text","text":"（逐行压住账页）“问天石入库时记作上品，领出时变成中品，改动都发生在月末。玄水四的去向也写得很清楚：外门筑基试场。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"2","text":"随周执查旧库","nodes":[{"type":"text","text":"周执从新鲜擦痕中找到一只被动过的木匣，第四阵眼修缮记录缺失最后一页。"},{"type":"text","text":"（展开旧图）“筑基试场正压在旧水阵上方。水阵一旦失控，外环泄水道就是弟子唯一的退路，缺失的正是这一页。”","speaker":"周执"}],"effects":[{"type":"relation","name":"周执","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与顾长清验印","nodes":[{"type":"text","text":"你与顾长清逐一引动旧封泥。第四枚印中亮起灰蓝水纹。"},{"type":"text","text":"（细看印纹）“封泥与守籍司旧印相合，落印的人仍可能借过他人灵息。我会申请调出当年的守库名册，查明后先送你一份结果。”","speaker":"顾长清"},{"type":"text","text":"顾长清没有立即收走封泥。他把印面转向灯下，请你与周执一同看清三处缺口，又让唐知夏将引动前后的颜色分别记下。"},{"type":"text","text":"“守籍司牵涉仙盟，单凭一枚旧印不能定人。眼下能确定的是，有人故意让我们看见这枚印，也可能想把追查方向引向仙盟。”","speaker":"顾长清"},{"type":"text","text":"“既要查印的来处，也要查谁希望我们相信它是真的。”","speaker":"我"},{"type":"text","text":"（微微颔首）“我也是这个意思。两条线并行，才不会让证据替别人说话。”","speaker":"顾长清"},{"type":"text","text":"三册记录与旧泄水图被同时铺在桌上。问天石调换、旧库空白时辰与云泽货单上的“庄”字落在同一条路线。"},{"type":"text","text":"“原图依规不能离库，今夜也来不及逐份誊抄。你们选一份带走，我留在这里守住其余卷册。”","speaker":"周执"}],"effects":[{"type":"relation","name":"顾长清","kind":"好感","value":1}],"ending":false}]},{"type":"choice","prompt":"选择保留记录","options":[{"key":"1","text":"抄录泄水图","nodes":[{"type":"text","text":"你将外环水道与三处泄水闸完整抄下。"},{"type":"text","text":"（点住图角）“东侧第三块青砖下藏着副闸，石面刻了一道浅横纹。主闸受损时，从那里排水，开闸后人要立刻退到北墙。”","speaker":"周执"},{"type":"text","text":"【关键记录：已抄录泄水图】"}],"effects":[{"type":"cultivation","value":1},{"type":"note","value":"已抄录泄水图"}],"ending":false},{"key":"2","text":"带走换料单","nodes":[{"type":"text","text":"你拓下换料单。纸页底部的半枚货印与灵墟坊市旧路线印相同。"}],"effects":[{"type":"contribution","value":1}],"ending":false},{"key":"3","text":"记下守印人","nodes":[{"type":"text","text":"你将守印栏迎向窗外，墨线下透出几笔旧字。"},{"type":"text","text":"“底下的名字写于十余年前，墨色已经发褐。上层描墨只干了数月，落笔的人还故意改了最后一捺。”","speaker":"唐知夏"},{"type":"text","text":"甲字库倒塌的书架下还压着一卷新封公文。封蜡摸上去仍带微温，公文要求封闭第四阵眼，其余筑基阵道照常启用。"},{"type":"text","text":"（神色沉下）“末尾用了守籍司旧印，这枚印十二年前便已停用。我会立刻申请暂缓筑基试，并将伪印一事报给掌门。”","speaker":"顾长清"},{"type":"text","text":"窗外闷雷滚过，尘灰从梁上簌簌落进灯火。公文最下方墨迹未干：三日后，筑基试照常举行。"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false}]},{"type":"text","text":"甲字库一时静得只剩雨打窗纸。周执将公文夹入封套，指腹因用力泛白；唐知夏迅速抄下墨迹干湿与封蜡温度，防止原件再次被换。"},{"type":"text","text":"“暂缓申请送到掌门案前至少要两日。筑基试的阵材已经进场，只靠一纸申请来不及。”","speaker":"周执"},{"type":"text","text":"“我去见掌门，要求停用第四阵眼与所有来路不明的问天石。周执公开核验参试名册，唐知夏保留三份证据。你可以选择继续参试，也可以退出，查到的线索不会因你的选择被扣下。”","speaker":"顾长清"},{"type":"text","text":"（收好泄水图）“我会参加。试场既压着旧水阵，只有进去才看得见阵势如何变化。安全路线必须先公开给所有人。”","speaker":"我"},{"type":"text","text":"顾长清看了你片刻，未劝你改意。他取出一张空白阵图，与周执一同标出北墙、旧渠和三处可撤离位置。"},{"type":"text","text":"“那便把能做的准备做全。明日午前，所有参试弟子都能拿到这张撤离图。”","speaker":"顾长清"},{"type":"text","text":"离库前，顾长清亲自落下三重封条，又将其中一枚封签交给周执保管。雨声越来越急，三日后的铜钟却已在山下试鸣。"}]},{"index":15,"title":"第十二章　筑基之争","meta":{"前置条件":["完成第十一章《外门旧账》"],"地点":["外门筑基试场"],"出场角色":["你、裴青萝、林惊雨、周执、谢临川"]},"nodes":[{"type":"text","text":"试场开放当日，山雾仍压在半山。九座剑台沿峭壁逐层升高，阵旗在冷风中猎猎作响，湿石上的水腥气比往日浓得多。"},{"type":"text","text":"（快步从北坡回来）“我沿北坡跑了两遍，三枚阵钉松了两枚，泥里还压着被割断的阵线。入场前跟我再走一次撤离路，真出事时别往人多的地方挤。”","speaker":"谢临川"},{"type":"text","text":"谢临川说完先看你的护腕，又低头确认鞋底防滑纹。他见你已经照撤离图做足准备，紧绷了一早的眉心才松开，眼里很快又有了明亮笑意。"},{"type":"text","text":"“师姐准备得比我想的还齐。那我少念两句，只再陪你走一遍北坡，走完便在终点等你。”","speaker":"谢临川"},{"type":"text","text":"（系紧护腕）“巡防队也要进阵救援。你先顾好自己的绳索，别一见到我就把备用符都塞过来。”","speaker":"我"},{"type":"text","text":"（把传讯符收回一半）“好师姐，这张还是留着吧。余下的我自己带好，一张也不少。”","speaker":"谢临川"},{"type":"text","text":"他把符纸放进你腰侧最容易取到的袋口，又退开一步等你自己系紧。铜钟尚未响，谢临川已经沿北坡向每名参试弟子说明哨声与撤离方向。"},{"type":"text","text":"（蹲下拨开兽印）“昨夜巡防簿上没记灵兽闯阵，这串脚印又深浅一样，多半是拿模子压出来给人看的。真东西藏在脚印下面。”","speaker":"林惊雨"},{"type":"choice","prompt":"选择赛前准备","options":[{"key":"1","text":"同裴青萝试路","nodes":[{"type":"text","text":"你与裴青萝登上第一座剑台，试出第三台风势偏左。"},{"type":"text","text":"“第三台的风势偏左，落脚时多留半尺。正式入场后你只管走在前面，我会凭自己的剑追上来。”","speaker":"裴青萝"}],"effects":[{"type":"relation","name":"裴青萝","kind":"信任","value":1}],"ending":false},{"key":"2","text":"请林惊雨听阵","nodes":[{"type":"text","text":"林惊雨将传讯符贴在石面。"},{"type":"text","text":"（侧耳贴近符纸）“第四阵眼封住了，水声还沿旧渠绕向终点阵盘。我已经把警讯传给周执，又留了一张母符；阵势一变，八方子符会同时响。”","speaker":"林惊雨"}],"effects":[{"type":"relation","name":"林惊雨","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与谢临川查钉","nodes":[{"type":"text","text":"你随谢临川检查北坡。他拨开潮湿草根，在第三枚阵钉下找到灰蓝石屑，随后将一截巡绳系到你腕上，绳结仍是儿时教你认路的样式。"},{"type":"text","text":"“临川，这个结我还记得。若哨声响了，我会沿绳去北坡找你。”","speaker":"我"},{"type":"text","text":"（笑得眉眼明亮）“我就知道你不会忘。三短一长便立刻撤，我会在北坡接你。等你平安拿到资格，我请你去灵膳堂，桂花酥给你留两碟。”","speaker":"谢临川"},{"type":"text","text":"铜钟震响，筑基试开始。参试弟子需要取得三面阵旗并登上问心台。"}],"effects":[{"type":"relation","name":"谢临川","kind":"好感","value":1}],"ending":false}]},{"type":"choice","prompt":"选择行进路线","options":[{"key":"1","text":"走正面剑台","nodes":[{"type":"text","text":"你迎着剑风穿过两道阵门，先裴青萝半步拔出第一面阵旗。"}],"effects":[{"type":"cultivation","value":2}],"ending":false},{"key":"2","text":"攀北侧石壁","nodes":[{"type":"text","text":"你沿湿滑石壁向上，在第二座剑台下发现三枚被削断的阵钉。"}],"effects":[{"type":"cultivation","value":2},{"type":"stamina","value":-1}],"ending":false},{"key":"3","text":"沿旧水渠绕行","nodes":[{"type":"text","text":"你在渠底找到数块刻有“玄水四”的问天石，缝隙中正向外渗出黑水。\n\n第三面阵旗近在眼前，山腰忽然响起三短一长的尖哨。下一瞬，第四阵眼冲断禁绳，黑水挟着碎石撞进试场，最下层剑台应声裂开。\n\n第一层石台向下倾斜，数名弟子被阵风掀倒。黑水灌进剑槽，原本指向阵旗的剑影全部转向人群，铁器相撞声沿峭壁回荡。"},{"type":"text","text":"（哨声后立即传讯）“北坡巡绳已落，能走的人贴右壁撤！受伤者报位置，附近的人先留标记，别独自跳进黑水。”","speaker":"谢临川"},{"type":"text","text":"谢临川沿绳滑下，途中稳住一名悬在断台边的弟子，又把自己的护身符扣在伤者腰间。他没有直奔你所在的终点，只先将最近的撤离缺口封住。"},{"type":"text","text":"“西侧剑影交给我。你们救人，阵旗先放着！”","speaker":"裴青萝"},{"type":"text","text":"（通过传讯符）“别往终点！终点阵盘反了，所有灵流都在往那里聚！”","speaker":"林惊雨"},{"type":"text","text":"她所在的传讯台随即塌陷，石板从脚下断成两截。林惊雨的肩膀撞上崖壁，一手扣住渗血石缝，另一手仍死死按着传讯符。"},{"type":"text","text":"（喘息急促）“东侧还有六个人没收到警讯！再给我三息，我把最后一道传出去，你们先别剪断母符。”","speaker":"林惊雨"}],"effects":[{"type":"cultivation","value":1},{"type":"contribution","value":1}],"ending":false}]},{"type":"choice","prompt":"选择应对方式","options":[{"key":"1","text":"折返救林惊雨","nodes":[{"type":"text","text":"你扣紧巡绳滑向塌陷处，碎石擦破掌心。依照林惊雨指向，你挪开压住传讯线的石块。最后一道符光冲向东侧，她这才松开母符，带血的手抓住绳索与你一同撤离。"},{"type":"text","text":"（疼得吸气）“符送到了，这只手也还在。回去记得替我向医修说，是救人受的伤，药费该算在试场账上。”","speaker":"林惊雨"}],"effects":[{"type":"relation","name":"林惊雨","kind":"信任","value":1}],"ending":false},{"key":"2","text":"先毁失控阵钉","nodes":[{"type":"text","text":"你斩断终点侧面的三枚阵钉。阵盘转速骤降，裴青萝踏着崩裂石台跃下，一手扣住林惊雨的护腕，将她拽上高处。"},{"type":"text","text":"（压住林惊雨肩伤）“传讯已经送出，接下来听我的。你若再动这条手臂，骨头真会错位。”","speaker":"裴青萝"}],"effects":[{"type":"contribution","value":2}],"ending":false},{"key":"3","text":"继续夺取阵旗","nodes":[{"type":"text","text":"你顶着水流拔出第三面阵旗，又以旗杆压下藏在旗座中的逆转机关。终点旗光成为被困弟子的撤离标记。\n\n谢临川从北坡放下巡绳，雷光接连钉进崖壁，替撤离弟子撑出一条路。周执越过禁绳，将最后一名昏迷弟子背出黑水。"},{"type":"text","text":"（俯身压住巡绳）“师姐，踩住第三个绳结，扶着我这边上来。下面的水线已经截住了，我接得住你。”","speaker":"谢临川"},{"type":"text","text":"（喘匀气息）“阵旗、救援与破阵都记入考核。今日通过的人照常取得筑基资格，受伤者的名次由戒律院复核，谁也不得借乱局抹去。”","speaker":"周执"},{"type":"text","text":"坍塌的终点阵盘下方露出一面平整黑水。第九阶从镜中升起，空白名简立在石阶尽头。"}],"effects":[{"type":"cultivation","value":2}],"ending":false}]},{"type":"text","text":"巡防队沿北坡逐段收绳，医修在白石外铺开伤席。谢临川从最低处一路报上人数，嗓音被水声磨得发哑，仍要亲眼看见最后一名弟子越过禁绳才肯停下。"},{"type":"text","text":"“参试弟子二十四人，教习四人，巡防六人，全数离开水线。重伤一人，轻伤七人，已经交医修。”","speaker":"谢临川"},{"type":"text","text":"他报完才朝你走来。你袖口被碎石割破，手臂只留一道浅痕，谢临川确认伤口能动，肩背才真正松下来。"},{"type":"text","text":"（声音放轻）“师姐，先坐在这块干石上。我去取温水，回来以前别靠近那面黑水。”","speaker":"谢临川"},{"type":"text","text":"“你先处理掌心。巡绳把皮磨破了。”","speaker":"我"},{"type":"text","text":"谢临川低头看了一眼红肿掌心，笑意又从眼底冒出来。他挨着你坐下，把药布递到你手边，像故城里许多个受伤后自然靠近的午后。"},{"type":"text","text":"“那劳烦师姐替我缠两圈。缠好我便去守水镜入口，谁也不会从你身后靠近。”","speaker":"谢临川"},{"type":"text","text":"黑水静得映不出人影。远处清点姓名的声音一遍遍传来，第九阶却在所有人的注视下继续上升。"}]},{"index":16,"title":"第十三章·上　水镜开阶","meta":{"前置条件":["完成第十二章《筑基之争》"],"地点":["封闭后的筑基试场"],"出场角色":["你、阿阮、唐知夏、许守安、裴青萝、周执、沈砚"]},"nodes":[{"type":"text","text":"第三夜，黑水仍停在坍塌阵盘下方。月光落进镜面，被第九层石阶截成两段。定魂香在冷风里烧得极慢，甜苦气息与水腥味缠在一处。"},{"type":"text","text":"（按住外环石缝）“东侧阵盘已经受过两次冲击，最多再撑半个时辰。水位涨过这道刻痕，所有人都撤，我留下来卸掉阵压。”","speaker":"许守安"},{"type":"text","text":"（逐一分发药丸）“定魂香已经点上，每人含一颗清神丸。谁听见水里有人叫名字，立刻说出来，别自己忍着。”","speaker":"阿阮"},{"type":"text","text":"“今夜只查水镜，不追入未知阵道。阵势越过外环便退，谁失联，同行者立即报出姓名与最后位置。”","speaker":"周执"},{"type":"text","text":"“旧殿外的断引剑痕一直通到这里。水镜下方压着玄水阵第四阵眼，水声每响九次，牵引便会加深一层。”","speaker":"沈砚"},{"type":"text","text":"沈砚将一条白色剑线落在水镜外缘，随后退回阵口。他始终与众人隔着几步，剑光却把每一处湿滑石缝照得清楚。"},{"type":"text","text":"“若牵引落到魂印上，外面的人怎样判断我还能听见？”","speaker":"我"},{"type":"text","text":"“每过三阶，敲一次剑鞘。声音若乱，我会斩开水线，带你退回。”","speaker":"沈砚"},{"type":"text","text":"“若我还能判断阵路，先听我的落脚声。”","speaker":"我"},{"type":"text","text":"“按你的判断来。”","speaker":"沈砚"},{"type":"text","text":"沈砚应得很快。他没有替你决定进退，只把能做的准备一项项放在明处：剑线、退阶信号、定魂药与岸上接应的位置。"},{"type":"choice","prompt":"选择调查方向","options":[{"key":"1","text":"请唐知夏验简","nodes":[{"type":"text","text":"唐知夏将旧殿拓纸朝向水面。第九名简背后显出被反复削磨的凹痕。"},{"type":"text","text":"（沿凹痕逐层辨认）“这里至少叠着九层刻痕，每一层的收笔位置都相同。名姓被反复写下，又被人从石面磨去。”","speaker":"唐知夏"}],"effects":[{"type":"relation","name":"唐知夏","kind":"信任","value":1}],"ending":false},{"key":"2","text":"同许守安固镜","nodes":[{"type":"text","text":"你与许守安按住东侧阵盘。银线探入水镜，在第九阶前骤然绷紧。"},{"type":"text","text":"“前八层石阶都把力送回水阵，第九层的回声落在人身上，阵力正压着人的魂印。”","speaker":"许守安"}],"effects":[{"type":"relation","name":"许守安","kind":"信任","value":1}],"ending":false},{"key":"3","text":"与沈砚探黑阶","nodes":[{"type":"text","text":"沈砚先踏入水镜，剑光将第一层黑阶凝实。"},{"type":"text","text":"“跟着剑光走。脚下传来两次震动，立即退回前一阶。”","speaker":"沈砚"},{"type":"text","text":"第五声响起时，你才越过断纹。他的剑光恰好停在你落脚前半尺。"},{"type":"text","text":"（侧身替你挡住水线）“你听阵声一向很准。下一阶由你判断，我只替你守住退路。”","speaker":"沈砚"},{"type":"text","text":"九枚定阵钉同时亮起。前八层各立一枚名简，第九层名简仍是空白。\n\n第一层名简刻着早已模糊的姓名，第二层只剩一道水痕。每往上一阶，脚下寒意便加重一分，岸上的灯火也远一层。"},{"type":"text","text":"（用指节敲响剑鞘）“第三阶，脚下稳。第六阶开始听见水声里有人说话。”","speaker":"我"},{"type":"text","text":"“只听自己的声音。下一阶先别走。”","speaker":"沈砚"},{"type":"text","text":"沈砚停了一瞬，剑光沿你脚边绕过一圈，将藏在黑阶背面的牵引纹逼出水面。确认纹路断开，他才抬剑示意继续。\n\n水中浮出一名穿旧制弟子服的女子。她抬手，将湿透的衣袖向上折了两次。\n\n旧影身后的景象随水纹展开：九盏灯围着一方空台，八枚名简已经落定，第九枚始终悬在无人伸手的位置。远处有人敲响阵钟，旧影便一次次回头。"},{"type":"text","text":"（压住逐渐发冷的弟子令）“她在等第九枚名简落下。水镜正在用我的魂印补上那个位置。”","speaker":"我"},{"type":"text","text":"“先记住你此刻说的话。旧影会扰乱记忆，出去后我们逐句核对。”","speaker":"唐知夏"},{"type":"text","text":"你低头看去，自己的袖口也被折成相同宽度。\n\n镜面的寒气贴上手腕，心跳声也被水纹一下一下送回耳中。"},{"type":"text","text":"（握紧银针）“她的魂息正在靠近你，水纹已经缠到腕脉。先别碰镜面，我替你封住第一道牵引。”","speaker":"阿阮"},{"type":"text","text":"（盯住石面）“名简开始落字，第一笔与旧籍上的“玄”字相同。它正在照着你的魂印写。”","speaker":"唐知夏"},{"type":"text","text":"玄水九三个旧字落上石面。镜中女子抬头，面容与你重合了一瞬。\n\n第九层石阶骤然下沉，黑水卷住弟子令，将你拖向名简。\n\n岸上的药铃同时炸裂，碎银落进水面。许守安压住东侧阵盘，石缝仍一寸寸张开；阿阮将第二枚银针钉入你的影子，牵引只停了短短一瞬。"},{"type":"text","text":"“她还听得见！沈砚守住剑线，我把魂息固定在第八阶，别让名简拖走她的姓名。”","speaker":"阿阮"},{"type":"text","text":"沈砚踏进上涨的黑水，白衣被水纹染出冷青。他仍停在你侧前方，没有替你触碰名简，只将剑鞘送到你能自己握住的位置。\n\n寒水猛地灌进衣袖，弟子令贴着腕骨震颤。沈砚一步踏碎身前水纹，将旧剑横到你掌边。"},{"type":"text","text":"（声音压低）“抓住剑鞘，往我这边退。脚下若空了，顺着剑意落脚。”","speaker":"沈砚"},{"type":"text","text":"你握住剑鞘，脚下石阶随即碎裂。"},{"type":"text","text":"“第九归者，入籍。”","speaker":"玄水九旧影"},{"type":"text","text":"空白名简最后一笔骤然加深，黑阶像被人从水下抽走。你与沈砚同时下坠，岸上定魂铃急促作响，阿阮的银针穿过镜面，只来得及钉住一缕散开的魂息。"},{"type":"text","text":"“魂息还连着！唐知夏看名简，许守安守住东侧阵盘，谁也别让外环再塌一寸！”","speaker":"阿阮"},{"type":"text","text":"寒水封住口鼻以前，你握紧沈砚的剑鞘。清寒剑意从掌心传来，水下很暗，那道光始终停在你伸手能够碰到的位置。"}],"effects":[{"type":"relation","name":"沈砚","kind":"好感","value":1}],"ending":false}]}]},{"index":17,"title":"第十三章·下　第九归者","meta":{"前置条件":["完成第十三章·上《水镜开阶》"],"地点":["玄水镜阵"],"出场角色":["你、阿阮、唐知夏、许守安、裴青萝、周执、沈砚"]},"nodes":[{"type":"text","text":"黑水没过头顶，寒意穿过护身灵光直抵骨缝，岸上的呼喊被压成模糊震动。沈砚的剑意沿剑鞘落下，在浑浊水色中劈出一条狭窄光路。"},{"type":"text","text":"“魂印藏在你的识海里，我只能替你拖住水势。最后一道牵引必须由你亲手斩断，我会守在这里，直到你出剑。”","speaker":"沈砚"},{"type":"text","text":"第九名简裂开数层石皮。每一层刻着不同名姓，末尾都落着同一个称号：玄水九。"},{"type":"text","text":"（声音穿过水镜）“九层刻痕全在发亮，魂印已经重合！第九名简至少重刻过九次，每一次写的名字都不同！”","speaker":"唐知夏"},{"type":"text","text":"（掌心抵住镜面）“水镜在抽她的灵力，经脉已经出现裂伤！我能用定魂苔稳住一刻钟，再久便护不住灵台了！”","speaker":"阿阮"},{"type":"text","text":"第四阵眼同时冲破封印，黑水沿旧水道涌向试场。"},{"type":"condition","flag":"已抄录泄水图","options":[{"text":"选择：若已抄录泄水图","nodes":[{"type":"text","text":"你想起旧档中的副闸位置，隔着水镜向外传声。"},{"type":"text","text":"“周执，别开主闸！东侧第三块青砖下有副闸！”","speaker":"我"},{"type":"text","text":"周执摸到浅横纹，劈开第三块青砖。许守安将阵盘转向坎位，裴青萝斩断闸柄锁链。副闸开启的刹那，积压黑水轰然改道，裹着碎石灌入山后深渠。\n\n一截断梁随水浪掀起，正撞在周执胸前。沉闷骨裂声近得令人牙根发酸，他整个人被拍上石壁，手中的名册仍死死护在怀中。\n\n裴青萝用撤离绳缠住他的腰，将人从回流边缘拖回。周执唇边全是血，胸口只剩极轻起伏，指节仍扣着泡软的名册。"},{"type":"text","text":"（跪下探脉）“右侧肋骨断了三根，其中一根伤到肺脉，神魂也被水浪震散。他还有气息，先把定魂苔给我！”","speaker":"阿阮"},{"type":"text","text":"你托住周执冰冷的肩背，阿阮将碾碎的定魂苔压入他舌下，银针接连封住心口三处灵脉。药香散开时，他紧扣名册的手终于松了。"},{"type":"text","text":"“阿阮，他的气息这么弱……那他什么时候能醒？”","speaker":"我"},{"type":"text","text":"（声音发颤，落针仍稳）“眼下说不准。定魂苔只能护住那一线生机，我先稳住他的魂息，再等温师兄接骨续脉。今夜能熬过去，才有醒来的机会。”","speaker":"阿阮"},{"type":"text","text":"【周执状态：重伤昏迷】\n\n温鹤丹带着医修赶到，先以护心阵托住周执胸口，再剪开被血水浸透的外袍。断骨复位时传来细微摩擦声，周执始终未醒，呼吸却在药力下渐渐连贯。"},{"type":"text","text":"“命暂时保住了。接下来三日守着魂灯，灯火稳住，他才有醒来的可能。”","speaker":"温鹤丹"},{"type":"text","text":"林惊雨把泡软的名册一页页摊开，仍按周执留下的朱记重新清点。确认无人失踪后，她才把最后一张干燥符纸盖在他的姓名上。\n\n【后续影响：周执进入长期疗伤支线】"}],"effects":[],"ending":false},{"text":"选择：若未抄录泄水图","nodes":[{"type":"text","text":"周执赶到主闸。下方水道已经塌陷，强开会冲毁整段外环。"},{"type":"text","text":"（看向仍在撤离的人群）“水势再积一轮，山门前的人便来不及撤。主闸一开，外环会塌，你们都退到北墙外。”","speaker":"周执"},{"type":"text","text":"他将最后一名受伤弟子推上高处，又把试场名册塞进对方怀里。主闸锈死在石槽中，他用肩背顶住闸杆，掌心被粗粝铁锈割出血。"},{"type":"text","text":"（隔着水声喊道）“照名册逐一清点，活着的人都要带出去！少一个名字，便回头再找一次！”","speaker":"周执"},{"type":"text","text":"主闸被他抬起半尺。奔涌黑水撞进旧渠，断裂石梁也随浪头砸向外环。巨响过后，山壁间只剩闸链来回碰撞的声音。\n\n水势退去，周执被压在断梁与碎石之间。阿阮跪进泥水，手指按上他的颈侧，又伏下去听了很久的心音。她的袖口很快被血浸透。"},{"type":"text","text":"（声音极轻）“他的心脉断了，神魂也散了。定魂苔留不住他。”","speaker":"阿阮"},{"type":"text","text":"四周忽然静得只剩残水滴落。林惊雨握着传讯符站在原地，半晌才低头展开那册被周执护住的名册，依着他留下的朱记，一个名字一个名字重新清点。\n\n裴青萝移开断梁，将周执的宗规抄本与木牌放回他身侧。纸页已经泡烂，封面仍压着他亲手系好的细绳。\n\n【周执状态：过世】\n\n温鹤丹赶到时，阿阮仍守着周执最后一点余温。护心阵落下又熄灭，银针无法再引动心脉，医修逐一确认瞳光、脉息与魂灯，最终替他合上眼睛。"},{"type":"text","text":"（低声）“死亡时辰，丑时三刻。死因是心脉断裂与神魂溃散。把在场者姓名记全，也把他开闸救下的人数记全。”","speaker":"温鹤丹"},{"type":"text","text":"林惊雨用干布擦净周执脸上的泥水，又把他护住的名册放在身侧。裴青萝脱下外袍覆住遗体，衣角被风掀起时，她一次次伸手压平。"},{"type":"text","text":"（声音沙哑）“名册共三十四人，活着的三十三人都在。他说少一个名字便回头再找，这一次只少了他自己。”","speaker":"林惊雨"},{"type":"text","text":"外门弟子沿北墙站成一列。传讯符将死讯送往执事堂，山下铜钟缓缓敲了三声，原本嘈杂的试场只剩水滴从断梁落下。\n\n阿阮洗净双手，指缝仍留着淡红血色。她在死亡记录上写下周执姓名，笔尖抖了一下，又重新把每个字写得端正。\n\n【后续影响：周执过世，双重核名制度由同届弟子承接】\n\n第九名简仍在书写你的姓名，炼气境壁障被涌入经脉的灵力挤出裂纹。"},{"type":"text","text":"“阵眼正借你的魂印重启，岸上的水势也撑不了多久。先守住灵台，听自己的呼吸，别跟着名简里的声音走。”","speaker":"沈砚"}],"effects":[],"ending":false}]},{"type":"choice","prompt":"选择破阵方式","options":[{"key":"1","text":"以灵力镇水","nodes":[{"type":"text","text":"你将散乱灵力收回丹田。每压回一次黑水，经脉便传来撕裂般灼痛；第九次周天闭合，凝聚灵力撞开筑基壁障。"}],"effects":[{"type":"cultivation","value":2}],"ending":false},{"key":"2","text":"循旧痕破阵","nodes":[{"type":"text","text":"你从交叠水声中辨出四道与五道剑痕间的空隙，将灵力斩入名简背面。第九道牵引应声裂开，倒涌灵力在丹田中凝成灵台。"}],"effects":[{"type":"cultivation","value":1},{"type":"heartDemon","value":-1}],"ending":false},{"key":"3","text":"引水势冲关","nodes":[{"type":"text","text":"你放开对水势的压制，刺骨灵力沿经脉奔入丹田。沈砚以剑意护住识海，你从层叠人声中抓住自己的呼吸，借阵势冲破壁障。\n\n【境界突破：筑基初期】\n\n灵台初成的震动沿水镜传向岸上，九枚定阵钉同时裂开。黑水从四面压来，你的经脉仍在灼痛，识海中却第一次有了可以站稳的地方。"},{"type":"text","text":"（握紧剑鞘）“我已经筑基。接下来斩名简，不让它替我写完姓名。”","speaker":"我"},{"type":"text","text":"“按你选好的剑路出剑，我替你守住退路。”","speaker":"沈砚"},{"type":"text","text":"沈砚只说了这一句。剑意替你压住翻涌水势，最后落向名简的力量由你亲手斩出。\n\n第九名简承受不住两股力量，表面裂成数片。你的姓名停在最后一笔前，随碎石沉入黑水。\n\n你跃出镜面，阿阮立即扣住你的手腕。"},{"type":"text","text":"（急得语速飞快）“灵脉已经稳住，筑基也成了。现在头晕不晕？耳边还有谁在说话？手指能不能动？你先看着我，一样一样回答。”","speaker":"阿阮"},{"type":"text","text":"“我听得见，也认得出你。手指还能动，胸口冷得有些发疼。”","speaker":"我"},{"type":"text","text":"（长舒一口气）“认得我便好，胸口发冷稍后再诊。你下回还敢这样吓人，我真要把定魂香缝进你的衣领，让你走到哪里都带着药味。”","speaker":"阿阮"},{"type":"text","text":"唐知夏捡起一片碎裂名简。水珠滑过石面，显出数个相互覆盖的名字。"},{"type":"text","text":"（将碎片按刻痕排开）“玄水九是一道旧籍称号。九层名姓各不相同，魂印纹路完全重合，灵鉴台认出的正是这一道旧籍。”","speaker":"唐知夏"},{"type":"text","text":"水镜沉没前，玄水九旧影再次出现。她将湿透的衣袖折起两次，走向一名执剑之人。\n\n那人的面容被水光遮住，腰间佩剑与沈砚手中的旧剑一模一样，连褪色剑穗上的结都分毫相同。\n\n沈砚抬手覆住剑柄，指节绷得发白。水镜在他掌下裂开，满地月光映出他腕间那道陈旧剑伤。"}],"effects":[{"type":"cultivation","value":3},{"type":"heartDemon","value":1}],"ending":false}]},{"type":"text","text":"水镜彻底沉下以后，试场迎来清晨第一线天光。救援绳、药箱与湿透的名册铺满石地，每个人都在处理自己负责的事，没有谁围着你追问水下看见了什么。\n\n沈砚站在阵口之外，白衣被黑水浸透，眉眼仍清冷。他确认你能够独自站稳，便向后退开一步，将道路让出来。"},{"type":"text","text":"“沈砚，水镜里的剑与你手中这一把相同。等我休息好，我们一起查剑、名简与魂印。”","speaker":"我"},{"type":"text","text":"“我会同你一起查。查清以后，我会告诉你。”","speaker":"沈砚"},{"type":"text","text":"沈砚暂未解释镜中的旧影，仍清楚回应了你的请求。他把一枚气味清淡的温脉丹放在石栏上，转身去守住仍在渗水的阵口。\n\n唐知夏将名简碎片装入证物匣，在封签上写下你此生的姓名。阿阮守着伤者与魂灯，许守安开始测量坍塌阵盘，裴青萝带人重新核对撤离绳。"},{"type":"text","text":"“旧籍写过许多名字，今日的记录只认这一份。筑基弟子，姓名由本人填写。”","speaker":"唐知夏"},{"type":"text","text":"你接过笔，在新弟子册上重新写下自己的姓名。墨迹落定时，灰蓝水纹从纸背浮起，又被新鲜笔锋压了下去。\n\n【第一卷《栖云》完成】\n\n【卷尾揭示：你并非第一次被登记为“玄水九”】"}]}];

window.XM_GIFT_DATA = {"dialogues":{"护剑油":{"沈砚":"沈砚接过瓷瓶，先看了一眼封口，又倒出一滴，在旧剑靠近护手的位置轻轻抹开。\n\n油色清透，很快渗入剑身的旧接缝，没有留下浮腻的光。\n\n“这种油不伤旧剑。”\n\n他重新封好瓶口，收入剑匣。\n\n“我会用。多谢。”","谢临川":"谢临川拔出短刀，在刀背上比了比。\n\n“我这把刀挨过雨，也碰过沙，确实该收拾一回。”\n\n他将护剑油放进外巡行囊。\n\n“名字写着养剑，刀也一样能用。谢了。”","墨无咎":"墨无咎转了转瓷瓶，查看瓶底的兵刃铺印记。\n\n“封蜡完整，油里也没有掺廉价松脂。”\n\n他将瓶子收进袖中。\n\n“我虽不常使长剑，随身短刃总要养护。这份礼很实在。”","顾长清":"顾长清看过瓶上的用法，将护剑油推回我面前。\n\n“天衡峰的兵刃房备着剑油，我平日取用方便。”\n\n“你的剑往后也要常经风雨，这瓶留在身边更合适。”"},"缠柄布":{"沈砚":"沈砚捻过布面，试了试厚薄。\n\n“织得密，缠上以后不会滑手。”\n\n他看了一眼旧剑上已经磨白的柄布。\n\n“原先那一层也该换了。”","谢临川":"谢临川扯了扯布卷，确认它受力后不会轻易断开。\n\n“能缠刀柄，也能临时固定木板和伤处。”\n\n他把布卷塞进行囊外层。\n\n“外巡时用处不少，我收下了。”","墨无咎":"墨无咎将布卷展开一段，对着日光看了看经纬。\n\n“颜色寻常，织得倒很结实。”\n\n“商队搬货时，箱柄和缰绳都磨手。这卷布不会闲置。”","顾长清":"顾长清接过布卷，顺手比了一下阵旗木杆的粗细。\n\n“前几日才有弟子说，练习阵旗的握处已经磨损。”\n\n他收好布卷。\n\n“我先留着，待换下旧布时便能用上。”"},"止血散":{"沈砚":"沈砚看过药包上的封期。\n\n“药性还新。”\n\n他将止血散放入剑匣侧袋，又从里面取出另一包旧药。\n\n“我这里尚有一些。你出门时，也要给自己留一份。”","谢临川":"谢临川接过药包，指腹压了压封口。\n\n“外巡最容易缺的就是这个。”\n\n“伤口拖到回山再治，小伤也能磨成麻烦。”\n\n他把止血散放到行囊最容易取到的位置。\n\n“我收下。下回遇上有人受伤，能早用一刻。”","墨无咎":"墨无咎先看药铺印记，又核过封口上的日期。\n\n“药没有受潮，包得也严实。”\n\n他将止血散收入随身木匣。\n\n“行商路上磕碰难免，备着总比临时寻药稳妥。”","顾长清":"顾长清接过药包，确认封口无损。\n\n“九峰弟子外出时都该随身带着。”\n\n“我会放在自己的行囊里，不挪进公用药箱。”"},"净水符":{"沈砚":"沈砚看了一遍符纹。\n\n“我很少走水路。”\n\n他想了想，还是将符纸收入剑匣。\n\n“后山雨季积水重，旧剑坪的石缝也能用到。”","谢临川":"谢临川将符纸迎着光看了看。\n\n“百草谷和山下水道都能用。”\n\n“巡路时若遇见浑水，也能先辨出里面有没有东西。”","墨无咎":"墨无咎没有立刻收下，先看了符尾的落印。\n\n“符线完整，灵气也没有散。”\n\n他将净水符放入防潮纸袋。\n\n“商队运药最怕水源出事。这张符，抵得上一日绕路。”","顾长清":"顾长清把净水符收入袖中。\n\n“云泽之后，宗门会增加几次水域巡查。”\n\n“这张符放在身边，遇见不明水气时可以先作查验。”"},"照明符":{"沈砚":"沈砚以指尖托住符角，确认符火不会伤到纸面。\n\n“后山石缝里还有几柄断剑。”\n\n“有了这张符，再去查看时会方便些。”","谢临川":"谢临川把符纸折好，放进行囊肩侧。\n\n“夜巡时火把容易暴露位置，符光收得住。”\n\n“这个实用，多谢。”","墨无咎":"墨无咎将照明符放到一只旧木匣旁试了试。\n\n“光线平稳，细小封蜡也能看清。”\n\n“往后验货不必总等到白日。”","顾长清":"顾长清查看过符纸剩余的灵气。\n\n“夜里查阵时，灯火容易被山风吹灭。”\n\n“这张符能照清石阶，又不会扰动阵纹。我收下了。”"},"传讯纸符":{"沈砚":"沈砚接过纸符，在空白处停了片刻。\n\n“我平日用得少。”\n\n他仍将纸符收进剑匣侧层。\n\n“旧剑坪离前山远。若阵路有变，能早些传出消息。”","谢临川":"谢临川看过纸符能够传出的距离。\n\n“够从百草谷送到外巡岗。”\n\n他把符纸收入贴身的小袋。\n\n“遇上兽群或山路塌陷，少跑一趟便能多留几分力气。”","墨无咎":"墨无咎查过符纸落印，又在指间轻轻一转。\n\n“坊市里卖的传讯符很多，能把字送全的却不算多。”\n\n“这一张符路清楚，带着不会误事。”","顾长清":"顾长清接过纸符，先检查了传讯范围与符尾印记。\n\n“天衡峰与主峰相隔不远，遇见阵路异动时，一张传讯符能省下许多耽搁。”\n\n他将纸符收入随身的阵图匣。\n\n“你挑得很合用。多谢。”"},"清脉散":{"沈砚":"沈砚看过药包，眉间稍稍一顿。\n\n“我最近用不上。”\n\n他将清脉散放回我手中。\n\n“你修为正到紧要处，经脉受累时别强撑。”","谢临川":"谢临川掂了掂药包。\n\n“外巡回来以后服一包，确实能少疼两日。”\n\n“我收着。你也别把自己的那份全送出去。”","墨无咎":"墨无咎看过药包上的丹霞峰印记。\n\n“药粉细，封口也新，应当没有走过潮湿水路。”\n\n他收入药匣。\n\n“连着赶路时，经脉比腿脚更容易吃不消。这份礼很周全。”","顾长清":"顾长清将药包翻到背面，看过服用时辰。\n\n“筑基之前，你比我更需要清脉散。”\n\n他把药重新递回来。\n\n“等你经脉稳下来，再考虑送人。”"},"回元露":{"沈砚":"沈砚接过小瓶，轻轻晃了一下。\n\n“没有沉渣。”\n\n他把回元露放进剑匣。\n\n“若在后山练剑太久，能用得上。”","谢临川":"谢临川拔开瓶塞闻了一下，随即重新封好。\n\n“药味不冲，赶路时服也不会扰乱气息。”\n\n他收进外巡行囊。\n\n“下次长途巡山，我带着。”","墨无咎":"墨无咎将瓶身对着光看过。\n\n“裴氏配出的回元露，药性一向平稳。”\n\n“放在商队里值钱，留在自己身边也同样值钱。你的心意我收下了。”","顾长清":"顾长清查看瓶口封蜡。\n\n“水镜台之后，峰中还有许多后续事务。”\n\n他收下回元露。\n\n“我会在需要时用，不会一直放到药性散去。”"},"验货签":{"沈砚":"沈砚看过签纸，随后递还给我。\n\n“剑上的问题，我用耳朵和手便能查出大半。”\n\n“你在坊市买旧物时更需要它。”","谢临川":"谢临川将验货签拍在一只旧药箱上试了试。\n\n签面很快浮出受潮痕迹。\n\n“外巡领物时也能用。”\n\n“总比背到半路，才发现药包进了水强。”","墨无咎":"墨无咎接过验货签，先看纸纹，再看管事处落下的暗印。\n\n“是管事处新出的那一批，能验封蜡，也能查浅层掺杂。”\n\n他妥善收进袖中。\n\n“坊市里，能让人少看走一次眼的东西，一向很有分量。”\n\n“这份礼，我很喜欢。”","顾长清":"顾长清将验货签贴近一只阵材匣。\n\n“宗门接收外来阵材时，偶尔也会遇见封口与内物不合。”\n\n他收起签纸。\n\n“可以先作初查，再请熟悉材料的弟子复核。”"},"纸墨":{"沈砚":"沈砚展开一张纸，试着折过边角。\n\n“纸面结实，画剑路时不会被笔锋划破。”\n\n他收好纸墨。\n\n“旧剑坪还有几道剑痕需要记下来。”","谢临川":"谢临川拿起墨条看了看。\n\n“我写字算不上好看，巡山图总要画清楚。”\n\n他把纸墨放进行囊。\n\n“下回画路线，至少不会再被雨水一冲就散。”","墨无咎":"墨无咎在纸角落下一小笔。\n\n墨色很快沉入纸面，边缘没有晕开。\n\n“纸是清河镇出的，墨来自灵墟北铺。”\n\n“用来写契书和货单都合适。你挑东西很仔细。”","顾长清":"顾长清翻过纸页，看到纸边压着细小水纹。\n\n“这种纸适合绘阵图，折过以后也不容易断裂。”\n\n他将纸墨放入阵图匣。\n\n“下一次重绘天衡剑阵，我会用它。”"},"防潮纸袋":{"沈砚":"沈砚试过纸袋的封口。\n\n“剑谱和拓样都怕受潮。”\n\n他把一张旧剑痕草图放进去，纸袋大小正好。\n\n“比放在剑匣底层妥当。”","谢临川":"谢临川把折好的巡山图塞进纸袋。\n\n“雨一落，最先遭殃的总是地图和传讯符。”\n\n他系紧袋口。\n\n“这东西看着轻，用处倒很实在。”","墨无咎":"墨无咎摸了摸纸袋内层的防水蜡。\n\n“蜡压得薄，不会粘住里面的纸。”\n\n他将几张货单放入其中。\n\n“清河冬市这批纸袋做得不错。你买到的是好货。”","顾长清":"顾长清将纸袋展开，放入两张尚未誊清的阵图。\n\n“峰中卷册多，赶上连日山雨时，常有纸页受潮。”\n\n“我收下了，正好随身带一只。”"},"厚布护腕":{"沈砚":"沈砚试着扣上护腕，又活动了一下手腕。\n\n“太厚，出剑时会压住转腕。”\n\n他解下护腕，叠好后还给我。\n\n“你走问天石路时可以用。”","谢临川":"谢临川戴上护腕，握住刀柄试了两次。\n\n“厚度合适，不妨碍拔刀。”\n\n“山路上搬石、拉绳都容易磨伤手腕。这个我收下。”","墨无咎":"墨无咎看了看护腕内侧的缝线。\n\n“行商搬箱时能用，只是颜色太显眼。”\n\n他将外层布翻到里面，重新扣好。\n\n“这样便妥当了。”","顾长清":"顾长清戴上护腕，试着提起一根阵旗木杆。\n\n“修整阵旗时能够护住腕骨，平日练剑则略显厚重。”\n\n他将护腕收好。\n\n“用在合适的地方，便不会浪费。”"}},"repeat":{"沈砚":"沈砚认出这件东西，动作停了一下。\n\n“上次那份还没有用完。”\n\n“你留着。”","谢临川":"谢临川看了一眼手中的同类物品。\n\n“我行囊里已经有一份。”\n\n“多带反倒占地方，你自己收好。”","墨无咎":"墨无咎将礼物推回案前。\n\n“东西再合用，囤得太多也会放坏。”\n\n“这一份留给更需要的人。”","顾长清":"顾长清记得上次收下的物品。\n\n“先前那份仍在，我也已经记下你的心意。”\n\n“这一件不必再送。”"},"matches":{"沈砚":"护剑油","谢临川":"止血散","墨无咎":"验货签","顾长清":"传讯纸符"},"refused":{"沈砚":["清脉散","验货签","厚布护腕"],"谢临川":[],"墨无咎":[],"顾长清":["护剑油","清脉散"]},"descriptions":{"护剑油":"兵刃铺调制的养护用油，可防止剑身受潮生锈。可作为礼物赠予他人。","缠柄布":"耐磨的细布，可用于缠绕剑柄、刀柄与常用工具。可作为礼物赠予他人。","止血散":"外巡常备药物，可用于处理寻常刀剑伤与妖兽抓伤。可作为礼物赠予他人。","净水符":"可聚拢水中杂质，清理少量残油、腐叶与浑浊水气。可作为礼物赠予他人。","照明符":"点亮后可维持一段时辰，适合夜间、洞穴与矿道探索。可作为礼物赠予他人。","传讯纸符":"可向一定范围内的同门传递简短消息。可作为礼物赠予他人。","清脉散":"可缓解经脉疲惫，适合连续修行或施术后服用。可作为礼物赠予他人。","回元露":"药性温和，可较快恢复体力。可作为礼物赠予他人。","验货签":"由坊市管事处出售，可查验货物的部分缺损、掺杂与残留气息。可作为礼物赠予他人。","纸墨":"纸质细密，墨色耐久，适合誊写账册、阵图与修行札记。可作为礼物赠予他人。","防潮纸袋":"能够隔开少量水气，适合存放符纸、账页与药包。可作为礼物赠予他人。","厚布护腕":"布层厚实，可在山路、寒冷或搬运物品时保护手腕。可作为礼物赠予他人。"}};
