window.XM_EXPLORE_EVENTS = [{"id":"E0101","chapter":1,"title":"叶下虫声","meta":{"事件类型":"人物／地点事件","触发地点":"栖云院药圃","开放条件":"完成第一章《栖云引气》","行动消耗":"1","重复规则":"仅一次"},"intro":["入夜后，院中的灯已经熄了大半。\n\n我经过药圃时，听见叶片下传来一阵细碎摩擦声。阿阮提着小灯蹲在田埂旁，裙角沾了泥，手里捏着一片被啃出孔洞的聚灵草叶。\n\n她将叶片翻过来。\n\n几只灰壳灵虫紧贴在叶脉间，背壳上还覆着一层细白粉末。\n\n“白日里还没有这么多。”\n\n阿阮拨开旁边的土，虫卵已经结成浅灰色小团，沿着根系向整畦药草蔓延。\n\n“它们吃得快，明早这一片就保不住了。”\n\n药圃中有三处虫巢。若逐只清理，需要耗费不少时间；若用药粉，处理得快，却可能伤到刚长出的嫩叶。"],"choices":[{"key":"①","text":"使用【驱虫粉】，先封住虫巢。","condition":"持有驱虫粉","stable":"","body":["我将药粉沿虫巢外围撒开。\n\n灰壳灵虫碰到药粉后纷纷蜷缩。阿阮没有立刻松气，又用湿土将药粉与嫩叶隔开。\n\n“驱虫粉下得重，虫是没了，草也会伤。”\n\n她检查完三处根系，确认药粉没有渗进主根，才重新将土压实。\n\n“这一包用得值。”"],"effects":["【驱虫粉－1】","【宗门贡献＋2】"],"heading":"使用驱虫粉"},{"key":"②","text":"与阿阮逐株清理虫卵。","condition":"","stable":"","body":["我卷起衣袖，同阿阮沿田埂逐株查看。\n\n虫卵黏在叶背与根须之间，不能直接扯下。阿阮用竹片挑开土层，我则将清出的虫卵装进空药罐。\n\n忙到后半夜，最后一处虫巢才算清干净。\n\n阿阮捶了捶发酸的肩。\n\n“你认虫不快，手倒是很稳。明日若还有漏下的，我再来找你。”"],"effects":["【体力－1】","【阿阮信任＋1】"],"heading":"逐株清理"},{"key":"③","text":"记下虫巢分布，连夜报给杂务堂。","condition":"","stable":"","body":["我将虫巢位置画在弟子令附页上，又封住最严重的一畦，免得灵虫继续爬散。\n\n杂务堂值夜弟子很快赶来。\n\n他看过虫壳上的白粉，神情严肃了几分。\n\n“这是随外来药苗带进来的灰甲虫。今夜不处理，明日其他院落也会遭殃。”\n\n药圃很快被临时封锁。"],"effects":["【获得札记：灰甲虫来源】","【后续宗门任务“药苗清查”开放】"],"heading":"上报杂务堂"}]},{"id":"E0102","chapter":1,"title":"错页院册","meta":{"事件类型":"人物事件","触发地点":"栖云院廊下","开放条件":"完成第一章《栖云引气》","行动消耗":"1","重复规则":"仅一次"},"intro":["午后，唐知夏独自坐在廊下。\n\n她面前摊着三册院务记录，纸页间压满细木签。平日整齐的桌面今日显得有些乱，药圃用水、阵石修缮和灵灯领取的记录混在了一起。\n\n“装订时串了两页。”\n\n她把其中一册推到我面前。\n\n“若只错一页，重新抄过便好。现在连前后的余数都对不上。”\n\n账册上共有三处异常。\n\n一处日期相同，领取人数不同；一处数字被墨点遮住；还有一处签名只写了一半。\n\n唐知夏已经核了大半日，眼底带着疲色。\n\n“今夜前要送去杂务堂。错一笔，下一旬的材料就会照错数发下来。”"],"choices":[{"key":"①","text":"与她逐项核对原始木牌。","condition":"","stable":"","body":["我按日期将木牌重新排开，唐知夏负责核算余数。\n\n一笔药圃用水被误记到阵石修缮名下，正好造成两边数字同时不合。\n\n找到错处后，她立刻划去旧数，重新写明缘由。\n\n“若只改最后的总数，下一次还会错。”\n\n她将核对过的木牌重新系好。\n\n“从头捋一遍，果然比凭着总数猜省事。方才那处日期，你抓得很准。”"],"effects":["【唐知夏信任＋1】"],"heading":"核对木牌"},{"key":"②","text":"使用【纸墨】，重新誊写整册。","condition":"持有纸墨","stable":"","body":["我铺开新纸，依照正确顺序重新誊写。\n\n唐知夏在旁逐句核对，遇到不清楚的地方便停下来查木牌。直到日头偏西，新册才完整装订。\n\n她翻过最后一页。\n\n“字迹清楚，送去杂务堂也省得再抄一次。”"],"effects":["【纸墨－1】","【宗门贡献＋2】"],"heading":"重新誊写"},{"key":"③","text":"先追查半截签名对应的领用人。","condition":"","stable":"","body":["我拿着那张只留半截签名的木牌，在院中问了一圈。\n\n最终，许守安认出上面的笔画来自一名已经搬离栖云院的旧弟子。那笔材料确实领过，只是交接时忘了补全姓名。\n\n唐知夏将那名旧弟子的牌号补回账册。\n\n“这笔错得不大，却最难查。”"],"effects":["【获得札记：栖云旧住册】","【后续可用于旧档调查】"],"heading":"追查签名"}]},{"id":"E0103","chapter":1,"title":"雨后的窗","meta":{"事件类型":"人物事件","触发地点":"栖云院灵居","开放条件":"完成第一章《栖云引气》","行动消耗":"1","重复规则":"仅一次"},"intro":["连日小雨过后，窗框每逢起风便发出轻响。\n\n我原以为只是木料受潮，直到夜里推窗时，整扇窗向外歪了半寸。\n\n许守安提着工具赶来，蹲下检查墙缝。\n\n“固定木楔泡胀了，右侧石缝也有些松。”\n\n他用手指压住窗角。\n\n“现在修，只换一根木楔。再拖几日，连墙边阵纹都要重新补。”\n\n屋外风势渐强。\n\n窗框已经无法自行立稳。许守安需要一人扶住木架，另一人处理墙缝和阵纹。"],"choices":[{"key":"①","text":"替他稳住窗框。","condition":"","stable":"","body":["我站到窗边，按照许守安的指示托住下角。\n\n木架比看起来沉，风一吹便向外偏。许守安换下受潮木楔，又重新固定上方卡扣。\n\n“别往上抬，向内压。”\n\n我调整力道，窗框终于重新嵌回石槽。\n\n他检查完一圈。\n\n“窗框没再偏，力道正好。下回遇到这种松动，先用木片卡住，别等整扇掉下来。”"],"effects":["【体力－1】","【许守安信任＋1】"],"heading":"稳住窗框"},{"key":"②","text":"使用【修缮石粉】填补墙缝。","condition":"持有修缮石粉","stable":"","body":["我将石粉调成泥浆，沿着裂缝一点点压入。\n\n许守安负责校正窗框，等石粉凝住以后，又补回断开的细小阵纹。\n\n风再次吹来，窗框只轻轻晃了一下。\n\n“石粉够细，能撑到入冬。”"],"effects":["【修缮石粉－1】","【宗门贡献＋2】"],"heading":"填补墙缝"},{"key":"③","text":"请他先教自己判断松动位置。","condition":"","stable":"","body":["我没有急着动手，先请他指出窗框受力的位置。\n\n许守安用木锤轻敲四角。\n\n左上声音清脆，右下却明显发闷。\n\n“听起来不一样，说明里面有空。”\n\n他让我自己重新判断一次。确认位置后，我们才开始修补。"],"effects":["【修为＋3】","【札记新增：基础修缮】"],"heading":"学习判断受力"}]},{"id":"E0104","chapter":1,"title":"收灶之前","meta":{"事件类型":"地点事件","触发地点":"灵膳堂","开放条件":"第一章结束后","行动消耗":"1","重复规则":"每年一次"},"intro":["我赶到灵膳堂时，灶火已经开始熄了。\n\n窗口只剩一碗灵米粥和半碟腌笋。值守弟子正准备收走木牌，身后却又跑来一名新弟子。\n\n他刚从灵田回来，鞋边全是泥，脸色也有些发白。\n\n“还有饭吗？”\n\n值守弟子看了看最后一碗粥。\n\n“一份。”\n\n那名弟子显然已经饿了许久，却仍站在窗口旁，没有伸手。"],"choices":[{"key":"①","text":"将灵米粥让给他。","condition":"","stable":"","body":["我把木牌推给他。\n\n那名弟子愣了一下，连声道谢。值守弟子看在眼里，从后厨找出一只冷掉的杂粮饼递给我。\n\n“粥没了，先垫一垫。”"],"effects":["【体力＋1】"],"heading":"让出灵粥"},{"key":"②","text":"同他各分一半。","condition":"","stable":"","body":["值守弟子找来两只小碗，将灵米粥分开。\n\n分量不多，胜在灵气温和。那名弟子吃完后，脸色很快缓了过来。\n\n“明日我还去灵田。”他抹去碗沿的水汽，“若你来得晚，我替你留一勺热的。”"],"effects":["【体力＋2】"],"heading":"各分一半"},{"key":"③","text":"自己用完，再替他去后厨问问。","condition":"","stable":"","body":["我先用完灵粥，又替他去后厨问了一圈。\n\n厨下还剩一锅准备喂灵兽的粗米饭。虽然灵气少些，至少能够填饱肚子。\n\n值守弟子重新热了一碗。"],"effects":["【体力＋3】"],"heading":"去后厨询问"}]},{"id":"E0105","chapter":1,"title":"古松下的余光","meta":{"事件类型":"修行事件","触发地点":"栖云聚灵阵","开放条件":"完成第一章《栖云引气》","行动消耗":"1","重复规则":"仅一次"},"intro":["聚灵阵修复以后，古松下仍有一小段阵纹时明时暗。\n\n白日里看不出异样，到了夜间，灵光每经过转角便会散去少许。若在此处打坐，灵气依旧能够入体，运转速度却比其他位置慢。\n\n我沿着阵纹检查了一遍。\n\n断口不大，像是旧日修补时少接了一笔。贸然补上，也可能让附近阵路发生偏移。"],"choices":[{"key":"①","text":"依照引气诀，顺着现有灵路梳理气息。","condition":"","stable":"","body":["我在古松下盘膝坐好。\n\n每当灵气经过转角，我便放缓运转，将散开的部分重新引回经脉。\n\n起初十次只能收回一两缕。等到呼吸渐稳，灵气终于能够完整走过断口。"],"effects":["【体力－1】","【修为＋6】"],"heading":"梳理灵气"},{"key":"②","text":"使用【残缺聚灵符】暂时补足断口。","condition":"持有残缺聚灵符","stable":"","body":["我将残符贴在阵纹外侧。\n\n符纸上的聚灵纹亮起一半，与地面断口短暂相连。周围灵气迅速向古松下聚拢。\n\n残符只能维持一次吐纳。我抓紧时机完成一个小周天。"],"effects":["【残缺聚灵符－1】","【修为＋10】"],"heading":"使用残符"},{"key":"③","text":"将阵纹拓下，交给唐知夏与许守安核对。","condition":"","stable":"","body":["我用薄纸拓下阵纹转角，又标明灵光明灭的时辰。\n\n唐知夏对照院册，发现这段阵路曾在十余年前更换过。许守安则确认地下还有一块未被取出的旧阵石。\n\n两人暂时封住此处，准备等材料齐全后再修。\n\n第二章《外门初课》自由行动事件"],"effects":["【宗门贡献＋2】","【札记新增：古松旧阵石】"],"heading":"留下拓样"}]},{"id":"E0201","chapter":2,"title":"偏离的灵光","meta":{"事件类型":"修行事件","触发地点":"演武场","开放条件":"完成第二章《外门初课》","行动消耗":"1","重复规则":"仅一次"},"intro":["演武场西侧摆着数具练习木傀。\n\n我依照玉简催动术法，灵光却总在靠近试法石前偏向左侧。连续数次以后，木傀毫发无损，旁边的石砖倒多了几道浅痕。\n\n周执刚核完阵旗，经过时停下脚步。\n\n“每次都偏向同一处，灵气本身多半无碍，偏差另有来处。”\n\n他指向木傀脚下。\n\n固定木傀的阵纹缺了一角，试法石也因此向左偏了半寸。若继续照着错误位置练习，久而久之，出手方向也会受到影响。"],"choices":[{"key":"①","text":"暂停练习，与周执重新校正木傀。","condition":"","stable":"","body":["我收回灵气，按照周执指出的位置转动木傀底座。\n\n他站在阵纹另一侧，逐一确认试法石、肩轴与地面刻度。校正完成后，我重新施术，灵光准确落在石面中央。\n\n周执看过阵盘上的记录。\n\n“木傀先歪了，术法却差点跟着练偏。你肯收手看这一眼，便没把错处留进手里。”"],"effects":["【周执信任＋1】"],"heading":"重新校正木傀"},{"key":"②","text":"换一具木傀，先完成今日术法修习。","condition":"","stable":"","body":["我换到相邻试法区。\n\n新的木傀阵纹完整，术法连续三次命中试法石。原本偏斜的灵气轨迹也逐渐恢复稳定。\n\n练习结束后，我将故障木傀的牌号写上修缮木牌。"],"effects":["【体力－1】","【修为＋6】"],"heading":"更换木傀"},{"key":"③","text":"使用【定纹砂】暂时补齐阵纹。","condition":"持有定纹砂","stable":"","body":["我将定纹砂撒入缺损位置，再依照周围纹路补出转角。\n\n阵纹重新亮起，试法石也随之归位。\n\n负责演武场的弟子检查以后，将这次修缮记入任务册。"],"effects":["【定纹砂－1】","【宗门贡献＋2】"],"heading":"补齐阵纹"}]},{"id":"E0202","chapter":2,"title":"剑架上的木剑","meta":{"事件类型":"人物事件","触发地点":"演武场","开放条件":"完成第二章《外门初课》，已认识裴青萝","行动消耗":"1","重复规则":"仅一次"},"intro":["试法结束后，演武场的人渐渐散去。\n\n裴青萝仍站在剑架前。她拿起一柄练习木剑，挥过两次，又换回原位。剑架上的木剑长短相近，重量却各有差别。\n\n“这些剑的重心都偏后。”\n\n她取下其中最旧的一柄，屈指敲了敲剑脊。\n\n“练劈斩还行，用来练转腕，动作容易变形。”\n\n我拿起另一柄试了试。\n\n剑柄较粗，剑锋前端又轻，确实难以控制收势。"],"choices":[{"key":"①","text":"与她交换所选木剑，各自试过再判断。","condition":"","stable":"","body":["我把手中的木剑递给裴青萝，也接过她挑出的那柄。\n\n两人各自练了数招。\n\n她的剑适合直取，我这柄则更利于回转。换过以后，原本生涩的招式都顺畅了些。\n\n裴青萝收势，将木剑重新放回架上。\n\n“你挑剑时还算仔细。”\n\n她看了一眼我方才留下的剑痕。\n\n“第三招慢了半息。下次试锋，我不会等你。”"],"effects":["【裴青萝信任＋1】"],"heading":"交换木剑"},{"key":"②","text":"使用【缠柄布】，重新调整旧木剑的握持位置。","condition":"持有缠柄布","stable":"","body":["我拆下已经松散的旧布，重新缠住剑柄前端。\n\n重量没有改变，握持位置前移以后，剑锋已经容易控制许多。\n\n裴青萝试了两招。\n\n“这样还能用。”\n\n她将其余几柄同样偏重的木剑放到一边，等演武场弟子统一修整。"],"effects":["【缠柄布－1】","【宗门贡献＋2】"],"heading":"调整剑柄"},{"key":"③","text":"挑一柄较轻的木剑，独自练习基础剑势。","condition":"","stable":"","body":["我选了一柄较轻的木剑，在空出的试法区反复练习。\n\n轻剑容易起势，收回时也不至于压住手腕。等动作熟悉以后，我再换回正常重量。"],"effects":["【体力－1】","【修为＋6】"],"heading":"独自练剑"}]},{"id":"E0203","chapter":2,"title":"竹简归处","meta":{"事件类型":"地点事件","触发地点":"藏经阁外层","开放条件":"完成第二章《外门初课》","行动消耗":"1","重复规则":"仅一次"},"intro":["藏经阁午后十分安静。\n\n我归还基础术法玉简时，发现书架角落放着一卷竹简。简上没有书号，只在系绳处挂着半块褪色木牌。\n\n展开以后，里面记的是五系术法最初的引气走向。\n\n内容并不高深，其中几处口诀却与现行玉简略有不同。\n\n负责看守的弟子查看木牌，也无法确认它原本属于哪一架。\n\n“无号旧卷不能随意借出。若找不到来处，只能先封进旧箱。”"],"choices":[{"key":"①","text":"根据竹简内容，查找对应术法书架。","condition":"","stable":"","body":["我逐架比对术法名称与旧书号。\n\n竹简中提到的几种口诀已经被后来的修士删改，旧书号也藏在一册修订目录末尾。\n\n最终，我在五行术法总录中找到了它的位置。\n\n看守弟子把竹简放回原架。\n\n“旧卷有了去处，往后有人查修订来历，也不必再翻整箱。”"],"effects":["【宗门贡献＋2】","【札记新增：基础术法旧录】"],"heading":"查找原位"},{"key":"②","text":"使用【空白木签】，替竹简重新标注。","condition":"持有空白木签","stable":"","body":["我依照修订目录写明竹简名称、旧书号与所在书架。\n\n看守弟子核过内容，在木签背面盖上藏经阁印。"],"effects":["【空白木签－1】","【获得物品：藏经阁借阅牌】","【效果：下一次藏经阁探索不消耗行动次数】"],"heading":"重新标注"},{"key":"③","text":"抄下与自身灵根相关的一小段，再将竹简交回。","condition":"","stable":"","body":["我只抄下与自身灵根相合的一段运气方法。\n\n旧口诀引气更缓，适合初学者梳理经脉，却不利于快速施术。我将两种走向对照练过一遍，才把竹简交回。"],"effects":["【修为＋7】"],"heading":"抄录口诀"}]},{"id":"E0204","chapter":2,"title":"重叠的任务牌","meta":{"事件类型":"宗门事件","触发地点":"杂务堂","开放条件":"完成第二章《外门初课》","行动消耗":"1","重复规则":"仅一次"},"intro":["杂务堂外的木墙上挂满任务牌。\n\n我准备领取清扫演武场的院务时，发现同一位置挂着两块内容相同的木牌：\n\n清理西侧试法区碎石。\n\n报酬：宗门贡献二点。\n\n两块差事牌的牌号不同，落款却是同一日。\n\n若被两名弟子分别领走，杂务堂便会重复发放贡献；若贸然取下一块，也可能漏掉另一桩尚未写入册中的差事。\n\n值守弟子正忙着清点材料，无暇逐一核查。"],"choices":[{"key":"①","text":"将两块差事牌交给值守弟子查验。","condition":"","stable":"","body":["值守弟子翻过两块木牌，很快发现其中一枚印记浅了一层。\n\n“这块昨日已经作废，收牌时漏了。”\n\n他当场销去旧牌，又把正确任务交给我。"],"effects":["【宗门贡献＋2】"],"heading":"交给值守弟子"},{"key":"②","text":"先领取其中一块，完成任务后再说明情况。","condition":"","stable":"","body":["我取下牌号较新的木牌，前往演武场清理碎石。\n\n任务完成后，我把另一块牌仍挂在墙上的事一并报明。值守弟子重新核对，没有重复发放贡献。"],"effects":["【体力－1】","【宗门贡献＋3】"],"heading":"先完成任务"},{"key":"③","text":"翻看当日差事册，找出错牌的来处。","condition":"","stable":"","body":["我翻开当日任务册。\n\n两块任务牌分别对应“清理碎石”与“搬运破损木傀”。后者在誊写时抄错了内容。\n\n值守弟子补回原任务，又请我将那具木傀送到修缮房。"],"effects":["【体力－1】","【宗门贡献＋2】","【获得物品：定纹砂一包】"],"heading":"追查登记"}]},{"id":"E0205","chapter":2,"title":"符纸上的旧墨","meta":{"事件类型":"人物事件","触发地点":"藏经阁外层","开放条件":"完成第二章《外门初课》，已认识林惊雨","行动消耗":"1","重复规则":"仅一次"},"intro":["林惊雨占了靠窗的一张长案。\n\n桌上铺着数张练习符纸，其中三张已经烧出焦痕。她握着笔，盯着第四张迟迟没有落下。\n\n“符纹走到这里总会断。”\n\n她将失败的符纸推给我。\n\n纸面上的前半段线条流畅，靠近末端时，朱砂却突然凝成一团。符纹本身看不出错，倒像纸面受过潮。"],"choices":[{"key":"①","text":"提醒她先检查符纸，再继续落笔。","condition":"","stable":"","body":["我将符纸迎着窗光举起。\n\n靠近末端的位置透光不均，纸层中还能看见浅淡水痕。\n\n林惊雨换了一张干燥符纸，重新画过。朱砂顺利走完最后一笔，符面亮起一层微光。\n\n她盯着水痕看了半晌。\n\n“我一直改符纹，倒没看纸。”\n\n她把剩下的受潮符纸全部挑了出来。\n\n“下回买东西，我先验纸。”"],"effects":["【林惊雨信任＋1】"],"heading":"检查符纸"},{"key":"②","text":"使用【新符纸】，让她重新绘制一张。","condition":"持有新符纸","stable":"","body":["我递给她一张尚未拆封的符纸。\n\n新纸吃墨均匀，朱砂也没有在末端结块。符纹完成后，灵光维持了足足十息。"],"effects":["【新符纸－1】","【获得物品：照明符一张】","【效果：探索山洞或夜间地点时，避免一次体力损耗】"],"heading":"提供新符纸"},{"key":"③","text":"帮她对照藏经阁中的基础符纹图。","condition":"","stable":"","body":["我们在书架上找到基础符纹图。\n\n林惊雨的运笔顺序没有错，只是最后一笔收得太急。我帮她按住图册，她连续练了几次，终于将符尾接稳。"],"effects":["【修为＋4】","【札记新增：基础符纹】"],"heading":"对照符图"}]},{"id":"E0206","chapter":2,"title":"三件旧物","meta":{"事件类型":"物品／交易事件","触发地点":"杂务堂库房","开放条件":"完成第二章《外门初课》","行动消耗":"1","重复规则":"仅一次"},"intro":["杂务堂后院清出一批蒙尘旧物。木箱沿廊开了一排，断绳、旧铜扣与褪色木签堆在一起，灵光虽淡，许多仍能再用上一阵。\n\n值守弟子从中挑出三件较完整的摆上长案，算作新弟子做完基础院务后的添置：\n\n一包定纹砂，能够暂时修补浅层阵纹；\n\n一卷缠柄布，可用于木剑与工具握柄；\n\n一叠空白木签，适合标记书卷和材料。\n\n“都是旧库里翻出来的，磨一磨还能使。看准了拿，过后可不许回来换。”"],"choices":[{"key":"①","text":"领取【定纹砂】。","condition":"","stable":"","body":[],"effects":["【获得物品：定纹砂一包】"],"heading":""},{"key":"②","text":"领取【缠柄布】。","condition":"","stable":"","body":[],"effects":["【获得物品：缠柄布一卷】"],"heading":""},{"key":"③","text":"领取【空白木签】。","condition":"","stable":"","body":["第三章《后山剑声》自由行动事件"],"effects":["【获得物品：空白木签三枚】"],"heading":""}]},{"id":"E0301","chapter":3,"title":"旧剑上的潮痕","meta":{"事件类型":"沈砚人物事件","触发地点":"后山旧剑坪","开放条件":"完成第三章《后山剑声》，已认识沈砚","行动消耗":"1","重复规则":"仅一次"},"intro":["旧剑坪昨夜落过一场雨。\n\n松针铺在石面上，几处深剑痕中仍积着水。沈砚坐在废弃剑架旁，旧剑横放膝前，正用干布擦拭剑脊。\n\n剑身靠近护手的位置泛着一层暗色。\n\n那处原本便有修补痕迹，受了潮以后，接缝比平日更清楚。\n\n我停在剑架外。\n\n“剑受潮了？”\n\n沈砚用布压过暗痕。\n\n“旧缝进了水。今日不能用灵气强烘，剑芯冷热不均，裂口会更深。”\n\n他把剑略微侧过。\n\n暗痕附近有一枚细小铜扣，已经松出半寸。若重新固定，需要有人压住剑身；若先处理水汽，也可以减轻接缝压力。"],"choices":[{"key":"①","text":"留下来替他压住剑身。","condition":"","stable":"","body":["我在剑架另一侧坐下，依照沈砚所指的位置按住剑脊。\n\n他用细针挑开铜扣边缘，将积在接缝里的水汽一点点引出。旧剑偶尔震动，我便调整手上的力道。\n\n铜扣重新压紧后，沈砚收起工具。\n\n“方才再偏半寸，剑脊便要受力。”\n\n他看了一眼已经固定好的接缝。\n\n“力道正好。”"],"effects":["【体力－1】","【沈砚好感＋1】"],"heading":"压住剑身"},{"key":"②","text":"使用【缠柄布】，暂时固定松动铜扣。","condition":"持有缠柄布","stable":"第二章杂务堂旧物领取，或杂务堂以灵石购买","body":["我撕下一段缠柄布，绕过铜扣和剑鞘内侧。\n\n布条不能修好接缝，却足以防止铜扣继续松动。\n\n沈砚检查过缠绕方向。\n\n“能撑到回剑房修理。”"],"effects":["【缠柄布－1】","【获得札记：旧剑接缝】"],"heading":"固定铜扣"},{"key":"③","text":"询问如何分辨旧剑接缝是否受损。","condition":"","stable":"","body":["沈砚用指节轻敲剑身。\n\n完好的位置声音清亮，经过修补的地方则略显沉闷。若接缝进水，敲击时还会带出细微杂音。\n\n我依次听过几处。\n\n“先听，再看灵光。”\n\n沈砚将旧剑收入鞘中。\n\n“剑身已经受损时，灵气反应往往慢一步。”"],"effects":["【修为＋4】","【札记新增：辨剑听音】"],"heading":"学习辨伤"}]},{"id":"E0302","chapter":3,"title":"松径上的弟子令","meta":{"事件类型":"地点事件","触发地点":"后山松径","开放条件":"完成第三章《后山剑声》","行动消耗":"1","重复规则":"仅一次"},"intro":["我从旧剑坪返回时，在松树根下看见一点青光。\n\n拨开落叶，一枚外门弟子令卡在石缝间。令牌边缘沾着新泥，正面的名字却被摔出的裂纹遮去大半。\n\n附近没有人影。\n\n松径分向三处，一条通往演武场，一条通往药圃，最窄的一条则通向尚未开放的北侧山路。\n\n弟子令仍有微弱传讯反应，失主应当还在附近。"],"choices":[{"key":"①","text":"沿令牌残留的灵气寻找失主。","condition":"","stable":"","body":["我依照令牌上尚未散尽的灵气向前。\n\n北侧岔路旁，一名新弟子正在草丛中反复翻找。他看见令牌时，先低头确认了裂纹，才长长松了口气。\n\n“里面记着我刚接的差事，若丢了，还得重新验明。”"],"effects":["【体力－1】","【宗门贡献＋2】"],"heading":"寻找失主"},{"key":"②","text":"使用【空白木签】，在原处留下寻物标记。","condition":"持有空白木签","stable":"第二章杂务堂旧物领取","body":["我在木签上写明发现地点与时辰，挂在松径交叉处，再把令牌藏进旁边避雨石龛。\n\n半个时辰后，失主依照木签找了回来。\n\n他取走令牌前，将自己的姓名和住处留在木签背面。"],"effects":["【空白木签－1】","【获得札记：北侧山路来客】"],"heading":"留下标记"},{"key":"③","text":"将令牌直接送往杂务堂。","condition":"","stable":"","body":["杂务堂验过令牌内的身份印记，很快找到失主。\n\n值守弟子将裂纹记入册中，又提醒我，损坏令牌不能自行修补，以免身份印记错乱。"],"effects":["【宗门贡献＋1】","【获得物品：传讯纸符一张】"],"heading":"送往杂务堂"}]},{"id":"E0303","chapter":3,"title":"未完的试锋","meta":{"事件类型":"裴青萝人物事件","触发地点":"外门试锋台","开放条件":"完成第三章《后山剑声》，裴青萝已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["试锋台上已经无人。\n\n裴青萝站在阵旗之间，反复练习白日里用过的第三招。她每次转腕时，剑锋都会比预想中高出少许。\n\n石台边缘留下几道新剑痕。\n\n她收剑时看见我，直接把另一柄木剑踢到石台中央。\n\n“白日那一场停得太早。”\n\n“再来三招。”\n\n护持阵法没有开启，木剑也不适合真正交锋。若继续比试，只能控制灵气与剑势。"],"choices":[{"key":"①","text":"接下木剑，与她重走白日里的三招。","condition":"","stable":"","body":["我拾起木剑，依照白日的次序起势。\n\n裴青萝第一剑仍快，第二剑却刻意留出了转身余地。到了第三招，我提前压低剑锋，逼她改变手腕方向。\n\n两柄木剑相触即分。\n\n她重新看了一遍脚下剑痕。\n\n“这次算清楚了。”\n\n裴青萝收剑入鞘。\n\n“下回试锋，我会换另一种走法。”"],"effects":["【体力－1】","【裴青萝信任＋1】"],"heading":"重走三招"},{"key":"②","text":"使用【缠柄布】，替她调整练习剑的握柄。","condition":"持有缠柄布","stable":"","body":["我检查过木剑握柄，发现旧布已经向后滑了一截。\n\n重新缠紧以后，剑的重心略微前移。裴青萝再试第三招，剑锋果然低了半寸。"],"effects":["【缠柄布－1】","【宗门贡献＋1】","【获得札记：试锋第三式】"],"heading":"调整握柄"},{"key":"③","text":"站在台下观察，指出她转腕时偏高的位置。","condition":"","stable":"","body":["我站在阵旗外，看她连续练过三次。\n\n偏差起在转身过快。脚下尚未落稳，手腕已经提前翻起，剑锋自然向上偏移。\n\n裴青萝听完，又将那一招拆成两段练习。"],"effects":["【修为＋5】"],"heading":"指出偏差"}]},{"id":"E0304","chapter":3,"title":"风中的剑鸣","meta":{"事件类型":"修行事件","触发地点":"后山旧剑坪","开放条件":"完成第三章《后山剑声》","行动消耗":"1","重复规则":"每年一次"},"intro":["山风穿过两侧石壁时，会带起低沉回声。\n\n旧剑坪上的废剑架跟着轻轻震动，木料与残剑相互碰撞，声音远近不一。\n\n我照着第三章学过的收势方法练剑，却总被风中的杂音扰乱呼吸。\n\n若能分清残剑清鸣与木架回声，运气时便不易被山风带乱。"],"choices":[{"key":"①","text":"闭眼听风，依照剑鸣调整呼吸。","condition":"","stable":"","body":["我收剑站定，先分辨风穿石缝时的长声，再寻找残剑震动时更短的清响。\n\n等两种声音逐渐分开，我才重新运转灵气。\n\n剑锋推出以后，呼吸没有再被杂音打断。"],"effects":["【体力－1】","【修为＋7】"],"heading":"听风练剑"},{"key":"②","text":"使用【照明符】，查看风声经过的石缝。","condition":"持有照明符","stable":"第二章林惊雨事件，或杂务堂符箓架购买","body":["照明符飞入石壁间的狭缝，映出几柄被碎石压住的断剑。\n\n风从剑刃间经过，才形成远处那阵格外清亮的剑声。\n\n我记下位置，没有贸然取剑。"],"effects":["【照明符－1】","【札记新增：石缝断剑】"],"heading":"查看石缝"},{"key":"③","text":"移到背风处，只练习收势。","condition":"","stable":"","body":["我移到山壁内侧，将全部注意力放在肩背和手腕。\n\n少了风声干扰，收势很快顺畅起来，体内灵气也能够完整退回丹田。"],"effects":["【修为＋5】"],"heading":"背风练习"}]},{"id":"E0305","chapter":3,"title":"旧剑坪的夜灯","meta":{"事件类型":"地点事件","触发地点":"后山旧剑坪","开放条件":"完成第三章《后山剑声》","行动消耗":"1","重复规则":"仅一次"},"intro":["天色将暗时，旧剑坪边缘的一盏阵灯忽然熄灭。\n\n这盏灯照着下山石阶。入夜以后，若没有灯光，石面上的青苔很难看清。\n\n灯罩完好，里面的照明石也仍有灵气，错处多半藏在连接石阶阵纹的铜线上。"],"choices":[{"key":"①","text":"沿阵纹寻找断开的铜线。","condition":"","stable":"","body":["我沿灯座向下查看，在第三块石阶边缘找到了被碎石压断的细铜线。\n\n清开碎石以后，阵灯重新亮起。"],"effects":["【体力－1】","【宗门贡献＋2】"],"heading":"寻找断线"},{"key":"②","text":"使用【定纹砂】，暂时接通灯下阵路。","condition":"持有定纹砂","stable":"","body":["定纹砂填入断口后，灵光顺着石阶重新流回阵灯。\n\n这只是暂时修补，足以维持到修缮弟子到来。"],"effects":["【定纹砂－1】","【宗门贡献＋2】","【修为＋2】"],"heading":"接通阵路"},{"key":"③","text":"点亮随身纸灯，先在石阶旁留下警示。","condition":"","stable":"","body":["我点起纸灯，挂在最湿滑的转角，又将熄灯之事写入传讯符送往杂务堂。\n\n当夜经过此处的弟子都绕开了青苔最重的位置。\n\n第四章《百草外巡》自由行动事件"],"effects":["【获得札记：后山石阶隐患】"],"heading":"留下警示"}]},{"id":"E0401","chapter":4,"title":"溪边旧蹄印","meta":{"事件类型":"谢临川人物事件","触发地点":"百草谷外围","开放条件":"完成第四章《百草外巡》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["百草谷的水源已经恢复清澈。\n\n我沿溪查看新长出的青露叶时，在湿土上发现一串旧蹄印。痕迹经过数日风雨，边缘已经模糊，方向却始终指向红色界石之外。\n\n谢临川正在上游检查警示牌。\n\n他看过蹄印，又用刀鞘拨开旁边倒伏的草叶。\n\n“受伤的灰脊兽走过这里。”\n\n“脚印一深一浅，后腿仍没有完全恢复。”\n\n界石外属于暂未开放的巡查区域。贸然追过去容易惊动其他妖兽，若只留在原地，也可能失去判断它去向的机会。"],"choices":[{"key":"①","text":"请谢临川教自己判断蹄印的新旧。","condition":"","stable":"","body":["谢临川蹲下，用刀鞘分别点过两处泥印。\n\n“边缘被露水冲过，至少隔了一夜。”\n\n他又翻开一片被踩断的草叶。\n\n“断口已经干了。它没有在附近停留。”\n\n我依照他的判断重新看过蹄印，逐渐分清新泥与旧痕。\n\n谢临川起身。\n\n“外巡时先看痕迹，再决定追不追。只凭一个方向往前赶，容易把自己送进兽群。”"],"effects":["【谢临川好感＋1】"],"heading":"辨认蹄印"},{"key":"②","text":"使用【空白木签】，标记蹄印方向与发现时辰。","condition":"持有空白木签","stable":"","body":["我在木签上写明妖兽种类、伤腿方向和蹄印时辰，插在界石内侧。\n\n谢临川看过内容，又补上一笔水位变化。\n\n“巡查队明日会沿这个方向查看。”"],"effects":["【空白木签－1】","【宗门贡献＋2】"],"heading":"留下标记"},{"key":"③","text":"留在界石以内，寻找灰脊兽是否折返回来。","condition":"","stable":"","body":["我在附近观察了半个时辰。\n\n溪边另有一组较小脚印，应当属于幼兽。它们沿同一方向离开，附近也没有新的血迹。\n\n灰脊兽多半已经回到谷外栖地。"],"effects":["【修为＋3】","【札记新增：灰脊兽归向】"],"heading":"守在界石内"}]},{"id":"E0402","chapter":4,"title":"受潮的药篓","meta":{"事件类型":"阿阮人物事件","触发地点":"百草谷外围","开放条件":"完成第四章《百草外巡》，阿阮已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["谷中晨雾很重。\n\n阿阮把采好的药材摊在岩石上，准备重新分装。最底层的纸包受了潮，里面几株青露叶已经贴在一起。\n\n“直接晒会卷叶，药性也会散。”\n\n她把还能使用的干布铺开。\n\n药材数量不多，却正好是下一次宗门任务需要的份额。处理不当，整包都只能报废。"],"choices":[{"key":"①","text":"与她逐片分开青露叶，放在阴处晾干。","condition":"","stable":"","body":["我与阿阮坐在岩石边，一片片分开粘连的叶面。\n\n青露叶很薄，稍一用力便会留下折痕。忙了许久，最后只损坏了两片。\n\n阿阮把完整叶片重新码好。\n\n“你现在认药比入门时快多了。”"],"effects":["【体力－1】","【阿阮信任＋1】"],"heading":"逐片整理"},{"key":"②","text":"使用【干燥纸】，重新包好受潮药材。","condition":"持有干燥纸","stable":"百草谷任务补给处或杂务堂药材柜","body":["干燥纸能够吸走叶面水汽。\n\n我将青露叶分成两层重新包好，药材很快恢复干爽。"],"effects":["【干燥纸－1】","【宗门贡献＋2】"],"heading":"重新封装"},{"key":"③","text":"挑出受损最重的部分，保住剩余药材。","condition":"","stable":"","body":["我挑出已经发黑的叶片，把其余部分移到通风处。\n\n损失了一小部分，好在剩下的药材仍能完成交付。"],"effects":["【获得物品：青露叶一份】"],"heading":"舍去受损部分"}]},{"id":"E0403","chapter":4,"title":"界石外的铃声","meta":{"事件类型":"探索事件","触发地点":"百草谷外围","开放条件":"完成第四章《百草外巡》","行动消耗":"1","重复规则":"仅一次"},"intro":["午后，红色界石外传来一阵轻微铃声。\n\n声音时断时续，像是风吹动了挂在树枝上的铜铃。百草谷的巡查铃原本只设在水源和岔路口，界石之外不该出现。\n\n我站在安全区域内观察。\n\n雾中隐约有一截细绳垂在灌木间，附近草叶也有被人拨开的痕迹。"],"choices":[{"key":"①","text":"留在界石内，沿声音判断铜铃位置。","condition":"","stable":"","body":["我沿界石移动，先后听见三次铃声。\n\n铃声三次都钉在同一棵老树附近，风向变了，来处仍未移动。树上多半悬着一枚旧警示铃。"],"effects":["【修为＋3】","【札记新增：界外旧铃】"],"heading":"判断位置"},{"key":"②","text":"使用【传讯纸符】，通知外巡队前来。","condition":"持有传讯纸符","stable":"","body":["纸符飞入谷口方向。\n\n不久后，两名外巡弟子赶来。他们确认铜铃属于早年废弃的巡查线，附近阵纹已经失效。"],"effects":["【传讯纸符－1】","【宗门贡献＋2】"],"heading":"通知外巡队"},{"key":"③","text":"记录草叶倒伏方向，暂时离开。","condition":"","stable":"","body":["我将草叶倒伏和铃声间隔记在弟子令中。\n\n数日后，杂务堂回信称，那一带曾有一条旧采药路，后来因妖兽迁徙而封闭。"],"effects":["【获得札记：废弃采药路】"],"heading":"记录痕迹"}]},{"id":"E0404","chapter":4,"title":"水面灰痕","meta":{"事件类型":"地点事件","触发地点":"百草谷溪流","开放条件":"完成第四章《百草外巡》","行动消耗":"1","重复规则":"仅一次"},"intro":["雨后溪水上涨，岸边重新出现一小片灰色浮沫。\n\n颜色比上次污染浅得多，气味也不刺鼻。浮沫只聚在石湾处，顺水而下后很快散开。\n\n若仍有旧药渣藏在上游，必须尽早清出；若只是腐叶堆积，也不必惊动整支外巡队。"],"choices":[{"key":"①","text":"取少量溪水，观察浮沫变化。","condition":"","stable":"","body":["我把溪水盛入白瓷小碗。\n\n静置片刻后，灰沫沉入碗底，只剩几粒腐草细籽，看不见半点药渣。"],"effects":["【修为＋3】","【获得札记：辨水浮沫】"],"heading":"观察溪水"},{"key":"②","text":"使用【净水符】，先清理石湾。","condition":"持有净水符","stable":"杂务堂符箓架，或林惊雨后续符箓事件","body":["净水符落入石湾，浮沫很快聚成一团，被灵光带到岸边。\n\n其中只有腐叶和草籽，没有发现药物残留。"],"effects":["【净水符－1】","【宗门贡献＋2】"],"heading":"使用净水符"},{"key":"③","text":"沿上游寻找新的药桶或腐叶堆。","condition":"","stable":"","body":["我沿溪向上，最终在倒木后找到一片堵住水流的腐叶。\n\n清开以后，灰色浮沫很快散去。"],"effects":["【体力－1】","【宗门贡献＋2】"],"heading":"查找源头"}]},{"id":"E0405","chapter":4,"title":"折断的警示牌","meta":{"事件类型":"宗门事件","触发地点":"百草谷入口","开放条件":"完成第四章《百草外巡》","行动消耗":"1","重复规则":"仅一次"},"intro":["谷口的一块警示牌被风吹倒。\n\n木牌上写着红色界石以内的开放范围，断裂处正好压住最后两行。若不及时处理，新弟子可能误以为更深处也能通行。\n\n负责谷口录名的弟子正在接收药材，无暇离开。"],"choices":[{"key":"①","text":"扶起警示牌，用石块暂时固定。","condition":"","stable":"","body":["我将木牌扶回原位，又在底部垒起几块山石。\n\n虽不牢固，至少能维持到当日巡查结束。"],"effects":["【体力－1】","【宗门贡献＋1】"],"heading":"暂时固定"},{"key":"②","text":"使用【修缮石粉】，补好断裂底座。","condition":"持有修缮石粉","stable":"","body":["石粉填入木桩与地面的裂口，很快凝成坚硬灰层。\n\n录名弟子验过后，在差事册上补记了修缮贡献。"],"effects":["【修缮石粉－1】","【宗门贡献＋2】"],"heading":"修补底座"},{"key":"③","text":"重新抄写一块简易警示木牌。","condition":"","stable":"","body":["我找来一块废木板，将开放区域、红色界石和妖兽警示重新写清。\n\n旧牌仍留在原处，新牌则先立在岔路口。\n\n第五章《灵墟初市》自由行动事件"],"effects":["【宗门贡献＋2】","【获得物品：干燥纸一叠】"],"heading":"重写警示"}]},{"id":"E0501","chapter":5,"title":"铜钱落案","meta":{"事件类型":"墨无咎人物事件","触发地点":"灵墟坊市·旧器摊","开放条件":"完成第五章《灵墟初市》，已认识墨无咎","行动消耗":"1","重复规则":"仅一次"},"intro":["旧器摊上摆着一只巴掌大的寻路盘。\n\n铜盘表面擦得发亮，刻度也十分齐整。摊主称它能在山雾中辨明方向，开价十二枚灵石。\n\n我拿起铜盘时，里面的指针轻轻晃了几下，最终停在西南方向。\n\n墨无咎恰好从旁经过。\n\n他没有接过铜盘，只将一枚旧铜钱放在摊面上。铜钱滚过半圈，停在盘沿旁边。\n\n寻路盘中的指针随之偏了几分。\n\n“指针会受寻常铜器牵引。”\n\n墨无咎收回铜钱。\n\n“入了山雾，身上只要带着钱袋，它便先指向你自己。”\n\n摊主立刻解释：\n\n“旧法器多少有些偏差，六枚灵石也能卖。”\n\n墨无咎看向我。","“能不能用，要看你买它做什么。”"],"choices":[{"key":"①","text":"请墨无咎说明缺损之处，再由自己向摊主还价。","condition":"","stable":"","body":["我让墨无咎指出指针受铜器牵引的位置，又向摊主确认阵芯尚能运转多久。\n\n“只能在空旷处辨大致方向，阵芯也快耗尽。”\n\n我将价格压到三枚灵石。\n\n摊主犹豫片刻，最终应下。\n\n墨无咎看过成交的灵石，淡淡道：\n\n“只能辨个大方向，用三回便算赚到。三枚灵石，尚可。”"],"effects":["【灵石－3】","【获得物品：偏针寻路盘】","【使用效果：一次山林探索中避免走错道路】","【墨无咎好感＋1】"],"heading":"自行还价"},{"key":"②","text":"使用【验货签】，请坊市管事留下缺损凭记。","condition":"持有验货签","stable":"灵墟坊市管事处，2枚灵石购买","body":["我将验货签贴在铜盘底部。\n\n管事注入灵气后，签面很快显出“易受铜物干扰、阵芯衰弱”两行小字。\n\n摊主只得重新标明缺损，价格也降为两枚灵石。\n\n我并未买下，其他经过的弟子却能看清它的实际用途。"],"effects":["【验货签－1】","【宗门贡献＋1】","【获得札记：旧器验看】"],"heading":"留下缺损凭记"},{"key":"③","text":"放下寻路盘，记住这类法器的辨认方法。","condition":"","stable":"","body":["我放下寻路盘，又用自己的灵石袋靠近试了一次。\n\n指针果然随着钱袋移动。\n\n墨无咎收起铜钱。\n\n“它若彻底坏了，反倒没人肯买。偏偏还能转上两圈，才最容易叫人掏灵石。”\n\n我将指针变化与阵芯光泽一并记下。"],"effects":["【修为＋3】","【札记新增：寻路盘偏针】"],"heading":"记下辨认方法"}]},{"id":"E0502","chapter":5,"title":"朱砂沉底","meta":{"事件类型":"林惊雨人物事件","触发地点":"灵墟坊市·符箓铺","开放条件":"完成第五章《灵墟初市》，已认识林惊雨","行动消耗":"1","重复规则":"仅一次"},"intro":["符箓铺前摆着数只盛朱砂的浅碟。\n\n林惊雨挑了许久，最后选中一盒颜色最亮的朱砂。铺主取水调开以后，碟底却沉下一层细黑砂粒。\n\n“这是掺了东西？”\n\n她用笔尖拨了拨沉渣。\n\n铺主答得含糊，只说低阶符箓用不出差别。\n\n林惊雨显然不信。\n\n朱砂已经拆封，想要退换，必须说清里面掺的究竟是什么。若只是寻常矿粉，确实只会让符光黯淡；若混入铁砂，落笔时还可能打断灵气。"],"choices":[{"key":"①","text":"与她用空白符纸试画一笔，观察朱砂走灵。","condition":"","stable":"","body":["我替她按住符纸，林惊雨只画了最基础的一道引灵纹。\n\n灵光行到一半，笔下忽然发涩，朱砂中的黑粒将符线割开了一处。\n\n她把废符翻过来。\n\n“掺的是铁砂。”\n\n林惊雨拿着试画结果去找铺主，最终换回一盒未掺杂的朱砂。\n\n回来时，她把剩余的空白符纸分给我两张。\n\n“刚才若直接争，他多半还要说是我手生。”"],"effects":["【林惊雨信任＋1】","【获得物品：新符纸两张】"],"heading":"试画符纹"},{"key":"②","text":"使用【验货签】，请管事查明沉渣成分。","condition":"持有验货签","stable":"","body":["验货签落入朱砂后，签面浮出一行铁灰色小字。\n\n铺主无法再推托，只得退还灵石，并撤下同批货物。"],"effects":["【验货签－1】","【宗门贡献＋1】","【获得物品：净水符一张】"],"heading":"请管事验看"},{"key":"③","text":"建议她换购颜色稍暗、封口完整的旧批朱砂。","condition":"","stable":"","body":["我提醒林惊雨查看盒底封蜡。\n\n颜色稍暗的那一批封口完整，朱砂颗粒也更细。试画以后，符光虽然不算明亮，走灵却十分稳定。"],"effects":["【修为＋4】","【札记新增：朱砂辨杂】"],"heading":"另选旧批朱砂"}]},{"id":"E0503","chapter":5,"title":"少了一钱","meta":{"事件类型":"坊市事件","触发地点":"灵墟坊市·药材街","开放条件":"完成第五章《灵墟初市》","行动消耗":"1","重复规则":"仅一次"},"intro":["药材街上，一名外门弟子正在交割晒干的青络草。\n\n铺中伙计把药材放上铜秤，秤杆刚刚抬平，便报出七钱三分。那名弟子皱着眉，低声说自己在宗门称过，足有八钱。\n\n铜秤的秤盘边缘沾着厚厚药屑。\n\n若药屑压住秤盘，称出的分量会略轻；也可能是药材在路上受潮，重量已经变化。\n\n铺中还有数人等着交货，伙计催得很急。"],"choices":[{"key":"①","text":"清理秤盘，重新称量一次。","condition":"","stable":"","body":["我先让伙计取下秤盘，将边缘积着的药屑清干净。\n\n重新放上青络草后，秤杆停在七钱九分。\n\n少去的一分应是途中散落，原先的秤却足足压低了六分。\n\n伙计重新结算，又把其余待称药材全部复核了一遍。"],"effects":["【宗门贡献＋2】"],"heading":"重称药材"},{"key":"②","text":"使用【干燥纸】，检查药材是否受潮。","condition":"持有干燥纸","stable":"","body":["干燥纸贴近草叶后，只吸出极少水汽。\n\n药材并未明显受潮，重量差异仍来自铜秤。"],"effects":["【干燥纸－1】","【获得札记：药材秤盘积屑】","【灵石＋3】"],"heading":"检查水汽"},{"key":"③","text":"取出自己的任务药材，与青络草对秤比较。","condition":"","stable":"","body":["我取出一包已知分量的任务药材，分别放在秤盘两侧。\n\n铜秤明显偏向铺内一边。\n\n伙计检查后，发现秤杆的铜环挂错了一格。"],"effects":["【体力－1】","【灵石＋4】"],"heading":"对秤比较"}]},{"id":"E0504","chapter":5,"title":"灯影下的残匣","meta":{"事件类型":"探索／物品事件","触发地点":"灵墟坊市·夜市","开放条件":"完成第五章《灵墟初市》","行动消耗":"1","重复规则":"仅一次"},"intro":["夜市将散时，一名老摊主摆出三只没有卖掉的旧木匣。\n\n匣中分别装着碎裂剑扣、半枚阵钉和一截烧焦的符笔。三样东西都已经失去原本用途，材料本身尚能回收。\n\n老摊主懒得再带回去，三枚灵石便可任选一匣。\n\n木匣封口相同，外面只能看见一小块露出的残件。"],"choices":[{"key":"①","text":"挑选露出青铜剑扣的木匣。","condition":"","stable":"","body":["我付过灵石，打开木匣。\n\n碎剑扣下面还压着一小瓶尚未干涸的护剑油。瓶口封蜡有损，剩余分量仍够使用一次。"],"effects":["【灵石－3】","【获得物品：护剑油一瓶】"],"heading":"青铜剑扣"},{"key":"②","text":"挑选露出黑铁阵钉的木匣。","condition":"","stable":"","body":["木匣中的阵钉只断了一枚，余下两枚仍可用于固定浅层阵纹。"],"effects":["【灵石－3】","【获得物品：定阵钉两枚】"],"heading":"黑铁阵钉"},{"key":"③","text":"使用【照明符】，从匣缝查看内部情况。","condition":"持有照明符","stable":"","body":["照明符的光从木缝透入。\n\n三只匣中，剑扣匣藏着护剑油，阵钉匣有两枚完整旧钉，符笔匣底则压着一张未使用的净水符。\n\n我可以据此挑选其中一件。"],"effects":["【照明符－1】","【灵石－3】","【从护剑油、定阵钉两枚、净水符中任选一项】"],"heading":"查看匣内"}]},{"id":"E0505","chapter":5,"title":"行囊添置","meta":{"事件类型":"行装／领取事件","触发地点":"灵墟坊市·行装铺","开放条件":"完成第五章《灵墟初市》","行动消耗":"1","重复规则":"每年一次"},"intro":["行装铺门前挂着数只束口布袋，风一吹，袋角的小木牌便相互轻碰。铺内混着皮革、药草和新纸的气味，来往弟子多半要在出山前来此添置一回。\n\n店主见我佩着宗门弟子令，从柜下取出三套适合炼气弟子的常用行装，逐一拆开封绳给我看。\n\n第一套用于保养兵刃，内有一瓶护剑油与一卷缠柄布。\n\n第二套用于外巡救治，内有一包止血散与两条干净布带。\n\n第三套用于水边和洞穴探索，内有一张净水符与一张照明符。\n\n“每套八枚灵石。”\n\n“都是寻常用物，封蜡却是今日才落的。真进了山，少缺一样，便能少绕半日路。”"],"choices":[{"key":"①","text":"购买兵刃养护行装。","condition":"","stable":"","body":[],"effects":["【灵石－8】","【获得物品：护剑油一瓶】","【获得物品：缠柄布一卷】"],"heading":"兵刃养护行装"},{"key":"②","text":"购买外巡救治行装。","condition":"","stable":"","body":[],"effects":["【灵石－8】","【获得物品：止血散一包】","【获得物品：干净布带两条】"],"heading":"外巡救治行装"},{"key":"③","text":"购买探索符箓行装。","condition":"","stable":"","body":["第六章《天衡问剑》自由行动事件"],"effects":["【灵石－8】","【获得物品：净水符一张】","【获得物品：照明符一张】"],"heading":"探索符箓行装"}]},{"id":"E0601","chapter":6,"title":"迟落的阵旗","meta":{"事件类型":"顾长清人物事件","触发地点":"天衡剑阵第一层","开放条件":"完成第六章《天衡问剑》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["剑阵修复后，天衡峰重新开放了第一层练习。\n\n我走到东侧石路时，发现一面阵旗每次都比其他旗晚落半息。剑影尚未出现偏移，经过此处的弟子却会下意识放慢脚步。\n\n顾长清正在检查阵盘。\n\n他看过阵旗起落，又将灵气送入地下阵纹。\n\n“旗面没有破损。”\n\n“迟落的缘由应当在石路下方。”\n\n阵旗底部共有三条灵线。若逐条切断查验，剑阵需要暂时关闭；若只调整旗杆，也许能让旗面恢复同步，却无法查清根源。"],"choices":[{"key":"①","text":"与顾长清依次核对三条灵线的回流。","condition":"","stable":"","body":["我站在阵纹另一端，按照顾长清报出的次序引动灵气。\n\n第一条灵线回流平稳，第二条略慢，第三条经过石阶下方时却突然变弱。\n\n顾长清移开一块问天石，发现下面压着半截烧黑的旧铜线。\n\n“上次阵旗错位时留下的。”\n\n他重新接好铜线，又让我再走一遍灵气。\n\n这一次，阵旗与其余旗面同时落下。\n\n顾长清收起阵图。\n\n“阵路再长，也得一寸寸走完。你肯回头查这条细线，日后便不容易被表面的灵光骗过去。”"],"effects":["【顾长清好感＋1】"],"heading":"核对灵线"},{"key":"②","text":"使用【定阵钉】，先固定略有松动的旗座。","condition":"持有定阵钉","stable":"第五章夜市残匣，或天衡峰杂务架购买","body":["我将定阵钉压入旗座两侧。\n\n旗杆不再晃动，迟落的幅度也小了许多。地下灵线仍需拆开细查，眼下已足够维持日常练习。"],"effects":["【定阵钉－1】","【宗门贡献＋2】"],"heading":"固定旗座"},{"key":"③","text":"记录阵旗迟落的间隔，交给天衡峰弟子继续查验。","condition":"","stable":"","body":["我连续观察十次阵旗起落，将每次迟延的长短写在弟子令附页上。\n\n天衡峰弟子依照十次起落的间隔，看出迟落只在灵气回流较弱时出现。"],"effects":["【修为＋3】","【札记新增：东侧阵旗迟落】"],"heading":"留下间隔记录"}]},{"id":"E0602","chapter":6,"title":"逆风三步","meta":{"事件类型":"裴青萝人物事件","触发地点":"天衡峰练剑台","开放条件":"完成第六章《天衡问剑》，裴青萝已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["天衡峰风势很大。\n\n裴青萝在练剑台上连走三次步法，每次踏到第三步，衣摆与剑穗都会被侧风带向石台外缘。\n\n她停下来，用剑鞘在地面画出三处落脚点。\n\n“顺风时能过，逆风时第三步总会偏。”\n\n她尝试压低身形，脚下位置稳了，出剑的速度却慢了许多。"],"choices":[{"key":"①","text":"站到侧风处，与她轮换练习第三步。","condition":"","stable":"","body":["我站到她对面，以木剑压住她第三步后的出剑方向。\n\n裴青萝第一次被风推偏，第二次已经能在落脚前调整脚尖。第三次，她的剑锋贴着木剑侧面划过，稳稳停在预定位置。\n\n换我练习时，她也照样封住我的退路。\n\n半个时辰后，两人都把逆风中的第三步走顺。"],"effects":["【体力－1】","【裴青萝信任＋1】"],"heading":"轮换练习"},{"key":"②","text":"使用【缠柄布】，缩短被风吹动的剑穗。","condition":"持有缠柄布","stable":"","body":["我用一小段布缠住过长剑穗，只留下不会妨碍出剑的长度。\n\n剑穗受风的力道减轻，第三步随之稳了许多。"],"effects":["【缠柄布－1】","【宗门贡献＋1】"],"heading":"收束剑穗"},{"key":"③","text":"替她观察脚步，指出重心偏移的位置。","condition":"","stable":"","body":["我站在台下看她重新走过三次。\n\n她在第二步结束时便将重心移向前脚，侧风一起，第三步自然难以收回。\n\n裴青萝照着提醒放慢半息，落脚很快稳住。"],"effects":["【修为＋5】"],"heading":"观察重心"}]},{"id":"E0603","chapter":6,"title":"少了一枚试炼牌","meta":{"事件类型":"周执人物事件","触发地点":"天衡峰登记台","开放条件":"完成第六章《天衡问剑》，已认识周执","行动消耗":"1","重复规则":"仅一次"},"intro":["天衡峰重新清点试炼牌时，木匣中少了一枚。\n\n周执将借出名册逐页翻过。\n\n牌号、姓名和归还时辰都写得清楚，最后一页却有一处墨迹被雨水晕开，只能看出半个姓氏。\n\n试炼牌若落在剑阵内，可能会被阵纹误认为仍有弟子尚未离场。"],"choices":[{"key":"①","text":"与周执按入阵次序逐一核对借牌弟子。","condition":"","stable":"","body":["我与周执按当日入阵次序查访。\n\n缺牌最终在一名弟子的护腕夹层中找到。他离阵时急着救治擦伤，忘了将木牌取下。\n\n周执补齐归还时辰。\n\n“照名册一人一人问，比翻遍整座剑阵快。”"],"effects":["【周执信任＋1】"],"heading":"逐人核对"},{"key":"②","text":"使用【空白木签】，重新整理当日借牌次序。","condition":"持有空白木签","stable":"","body":["我将姓名、牌号与时辰分别写在三列木签上，再按照入阵先后排列。\n\n被雨水晕开的那一笔很快与其中一枚牌号对应。"],"effects":["【空白木签－1】","【宗门贡献＋2】"],"heading":"重整木签"},{"key":"③","text":"先进入剑阵外层，寻找遗落的试炼牌。","condition":"","stable":"","body":["我沿第一层石路逐处查看。\n\n试炼牌没有掉在剑阵里，却在阵门外的排水沟中找到了一截系绳。顺着系绳来路，最终找到了佩牌弟子。"],"effects":["【体力－1】","【修为＋3】","【获得物品：传讯纸符一张】"],"heading":"入阵寻找"}]},{"id":"E0604","chapter":6,"title":"石剑回声","meta":{"事件类型":"修行事件","触发地点":"天衡峰石剑道","开放条件":"完成第六章《天衡问剑》","行动消耗":"1","重复规则":"每年一次"},"intro":["通往天衡峰的石阶两旁立着数十柄无锋石剑。\n\n每当山风掠过，石剑内部便会传出低沉回响。不同石剑的声音略有差异，有的清亮，有的发闷。\n\n天衡峰弟子常借这些回声调整吐纳。\n\n我在第十二柄石剑旁停下时，丹田中的灵气也跟着轻轻震动。"],"choices":[{"key":"①","text":"依照石剑回声调整吐纳。","condition":"","stable":"","body":["我将呼吸压到与石剑回声相近的间隔。\n\n数次以后，经脉中的灵气渐渐收拢，运行时少了许多散乱。"],"effects":["【体力－1】","【修为＋7】"],"heading":"随声吐纳"},{"key":"②","text":"使用【清脉散】，趁灵气共鸣梳理经脉。","condition":"持有清脉散","stable":"坊市药铺购买；第七章后丹霞峰可购买","body":["清脉散化开以后，药力随石剑回声进入经脉。\n\n先前练剑留下的酸胀逐渐散去。"],"effects":["【清脉散－1】","【体力＋3】","【修为＋4】"],"heading":"梳理经脉"},{"key":"③","text":"沿石阶寻找与自身灵根最相合的石剑。","condition":"","stable":"","body":["我沿石阶逐一感受回声。\n\n走到第二十七柄时，石剑中的灵气与我的灵根产生了短暂共鸣。\n\n我记下位置，以后再来修行便能省去寻找时辰。"],"effects":["【札记新增：相合石剑】","【下一次天衡峰修行额外获得修为＋3】"],"heading":"寻找相合石剑"}]},{"id":"E0605","chapter":6,"title":"入阵前的准备","meta":{"事件类型":"行装／领取事件","触发地点":"天衡峰杂务架","开放条件":"完成第六章《天衡问剑》","行动消耗":"1","重复规则":"每年一次"},"intro":["天衡峰在剑阵入口摆了几只补给木箱。\n\n通过第一层试炼的弟子，可以用六枚灵石换取一份入阵补给。值守弟子先验过试炼牌，才掀开箱盖。\n\n一份是两枚定阵钉和一小包定纹砂，适合处理浅层阵纹松动。\n\n一份是止血散与干净布带，用于试炼中擦伤和割伤。\n\n一份是传讯纸符与照明符，适合进入视线受阻的阵路。\n\n值守弟子将三份用物依次摆开。\n\n“一人一次，只能择一份。若在阵中用过，出来后把去向写回差事册。”"],"choices":[{"key":"①","text":"换取阵纹修缮用物。","condition":"","stable":"","body":[],"effects":["【灵石－6】","【获得物品：定阵钉两枚】","【获得物品：定纹砂一包】"],"heading":"阵纹修缮用物"},{"key":"②","text":"换取外伤药具。","condition":"","stable":"","body":[],"effects":["【灵石－6】","【获得物品：止血散一包】","【获得物品：干净布带两条】"],"heading":"外伤药具"},{"key":"③","text":"换取传讯照明符箓。","condition":"","stable":"","body":["第七章《丹火初燃》自由行动事件"],"effects":["【灵石－6】","【获得物品：传讯纸符一张】","【获得物品：照明符一张】"],"heading":"传讯照明符箓"}]},{"id":"E0701","chapter":7,"title":"封签上的药香","meta":{"事件类型":"墨无咎人物事件","触发地点":"丹霞峰交药廊","开放条件":"完成第七章《丹火初燃》，已认识墨无咎","行动消耗":"1","重复规则":"仅一次"},"intro":["丹霞峰新送来一批清脉散药材。\n\n木箱沿长廊排开，箱角都贴着青色封签。负责收药的弟子拆开其中一箱，刚取出药包，廊下便散开一股过重的辛辣气息。\n\n墨无咎站在长案另一侧，取出一片沉香根，指腹轻轻压过断面。\n\n“晒得太急，外干内湿。”\n\n他又看了眼封签。\n\n“封签写着上月初七入库。这批药若真存了一个月，里面早该生霉。”\n\n药材尚能使用，只是必须重新晾晒。封签上的日期也得查清，若药性受损，过失便会落到丹霞峰头上。"],"choices":[{"key":"①","text":"请墨无咎教自己从药材和封签中判断入库时日。","condition":"","stable":"","body":["墨无咎把沉香根递给我。\n\n“看断面，闻气味，再捏一捏外皮。”\n\n药材外皮已经发硬，内部仍带水汽，最多只晒过三日。封签边缘的浆糊却已经泛黄，显然是从旧箱上揭下后重新贴过。\n\n我将两处差异记下。\n\n墨无咎收回药材。\n\n“嘴上能改，药材改不了。断面、气味、封蜡都摆在这里，慢慢看。”"],"effects":["【墨无咎好感＋1】"],"heading":"判断时日"},{"key":"②","text":"使用【验货签】，将受潮情况留在药箱上。","condition":"持有验货签","stable":"灵墟坊市管事处购买","body":["我将验货签贴在箱角。\n\n签面吸入药气，很快浮出“内潮、封签日期有异”几行小字。丹霞峰弟子当即将整批药材移到待查处。"],"effects":["【验货签－1】","【宗门贡献＋2】"],"heading":"留下验货凭记"},{"key":"③","text":"沿封签号记查找这批药材的送货册。","condition":"","stable":"","body":["我依照封签号记翻到药材簿。\n\n这批药材原本应在三日前送到，箱上却贴着一张旧封签。送货人为了避开迟交责罚，换下了原有封签。"],"effects":["【札记新增：改换的药箱封签】","【宗门贡献＋1】"],"heading":"追查送货记录"}]},{"id":"E0702","chapter":7,"title":"晒药架下的风","meta":{"事件类型":"阿阮人物事件","触发地点":"丹霞峰药圃","开放条件":"完成第七章《丹火初燃》，阿阮已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["午后山风忽然转向。\n\n晒药架上的薄叶草被吹得四处翻动，其中几张已经滑到架边。阿阮抱着竹筛追过去，刚按住这一头，另一头又被风掀起。\n\n“这些叶子晒得正好，再吹一阵就要碎了。”\n\n药架上分着三种药材，收得太急容易混在一起，继续留着又可能被风卷走。"],"choices":[{"key":"①","text":"与阿阮按药材种类逐架收拢。","condition":"","stable":"","body":["我从靠近山壁的一架开始，阿阮则守住风口。\n\n两人按照木牌上的药名分开收拢。最后一筛药叶刚倒进布袋，山风便将空竹筛吹翻在地。\n\n阿阮把袋口系紧。\n\n“你记药名已经很快了。方才若收错一味，回去还得重新挑。”"],"effects":["【体力－1】","【阿阮信任＋1】"],"heading":"逐架收药"},{"key":"②","text":"使用【干燥纸】，将尚未晒透的药叶包好。","condition":"持有干燥纸","stable":"","body":["我将尚带水汽的叶片平铺在干燥纸上，再分层包好。\n\n药叶没有被闷住，剩余水汽也会被纸面慢慢吸走。"],"effects":["【干燥纸－1】","【获得物品：晒干薄叶草一份】"],"heading":"包好药叶"},{"key":"③","text":"先压住药架四角，再等风势过去。","condition":"","stable":"","body":["我找来石块压住架脚，又用绳子拴紧竹筛。\n\n风势最盛时，药叶虽然翻动，仍留在架面上。等山风转缓，再逐一收取也不迟。"],"effects":["【宗门贡献＋2】"],"heading":"固定药架"}]},{"id":"E0703","chapter":7,"title":"丹方缺了一字","meta":{"事件类型":"唐知夏人物事件","触发地点":"外峰丹房","开放条件":"完成第七章《丹火初燃》，唐知夏已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["唐知夏在丹房门外摊开两份清脉散丹方。\n\n一份写着“文火三刻”，另一份却只剩“火三刻”，最前面的字被墨迹遮住。\n\n若缺的是“文”字，火势应当缓慢；若原本写的是“武”字，整炉药材的投入时辰都会改变。\n\n两份丹方都盖着丹霞峰旧印，单看纸页无法确认哪一份有误。"],"choices":[{"key":"①","text":"与唐知夏对照今日出炉药色和炉底焦痕。","condition":"","stable":"","body":["我与唐知夏取来今日炼成的清脉散。\n\n药色浅青，炉底也没有焦痕。若曾用武火烧过三刻，药粉应当更暗，气味也会带苦焦。\n\n唐知夏在缺字处补回“文”字，又在旁边写明判断依据。\n\n“只看旧纸容易争不清。成药和炉痕也能作证。”"],"effects":["【唐知夏信任＋1】"],"heading":"核对药色"},{"key":"②","text":"使用【纸墨】，将确认后的丹方重新誊清。","condition":"持有纸墨","stable":"","body":["确认火候以后，我将整份丹方重新誊录，缺字处另加小注。\n\n新方送入丹房保存，旧页则封入错漏册。"],"effects":["【纸墨－1】","【宗门贡献＋2】"],"heading":"重新誊写"},{"key":"③","text":"请值守丹师查看两份旧方的用印年份。","condition":"","stable":"","body":["值守丹师看过印记，认出缺字丹方来自十年前的一次抄录。\n\n当年抄方弟子笔锋过重，后来墨迹受潮，才遮住了第一个字。"],"effects":["【札记新增：清脉散旧方】"],"heading":"核对用印"}]},{"id":"E0704","chapter":7,"title":"炉底余温","meta":{"事件类型":"修行事件","触发地点":"外峰丹房","开放条件":"完成第七章《丹火初燃》","行动消耗":"1","重复规则":"每年一次"},"intro":["丹房收炉以后，炉底仍留着一层温和火气。\n\n值守弟子允许新弟子在炉边打坐片刻，借余温梳理经脉。火气虽然平稳，靠得太近仍会让灵气变得躁动。\n\n我在离丹炉三步处坐下。\n\n暖意沿经脉缓缓散开，先前练习术法留下的酸胀也松了几分。"],"choices":[{"key":"①","text":"顺着炉火起伏完成一次吐纳。","condition":"","stable":"","body":["我将呼吸放缓，等火气升起时引灵入体，火势回落时再将灵气沉入丹田。\n\n数个周天以后，经脉中的滞涩逐渐散去。"],"effects":["【体力－1】","【修为＋7】"],"heading":"借火吐纳"},{"key":"②","text":"使用【清脉散】，借余温化开药力。","condition":"持有清脉散","stable":"丹霞峰药柜或灵墟坊市药铺","body":["清脉散入口微苦。\n\n药力随着炉底余温化开，沿手臂与肩背缓缓流动，练剑和施术积下的疲意随之减轻。"],"effects":["【清脉散－1】","【体力＋3】","【修为＋4】"],"heading":"化开药力"},{"key":"③","text":"观察炉火熄灭前的灵气变化。","condition":"","stable":"","body":["我没有立刻运功，只看着炉底火光一点点变暗。\n\n丹火将熄时，最外层火气先散，炉心仍会维持数息。掌握这一段变化，往后看护丹炉便不容易过早收火。"],"effects":["【札记新增：丹炉余火】","【修为＋3】"],"heading":"观察余火"}]},{"id":"E0705","chapter":7,"title":"丹霞药柜","meta":{"事件类型":"行装／领取事件","触发地点":"丹霞峰药柜","开放条件":"完成第七章《丹火初燃》","行动消耗":"1","重复规则":"每年一次"},"intro":["丹霞峰外廊常年浮着淡淡药香。参加过短期课程的弟子可以开启一只外峰药柜，柜门内侧还贴着辨药与避潮的小笺。\n\n柜中没有名贵丹药，只整齐放着三类最常用的东西，封纸上都盖着当月药印。\n\n一包清脉散，可缓解经脉疲惫；\n\n一束安神香，点燃后能使睡眠安稳；\n\n一叠干燥纸，适合保存容易受潮的药材。\n\n值守弟子道：\n\n“每次择一份。若还缺别的，去旁边药架以灵石补换，莫从同一格里多拿。”"],"choices":[{"key":"①","text":"领取【清脉散一包】。","condition":"","stable":"","body":[],"effects":["【获得物品：清脉散一包】"],"heading":""},{"key":"②","text":"领取【安神香一束】。","condition":"","stable":"","body":[],"effects":["【获得物品：安神香一束】"],"heading":""},{"key":"③","text":"领取【干燥纸一叠】。","condition":"","stable":"","body":["第八章《忘却之夜》自由行动事件"],"effects":["【获得物品：干燥纸一叠】"],"heading":""}]},{"id":"E0801","chapter":8,"title":"石片上的断痕","meta":{"事件类型":"沈砚人物事件","触发地点":"后山旧剑坪","开放条件":"完成第八章《忘却之夜》，已认识沈砚","行动消耗":"1","重复规则":"仅一次"},"intro":["我将药圃地下旧阵石的纹路画在纸上，带到后山旧剑坪。\n\n沈砚看过草图，又让我将阵纹断口的位置重新画了一遍。\n\n“这一处断得太齐。”\n\n他用剑鞘点在纸面上。\n\n“石头受潮开裂，边缘会向外散。这里的灵线却在同一处收住，应当被利器切断过。”\n\n他沉默片刻，又添了一句：\n\n“用的是剑。”"],"choices":[{"key":"①","text":"只请他判断剑痕来路，不提阿阮失忆的细节。","condition":"","stable":"","body":["我只说阵石发现于栖云院地下，未提阿阮夜间失忆之事。\n\n沈砚看出我有所保留，也没有追问。\n\n“剑锋从右上落下，切断以后又补了一道回势。”\n\n“出剑的人熟悉阵路，知道停在哪里，外层阵纹才不会立刻崩开。”\n\n他将草图还给我。\n\n“原物留在原处。也别一个人继续向下挖。”"],"effects":["【沈砚好感＋1】","【札记新增：旧制断引剑痕】"],"heading":"询问剑痕"},{"key":"②","text":"使用【拓纹纸】，依照他的指点重新拓画断口。","condition":"持有拓纹纸","stable":"杂务堂旧档柜，3枚灵石换取","body":["我依照沈砚指出的位置，将断口、回势与灵线余痕分别画在拓纹纸上。\n\n原先看似杂乱的裂纹逐渐显出两道清楚剑路。"],"effects":["【拓纹纸－1】","【获得线索：断引剑痕拓样】"],"heading":"重新拓画"},{"key":"③","text":"请他示范如何在不毁坏阵石的情况下切断灵线。","condition":"","stable":"","body":["沈砚在旧剑坪的废阵纹上示范了一次。\n\n剑锋只落到灵线外层，在阵气回转前立即收势。出手稍重，整段阵纹都会碎裂；收剑稍慢，灵气便会顺着剑身反冲经脉。\n\n我依照他留下的剑路练过几次，只做到第一步。"],"effects":["【体力－1】","【修为＋6】"],"heading":"学习断引"}]},{"id":"E0802","chapter":8,"title":"缺失的一夜","meta":{"事件类型":"阿阮人物事件","触发地点":"阿阮灵居","开放条件":"完成第八章《忘却之夜》，阿阮已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["阿阮把那一夜用过的竹篓放在案上。\n\n篓中泥土已经干了，几张写着药草号记的纸条也被她逐一展平。她从晚饭后开始回想，仍只能记到自己点亮房中油灯。\n\n再往后，记忆像被人从中截去了一段。\n\n“我知道这些药是怎么挖的，也认得纸上的药号。”\n\n她捏着其中一张纸条。\n\n“可我想不起自己什么时候走出房门。”"],"choices":[{"key":"①","text":"陪她从房中到药圃重走一遍当夜的路线。","condition":"","stable":"","body":["我与阿阮从房门开始，沿着廊下走向药圃。\n\n到了院中第三盏灯旁，她忽然停下。\n\n“这里有一点印象。”\n\n她记得自己曾听见水声，随后便转向药圃。再往前，记忆仍旧空白。\n\n阿阮低头看着石路。\n\n“至少这一段路确实走过。只是中间像被截断了。”"],"effects":["【阿阮信任＋1】","【获得线索：第三盏灯下的水声】"],"heading":"重走路线"},{"key":"②","text":"使用【安神香】，让她先睡一晚再继续回想。","condition":"持有安神香","stable":"第七章丹霞药柜或丹霞峰药铺","body":["香气在屋中缓缓散开。\n\n阿阮这一夜睡得很沉，第二日醒来时精神好了许多，额角也不再隐隐作痛。"],"effects":["【安神香－1】","【体力恢复至上限】"],"heading":"点燃安神香"},{"key":"③","text":"将她记得的时辰逐一写下，寻找记忆断开的地方。","condition":"","stable":"","body":["我将晚饭、点灯、药圃发现和众人赶来的时辰依次写下。\n\n记忆空缺约有半个时辰。\n\n纸条上的墨迹也正是在这一段时间内写成。"],"effects":["【札记更新：阿阮的记忆空缺】","【获得线索：失忆持续半个时辰】"],"heading":"整理时辰"}]},{"id":"E0803","chapter":8,"title":"被裁去的一栏","meta":{"事件类型":"唐知夏人物事件","触发地点":"栖云院廊下","开放条件":"完成第八章《忘却之夜》，唐知夏已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["唐知夏将十余年前的修缮记录摊在灯下。\n\n记载第四阵眼的那一页，封闭缘由被人整齐裁去。切口平直，纸边也已经泛黄，至少在许多年前便被取走。\n\n前后两页分别记着药圃引灵和古松阵路，却都没有提及第四阵眼后来如何处置。\n\n“被裁去的内容应当不止一句。”\n\n唐知夏用细尺量过纸边。\n\n“至少有三行。”"],"choices":[{"key":"①","text":"与她比对前后页的用词，推断缺失内容。","condition":"","stable":"","body":["我们将前后数页逐行排开。\n\n同一年所有封阵记录都会写明封闭缘由、经手弟子与材料去向。被裁去的三行，应当正好对应这三项。\n\n唐知夏在缺口旁留下小注。\n\n“先把缺口圈清。副册一旦找回来，翻到这里便能立刻对上。”"],"effects":["【唐知夏信任＋1】"],"heading":"比对前后记录"},{"key":"②","text":"使用【纸墨】，誊录完整页码与裁口位置。","condition":"持有纸墨","stable":"","body":["我将页码、裁口宽度和上下残字全部誊下，另附一张简图。\n\n原册重新封回院柜，誊本则留作后续查验。"],"effects":["【纸墨－1】","【获得物品：旧阵记录誊本】"],"heading":"誊录裁口"},{"key":"③","text":"前往杂务堂查找同一年的修缮副册。","condition":"","stable":"","body":["杂务堂同年的修缮副册已经缺失。\n\n值守弟子只找到一张借阅木牌，上面写着十五年前曾有人调取此册，此后再无归还记录。"],"effects":["【札记新增：未归还的修缮副册】"],"heading":"寻找副册"}]},{"id":"E0804","chapter":8,"title":"药圃下的回声","meta":{"事件类型":"许守安人物事件","触发地点":"栖云院药圃","开放条件":"完成第八章《忘却之夜》，许守安已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["许守安用木槌轻敲药圃边缘的石板。\n\n前五处声音沉实，到了第六处，石下却传出一阵空响。那块旧阵石便埋在附近，地下或许还有未被填平的旧槽。\n\n“不能直接挖。”\n\n他把木槌放到一旁。\n\n“下面若连着旧阵路，挖断一处，整片药圃都会受影响。”"],"choices":[{"key":"①","text":"帮他沿药圃边缘逐处辨听地下回声。","condition":"","stable":"","body":["我依照许守安的办法，从不同方向敲击石板。\n\n空响区域并不大，只沿着药圃西侧延伸了两丈。许守安把位置记进院图。\n\n“最西边那处转角也叫你听出来了。”"],"effects":["【许守安信任＋1】","【获得线索：地下旧槽走向】"],"heading":"辨听回声"},{"key":"②","text":"使用【定纹砂】，标出空响范围。","condition":"持有定纹砂","stable":"","body":["我将定纹砂撒在回声变化的位置。\n\n砂粒受到地下灵气牵引，逐渐连成一道弯曲细线，显出旧槽的大致边界。"],"effects":["【定纹砂－1】","【宗门贡献＋2】","【获得线索：第四阵眼外槽】"],"heading":"标记范围"},{"key":"③","text":"暂时封住第六处石板，等待正式修缮令。","condition":"","stable":"","body":["我与许守安搬来两块厚木板，挡住第六处石板周围。\n\n唐知夏随后在院册中标明此处暂禁踩踏。"],"effects":["【体力－1】","【宗门贡献＋1】"],"heading":"封住石板"}]},{"id":"E0805","chapter":8,"title":"药圃守夜","meta":{"事件类型":"地点事件","触发地点":"栖云院药圃","开放条件":"完成第八章《忘却之夜》","行动消耗":"1","重复规则":"仅一次"},"intro":["忘却之夜以后，栖云院决定轮流守着药圃。\n\n第一夜风平浪静。\n\n聚灵草在月光下轻轻摇动，地下阵纹也没有出现异样。越接近子时，药圃西侧却隐约传来细小水声。\n\n那里没有水渠。\n\n声音只持续了数息，随后便消失在土层深处。"],"choices":[{"key":"①","text":"留在原地守到天明，观察水声是否再次出现。","condition":"","stable":"","body":["水声在后半夜又出现了一次。\n\n两次间隔大致相同，都来自旧阵石附近。天亮以后，我将时辰写入院册。"],"effects":["【体力－2】","【获得线索：子时地下水声】"],"heading":"守到天明"},{"key":"②","text":"使用【传讯纸符】，将水声时辰报给杂务堂。","condition":"持有传讯纸符","stable":"","body":["传讯纸符沿院墙飞向杂务堂。\n\n值夜弟子赶来时，水声已经停止。他在药圃外留下监测阵纸，准备连续观察三夜。"],"effects":["【传讯纸符－1】","【宗门贡献＋2】"],"heading":"送出传讯"},{"key":"③","text":"在水声出现的位置打坐，感应地下灵气流向。","condition":"","stable":"","body":["我在药圃边缘坐下，将灵气缓缓沉入地面阵纹。\n\n地下有一缕极弱水灵气向西侧流动，经过旧阵石后便消失不见。\n\n第九章《山庄来信》自由行动事件"],"effects":["【体力－1】","【修为＋6】","【札记新增：西行水灵】"],"heading":"感应灵流"}]},{"id":"E0901","chapter":9,"title":"竹门外的脚印","meta":{"事件类型":"谢临川人物事件","触发地点":"裴氏山庄外·南岭山道","开放条件":"完成第九章《山庄来信》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["离开裴氏山庄时，山道上刚落过一场细雨。\n\n谢临川在前方停下，用刀鞘拨开路边湿草。泥地上留着两串脚印，一串来自山庄车马，另一串却沿竹林绕向后山。\n\n脚印很浅，落步间距也不一致。\n\n“有人背着重物。”\n\n他顺着痕迹看了一段。\n\n“从山庄出来，走的却是避开正门的小路。”\n\n裴家近日正在清点春祭后的货物。若只是庄中仆役搬运，不必刻意绕开门房；若是外人，此事也未必与宗门差事相干。"],"choices":[{"key":"①","text":"与谢临川沿脚印查到山道岔口。","condition":"","stable":"","body":["我与谢临川沿竹林前行。\n\n脚印在一处陡坡前停下，旁边留下几根断裂麻绳和碎木屑。有人曾在此换过背架，随后转入通往山下集镇的旧路。\n\n谢临川检查过木屑。\n\n“脚印受力方正，肩上压着的多半是木箱。”\n\n他在路边留下外巡印记。\n\n“先查清山庄少了什么，再决定是否继续追。”"],"effects":["【体力－1】","【谢临川好感＋1】","【札记新增：后山运货脚印】"],"heading":"追查脚印"},{"key":"②","text":"使用【空白木签】，标下脚印方向与发现时辰。","condition":"持有空白木签","stable":"","body":["我将脚印方向、深浅和发现位置写在木签上，挂在竹林岔口。\n\n谢临川补上天气与雨停时辰。\n\n“雨后留下的痕迹散得快。有这些记录，后来的人还能判断先后。”"],"effects":["【空白木签－1】","【宗门贡献＋2】"],"heading":"留下标记"},{"key":"③","text":"先返回山庄，询问今日是否有人从后门运货。","condition":"","stable":"","body":["裴氏管事查过出入册。\n\n当日没有后门运货记录，仓房却少了一只装废旧阵材的木箱。箱中物品价值不高，去向仍需核实。"],"effects":["【获得线索：遗失的旧阵材箱】"],"heading":"回庄询问"}]},{"id":"E0902","chapter":9,"title":"旧剑穗","meta":{"事件类型":"裴青萝人物事件","触发地点":"裴氏山庄练武场","开放条件":"完成第九章《山庄来信》，裴青萝已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["山庄练武场旁挂着许多旧兵器。\n\n裴青萝从架上取下一柄幼时用过的木剑。剑身短了许多，剑穗也已经褪色，只剩中间一段仍能看出原本的赤红。\n\n“我第一次练剑用的就是它。”\n\n她挥过一招，很快又停下。\n\n木剑的重量早已不合手，剑柄却被磨得十分光滑。\n\n不远处的族中弟子正在整理旧物，准备将无法使用的兵器拆去烧毁。"],"choices":[{"key":"①","text":"陪她将幼时所学的第一套剑招重新走一遍。","condition":"","stable":"","body":["我从架上另取一柄木剑。\n\n裴青萝先示范了一遍幼时所学的三式。招式简单，步法也比宗门剑诀缓慢许多。\n\n她起初仍按现在的习惯出剑，练到第二遍才找回从前的节奏。\n\n两柄木剑在最后一式相触。\n\n裴青萝收剑看了片刻。\n\n“当年觉得很难，现在反倒容易忘记怎么慢下来。”"],"effects":["【体力－1】","【裴青萝信任＋1】"],"heading":"重走旧招"},{"key":"②","text":"使用【缠柄布】，替旧木剑重新包好剑柄。","condition":"持有缠柄布","stable":"","body":["我拆去受潮旧布，沿剑柄重新缠好。\n\n木剑仍不适合实战，至少不会在搬动时继续开裂。"],"effects":["【缠柄布－1】","【获得札记：裴青萝的旧木剑】"],"heading":"重新缠柄"},{"key":"③","text":"将剑穗拆下收好，木剑交给山庄处理。","condition":"","stable":"","body":["裴青萝将褪色剑穗拆下，重新系在自己的新剑鞘内侧。\n\n旧木剑则交给族中弟子拆去。\n\n“剑不能用了，留一段剑穗也够记得。”"],"effects":["【修为＋3】"],"heading":"留下剑穗"}]},{"id":"E0903","chapter":9,"title":"春祭余烬","meta":{"事件类型":"地点事件","触发地点":"裴氏山庄祭台","开放条件":"完成第九章《山庄来信》","行动消耗":"1","重复规则":"仅一次"},"intro":["春祭结束后，祭台四周仍留着淡淡火气。\n\n几只香炉已经熄灭，其中一只炉底却持续发热。负责清理的弟子不敢直接搬动，担心里面还压着尚未燃尽的阵纸。\n\n香炉外壁刻着护山阵纹。\n\n若阵纸未尽，贸然泼水可能冲散残余灵气；若只是炉底积炭，也不必惊动阵师。"],"choices":[{"key":"①","text":"等待火气自行减弱，再检查炉底。","condition":"","stable":"","body":["我守在香炉旁，观察火气变化。\n\n半个时辰后，炉底温度逐渐下降。打开炉盖，里面只剩几张已经燃尽的阵纸灰烬。"],"effects":["【修为＋4】"],"heading":"等待余火"},{"key":"②","text":"使用【净水符】，引少量水气环绕香炉降温。","condition":"持有净水符","stable":"","body":["净水符引来一层薄薄水气，只绕在香炉外侧，没有触及炉内阵灰。\n\n温度很快降到能够搬动的程度。"],"effects":["【净水符－1】","【宗门贡献＋2】"],"heading":"引水降温"},{"key":"③","text":"请山庄弟子取来春祭阵纸清单逐项核对。","condition":"","stable":"","body":["清单中记有九张护阵纸，炉灰里却只能辨出八枚阵印。\n\n最后一张并未投入香炉，而是被值守弟子留在备用匣中。"],"effects":["【获得物品：未使用的护阵纸】","【效果：一次阵法事件中减少体力损耗1点】"],"heading":"核对阵纸"}]},{"id":"E0904","chapter":9,"title":"未寄出的回信","meta":{"事件类型":"人物／札记事件","触发地点":"裴氏山庄客院","开放条件":"完成第九章《山庄来信》","行动消耗":"1","重复规则":"仅一次"},"intro":["我去客院归还山庄借出的腰牌时，裴青萝正坐在案前。\n\n她面前摊着一封没有封口的书信，只写到半页。那是春祭前拟好的请假信，最后一句停在“暂依家中安排”之后，墨色压得很深。\n\n听见我的脚步，她没有收起信，只将纸页往案边推了半寸。\n\n“这是春祭前写的。”\n\n“后来没寄。”\n\n她没有解释为何留下，信纸却仍未撕去。"],"choices":[{"key":"①","text":"问她是否要重新写一封返回宗门的说明。","condition":"","stable":"","body":["裴青萝沉默片刻，重新展开纸页。\n\n她划去“暂依家中安排”，改成了：\n\n春祭已毕，仍按宗门原定课程返山。\n\n写完以后，她把信递给我看了一遍。\n\n“这封才该寄出去。”"],"effects":["【裴青萝信任＋1】"],"heading":"重新写信"},{"key":"②","text":"使用【纸墨】，替她备好一张新信纸。","condition":"持有纸墨","stable":"","body":["我将新信纸铺在案上。\n\n裴青萝没有照抄旧信，只重新写明返山时辰与护阵结果。"],"effects":["【纸墨－1】","【宗门贡献＋1】"],"heading":"备好新纸"},{"key":"③","text":"不问书信内容，只提醒她封存旧信。","condition":"","stable":"","body":["我替她找来一只空木匣。\n\n旧信被折好放入其中，没有寄出，也没有丢掉。"],"effects":["【札记新增：未寄出的留庄信】"],"heading":"封存旧信"}]},{"id":"E0905","chapter":9,"title":"山庄谢礼","meta":{"事件类型":"行装／领取事件","触发地点":"裴氏山庄库房","开放条件":"完成第九章《山庄来信》","行动消耗":"1","重复规则":"仅一次"},"intro":["离庄前，裴氏管事在偏厅摆下一只乌木长案。窗外春祭余灯尚未撤尽，案上的三件谢礼都系着裴氏赤纹，旁边压着此次护阵的名册。\n\n一瓶回元露，可以恢复体力；\n\n一卷火纹护腕，能够在火系阵法中护住手臂；\n\n一只小型储药匣，适合保存易碎丹药。\n\n管事将三样东西依次推到案前，说明各自用处，又让随行弟子当面验过封口。\n\n“诸位为山庄护阵出了力。礼不算重，择一件合用的带走。”"],"choices":[{"key":"①","text":"领取【回元露一瓶】。","condition":"","stable":"","body":[],"effects":["【获得物品：回元露一瓶】","【使用效果：体力恢复4点】"],"heading":"回元露"},{"key":"②","text":"领取【火纹护腕一副】。","condition":"","stable":"","body":[],"effects":["【获得物品：火纹护腕一副】","【使用效果：一次火系事件中免除1点体力损耗】"],"heading":"火纹护腕"},{"key":"③","text":"领取【储药匣一只】。","condition":"","stable":"","body":["第十章《灵矿归途》自由行动事件"],"effects":["【获得物品：储药匣一只】","【使用效果：携带丹药时，不会因受潮或碰撞损坏】"],"heading":"储药匣"}]},{"id":"E1001","chapter":10,"title":"箱底的碎石","meta":{"事件类型":"周执人物事件","触发地点":"西岭灵矿库房","开放条件":"完成第十章《灵矿归途》，已认识周执","行动消耗":"1","重复规则":"仅一次"},"intro":["封存后的十七号箱被重新送到矿库。\n\n周执拆开外层封条，将箱中问天石逐块取出。上层矿石品相尚可，越靠近箱底，碎石和普通山石越多。\n\n最后一层木板上还留着几道浅白刮痕。\n\n“有人曾在装箱后重新撬开箱底。”\n\n周执用尺量过刮痕间距。\n\n“所用工具很窄，留下的痕迹也很整齐。”\n\n木箱经了好几双手。只看刮痕，还分不清它添在开矿、封箱，还是运出矿场以后。"],"choices":[{"key":"①","text":"与周执比对其他木箱底板的工具痕迹。","condition":"","stable":"","body":["我们连续检查了另外六只同批木箱。\n\n六只同批木箱里，只有十七号箱底留着双线刮痕，可见这道痕后来才添上。十三号箱外侧也有相似印子，却还没来得及撬开。\n\n周执将两只箱号并列写入核查簿。\n\n“同一工具动过两只箱，先后相隔不会太久。”"],"effects":["【周执信任＋1】","【获得线索：双线撬箱痕】"],"heading":"比对木箱"},{"key":"②","text":"使用【拓纹纸】，拓下十七号箱底刮痕。","condition":"持有拓纹纸","stable":"杂务堂旧档柜换取","body":["我将拓纹纸压在底板上，用软炭扫出两道完整痕迹。\n\n刮痕末端还有一处向内弯折的小缺口，可用于比对工具。"],"effects":["【拓纹纸－1】","【获得物品：箱底刮痕拓样】"],"heading":"拓下刮痕"},{"key":"③","text":"沿箱底木屑查找使用过的撬箱工具。","condition":"","stable":"","body":["我沿矿库工具架逐一查看。\n\n一柄窄口撬钩的尖端正好有相同缺口，借用木牌却已经遗失。"],"effects":["【宗门贡献＋2】","【札记新增：无借用记录的撬钩】"],"heading":"查找工具"}]},{"id":"E1002","chapter":10,"title":"松动的矿车轴","meta":{"事件类型":"许守安人物事件","触发地点":"西岭灵矿车道","开放条件":"完成第十章《灵矿归途》，许守安已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["灵矿车道旁停着一辆旧矿车。\n\n许守安蹲在车轮边，转动车轴时，里面不断传出轻微摩擦声。木轮本身没有裂缝，轴心却向左偏了一线。\n\n“归山栈道上那辆车，这处松动多半早就有了。”\n\n他取下轴盖。\n\n里面的润滑油已经干透，固定铁片也少了一枚钉子。"],"choices":[{"key":"①","text":"帮他托起车架，更换轴心固定位置。","condition":"","stable":"","body":["我用木杠托住车架。\n\n许守安重新校正轴心，又换下已经磨薄的铁片。车轮落回地面后，转动时不再向左偏移。\n\n他推着矿车走过一段。\n\n“运出矿场前若多看一遍，栈道上便能少一桩险事。”"],"effects":["【体力－1】","【许守安信任＋1】"],"heading":"调整车轴"},{"key":"②","text":"使用【定阵钉】，暂代缺失的固定钉。","condition":"持有定阵钉","stable":"","body":["定阵钉尺寸略长，我将末端磨去一小截，正好能够卡入轴盖。\n\n旧矿车暂时恢复使用。"],"effects":["【定阵钉－1】","【宗门贡献＋2】"],"heading":"补上固定钉"},{"key":"③","text":"查看同批矿车是否也有相同松动。","condition":"","stable":"","body":["我们将附近五辆矿车全部转过一遍。\n\n其中两辆润滑不足，另一辆车轮边缘已经开裂。矿场当即扣下这几辆矿车，不再放它们上栈道。"],"effects":["【体力－1】","【宗门贡献＋3】"],"heading":"检查同批矿车"}]},{"id":"E1003","chapter":10,"title":"矿灯深处","meta":{"事件类型":"探索事件","触发地点":"西岭灵矿浅层矿道","开放条件":"完成第十章《灵矿归途》","行动消耗":"1","重复规则":"仅一次"},"intro":["浅层矿道已经停工。\n\n我经过一处岔口时，发现深处仍亮着一盏矿灯。灯光很弱，位置却不在当日开放的矿道图中。\n\n岔路前没有封条，地面还留着几道拖拽物品的痕迹。\n\n照明灵石即将耗尽。"],"choices":[{"key":"①","text":"使用【照明符】，沿岔路查看矿灯来源。","condition":"持有照明符","stable":"","body":["照明符飞在前方，映出一条已经废弃的短矿道。\n\n尽头放着空木箱与旧封条，矿灯旁还散落着数块普通山石。这里曾被人用作临时换箱处。"],"effects":["【照明符－1】","【获得线索：废弃矿道换箱点】"],"heading":"进入岔路"},{"key":"②","text":"使用【传讯纸符】，通知矿场守卫。","condition":"持有传讯纸符","stable":"","body":["矿场守卫赶来后封住岔路。\n\n他们在矿灯后发现一只没有箱号的空木箱，当即封住整条岔道。"],"effects":["【传讯纸符－1】","【宗门贡献＋2】"],"heading":"通知守卫"},{"key":"③","text":"留在岔口，记录灯光明灭与矿道风向。","condition":"","stable":"","body":["我没有贸然进入，只记下灯光位置和风向。\n\n矿道内的风从深处向外吹，说明里面还有另一处出口或通风井。"],"effects":["【札记新增：浅层岔路暗风】"],"heading":"记录矿道"}]},{"id":"E1004","chapter":10,"title":"湿透的符纸","meta":{"事件类型":"林惊雨人物事件","触发地点":"归山栈道休息处","开放条件":"完成第十章《灵矿归途》，已认识林惊雨","行动消耗":"1","重复规则":"仅一次"},"intro":["山雨停后，林惊雨将物品袋里的符纸全部摊开。\n\n最外层几张已经湿透，内侧仍有几张只沾了少量水汽。若直接催动灵气烘干，朱砂容易沿水痕散开。\n\n她挑出一张受潮最轻的符纸。\n\n“再放下去也要废了。”\n\n符纹尚未完成，仍有重新处理的余地。"],"choices":[{"key":"①","text":"帮她将符纸逐层分开，放在背风处阴干。","condition":"","stable":"","body":["我与林惊雨一张张分开符纸。\n\n湿纸很容易粘连，稍一用力便会扯破。最终保住了大半未画符纸。\n\n她重新包好纸张。\n\n“下次过栈道，我先把符袋塞进里层。”"],"effects":["【体力－1】","【林惊雨信任＋1】","【获得物品：新符纸两张】"],"heading":"分纸阴干"},{"key":"②","text":"使用【干燥纸】，压住受潮最轻的几张。","condition":"持有干燥纸","stable":"","body":["干燥纸吸走了大部分水汽。\n\n受潮最轻的三张符纸仍能继续使用，其余则无法恢复。"],"effects":["【干燥纸－1】","【获得物品：新符纸三张】"],"heading":"使用干燥纸"},{"key":"③","text":"挑出已经无法使用的符纸，留下朱砂练习运笔。","condition":"","stable":"","body":["我将已经散墨的符纸剪成小片。\n\n虽然不能成符，仍可用来练习起笔、转折和收尾。"],"effects":["【修为＋4】","【札记新增：雨中护符袋】"],"heading":"留下朱砂"}]},{"id":"E1005","chapter":10,"title":"矿场补给箱","meta":{"事件类型":"行装／领取事件","触发地点":"西岭灵矿补给处","开放条件":"完成第十章《灵矿归途》","行动消耗":"1","重复规则":"每年一次"},"intro":["矿场出口的石棚下摆着几只粗木箱，箱身还沾着未洗净的矿尘。完成护送差事的弟子可以从中择一份补给，免得归山途中再缺照明或伤药。\n\n第一份是照明符与传讯纸符，适合矿道探索；\n\n第二份是干净布带与止血散，适合栈道护送；\n\n第三份是拓纹纸与空白木签，适合记录箱号和矿石痕迹。\n\n值守管事拍去箱盖上的灰，逐一掀开给我看：\n\n“任选一份。若在差事中用过，记得把经过写回交差牌。”"],"choices":[{"key":"①","text":"领取矿道探索补给。","condition":"","stable":"","body":[],"effects":["【获得物品：照明符一张】","【获得物品：传讯纸符一张】"],"heading":"矿道探索补给"},{"key":"②","text":"领取外伤处理补给。","condition":"","stable":"","body":[],"effects":["【获得物品：止血散一包】","【获得物品：干净布带两条】"],"heading":"外伤处理补给"},{"key":"③","text":"领取记录核查补给。","condition":"","stable":"","body":["第十一章《九峰问道》自由行动事件"],"effects":["【获得物品：拓纹纸一张】","【获得物品：空白木签三枚】"],"heading":"记录核查补给"}]},{"id":"E1101","chapter":11,"title":"烧焦的护符边角","meta":{"事件类型":"谢临川人物事件","触发地点":"主峰问道台","开放条件":"完成第十一章《九峰问道》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["问道结束后，受损的护身符被统一放入木盘。\n\n多数符纸只裂开一两道纹路，其中一枚却从中央烧穿，边缘留下细密赤痕。谢临川把它夹在刀鞘上翻看，神色比平日更沉。\n\n“灼痕从符心向外散，火气是从佩戴者经脉里冲出来的。”\n\n他指向符纸背面。\n\n“护身符是被体内冲出的热气灼穿的。燃元符多半藏在内襟附近。”\n\n符纸已经十分脆弱。若继续翻动，残余纹路可能彻底碎掉；若直接封存，又难以判断燃元符究竟贴在何处。"],"choices":[{"key":"①","text":"请谢临川教自己分辨护符上的内灼痕迹。","condition":"","stable":"","body":["谢临川用刀鞘分别点过三处烧痕。\n\n“外火烧过，纸边会先卷。灵气从体内冲出来，焦痕会沿符线向外散。”\n\n我照着他的说法重新看了一遍。\n\n赤痕最深的位置正贴近佩戴者心口，说明燃元符很可能藏在内襟或护符之后。\n\n谢临川收起刀鞘。\n\n“灼痕从哪里起，断灵时便从哪里下手。看错一寸，救人时便要多费一刻。”"],"effects":["【谢临川好感＋1】","【札记新增：护符内灼痕】"],"heading":"辨认内灼痕"},{"key":"②","text":"使用【拓纹纸】，拓下护符尚存的赤色纹路。","condition":"持有拓纹纸","stable":"","body":["我将拓纹纸覆在护符上方，以微弱灵气引出残存赤纹。\n\n焦痕转印到纸上，显出一段与燃元符边角相接的弧形符线。"],"effects":["【拓纹纸－1】","【获得线索：燃元符贴附位置】"],"heading":"拓下纹路"},{"key":"③","text":"将护符连同木盘一起送往丹霞峰查验。","condition":"","stable":"","body":["丹霞峰弟子将护符收入隔火匣，又取少量焦灰查验。\n\n灰中残留着催动气血的赤砂，与燃元符上的材料相同。"],"effects":["【宗门贡献＋2】","【札记更新：燃元符片】"],"heading":"送往丹霞峰"}]},{"id":"E1102","chapter":11,"title":"重排的试台名册","meta":{"事件类型":"顾长清人物事件","触发地点":"主峰问道台长案","开放条件":"完成第十一章《九峰问道》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["燃元符事故打乱了数座试台的考核次序。\n\n顾长清坐在长案后，将中断考核、已经完成和需要重试的弟子名册分开。几名弟子曾临时转移试台，原先的木牌与后续成绩无法完全对应。\n\n若名册写错，有人会重复入场，也有人可能失去重试资格。\n\n顾长清将其中两页递给我。\n\n“这两组撤得最急，木牌和名册都混在一处。”\n\n“从入场时辰往回捋，再看试台留下的灵印。”"],"choices":[{"key":"①","text":"与他逐人核对撤离前后的试台位置。","condition":"","stable":"","body":["我按照入场时辰排好木牌，顾长清则查看试台阵盘留下的灵气印记。\n\n一名弟子原本在第三台，撤离时却被误记到第五台。若照旧册结算，他已经完成的前六道灵光便会全部作废。\n\n顾长清改正记录，又在旁边写明缘由。\n\n“试炼可以重走，弟子已经闯过的那几步，不能凭一页乱册子便算作无效。”\n\n他将最后一枚木牌归回原处。\n\n“你记下的时辰正好接上阵盘。少叫他们来回跑一趟，也能早些歇下。”"],"effects":["【顾长清好感＋1】"],"heading":"核对试台"},{"key":"②","text":"使用【纸墨】，重新誊写需要重试的名册。","condition":"持有纸墨","stable":"","body":["我将中断位置、已得成绩和重试顺序逐项誊清。\n\n顾长清核过一遍，在新册末尾落下主峰印记。"],"effects":["【纸墨－1】","【宗门贡献＋2】"],"heading":"誊写新册"},{"key":"③","text":"前往各峰休息处，收回尚未归还的考核木牌。","condition":"","stable":"","body":["我依次走过几处休息区，收回五枚尚未归还的考核牌。\n\n其中一枚沾着药汁，正是受伤弟子被送往丹霞峰时遗落的。"],"effects":["【体力－1】","【宗门贡献＋2】","【获得物品：传讯纸符一张】"],"heading":"收回木牌"}]},{"id":"E1103","chapter":11,"title":"赤砂从何而来","meta":{"事件类型":"周执人物事件","触发地点":"杂务堂核验室","开放条件":"完成第十一章《九峰问道》，已认识周执","行动消耗":"1","重复规则":"仅一次"},"intro":["燃元符碎片被封在一只透明玉匣中。\n\n周执把近半年的符材领用簿摊开，逐一查找赤砂、火纹纸和催血藤的去向。\n\n三种材料都能用于寻常符箓，单独领取看不出异样。若有人分开领走，再私下拼成燃元符，单看簿册便很难看出端倪。\n\n“半年里，赤砂一共领出十七回。”\n\n周执指向其中三笔。\n\n“这三次领用量不大，时辰却都在闭库前一刻。”"],"choices":[{"key":"①","text":"与周执比对三次领用人的其他材料记录。","condition":"","stable":"","body":["我将三名领用人的半年记录全部调出。\n\n其中两人领用后都交回了相应的差事牌，余下一人只领过赤砂和火纹纸，既没有交回成符，也未报损。\n\n周执在名字旁留下待查印记。\n\n“先把材料去向找齐。两笔账还压不住一个人的罪名。”"],"effects":["【周执信任＋1】","【获得线索：无交差牌的符材领取】"],"heading":"比对记录"},{"key":"②","text":"使用【空白木签】，将三种材料按日期重新排列。","condition":"持有空白木签","stable":"","body":["我把赤砂、火纹纸和催血藤分别写在木签上，再依照领用日期排列。\n\n三种材料曾在同一旬内分三次领出，经手人虽不同，担保印却来自同一处符房。"],"effects":["【空白木签－1】","【获得线索：同一符房担保印】"],"heading":"重排日期"},{"key":"③","text":"查验玉匣中的碎片，辨认符纸来自哪一批。","condition":"","stable":"","body":["燃元符碎片的纸质偏厚，纤维中夹着浅红细丝。\n\n藏经阁保存的符纸入库册中，只有一批火纹纸带有同样特征。"],"effects":["【宗门贡献＋2】","【札记新增：红丝火纹纸】"],"heading":"查验纸质"}]},{"id":"E1104","chapter":11,"title":"铜镜余辉","meta":{"事件类型":"修行事件","触发地点":"主峰问道台","开放条件":"完成第十一章《九峰问道》","行动消耗":"1","重复规则":"每年一次"},"intro":["考核用的悬空铜镜尚未收起。\n\n十道记分纹已经熄灭，镜面仍残留着细弱灵光。每当我将灵气靠近，铜镜便会映出术法偏离的方向。\n\n负责收台的弟子允许我再练一轮。\n\n“只剩余灵，撑不了多久。”"],"choices":[{"key":"①","text":"连续施展十次术法，修正出手方向。","condition":"","stable":"","body":["我站回试台中央，依照铜镜残存光点连续出手。\n\n前几次灵光仍有轻微偏斜，到了第八次，落点终于稳定在镜纹中央。"],"effects":["【体力－2】","【修为＋9】"],"heading":"完整练习"},{"key":"②","text":"使用【清脉散】，缓解连续施术造成的经脉疲惫。","condition":"持有清脉散","stable":"","body":["药力化开以后，经脉中的灼热很快减轻。\n\n我借铜镜余辉完成数次控灵，没有继续强行催动。"],"effects":["【清脉散－1】","【体力＋3】","【修为＋5】"],"heading":"服用清脉散"},{"key":"③","text":"只练习最容易偏离的最后三道灵光。","condition":"","stable":"","body":["我只等待铜镜放出最急的三道灵光。\n\n次数虽少，每一次都需要在极短时辰内收回旧术、重新凝灵。"],"effects":["【修为＋6】"],"heading":"专练末段"}]},{"id":"E1105","chapter":11,"title":"问道台补给","meta":{"事件类型":"行装／领取事件","触发地点":"主峰问道台库架","开放条件":"完成第十一章《九峰问道》","行动消耗":"1","重复规则":"每年一次"},"intro":["九峰问道结束后，各峰留下了一批未用完的常备行装。\n\n其中一份是清脉散与止血散，适合连续试法后恢复；\n\n一份是拓纹纸与空白木签，适合记录阵纹和符纹；\n\n一份是照明符与传讯纸符，适合外出任务。\n\n值守弟子看过我的考核木牌，又在木箱旁的小册上添了一笔。\n\n“可任选一份，带走后记入弟子令。”"],"choices":[{"key":"①","text":"领取调息药物。","condition":"","stable":"","body":[],"effects":["【获得物品：清脉散一包】","【获得物品：止血散一包】"],"heading":"调息药物"},{"key":"②","text":"领取查验用具。","condition":"","stable":"","body":[],"effects":["【获得物品：拓纹纸一张】","【获得物品：空白木签三枚】"],"heading":"查验用具"},{"key":"③","text":"领取外出符箓。","condition":"","stable":"","body":["第十二章《人间灯火》自由行动事件"],"effects":["【获得物品：照明符一张】","【获得物品：传讯纸符一张】"],"heading":"外出符箓"}]},{"id":"E1201","chapter":12,"title":"焦木间的脚步","meta":{"事件类型":"谢临川人物事件","触发地点":"清河镇灯市","开放条件":"完成第十二章《人间灯火》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["灯市大火熄灭后，街上仍留着成片焦木。\n\n谢临川沿烧毁的灯架逐一查看，刀鞘不时拨开积灰。多数脚印都来自救火百姓，只有一串痕迹逆着人群方向，从后巷走向起火处。\n\n脚印主人穿着硬底靴，步幅平稳。\n\n“起火以后，人人都往外跑。”\n\n谢临川看向后巷。\n\n“这个人却在往里走。”\n\n痕迹走到一只破裂灯油桶旁便断了。桶边散着碎布和半截麻绳，可能有人曾搬动过它。"],"choices":[{"key":"①","text":"与谢临川沿逆行脚印追查后巷出口。","condition":"","stable":"","body":["我与谢临川穿过两条窄巷。\n\n脚印最终停在临河石阶前。水边系船的木桩上留着新绳痕，附近却没有船。\n\n谢临川看了一眼河面。\n\n“人从水路离开了。”\n\n他蹲下查看潮湿石阶。\n\n“后巷这条退路早有人踩过。来者应是有备而来。”"],"effects":["【体力－1】","【谢临川好感＋1】","【获得线索：灯市水路来人】"],"heading":"追查后巷"},{"key":"②","text":"使用【空白木签】，标出脚印与油桶位置。","condition":"持有空白木签","stable":"","body":["我将脚印方向、灯油桶位置和碎布散落处分别写在木签上。\n\n外巡队随后依照标记封住现场。"],"effects":["【空白木签－1】","【宗门贡献＋2】"],"heading":"标记现场"},{"key":"③","text":"留在原地整理破桶、麻绳和碎布的先后关系。","condition":"","stable":"","body":["破桶先被搬到灯架旁，麻绳随后断裂，碎布则是救火时留下的。\n\n有人在起火前便把掺脂灯油送到了最容易蔓延的位置。"],"effects":["【札记新增：灯市逆行脚印】","【宗门贡献＋1】"],"heading":"整理痕迹"}]},{"id":"E1202","chapter":12,"title":"济药册上的空格","meta":{"事件类型":"顾长清人物事件","触发地点":"清河镇济药处","开放条件":"完成第十二章《人间灯火》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["御寒药分发结束后，济药册上留下七处空格。\n\n领药人的姓名与住处都有记录，领取数量一栏却因火灾中断，没有来得及补齐。若按整份药包计算，库存少了三包；若按实际拆分数量计算，仍可能正好相合。\n\n顾长清将剩余药包、空药纸和领药木牌摆在一起。\n\n“能对上的先补齐。”\n\n“拿不准的便空着，我再去问人。别为了把账页填满，反叫哪户明日领不到药。”"],"choices":[{"key":"①","text":"与顾长清按照药包封口和木牌逐户核对。","condition":"","stable":"","body":["我将完整药包、拆开的半包和空纸逐一分类。\n\n顾长清依据木牌上的领药时辰，确认其中五户各领一包，另外两户因家中人数少，只分到半包。\n\n最终数量与库存相合。\n\n他在空格旁写明查清经过。\n\n“这几笔写明白，明日来接手的人才不会叫病中的百姓再跑一趟。”"],"effects":["【顾长清好感＋1】"],"heading":"核对封口"},{"key":"②","text":"使用【纸墨】，重新誊写受火熏污的济药册。","condition":"持有纸墨","stable":"","body":["我把仍能辨认的姓名、住处与时辰重新誊到新册。\n\n被火熏黑的旧册封入木匣，留作日后核查。"],"effects":["【纸墨－1】","【宗门贡献＋2】"],"heading":"誊写药册"},{"key":"③","text":"前往受药百姓家中，确认当日领取数量。","condition":"","stable":"","body":["我沿着济药册上的住处找过七户人家。\n\n其中一户将半包药又分给了邻家，才让原始记录看起来少了一份。"],"effects":["【体力－2】","【宗门贡献＋3】"],"heading":"逐户确认"}]},{"id":"E1203","chapter":12,"title":"退回来的灯油","meta":{"事件类型":"墨无咎人物事件","触发地点":"清河镇临时货栈","开放条件":"完成第十二章《人间灯火》，已认识墨无咎","行动消耗":"1","重复规则":"仅一次"},"intro":["被封存的灯油桶堆在临时货栈中。\n\n墨无咎正核对桶底商号与交货单。起火的那批灯油来自三家铺面，封口却都用了同一种灰蜡。\n\n他削下一小块封蜡，放在灯下查看。\n\n“商号不同，封货的人应当相同。”\n\n其中一只油桶没有起火，桶内也未验出灵脂。若能找出它与其余油桶的差异，便能看清掺换发生在装油前还是封货后。"],"choices":[{"key":"①","text":"请墨无咎带自己比对三种灯油的封蜡和桶底痕迹。","condition":"","stable":"","body":["墨无咎让我先看桶底磨痕。\n\n掺脂油桶底部都留着两道横向刮痕，未燃油桶则只有一道。那两道痕迹来自同一辆双梁货车。\n\n封蜡外层虽相同，掺脂油桶内侧还夹着一层新蜡，可见途中曾被重新开启。\n\n墨无咎把封蜡放回木盘。\n\n“货单写的是经手人。要找中途开封的时辰，得看桶身留下的痕。”"],"effects":["【墨无咎好感＋1】","【获得线索：双梁货车刮痕】"],"heading":"比对油桶"},{"key":"②","text":"使用【验货签】，分别查验未燃灯油与掺脂灯油。","condition":"持有验货签","stable":"","body":["两张验货签分别贴上油桶。\n\n未燃灯油只显出寻常油脂，掺脂灯油则浮出赤色灵脂反应。\n\n两批灯油起初应当分开，灵脂是在中途开封后才混进去的。"],"effects":["【验货签－2】","【获得线索：灯油途中掺换】"],"heading":"分别验货"},{"key":"③","text":"沿交货单查找三家铺面共同使用的货栈。","condition":"","stable":"","body":["三家铺面的交货单上，都盖着清河镇西货栈的中转印。\n\n货栈账册却只记了两批灯油，第三批全无踪影。"],"effects":["【宗门贡献＋2】","【札记新增：西货栈漏记油桶】"],"heading":"查找共同货栈"}]},{"id":"E1204","chapter":12,"title":"薄冰下的河灯","meta":{"事件类型":"地点事件","触发地点":"清河镇河岸","开放条件":"完成第十二章《人间灯火》","行动消耗":"1","重复规则":"仅一次"},"intro":["灯节过后，河面薄冰下压着几盏未熄的河灯。\n\n灯纸已经被水浸透，灯芯却靠着残余灵油继续发亮。若冰层继续增厚，河灯中的灵油可能堵住下游取水口。\n\n河岸边有长竹竿，也有镇民留下的捞网。"],"choices":[{"key":"①","text":"用竹竿逐盏将河灯引向岸边。","condition":"","stable":"","body":["我踩着岸边石阶，用竹竿慢慢拨动灯架。\n\n冰层很薄，稍一用力便会裂开。忙了许久，五盏河灯都被引回岸边。"],"effects":["【体力－1】","【宗门贡献＋2】"],"heading":"捞回河灯"},{"key":"②","text":"使用【净水符】，聚拢散在冰下的残油。","condition":"持有净水符","stable":"","body":["净水符贴近冰面后，水下残油逐渐聚成一团，被灵光带到岸边。\n\n河灯仍压在冰下，却不会再污染水流。"],"effects":["【净水符－1】","【宗门贡献＋2】","【修为＋2】"],"heading":"清理残油"},{"key":"③","text":"沿河岸查看河灯是否已经流入取水渠。","condition":"","stable":"","body":["我沿河向下游走去。\n\n两盏破损河灯已经卡在取水渠入口。清理以后，渠水重新流通。"],"effects":["【体力－1】","【获得札记：清河取水渠】"],"heading":"检查水渠"}]},{"id":"E1205","chapter":12,"title":"清河冬市","meta":{"事件类型":"行装／领取事件","触发地点":"清河镇冬市","开放条件":"完成第十二章《人间灯火》","行动消耗":"1","重复规则":"每年一次"},"intro":["大火过后的清河镇仍带着焦木气味，冬市却已重新亮起灯笼。新搭的棚顶压着薄雪，药铺、行装铺与纸铺挤在同一条窄街上，炉火与人声把寒意挡在檐外。\n\n药铺摆出一瓶回元露与一包止血散；\n\n行装铺挂出一副厚实护腕和两条防水布带；\n\n纸铺则售卖纸墨、空白木签与防潮纸袋。\n\n三家铺主商量后将用物配成三份，每份都售八枚灵石，封袋上写着所装之物。"],"choices":[{"key":"①","text":"购买冬季药物。","condition":"","stable":"","body":[],"effects":["【灵石－8】","【获得物品：回元露一瓶】","【获得物品：止血散一包】"],"heading":"冬季药物"},{"key":"②","text":"购买外巡行装。","condition":"","stable":"","body":[],"effects":["【灵石－8】","【获得物品：厚布护腕一副】","【获得物品：防水布带两条】","【厚布护腕效果：一次寒冷或山路事件中免除1点体力损耗】"],"heading":"外巡行装"},{"key":"③","text":"购买记录用具。","condition":"","stable":"","body":["第十三章《云泽入境》关联自由行动事件\n\n第十三章《云泽入境》与第十四章《旧殿留字》连续触发，中途无法返回主页。\n\n以下事件在完成第十四章、离开云泽秘境后开放。"],"effects":["【灵石－8】","【获得物品：纸墨一份】","【获得物品：空白木签三枚】","【获得物品：防潮纸袋一只】","【防潮纸袋效果：防止一次纸张、符箓或账册受潮】","【开放说明】"],"heading":"记录用具"}]},{"id":"E1301","chapter":13,"title":"苇叶上的剑痕","meta":{"事件类型":"沈砚人物事件","触发地点":"云水崖","开放条件":"完成第十四章《旧殿留字》，已认识沈砚","行动消耗":"1","重复规则":"仅一次"},"intro":["云泽入口已经闭合。\n\n深潭恢复平静，只剩崖边堆着几捆从秘境带出的断苇。宗门弟子准备将它们焚去，沈砚却从中抽出一片叶缘破损的长苇。\n\n苇叶上留着一道极细剑痕。\n\n伤口从叶脉间穿过，叶片仍连在一处。这样的力道足以割断缠在脚边的水草，又不会惊动水下灵兽。\n\n沈砚将苇叶放在石上。\n\n“云泽里有人用过这一路剑法。”\n\n秘境中除他以外，还有数名佩剑弟子。单凭一道苇叶剑痕，无法分辨出手者是谁。"],"choices":[{"key":"①","text":"请沈砚依照剑痕教自己控制落剑深浅。","condition":"","stable":"","body":["沈砚另取一片苇叶，夹在两块石头之间。\n\n“剑锋穿过叶面，力要收在叶脉之前。”\n\n我试过数次。\n\n前几剑都将苇叶彻底斩断，直到放缓手腕，剑锋才只在叶面留下一道浅痕。\n\n沈砚捻起那片叶子看了一眼。\n\n“再练几次，遇见缠身水草时便不会伤到同行弟子。”"],"effects":["【体力－1】","【沈砚好感＋1】"],"heading":"练习控剑"},{"key":"②","text":"使用【拓纹纸】，留下苇叶剑痕的完整形状。","condition":"持有拓纹纸","stable":"","body":["我将苇叶展平，用拓纹纸覆住叶面。\n\n剑痕经过叶脉时曾有一次短暂停顿，随后又重新落下。两段剑势看似相连，力道却并不相同。"],"effects":["【拓纹纸－1】","【获得线索：云泽苇叶剑痕】"],"heading":"拓下剑痕"},{"key":"③","text":"将断苇送往主峰，与入境弟子的剑路逐一比对。","condition":"","stable":"","body":["主峰收下断苇，将它与入境弟子的剑路一并收录。\n\n其中三人的剑路与痕迹方向接近，仍需调出当日的试炼留影石，再看各自佩剑的刃口磨损。"],"effects":["【宗门贡献＋2】","【札记新增：云泽无名剑痕】"],"heading":"送往主峰"}]},{"id":"E1302","chapter":13,"title":"青晶里的细响","meta":{"事件类型":"修行／探索事件","触发地点":"云水崖封存台","开放条件":"完成第十四章《旧殿留字》","行动消耗":"1","重复规则":"仅一次"},"intro":["从断桥遗台带回的云泽青晶被暂时放在崖边封存台。\n\n白日里，晶石只泛着浅蓝光泽。到了夜间，靠近其中一块时，却能听见极轻的水声。\n\n那声音像水流穿过窄缝，时快时缓。\n\n封存阵纹没有异动，青晶表面也看不出裂口。水声可能来自晶石内部残留的秘境灵气，也可能与沉水石门有关。"],"choices":[{"key":"①","text":"将灵气缓缓送入青晶，感受水声变化。","condition":"","stable":"","body":["我将灵气压在掌心，只送入极细一缕。\n\n青晶中的水声随之变得清楚，仿佛有一道水流沿着石内阵纹转过三处弯角，最终停在晶石中央。\n\n灵气收回后，水声也渐渐淡去。"],"effects":["【体力－1】","【修为＋7】"],"heading":"感应青晶"},{"key":"②","text":"使用【净水符】，引出晶石外层残余水气。","condition":"持有净水符","stable":"","body":["净水符贴近青晶，牵出一层薄雾。\n\n雾气在半空凝成一圈残缺水纹，与玄水旧殿石门上的纹路略有相似。"],"effects":["【净水符－1】","【获得线索：青晶残缺水纹】"],"heading":"引出水气"},{"key":"③","text":"记录水声间隔，与云泽入口闭合时辰对照。","condition":"","stable":"","body":["我连续守了一个时辰。\n\n水声每隔九息出现一次，与旧殿黑色水镜亮起时的节律相近。主峰弟子将这块青晶单独移入封匣。"],"effects":["【札记新增：九息水声】","【宗门贡献＋2】"],"heading":"对照时辰"}]},{"id":"E1303","chapter":13,"title":"药篓底的银丝","meta":{"事件类型":"阿阮人物事件","触发地点":"栖云院药圃","开放条件":"完成第十四章《旧殿留字》，阿阮已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["阿阮清理从云泽带回的药篓时，在篓底发现几缕银白细丝。\n\n细丝浸过水后仍未腐烂，碰到灵气便会轻轻收缩，应当是秘境中的银丝藻。\n\n它们原本缠在泽兰根部，混进药篓后一路带回了宗门。\n\n阿阮用竹片挑起一缕。\n\n“银丝藻离水以后很难存活。”\n\n“若能养下来，往后配止血药时或许用得上。”\n\n药圃土壤偏干，灵泉边水气充足，却离栖云院较远。"],"choices":[{"key":"①","text":"与阿阮在药圃边挖一处浅水槽，尝试养活银丝藻。","condition":"","stable":"","body":["我与阿阮在药圃边挖开一小片土，引来细细一股泉水。\n\n银丝藻入水后缓缓舒展，缠上了水槽中的细石。\n\n阿阮蹲在旁边看了许久。\n\n“若三日后还活着，这一株便算留住了。”"],"effects":["【体力－1】","【阿阮信任＋1】","【开放后续事件：银丝藻新芽】"],"heading":"挖浅水槽"},{"key":"②","text":"使用【储药匣】，将银丝藻暂时封存。","condition":"持有储药匣","stable":"","body":["我在储药匣底部铺上湿布，将银丝藻分开安置。\n\n匣中水气不散，足以维持到丹霞峰给出处理办法。"],"effects":["【获得物品：封存的银丝藻】","【储药匣进入占用状态】"],"heading":"暂时封存"},{"key":"③","text":"取一小段送往丹霞峰，查明它的药性。","condition":"","stable":"","body":["丹霞峰辨药弟子确认，银丝藻能够收紧伤口附近的细小血脉。\n\n数量虽少，晒干以后仍能配出一份止血散。"],"effects":["【获得物品：止血散一包】","【札记新增：云泽银丝藻】"],"heading":"送往丹霞峰"}]},{"id":"E1304","chapter":13,"title":"断桥水图","meta":{"事件类型":"顾长清人物事件","触发地点":"主峰内院","开放条件":"完成第十四章《旧殿留字》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["顾长清将云泽断桥附近的地形绘成一幅水图。\n\n图上标着芦苇水道、下陷石路与沉水石门。几名弟子所记的路线略有差异，其中一段石路在三张图上分别偏向东、西和正北。\n\n“云泽水面会挪动倒影，人在雾里很容易把东岸看成西岸。”\n\n他将三张草图并排展开。\n\n“先找三张图上都画过的石柱和断桥。”\n\n断桥石柱、水下旧桥与青晶石台都可能成为参照。若选错位置，下一次入境时便可能将路引向更深水域。"],"choices":[{"key":"①","text":"与顾长清以断桥石柱为准，重新排列三张路线图。","condition":"","stable":"","body":["我先找出三张图中形状相同的断桥石柱，再依照水流方向调整方位。\n\n原本互相冲突的石路逐渐接在一起。偏向正北的那张图，实际将水面倒影误作了另一根石柱。\n\n顾长清将路线重新标明。\n\n“水面会骗人，石柱不会。把三张图都认得的地方钉住，余下的路便不容易乱。”"],"effects":["【顾长清好感＋1】"],"heading":"重排水图"},{"key":"②","text":"使用【纸墨】，誊绘一幅完整水图。","condition":"持有纸墨","stable":"","body":["我将断桥、石台与沉水门的位置重新誊入新纸。\n\n顾长清在危险水域旁补上红印，并注明水位变化时不可照图强行前进。"],"effects":["【纸墨－1】","【宗门贡献＋2】","【获得物品：云泽断桥水图副本】"],"heading":"誊绘整图"},{"key":"③","text":"询问其他入境弟子，补齐芦苇荡中的岔路。","condition":"","stable":"","body":["我逐一询问同批入境弟子。\n\n有两人在芦苇荡中见过半截刻纹石柱，位置恰好能补上缺失的岔路。"],"effects":["【体力－1】","【获得线索：芦苇荡刻纹石柱】"],"heading":"补问岔路"}]},{"id":"E1305","chapter":13,"title":"云泽归途行装","meta":{"事件类型":"行装／领取事件","触发地点":"云水崖补给处","开放条件":"完成第十四章《旧殿留字》","行动消耗":"1","重复规则":"仅一次"},"intro":["云泽秘境封闭后，宗门将余下行装重新清点。\n\n一份是避水绳与防潮纸袋，适合水域探索；\n\n一份是止血散与清脉散，适合秘境受伤后调息；\n\n一份是拓纹纸与照明符，适合调查旧阵与石刻。\n\n负责清点的弟子把潮湿木牌换成新的，抬手指向三只竹筐：\n\n“入过云泽的弟子可以择一份。水域用物都重新晒过，带走前再看一眼封绳。”"],"choices":[{"key":"①","text":"领取水域行装。","condition":"","stable":"","body":[],"effects":["【获得物品：避水绳一捆】","【获得物品：防潮纸袋一只】","【避水绳效果：一次水域事件中免除1点体力损耗】"],"heading":"水域行装"},{"key":"②","text":"领取调息药物。","condition":"","stable":"","body":[],"effects":["【获得物品：止血散一包】","【获得物品：清脉散一包】"],"heading":"调息药物"},{"key":"③","text":"领取调查用具。","condition":"","stable":"","body":["第十四章《旧殿留字》自由行动事件"],"effects":["【获得物品：拓纹纸一张】","【获得物品：照明符一张】"],"heading":"调查用具"}]},{"id":"E1401","chapter":14,"title":"封印铜片","meta":{"事件类型":"顾长清人物事件","触发地点":"主峰封存室","开放条件":"完成第十四章《旧殿留字》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["从玄水旧殿带回的封印残件被放在白玉盘中。\n\n铜片边缘布满暗色锈迹，背面却有一处狭长凹槽。凹槽内残留着极淡灵光，像是曾经嵌过另一枚更小的阵钥。\n\n顾长清戴上隔灵手套，将铜片转到光下。\n\n“若这里原有阵钥，玄水殿的封印便不止一重。”\n\n他没有直接注入灵气，只先检查铜片四周的水纹。\n\n“它离开旧殿仍在牵引水灵。试探可以，回流的阵路要先封好。”"],"choices":[{"key":"①","text":"与顾长清从最外层阵纹开始，逐步查验灵气走向。","condition":"","stable":"","body":["我站在白玉盘另一侧，只送入一缕灵气。\n\n顾长清依次封住两处回流纹，铜片中心才缓缓亮起。凹槽内随之浮出半个古字，形似“归”。\n\n灵光刚有增强迹象，他便立即切断阵路。\n\n“它会回应灵气，这一点已经够我们往下查。今日收手。”\n\n顾长清重新盖上封印布。\n\n“旧阵的脾性尚未摸清，能安稳收回来，便比多逼出一层灵光要紧。”"],"effects":["【顾长清好感＋1】","【获得线索：封印凹槽“归”字】"],"heading":"查验阵纹"},{"key":"②","text":"使用【拓纹纸】，拓下凹槽与残余水纹。","condition":"持有拓纹纸","stable":"","body":["我将拓纹纸覆在铜片背面。\n\n水纹从凹槽向外分成九道，其中八道完整，最末一道只剩半截。"],"effects":["【拓纹纸－1】","【获得物品：九道封纹拓样】"],"heading":"拓下水纹"},{"key":"③","text":"将铜片放入隔灵匣，暂时停止查验。","condition":"","stable":"","body":["我没有继续引动铜片。\n\n封存室弟子取来隔灵匣，将残件与其他旧殿物品分开放置。匣面很快浮出一层薄水雾，说明铜片仍在吸引周围水气。"],"effects":["【宗门贡献＋2】","【札记新增：封印残件持续引水】"],"heading":"封入隔灵匣"}]},{"id":"E1402","chapter":14,"title":"拓本缺去的半行","meta":{"事件类型":"唐知夏人物事件","触发地点":"栖云院廊下","开放条件":"完成第十四章《旧殿留字》，唐知夏已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["从旧殿带回的石刻拓本晾干后，边角露出一行先前未曾看清的小字。\n\n前半句已经完整：\n\n第九名简入水……\n\n后半句恰好落在破损处，只剩两个模糊笔画。\n\n唐知夏将拓本压在案上，又找出玄水旧殿其他石刻的字形。\n\n“同一处殿宇的刻字习惯应当相近。”\n\n“只要找到相同笔画，也许能补出一两个字。”"],"choices":[{"key":"①","text":"与她对照拓本中的重复字形。","condition":"","stable":"","body":["我们将“名简”“归者”“水镜”几处字形逐一排开。\n\n残存的第一笔与“碎”字下部相近，第二笔则可能属于“沉”字。\n\n唐知夏没有直接补字，只在旁边写下两种推测。\n\n“看不清便先空着。若把猜出来的字写进正文，后来的人只会顺着错处越走越远。”"],"effects":["【唐知夏信任＋1】","【获得线索：名简或曾碎于水中】"],"heading":"比对字形"},{"key":"②","text":"使用【纸墨】，将残存笔画分层描出。","condition":"持有纸墨","stable":"","body":["我用极淡墨色描出石刻凹痕，再将后补线条与原文分开标记。\n\n残笔比先前清楚许多，却仍无法拼成完整句子。"],"effects":["【纸墨－1】","【获得物品：旧籍残文摹本】"],"heading":"描出残笔"},{"key":"③","text":"前往藏经阁查找玄水殿旧制碑文。","condition":"","stable":"","body":["藏经阁旧碑录中收着一篇玄水殿落成铭文。\n\n其中“入水”“归简”等字形与拓本相同，仍未找到缺失半句的原文。"],"effects":["【修为＋3】","【札记新增：玄水殿落成铭】"],"heading":"查找旧碑"}]},{"id":"E1403","chapter":14,"title":"九阶水影","meta":{"事件类型":"修行／心魔事件","触发地点":"栖云院静室","开放条件":"完成第十四章《旧殿留字》","行动消耗":"1","重复规则":"仅一次"},"intro":["入定以后，我再次看见旧殿水镜中的九级长阶。\n\n前八级都映着模糊人影，最后一级仍旧空着。水光每次流过，空位处便会出现半枚名简，随后又沉入黑暗。\n\n这段景象来自旧殿残阵，也可能只是心神受水镜影响后留下的余象。\n\n我握住弟子令，令面没有异动。"],"choices":[{"key":"①","text":"稳住呼吸，从第一阶开始逐级分辨水影。","condition":"","stable":"","body":["我没有追逐第九级的半枚名简，只从第一道影子开始观察。\n\n八道人影高矮不同，其中一人腰间似乎佩着剑，另一人怀中抱着长匣。水光经过第七级时，影子曾短暂回头。\n\n我刚想看清，那些人影便一同散去。"],"effects":["【体力－1】","【修为＋6】","【心魔＋1】","【获得线索：九阶八影】"],"heading":"分辨水影"},{"key":"②","text":"点燃【安神香】，阻止水镜余象继续加深。","condition":"持有安神香","stable":"","body":["香气在静室中缓缓散开。\n\n九级长阶逐渐淡去，水声也从耳边退远。再次睁眼时，弟子令仍安静地放在膝前。"],"effects":["【安神香－1】","【心魔－1】"],"heading":"平复心神"},{"key":"③","text":"提前结束入定，将所见全部写入札记。","condition":"","stable":"","body":["我立即散去灵气，将长阶、人数与名简位置写入札记。\n\n余象没有继续出现，丹田气息也未受到影响。"],"effects":["【札记更新：水镜九阶】"],"heading":"结束入定"}]},{"id":"E1404","chapter":14,"title":"剑鞘里的水砂","meta":{"事件类型":"裴青萝人物事件","触发地点":"演武场","开放条件":"完成第十四章《旧殿留字》，裴青萝已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["从云泽回来以后，裴青萝的剑出鞘时总带着细微摩擦声。\n\n她拆开剑鞘内衬，倒出几粒浅蓝水砂。水砂细得像碎晶，多半是在断桥附近沾入。\n\n“再留几日，剑鞘内侧便要磨花。”\n\n她用软布探入鞘中，布角很快被水汽浸湿。\n\n剑鞘窄长，单靠手指难以清理到最深处。"],"choices":[{"key":"①","text":"帮她固定剑鞘，让她用细竹片清出水砂。","condition":"","stable":"","body":["我按住剑鞘两端，裴青萝将缠着软布的竹片缓缓送入。\n\n水砂一粒粒被带出，最深处还夹着一小片芦苇叶。\n\n清理完成后，她重新试剑。\n\n剑锋出鞘时终于恢复利落。\n\n“下次进水域，我会先把剑鞘封好。”"],"effects":["【体力－1】","【裴青萝信任＋1】"],"heading":"清理剑鞘"},{"key":"②","text":"使用【防潮纸袋】，吸去剑鞘中残留水汽。","condition":"持有防潮纸袋","stable":"","body":["我将防潮纸裁成细条，送入剑鞘内侧。\n\n纸面很快吸走水气，剩余水砂也随纸条一同带出。"],"effects":["【防潮纸袋－1】","【获得札记：云泽水砂】"],"heading":"吸去水汽"},{"key":"③","text":"将水砂收起，送往云水崖与青晶碎屑比对。","condition":"","stable":"","body":["云水崖弟子查验后确认，水砂与云泽青晶的外层碎屑相近，却少了晶石内部的水灵气。\n\n它们应当只是断桥附近受冲刷形成的碎砂。"],"effects":["【宗门贡献＋2】"],"heading":"比对碎屑"}]},{"id":"E1405","chapter":14,"title":"玄水查验行装","meta":{"事件类型":"行装／领取事件","触发地点":"主峰封存室外架","开放条件":"完成第十四章《旧殿留字》","行动消耗":"1","重复规则":"仅一次"},"intro":["主峰为参与旧殿调查的弟子备了三套查验用具。\n\n一份是拓纹纸与纸墨，适合整理石刻和阵纹；\n\n一份是安神香与清脉散，适合受到旧阵影响后调息；\n\n一份是隔灵布与空白木签，适合临时封存带有灵气的残件。\n\n值守弟子将隔灵布单独压在玉镇下，低声提醒：\n\n“这些用物只许用在查验差事上。若残件自行引灵，先以隔灵布覆住，送回此处，莫带进灵居。”"],"choices":[{"key":"①","text":"领取摹录用具。","condition":"","stable":"","body":[],"effects":["【获得物品：拓纹纸一张】","【获得物品：纸墨一份】"],"heading":"摹录用具"},{"key":"②","text":"领取调息药物。","condition":"","stable":"","body":[],"effects":["【获得物品：安神香一束】","【获得物品：清脉散一包】"],"heading":"调息药物"},{"key":"③","text":"领取封存用具。","condition":"","stable":"","body":["第十五章《外门旧账》自由行动事件"],"effects":["【获得物品：隔灵布一块】","【获得物品：空白木签三枚】","【隔灵布效果：一次旧阵或异常物品事件中，防止物品自行引灵】"],"heading":"封存用具"}]},{"id":"E1501","chapter":15,"title":"账页上的空印","meta":{"事件类型":"周执人物事件","触发地点":"杂务堂旧档房","开放条件":"完成第十五章《外门旧账》，已认识周执","行动消耗":"1","重复规则":"仅一次"},"intro":["旧档房新清出一册阵材领用簿。\n\n账页上记着问天石、水纹铜与聚灵草的领出数量，每笔后方都盖有经手印。翻到十五年前的一页时，其中一枚印记只剩外圈，中央姓名已经被人刮去。\n\n周执把账册移到灯下。\n\n“纸面没有破，墨却被刮得很薄。”\n\n“动手的人不想毁掉整页，只想抹去经手者。”\n\n空印旁还留着领用时辰和材料数量。若能找到同日其他记录，也许能够补回身份。"],"choices":[{"key":"①","text":"与周执按时辰查找当日其他领用册页。","condition":"","stable":"","body":["我与周执调出同一日的库房交接册。\n\n空印出现前一刻，有人领走四块问天石；半个时辰后，又以另一枚印记归还了一只空木箱。\n\n两枚印记外圈纹路相同，显然出自同一套旧印。\n\n周执将两笔账并在一处。\n\n“名字刮了，印纹还在。把同日的册页并起来，至少能找出这枚印从哪里来。”"],"effects":["【周执信任＋1】","【获得线索：同纹旧印】"],"heading":"查找同日记录"},{"key":"②","text":"使用【拓纹纸】，拓下空印残留的边缘纹路。","condition":"持有拓纹纸","stable":"","body":["我将拓纹纸覆在账页上，只以微弱灵气引出纸面凹痕。\n\n印记中央虽已被刮去，右下角仍留着半片山形纹样。"],"effects":["【拓纹纸－1】","【获得物品：空印拓样】"],"heading":"拓下空印"},{"key":"③","text":"使用【空白木签】，将相关材料与账页分别标记。","condition":"持有空白木签","stable":"","body":["我把问天石、水纹铜和聚灵草分别写上木签，再标明对应年份与领用次数。\n\n混在数十页账目中的材料去向逐渐清楚起来。"],"effects":["【空白木签－3】","【宗门贡献＋2】","【札记更新：旧阵材料流向】"],"heading":"分列标记"}]},{"id":"E1502","chapter":15,"title":"旧商号的铜秤","meta":{"事件类型":"墨无咎人物事件","触发地点":"灵墟坊市·废弃商号仓房","开放条件":"完成第十五章《外门旧账》，已认识墨无咎","行动消耗":"1","重复规则":"仅一次"},"intro":["废弃商号的仓房已经多年无人使用。\n\n木架上积着厚灰，墙角仍摆着一架铜秤。秤盘锈得发黑，秤杆却被擦过，刻度间还夹着一小片新蜡。\n\n墨无咎将那片蜡挑下来。\n\n“仓房废了十年，秤杆近来却有人动过。”\n\n地上留着几只空木箱，尺寸与外门运送水纹铜的货箱相近。若这里曾被重新启用，经手人很可能借旧商号掩过货物来路。"],"choices":[{"key":"①","text":"请墨无咎带自己核对铜秤、木箱与旧收据。","condition":"","stable":"","body":["墨无咎先让我查看秤杆刻度。\n\n靠近五斤的位置磨损最重，与三张旧收据上记录的水纹铜重量相合。木箱底部也留着相同铜屑。\n\n“旧秤、旧箱和旧收据都能对上。”\n\n他把收据重新收入木匣。\n\n“有人图的就是一个‘旧’字。旧物摆得越齐，来路越像真的。”"],"effects":["【墨无咎好感＋1】","【获得线索：废商号称铜记录】"],"heading":"核对旧物"},{"key":"②","text":"使用【验货签】，查验秤盘上的残留物。","condition":"持有验货签","stable":"","body":["验货签贴上秤盘后，浮出浅青色水纹。\n\n盘面近来称过水纹铜，分量至少有十余斤。"],"effects":["【验货签－1】","【宗门贡献＋2】","【札记新增：旧秤水纹反应】"],"heading":"查验残留物"},{"key":"③","text":"沿仓房寻找近期出入留下的痕迹。","condition":"","stable":"","body":["我沿仓房墙角查看。\n\n后门门轴积灰较薄，门槛外还有两道车轮压痕。痕迹通往坊市西侧货道。"],"effects":["【体力－1】","【获得线索：西侧货道车辙】"],"heading":"查找出入痕迹"}]},{"id":"E1503","chapter":15,"title":"封存箱的双锁","meta":{"事件类型":"顾长清人物事件","触发地点":"主峰封存室","开放条件":"完成第十五章《外门旧账》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["外门旧账与玄水殿原始清册已经装入封存箱。\n\n箱上设有两道锁，一道使用主峰印记，一道由杂务堂保管。顾长清检查时，发现第二道锁舌比原槽短了一线。\n\n锁仍能扣住箱盖，却经不起灵气冲击。\n\n“这箱旧册往后还要反复调看。谁开过锁、在何时开，都得写在同一页上。”\n\n顾长清取出备用锁舌，又将封存记录放在案上。"],"choices":[{"key":"①","text":"与顾长清核对旧锁磨损和近期开箱记录。","condition":"","stable":"","body":["我将近期开箱时辰逐一排开。\n\n旧锁在上一次调取玄水清册前仍然完整，归还后便少了一段锁舌。那次调取由两人共同经手，其中一枚签名十分潦草。\n\n顾长清将记录单独封起。\n\n“先把上一次开箱的人找齐，再问这截锁舌落在何处。”\n\n他重新装好备用锁。\n\n“箱子锁得再严，若经手的人说不清，日后一样会成一笔糊涂账。”"],"effects":["【顾长清好感＋1】","【获得线索：封存箱锁舌缺损】"],"heading":"核对记录"},{"key":"②","text":"使用【隔灵布】，暂时包住封存箱的阵纹接缝。","condition":"持有隔灵布","stable":"","body":["我用隔灵布包住锁扣与阵纹接缝。\n\n即便有人从外侧催动灵气，封存箱也不会立刻回应。"],"effects":["【隔灵布进入占用状态】","【宗门贡献＋2】"],"heading":"包住阵纹"},{"key":"③","text":"请杂务堂重新更换双锁，并将经手人写入开箱册。","condition":"","stable":"","body":["杂务堂取来两套新锁，并让主峰、杂务堂各留一把阵钥。\n\n旧锁则连同缺损位置一起封入证物匣。"],"effects":["【宗门贡献＋3】"],"heading":"更换双锁"}]},{"id":"E1504","chapter":15,"title":"借阅木牌的背面","meta":{"事件类型":"唐知夏人物事件","触发地点":"栖云院廊下","开放条件":"完成第十五章《外门旧账》，唐知夏已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["唐知夏从旧住册夹层中找到一枚借阅木牌。\n\n木牌正面写着十五年前调取修缮副册的记录，背面却留着几道被墨涂去的字。墨色已经发灰，下面的旧字仍能透出一点笔画。\n\n“借阅人姓名应当写在背面。”\n\n她将木牌放在斜照进来的日光下。\n\n“强行刮墨会伤到木纹，只能先找原有凹痕。”"],"choices":[{"key":"①","text":"与她沿木纹辨认被覆盖的笔画。","condition":"","stable":"","body":["我与唐知夏轮换角度查看。\n\n墨层下方共有三个字，最后一字带着长竖，应当是职位或堂名。姓名仍无法辨清，开头却能看出一个“水”字旁。\n\n唐知夏将看清的部分照原样记下。\n\n“能认多少便写多少，缺处留空。”"],"effects":["【唐知夏信任＋1】","【获得线索：水旁借阅人】"],"heading":"辨认旧字"},{"key":"②","text":"使用【拓纹纸】，拓下木牌背面的凹字。","condition":"持有拓纹纸","stable":"","body":["拓纹纸贴上木牌后，凹陷笔画逐渐显出。\n\n三个字中，第二字似乎带有“令”部，仍不足以确认姓名。"],"effects":["【拓纹纸－1】","【获得物品：旧借阅牌拓样】"],"heading":"拓下凹字"},{"key":"③","text":"将木牌送往藏经阁，与旧借阅牌的书写习惯比对。","condition":"","stable":"","body":["藏经阁保存的借阅牌中，有两批木牌使用相同细笔。\n\n那批木牌曾专供主峰内院与旧阵值守弟子使用。"],"effects":["【宗门贡献＋2】","【札记新增：内院借阅木牌】"],"heading":"比对旧牌"}]},{"id":"E1505","chapter":15,"title":"旧档查验用具","meta":{"事件类型":"行装／领取事件","触发地点":"杂务堂旧档柜","开放条件":"完成第十五章《外门旧账》","行动消耗":"1","重复规则":"仅一次"},"intro":["旧档翻检开始后，杂务堂取出一批查验用具。\n\n一份是拓纹纸与纸墨，用于账页、印记和木牌；\n\n一份是空白木签与防潮纸袋，用于分类和保存旧册；\n\n一份是隔灵布与传讯纸符，用于封存异常物件和紧急传讯。\n\n值守弟子将隔灵布单独压在玉镇下，低声提醒：\n\n“取走什么，便在借物簿上写清。遇到封存旧物，只管包好送回，莫在半路拆看。”"],"choices":[{"key":"①","text":"领取摹录用具。","condition":"","stable":"","body":[],"effects":["【获得物品：拓纹纸两张】","【获得物品：纸墨一份】"],"heading":"摹录用具"},{"key":"②","text":"领取归档用具。","condition":"","stable":"","body":[],"effects":["【获得物品：空白木签三枚】","【获得物品：防潮纸袋一只】"],"heading":"归档用具"},{"key":"③","text":"领取封存传讯用具。","condition":"","stable":"","body":["第十六章《筑基之争》自由行动事件"],"effects":["【获得物品：隔灵布一块】","【获得物品：传讯纸符一张】"],"heading":"封存传讯用具"}]},{"id":"E1601","chapter":16,"title":"石阶边的碎屑","meta":{"事件类型":"谢临川人物事件","触发地点":"问天石路","开放条件":"完成第十六章《筑基之争》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["选拔结束后，问天石路暂时封闭。\n\n谢临川沿第七十二级石阶向上检查，路边散着几粒颜色发暗的石屑。定阵铜钉已经重新压紧，石阶内侧仍有一道细裂。\n\n他用刀鞘压了压裂口。\n\n“石面能承重，里面的阵路却未必稳。”\n\n裂纹附近留着两种碎屑，一种来自问天石，一种颜色更深，像是从旧阵钉上崩落。"],"choices":[{"key":"①","text":"与谢临川沿裂纹检查石阶受力和退路。","condition":"","stable":"","body":["我沿石阶内侧慢慢向上，谢临川则站在外沿观察护栏和落脚处。\n\n第七十五级石阶下方同样有一处细裂，若上方阵纹再次偏转，那里会先失去支撑。\n\n谢临川在两处留下巡查印。\n\n“遇上灵压失控，先找能退的位置。”\n\n他用刀鞘点了点完好的内侧石阶。\n\n“记住这条线。真出事时，才不会边跑边找路。”"],"effects":["【谢临川好感＋1】","【札记新增：问天石路内侧退路】"],"heading":"检查退路"},{"key":"②","text":"使用【定纹砂】，显出石阶内部的阵路裂口。","condition":"持有定纹砂","stable":"","body":["定纹砂落入石缝，很快被地下灵气带向两侧。\n\n砂线在铜钉下方断开，说明裂口仍与上次阵旗异常有关。"],"effects":["【定纹砂－1】","【宗门贡献＋2】","【获得线索：铜钉下方断纹】"],"heading":"显出裂口"},{"key":"③","text":"将两种碎屑分别收起，送往天衡峰查验。","condition":"","stable":"","body":["天衡峰确认，深色碎屑来自一枚较早更换下来的旧阵钉。\n\n新钉重新固定时，旧碎片仍留在石缝中，才让阵路无法完全闭合。"],"effects":["【宗门贡献＋2】","【札记新增：问天石路旧钉残屑】"],"heading":"查验碎屑"}]},{"id":"E1602","chapter":16,"title":"第四面资格旗","meta":{"事件类型":"裴青萝人物事件","触发地点":"外门筑基台","开放条件":"完成第十六章《筑基之争》，裴青萝已加入因缘","行动消耗":"1","重复规则":"仅一次"},"intro":["四面资格旗已经收起。\n\n裴青萝站在空出的旗座旁，反复查看自己的控灵印记。她的成绩排在第二，问天石路用时却比第一名慢了三息。\n\n“最后十级灵压突然加重。”\n\n她用剑鞘在石面画出当时的落脚位置。\n\n“若重走一次，我能快两息。”\n\n筑基资格已经确定，名次不会再改。她仍想把最后一段走顺，免得同样的迟疑带进水镜台。"],"choices":[{"key":"①","text":"与她在无灵压的石台上重演最后十步。","condition":"","stable":"","body":["我按照问天石路的间距在台上标出十处落点。\n\n裴青萝连走三遍。\n\n第一遍仍在第七步停了一瞬，第二遍已经能把灵气提前沉入丹田。到了第三遍，她顺利走过全部标记，出剑时也没有再乱。\n\n轮到我走时，她站在终点封住最短路线。\n\n“你也别把这几步忘了。”"],"effects":["【体力－1】","【裴青萝信任＋1】"],"heading":"重演十步"},{"key":"②","text":"使用【厚布护腕】，让她试验收紧手腕后的控灵。","condition":"持有厚布护腕","stable":"","body":["厚布护腕收紧以后，手腕受灵压影响小了些，控灵时却少了几分灵活。\n\n裴青萝试过两次，最终仍将护腕解下。\n\n“适合护伤，不适合我现在的剑路。”"],"effects":["【获得札记：筑基前护腕试验】","【厚布护腕不消耗】"],"heading":"试验护腕"},{"key":"③","text":"替她记录每一步的呼吸和落脚时辰。","condition":"","stable":"","body":["我站在石台边，逐一记下她的呼吸与步幅。\n\n第七步的迟疑根在换气过早，脚下反倒没有散。她将那口气压后半息，整段步法很快连贯起来。"],"effects":["【修为＋5】"],"heading":"记录步法"}]},{"id":"E1603","chapter":16,"title":"差两分的木牌","meta":{"事件类型":"林惊雨人物事件","触发地点":"筑基台休息廊","开放条件":"完成第十六章《筑基之争》，已认识林惊雨","行动消耗":"1","重复规则":"仅一次"},"intro":["林惊雨把自己的考核木牌放在膝上。\n\n控灵成绩已经达标，问天石路却因中途受困少了两分。木牌上的结果写得清楚，下一季可以直接重考后两项。\n\n她用指尖敲了敲木牌。\n\n“差两分听起来不多，放在名额前面就很碍眼。”\n\n她没有埋怨救援和阵路事故，只把问天石路的落点图重新翻出来。"],"choices":[{"key":"①","text":"陪她按原路线复盘失分位置。","condition":"","stable":"","body":["我与林惊雨从第六十级开始回想。\n\n她在灵压骤增时连续使用术法护身，虽然挡住了剑气，也让后半段体力不足。若先退到内侧石阶，再调整呼吸，消耗会少许多。\n\n林惊雨将那处位置圈起。\n\n“下次我先留力，不到最后几级不乱放术法。”"],"effects":["【林惊雨信任＋1】"],"heading":"复盘石路"},{"key":"②","text":"使用【纸墨】，替她整理下一季重试计划。","condition":"持有纸墨","stable":"","body":["我按照她下一季的时间，将修行、控灵和问天石路练习分开写好。\n\n林惊雨看过以后，又自行删去两次过密的练习。"],"effects":["【纸墨－1】","【获得札记：惊雨的重试计划】"],"heading":"整理计划"},{"key":"③","text":"将自己的控灵心得写给她参考。","condition":"","stable":"","body":["我将铜镜控灵时使用的呼吸节奏写在木牌背面。\n\n林惊雨照着试过几次，掌心灵光果然稳定了些。"],"effects":["【修为＋3】"],"heading":"分享心得"}]},{"id":"E1604","chapter":16,"title":"筑基前夜","meta":{"事件类型":"修行事件","触发地点":"栖云院静室","开放条件":"完成第十六章《筑基之争》","行动消耗":"1","重复规则":"仅一次"},"intro":["距离水镜台开放只剩数日。\n\n丹田中的灵气已经充盈，继续强行修炼也无法再增加修为。每次吐纳时，灵气都会沿经脉回转，带来轻微胀痛。\n\n筑基前更需要整理气息，避免灵气在水镜中失控。\n\n案上放着弟子令、筑基令和一盏尚未点燃的灯。"],"choices":[{"key":"①","text":"停止吸纳灵气，只做完整周天梳理。","condition":"","stable":"","body":["我没有再引外界灵气入体，只推动原有灵气沿经脉缓缓运行。\n\n每完成一个周天，丹田中的躁动便减轻一分。"],"effects":["【体力－1】","【获得状态：气息平稳】","【效果：第十七章第一次体力损耗减少1点】"],"heading":"梳理周天"},{"key":"②","text":"使用【清脉散】，缓解经脉中的胀痛。","condition":"持有清脉散","stable":"","body":["药力进入经脉后，胀痛逐渐缓和。\n\n灵气仍处于圆满状态，运转时已经不再冲撞腕脉与肩背。"],"effects":["【清脉散－1】","【体力＋3】","【获得状态：经脉舒缓】"],"heading":"服用清脉散"},{"key":"③","text":"点燃【安神香】，提前结束修行，好好休息。","condition":"持有安神香","stable":"","body":["香气在静室中散开。\n\n我将两枚令牌收好，提前结束吐纳。次日醒来时，神思清明，丹田也十分安静。"],"effects":["【安神香－1】","【体力恢复至上限】","【心魔－1】"],"heading":"安神休息"}]},{"id":"E1605","chapter":16,"title":"水镜台行囊","meta":{"事件类型":"行装／领取事件","触发地点":"主峰筑基登记处","开放条件":"完成第十六章《筑基之争》","行动消耗":"1","重复规则":"仅一次"},"intro":["水镜台开放前一日，主峰在登记处摆下三只青布行囊。袋口缀着细小水纹，里面所装之物都经过守阵弟子查验，免得外来灵气扰动镜阵。\n\n一份装有清脉散和回元露，用于筑基前后调息；\n\n一份装有安神香与隔灵布，用于应对水镜异动；\n\n一份装有纸墨、拓纹纸与传讯纸符，用于摹录和传讯。\n\n守台弟子逐一验过筑基令。\n\n“水镜台内不可擅动外物。”\n\n“所带之物会在入阵前记入名册。阵内若生异变，自有守阵弟子从外取用。”"],"choices":[{"key":"①","text":"领取调息行囊。","condition":"","stable":"","body":[],"effects":["【获得物品：清脉散一包】","【获得物品：回元露一瓶】"],"heading":"调息行囊"},{"key":"②","text":"领取安神封存行囊。","condition":"","stable":"","body":[],"effects":["【获得物品：安神香一束】","【获得物品：隔灵布一块】"],"heading":"安神封存行囊"},{"key":"③","text":"领取记录传讯行囊。","condition":"","stable":"","body":["第十七章《水镜问天》卷末余波事件\n\n以下事件在完成第十七章《水镜问天》、筑基成功并返回主峰后开放。玩家可在进入第二卷前继续完成卷末自由行动。"],"effects":["【获得物品：纸墨一份】","【获得物品：拓纹纸一张】","【获得物品：传讯纸符一张】","【开放说明】"],"heading":"记录传讯行囊"}]},{"id":"E1701","chapter":17,"title":"镜痕未散","meta":{"事件类型":"沈砚人物事件","触发地点":"水镜台外层石廊","开放条件":"完成第十七章《水镜问天》，已认识沈砚","行动消耗":"1","重复规则":"仅一次"},"intro":["水镜台已经重新封闭。\n\n石廊上残留着几道被水光冲刷过的剑痕。大部分痕迹来自阵法失控时的救援，最靠近镜门的一道却十分平直，剑锋落下以后，周围阵纹没有出现崩裂。\n\n沈砚站在石廊尽头，旧剑尚未完全归鞘。\n\n他俯身看过那道剑痕。\n\n“与旧阵石上的断引痕相似。”\n\n水镜开启时，台上曾同时出现数道剑光。眼前的痕迹也可能来自沈砚救援时的一剑，需要比对落剑方向与阵纹回流才能确认。"],"choices":[{"key":"①","text":"与沈砚沿石廊重走阵法失控时的落剑位置。","condition":"","stable":"","body":["我从自己当时站立的位置开始，依照记忆走向镜门。\n\n沈砚则沿另一侧石阶重走救援路线。他在第三道阵纹前停下，剑鞘指向地面。\n\n“我当时从这里出剑，痕迹应当向左偏。”\n\n镜门前那一道却正好相反。\n\n这意味着水镜失控时，还有另一道剑光切过阵路。\n\n沈砚收回剑鞘。\n\n“你的落脚没有错。这道剑光便另有来处。”\n\n他看向仍带水光的剑痕。\n\n“下一次再见到这一路剑痕，便不会等它落完才察觉。”"],"effects":["【沈砚好感＋1】","【获得线索：水镜中的第二道断引剑光】"],"heading":"重走落剑位置"},{"key":"②","text":"使用【拓纹纸】，拓下镜门前的完整剑痕。","condition":"持有拓纹纸","stable":"第十六章水镜台行囊，或杂务堂旧档柜","body":["我将拓纹纸压在石面上，以软炭扫出剑痕与相邻阵纹。\n\n剑锋经过阵纹交界处时，曾有一缕水灵向内回收，说明出剑者清楚水镜阵路的走向。"],"effects":["【拓纹纸－1】","【获得物品：水镜剑痕拓样】"],"heading":"拓下镜痕"},{"key":"③","text":"将剑痕位置与旧阵石的断引拓样并列记录。","condition":"","stable":"","body":["我取出旧阵石的断引拓样，与眼前剑痕逐处比对。\n\n两者收势位置相近，起剑方向却不同。它们可能出自同一套旧制剑路，也可能分别对应两名熟悉玄水阵法的人。"],"effects":["【修为＋4】","【札记更新：断引剑路】"],"heading":"并列记录"}]},{"id":"E1702","chapter":17,"title":"石栏外的水声","meta":{"事件类型":"谢临川人物事件","触发地点":"水镜台外侧石阶","开放条件":"完成第十七章《水镜问天》，已认识谢临川","行动消耗":"1","重复规则":"仅一次"},"intro":["水镜台外侧的一段石栏在混乱中裂开。\n\n裂口已经用木架围住，石阶下方却仍不断传来水声。谢临川沿护栏逐处检查，发现其中一根石柱只剩外层阵纹相连，内部已经空了一半。\n\n“下一场雨下来，它就会倒。”\n\n他将刀鞘横在石栏前，挡住经过的弟子。\n\n“先把通路改到内侧，再看下面有没有人能落脚的地方。”\n\n石阶外是云雾与深潭，修缮之前必须确定撤离路线，免得更换石柱时又有人受困。"],"choices":[{"key":"①","text":"与谢临川从石阶下方逐段确认可用的退路。","condition":"","stable":"","body":["我沿内侧石阶向下，谢临川在上方逐段敲击护栏。\n\n第六级石阶外侧已经松动，到了第九级却有一处能够容人停留的宽台。若修缮时石栏突然倒下，附近弟子可以先退到那里。\n\n谢临川记下位置，又亲自走了一遍最短路线。\n\n“退路要自己走过，光看图不够。”\n\n他把引路绳固定在内侧石柱上。\n\n“那块湿石你看见了。真要撤人，脚下少滑一步，便能多带一个人出去。”"],"effects":["【谢临川好感＋1】","【札记新增：水镜台内侧退路】"],"heading":"确认退路"},{"key":"②","text":"使用【定纹砂】，标出石柱内部空裂范围。","condition":"持有定纹砂","stable":"","body":["定纹砂沿石柱裂缝向内流动，最终在柱心空腔处停下。\n\n裂口比外面所见更深，整根石柱需要更换，不能只补表面。"],"effects":["【定纹砂－1】","【宗门贡献＋2】"],"heading":"显出空裂"},{"key":"③","text":"在内侧石阶设置临时引路木签。","condition":"","stable":"","body":["我在完好石阶旁依次插下木签，标明通行方向和封闭区域。\n\n修缮弟子到来前，水镜台外侧没有再发生误入。"],"effects":["【空白木签－2】","【宗门贡献＋2】"],"heading":"设置引路木签"}]},{"id":"E1703","chapter":17,"title":"错置的封条","meta":{"事件类型":"墨无咎人物事件","触发地点":"主峰证物室","开放条件":"完成第十七章《水镜问天》，已认识墨无咎","行动消耗":"1","重复规则":"仅一次"},"intro":["从水镜台取回的问天石封条被分成三叠。\n\n第一叠来自原有阵位，第二叠来自临时更换的石块，第三叠却找不到相合的阵位号。墨无咎把三叠封条并排放在长案上，逐一看过封蜡与裁口。\n\n“无号封条的纸与主峰常用纸相同。”\n\n他翻到封条背面。\n\n“裁口却来自商号用的窄刀。”\n\n其中一张无号封条上还残留着半枚担保印，与第十五章查到的废弃商号印记相近。"],"choices":[{"key":"①","text":"请墨无咎带自己核对封条、担保印与货栈裁纸习惯。","condition":"","stable":"","body":["墨无咎先把完整封条推到我面前。\n\n“宗门封条从中间下刀，商号为了省纸，习惯贴边裁。”\n\n无号封条边缘确实更窄，封蜡中还夹着极细铜屑。那类铜屑常见于搬运水纹铜的旧货箱。\n\n我将废商号的收据与封条并在一处。\n\n半枚担保印的山形纹样终于完整接上。\n\n墨无咎把两张纸分开封存。\n\n“印和货路都接上了。这张封条可以单独封存。”"],"effects":["【墨无咎好感＋1】","【获得线索：废商号担保印与无号封条相合】"],"heading":"核对来路"},{"key":"②","text":"使用【验货签】，查验三叠封蜡是否出自同一炉。","condition":"持有验货签","stable":"灵墟坊市管事处","body":["验货签依次贴过三叠封蜡。\n\n正常封条与临时封条使用主峰青蜡，无号封条外层虽涂成青色，内层却是坊市常用的灰蜡。"],"effects":["【验货签－1】","【获得线索：无号封条双层蜡】"],"heading":"查验封蜡"},{"key":"③","text":"按问天石阵位号重新排列全部封条。","condition":"","stable":"","body":["我按照问天石阵位、替换时辰和封条裁口重新排序。\n\n无号封条正好对应两块曾被错置的问天石，其中一块便在第十六章出现过阵纹偏转。"],"effects":["【宗门贡献＋2】","【札记更新：错置问天石封条】"],"heading":"重排封条"}]},{"id":"E1704","chapter":17,"title":"第九名简","meta":{"事件类型":"顾长清人物事件","触发地点":"主峰内院","开放条件":"完成第十七章《水镜问天》，已认识顾长清","行动消耗":"1","重复规则":"仅一次"},"intro":["水镜台恢复平静以后，镜面曾短暂浮出九枚名简。\n\n前八枚与玄水旧殿石刻中的八道人影相合，第九枚却只显出背面。顾长清将水镜记录、旧籍拓本和玄水殿原始清册一同摊开。\n\n清册上的入殿人数只有八人。\n\n“第九名简或许从未写入清册，也可能在事后被人抽走。”\n\n他把几份材料按时间排开。\n\n“先把三份旧录的先后排清，再看哪一页曾被后人动过。”"],"choices":[{"key":"①","text":"与顾长清从纸张、用印和记录时辰判断材料先后。","condition":"","stable":"","body":["我先看清册的纸色与装订线，再核对拓本上的旧制用字。\n\n玄水殿原始清册最早，旧籍石刻稍晚，水镜记录则来自当日。清册末页有重新装订的痕迹，正好少了一页应有的页码。\n\n顾长清把三份材料分别封好。\n\n“第九人究竟是谁，眼下还落不了笔。”\n\n他在对照记录末尾写下“缺页一张”。\n\n“先把缺页和次序写清。余下的，等找到下一份旧录再往下写。”"],"effects":["【顾长清好感＋1】","【获得线索：玄水清册末页缺失】"],"heading":"判断先后"},{"key":"②","text":"使用【纸墨】，制作一份不补写缺口的对照册。","condition":"持有纸墨","stable":"","body":["我将八道人影、九枚名简与清册页码分别列开。\n\n缺失处全部留白，只标明材料来源和发现时辰。"],"effects":["【纸墨－1】","【获得物品：玄水名简对照册】"],"heading":"制作对照册"},{"key":"③","text":"前往灵鉴台，查找旧籍名简是否留有同样背纹。","condition":"","stable":"","body":["灵鉴台保存的旧名简中，有数枚背面带着相似水纹。\n\n其中一枚名简的姓名与入册年份都被封住，只能看见末端留下的“旧籍”二字。"],"effects":["【宗门贡献＋2】","【札记新增：灵鉴台水纹旧简】"],"heading":"查找背纹"}]},{"id":"E1705","chapter":17,"title":"筑基后的第一息","meta":{"事件类型":"卷末修行事件","触发地点":"栖云院静室","开放条件":"完成第十七章《水镜问天》，筑基成功","行动消耗":"1","重复规则":"仅一次"},"intro":["回到栖云院时，天色已经入夜。\n\n屋内的陈设仍与入门时相同，案边却多了筑基令、水镜记录和数册写满批注的札记。丹田中的灵气已经凝成更稳定的气旋，每一次呼吸都比炼气期更深。\n\n新生经脉尚未完全适应筑基后的灵力。\n\n灵气运转过快，腕脉会隐隐发胀；压得太慢，又会在丹田边缘积成滞流。\n\n窗外传来药圃水渠的轻响。我在蒲团上坐下，准备完成筑基后的第一次正式吐纳。"],"choices":[{"key":"①","text":"不借外物，依照新的灵气节律完成一个周天。","condition":"","stable":"","body":["我收拢心神，让灵气沿新扩展的经脉缓缓前行。\n\n最初几次转折仍显生涩，运行到丹田时也会轻轻震动。等到第一个完整周天结束，屋外水声已经与呼吸渐渐合在一处。\n\n我睁开眼，掌心灵光比从前更加凝实。"],"effects":["【体力－1】","【修为＋8】","【获得卷末状态：筑基初定】"],"heading":"完成新周天"},{"key":"②","text":"使用【清脉散】，缓和新生经脉的胀痛。","condition":"持有清脉散","stable":"","body":["清脉散的药力沿经脉化开。\n\n腕脉与肩背的胀痛逐渐减轻，筑基后的灵气也不再频繁冲撞细小支脉。"],"effects":["【清脉散－1】","【体力＋3】","【获得卷末状态：经脉调和】"],"heading":"舒缓经脉"},{"key":"③","text":"点燃【安神香】，先让水镜留下的余象彻底沉静。","condition":"持有安神香","stable":"","body":["香气在静室中缓缓升起。\n\n水镜中的九级长阶曾短暂浮现在眼前，很快又随着呼吸淡去。那枚背对镜面的第九名简仍留在记忆里，却没有继续牵动心神。"],"effects":["【安神香－1】","【心魔－1】","【获得卷末状态：神思清明】","【第一卷小事件池完成】"],"heading":"平复余象"}]}];
