window.XM_ROMANCE_EVENTS = [{"id":"shen-01","maleKey":"shen","male":"沈砚","title":"檐下听雨","length":"长","unlock":"完成主线《后山剑声》","place":"藏书阁檐下","stage":"初识","intro":[{"speaker":"旁白","text":"午后落了雨，藏书阁檐下潮气渐重。风从书架间穿过，带来旧纸、湿木和一点松脂的气味。我摊开的剑诀被吹起半页，墨迹蹭到指侧。"},{"speaker":"旁白","text":"沈砚抱着两册旧录走上石阶。白衣沾了细雨，袖口仍干净。他从案边经过，目光在剑诀第三行停了一瞬。"},{"speaker":"沈砚","text":"这一处次序反了。"},{"speaker":"我","text":"（按住纸页）先收腕，再松肩？"},{"speaker":"沈砚","text":"先松肩。收腕要迟半息。"},{"speaker":"旁白","text":"沈砚取笔改了两个字。笔锋落得很轻，檐外雨声一密，我右腕残留的麻意又跳了一下。"},{"speaker":"沈砚","text":"今日练了几遍？"},{"speaker":"我","text":"第六遍时开始发麻。沈师兄怎么知道是右手？"},{"speaker":"旁白","text":"沈砚抬眼看我，神色很淡。那道目光停得过久，笔尖也一直悬在纸上，片刻后才被他搁回砚边。"},{"speaker":"沈砚","text":"你收剑时，右边的风声会乱。"},{"speaker":"旁白","text":"一阵潮湿墨气漫过来。我下意识偏开脸，沈砚已经换走那方松烟墨，从东架取来气味更淡的一盒。动作熟稔得近乎自然，做完后，他的手在盒盖上停了停。"},{"speaker":"我","text":"沈师兄怎么知道我不喜欢这方墨？"},{"speaker":"沈砚","text":"你方才皱眉了。"},{"speaker":"旁白","text":"沈砚说完便抱起旧录，退到檐柱另一侧。雨水隔在两人之间，他站得清冷疏远，案上的淡墨已经替我磨好。"}],"choices":[{"text":"请沈砚演示","gainAffection":true,"body":[{"speaker":"我","text":"（收起剑诀）纸上的半息很难拿准。沈师兄若有空，能示范一遍吗？"},{"speaker":"旁白","text":"沈砚接过木剑，走到雨帘边。剑锋破开坠下的水线，收势时刻意放缓，腕骨与剑柄之间的转折清楚利落。"},{"speaker":"沈砚","text":"看这里。灵气回到腕脉，再收剑。"},{"speaker":"旁白","text":"我照着练了一遍。沈砚站在三步外，只在我肩头抬高时用剑鞘轻点石面。第二遍收势，腕间的滞涩终于散开。"},{"speaker":"我","text":"这回对了吗？"},{"speaker":"沈砚","text":"对。今日到这里。"},{"speaker":"旁白","text":"闭阁钟声穿过雨幕。沈砚替我收好木剑，转身时又看了一眼我的右腕，终究只把一小瓶活络药放在案角。"}]},{"text":"记下修改要诀","gainAffection":false,"body":[{"speaker":"我","text":"（提笔改正剑诀）我先记下来，明日再照着练。"},{"speaker":"旁白","text":"风把纸角掀起，沈砚伸手压住。他圈出腕脉易滞的三处，笔锋停在第四处，最后收了回去。"},{"speaker":"沈砚","text":"练到第五遍便停。右腕发热时敷冷巾。"},{"speaker":"旁白","text":"我写完抬头，沈砚已走到还书台。案边留下的活络药尚带着他掌心的微温。"}]},{"text":"先用木剑试练","gainAffection":false,"body":[{"speaker":"我","text":"（拿起案边木剑）我在这里试两遍。沈师兄听见不对，再提醒我。"},{"speaker":"旁白","text":"沈砚停在檐下，未曾走近。第一遍剑声发紧，他用指节在剑鞘上敲了一下；第二遍顺畅许多，雨水也恰好缓下来。"},{"speaker":"沈砚","text":"肩背放松了。收剑仍快。"},{"speaker":"旁白","text":"我准备再练，沈砚已经把木剑按回架上。"},{"speaker":"沈砚","text":"腕脉在抖。回去热敷。"},{"speaker":"旁白","text":"他抱着旧录走下石阶。积水最深的那一级，不知何时多了一块干燥木板。"}]}]},{"id":"shen-02","maleKey":"shen","male":"沈砚","title":"竹影入定","length":"短","unlock":"完成主线《百草外巡》及事件《檐下听雨》","place":"栖云院竹廊","stage":"初识","intro":[{"speaker":"旁白","text":"百草园外巡后的第三夜，栖云院仍浮着淡淡药腥。竹叶刮过窗纸，细碎声响总让我想起泽角兽撞断围栏的那一刻。"},{"speaker":"旁白","text":"巡夜脚步从院外经过，隔了一会儿，又沿原路折回。沈砚停在竹廊尽头，手中提着一盏未点亮的灯。"},{"speaker":"沈砚","text":"肩颈的灵气散不开。"},{"speaker":"我","text":"（松开掐得发白的指尖）我知道。可一停下来，脑子里更乱。"},{"speaker":"旁白","text":"沈砚把灯放在廊柱旁，取下被风吹得乱响的铜铃。院外钟声随夜雾传来，沉沉落在竹林深处。"},{"speaker":"沈砚","text":"听钟声。下一声到来以前，只管呼吸。"},{"speaker":"我","text":"若我又想起围栏断开的声音呢？"},{"speaker":"沈砚","text":"睁眼。廊下是竹声。"},{"speaker":"旁白","text":"沈砚说完退回廊口，身影停在灯照不到的地方。竹叶仍响，药腥渐渐被夜风吹散，我终于分清了此刻与那一日。"},{"speaker":"旁白","text":"沈砚腰间的剑穗偶尔擦过衣料，发出极轻的沙沙声。那声音始终停在原处，让人知道廊口的人尚未离开。"}],"choices":[{"text":"请沈砚同坐","gainAffection":true,"body":[{"speaker":"我","text":"（往旁边挪开一只蒲团）沈师兄能多留一会儿吗？等我把这一轮气息走完。"},{"speaker":"沈砚","text":"我陪你等。"},{"speaker":"旁白","text":"沈砚在廊口坐下，距离仍隔着几步。每当我的呼吸乱起来，剑鞘便在石面轻响一声。天边泛白时，我睁开眼，他肩头覆着一层薄露。"},{"speaker":"我","text":"你整夜都在这里？"},{"speaker":"沈砚","text":"巡夜还未结束。"},{"speaker":"旁白","text":"他说得平淡，起身时腿脚分明僵了一瞬。蒲团旁放着一盏淡茶，温度正好入口。"}]},{"text":"独自重新入定","gainAffection":false,"body":[{"speaker":"我","text":"我想自己再试一次。沈师兄去巡夜吧。"},{"speaker":"旁白","text":"沈砚将铜铃系紧，又把廊门留出一道透气的缝。"},{"speaker":"沈砚","text":"心跳过快就停下。"},{"speaker":"旁白","text":"脚步声沿石径远去。半刻钟后，院墙外传来剑鞘轻碰石栏的声音，他巡到附近时放慢了脚步。"}]},{"text":"今夜先行歇息","gainAffection":false,"body":[{"speaker":"我","text":"今夜先歇息。强行入定，只会让经脉更乱。"},{"speaker":"旁白","text":"沈砚点头，把未点亮的灯提到房门外，又移开气味过重的安神香。"},{"speaker":"沈砚","text":"窗留半扇。竹风能散药气。"},{"speaker":"旁白","text":"我合门前回头，沈砚已走过月洞门。廊灯被他添了灯油，暖光稳稳落在门槛上。"}]}]},{"id":"shen-03","maleKey":"shen","male":"沈砚","title":"丹房夜守","length":"长","unlock":"完成主线《忘却之夜》","place":"丹房外廊","stage":"相熟","intro":[{"speaker":"旁白","text":"丹房内药炉低鸣，定魂香的苦甜气息从门缝里漫出来。阿阮睡得很浅，偶尔在梦中轻声喊疼。我守在外廊，掌心沾着冷透的药水。"},{"speaker":"旁白","text":"沈砚从第四阵眼回来，衣摆带着湿泥。他把三只装有香灰、阵砂与碎石的瓷盏排在案上，随后将一杯温水放到我右手边。"},{"speaker":"沈砚","text":"阿阮的魂息稳住了。子时换一次药。"},{"speaker":"我","text":"她醒来后一直问，那段记忆会不会回来。沈师兄觉得，今夜要告诉她多少？"},{"speaker":"旁白","text":"药炉里的水翻滚起来。沈砚垂眼检查阵砂，指尖拨开其中一粒颜色过深的碎石。"},{"speaker":"沈砚","text":"等她醒稳。先问哪里疼。"},{"speaker":"我","text":"若她仍追问呢？"},{"speaker":"沈砚","text":"把查清的部分告诉她。其余的，等证据。"},{"speaker":"旁白","text":"沈砚将三份记录分开，亲眼查到的写入正页，仍有疑处的留在纸边。笔尖划过纸面，沙沙声盖住了屋内的梦呓。"},{"speaker":"我","text":"我怕自己说错，让她更难受。"},{"speaker":"旁白","text":"沈砚停了停，将换药的沙漏移到我最容易看见的位置。灯影落在他眉眼间，清冷得像檐外新雪。"},{"speaker":"沈砚","text":"我在外面。拿不准时，叫我。"},{"speaker":"旁白","text":"他低头继续核对阵砂，话只说到这里。门内传来被褥轻响，沈砚已经起身添好温水。"},{"speaker":"我","text":"（翻看他带回的查阵记录）这几页字迹深浅不同。沈师兄查了很久？"},{"speaker":"沈砚","text":"从日落到现在。阵砂换过位置，夜里更容易看清。"},{"speaker":"旁白","text":"他手背被阵砂磨出细小伤口，袖口也结着一层干泥。温水只备了一杯，放在我惯用的右手边。"},{"speaker":"我","text":"沈师兄自己喝什么？"},{"speaker":"沈砚","text":"丹房有水。"},{"speaker":"旁白","text":"我又取一只杯子，把温水分成两份。沈砚看着推到面前的半杯，停了片刻才接过去。药炉的热汽从两盏杯口升起，外廊终于添了一点暖意。"}],"choices":[{"text":"与沈砚一同守夜","gainAffection":true,"body":[{"speaker":"我","text":"（看了一眼将尽的沙漏）今夜一起守吧。阿阮醒来时，多一个人也好照应。"},{"speaker":"旁白","text":"沈砚抬眸看我，目光在我发白的指尖停了一瞬。檐外风声渐紧，他起身将窗缝推严。"},{"speaker":"沈砚","text":"你守里面。我守外廊。"},{"speaker":"我","text":"隔着一道门，也算一起守？"},{"speaker":"沈砚","text":"你叫我，我听得见。"},{"speaker":"旁白","text":"沙漏落尽，沈砚轻敲门框提醒我换药。他稳稳托住药盏，等我接牢才松手。整夜里，外廊翻动记录的声音始终未断。"}]},{"text":"先查定魂香","gainAffection":false,"body":[{"speaker":"我","text":"（取出阿阮枕边的纸条）明日从哪里查起？"},{"speaker":"沈砚","text":"定魂香出自丹房，碎阵砂来自第四阵眼。两处都查。"},{"speaker":"旁白","text":"他在纸上标出三条路，又把最危险的阵眼圈在自己名下。"},{"speaker":"我","text":"这一处也算我一份。"},{"speaker":"旁白","text":"沈砚看了我一眼，将圆圈划开一半，添上会合的时辰。"}]},{"text":"回屋照看阿阮","gainAffection":false,"body":[{"speaker":"我","text":"我回屋守着阿阮。她醒来时，熟悉的人在身边会安稳些。"},{"speaker":"沈砚","text":"子时到了，我敲门。"},{"speaker":"旁白","text":"沈砚把外廊灯调暗，坐到迎风的廊角。定魂香散尽后，屋里只剩阿阮平缓的呼吸；门外偶尔响起翻动记录的轻声。"}]}]},{"id":"shen-04","maleKey":"shen","male":"沈砚","title":"一碟桂花糕","length":"短","unlock":"完成主线《山庄来信》","place":"灵膳堂","stage":"相熟","intro":[{"speaker":"旁白","text":"灵膳堂午时人声嘈杂，蒸笼掀开时，米香与桂花甜气一同涌到门边。沈砚独坐在临窗一桌，长剑横在外侧，恰好隔开来往的人群。"},{"speaker":"旁白","text":"我端着饭食走近，他将剑鞘收了半寸。桌边摆着一只纸包，热气把纸面洇出浅浅油痕。"},{"speaker":"我","text":"（坐下后打开纸包）边角烤黄的桂花糕。沈师兄也喜欢这一种？"},{"speaker":"沈砚","text":"给你留的。"},{"speaker":"我","text":"你怎么知道我会来？"},{"speaker":"沈砚","text":"山庄回来后，你三日都在这个时辰用饭。"},{"speaker":"旁白","text":"沈砚把淡茶推到我手边，动作做到一半忽然停住。他垂眼看着茶盏，片刻后收回手，目光转向窗外。"},{"speaker":"我","text":"连茶也是淡的。"},{"speaker":"沈砚","text":"浓茶伤胃。"},{"speaker":"旁白","text":"堂内木勺碰着陶碗，声音清脆。沈砚低头用饭，侧脸疏淡，纸包里最软、最热的几块全留在我这一边。"}],"choices":[{"text":"与沈砚分食","gainAffection":true,"body":[{"speaker":"我","text":"（把纸包推回桌子中央）沈师兄陪我吃一块吧。膳堂做得太多，我带回去也会变硬。"},{"speaker":"旁白","text":"沈砚看着那碟糕点，取了最小的一块。碎桂花落在袖口，我伸手拂去，他的肩背微微一僵，又很快放松。"},{"speaker":"沈砚","text":"这一炉比上一炉甜。"},{"speaker":"我","text":"沈师兄还记得上一炉？"},{"speaker":"旁白","text":"沈砚垂眸喝茶。窗外日光落在他睫上，照出一瞬难言的寂静。"},{"speaker":"沈砚","text":"我一直记得。"},{"speaker":"旁白","text":"他把余下半块放回纸包，推到我面前。人群散去许久，沈砚才起身离席。"}]},{"text":"带回去分给阿阮","gainAffection":false,"body":[{"speaker":"我","text":"阿阮今日守在丹房。我带回去同她分着吃。"},{"speaker":"旁白","text":"沈砚请膳堂弟子添了一层防潮纸，又从旁边挑出一块火候稍轻的。"},{"speaker":"沈砚","text":"这一块软些，给阿阮。"},{"speaker":"旁白","text":"我想问他何时留意过阿阮的口味，沈砚已经提剑走进堂外明亮的日光里。"}]},{"text":"只取一块尝味","gainAffection":false,"body":[{"speaker":"我","text":"（取出最上面一块）我尝这一块就够了，午后还要练剑。"},{"speaker":"旁白","text":"桂花糕入口温软，边角微脆。沈砚把淡茶移近，另将纸包重新折好。"},{"speaker":"沈砚","text":"剩下的放在栖云院小厨房。夜里饿了再吃。"},{"speaker":"旁白","text":"他说出小厨房的位置时毫无迟疑。我抬头看去，沈砚已经避开视线，手中茶水一口未动。"}]}]},{"id":"shen-05","maleKey":"shen","male":"沈砚","title":"半局残棋","length":"长","unlock":"完成主线《人间灯火》","place":"藏书阁外亭","stage":"相熟","intro":[{"speaker":"旁白","text":"山雨初歇，藏书阁外亭仍浸着凉意。松针贴在石阶上，檐角的水一滴一滴落进铜盆。沈砚坐在亭内晾晒旧棋谱，半局残棋摆在手边。"},{"speaker":"旁白","text":"我踏上最后一级石阶，他将对面的棋盒移开。白子已经落定，给黑棋留着一道窄口。"},{"speaker":"我","text":"（在对面坐下）这局是在等人吗？"},{"speaker":"沈砚","text":"在等雨停。"},{"speaker":"我","text":"那我接着下，不算打扰吧？"},{"speaker":"沈砚","text":"你落子吧。"},{"speaker":"旁白","text":"黑子触到棋盘，我迟迟未放。沈砚看着中腹，指尖在白子旁停住，最终收回袖中。"},{"speaker":"沈砚","text":"你想走右侧。"},{"speaker":"我","text":"右侧看着安全。沈师兄为何笃定？"},{"speaker":"沈砚","text":"你遇到太安静的路，会先疑心。"},{"speaker":"我","text":"（抬眼看他）我们认识还不算久。"},{"speaker":"旁白","text":"铜盆里的水声忽然清晰起来。沈砚神色未变，白子夹在指间，许久才落下。"},{"speaker":"沈砚","text":"你的习惯很好认。"},{"speaker":"旁白","text":"我转走中腹，棋势果然活了。山雾漫过栏杆，沈砚坐在雾色另一端，白衣与雾气相接，眉眼越发清冷。"},{"speaker":"旁白","text":"棋盘旁的茶已经凉了。山雾越过栏杆，潮气凝在沈砚的睫上，他垂眸看着棋局，白子停在清瘦的指间。"},{"speaker":"我","text":"沈师兄每一步都要想这么久？"},{"speaker":"沈砚","text":"这一局要。"},{"speaker":"我","text":"因为我的棋路难猜？"},{"speaker":"旁白","text":"沈砚抬眼，神色仍淡。白子在棋盘边轻轻一触，最终落在给黑棋留有余地的位置。"},{"speaker":"沈砚","text":"你的棋路总会多留一条。"},{"speaker":"旁白","text":"亭外水声清亮，他已经收回目光，仿佛方才只说了一句寻常的棋话。"}],"choices":[{"text":"与沈砚再下一局","gainAffection":true,"body":[{"speaker":"我","text":"（把棋子重新分开）这一局被你提醒过，不能算。再下一局，沈师兄别让我。"},{"speaker":"沈砚","text":"好。你先手。"},{"speaker":"旁白","text":"第二局落子很慢。沈砚看得出我的每一次犹豫，始终等到棋子真正落稳才应手。闭阁钟响时，棋盘仍剩半角。"},{"speaker":"我","text":"又要留到下回了。"},{"speaker":"旁白","text":"沈砚取纸描下棋位，连我无意放歪的一枚黑子也照原样记下。"},{"speaker":"沈砚","text":"下回从这里续。"},{"speaker":"旁白","text":"我收起黑子时碰到他的指尖，微凉触感转瞬分开。沈砚将那张棋谱折好，压进棋盒最上层，留待下回续局。"}]},{"text":"请沈砚拆解残局","gainAffection":false,"body":[{"speaker":"我","text":"我想看清中腹为何能活。沈师兄从前面三步讲起吧。"},{"speaker":"旁白","text":"沈砚逐一复原棋势，讲得简短，也肯等我追问。说到右侧诱局时，他看了一眼我的落子习惯。"},{"speaker":"沈砚","text":"这一手太急。下回看清再落子。"},{"speaker":"旁白","text":"雨水滴尽，残局也拆完了。沈砚将另一条破局路写在棋谱背面，留给我自行推演。"}]},{"text":"将棋局留待改日","gainAffection":false,"body":[{"speaker":"我","text":"今日静不下心。残局留着，改日再来。"},{"speaker":"旁白","text":"沈砚用棋盒压住棋谱，未问缘由。他将自己的茶换到下风处，把尚温的那盏留在我面前。"},{"speaker":"沈砚","text":"坐一会儿也好。"},{"speaker":"旁白","text":"沈砚提剑离亭，石阶上的湿叶已被剑鞘拨开。亭中只余松香与茶气，我的位置恰好避开山风。"}]}]},{"id":"shen-06","maleKey":"shen","male":"沈砚","title":"旧殿之后","length":"短","unlock":"完成主线《旧殿留字》","place":"云泽秘境外围","stage":"向信任过渡","intro":[{"speaker":"旁白","text":"云泽营地熄灯后，溪水仍在石缝间流响。沈砚独坐下游，掌心浸在冷水里，血色顺着水纹散开。湿苔气混着淡淡铁锈味，贴在夜风中。"},{"speaker":"我","text":"（蹲到溪边，将药瓶放在石上）手给我。伤口里还有碎石。"},{"speaker":"旁白","text":"沈砚依言摊开手掌。药粉落下时，他眉眼未动，只在我碰到一道旧疤时收紧指节。"},{"speaker":"我","text":"旧殿的阵纹，你已经查到多少？"},{"speaker":"沈砚","text":"三处阵眼，两处残缺。"},{"speaker":"我","text":"掌心这道伤，也是查阵时碰到的？"},{"speaker":"旁白","text":"沈砚看向溪面。月光碎在水里，照不清他眼底的神色。"},{"speaker":"沈砚","text":"石刃割的。伤得不深。"},{"speaker":"旁白","text":"他从行囊取出一叠卷号清单，缺页、阵眼与查阅时辰都写得清楚。最旧的一张纸边已经磨白，墨迹深浅不一。"},{"speaker":"沈砚","text":"我查到的都在这里。"},{"speaker":"我","text":"为何现在才给我？"},{"speaker":"沈砚","text":"卷中出现了你的名简。你该知道。"},{"speaker":"旁白","text":"溪水漫过一块青石。沈砚收回包好的手，往后退了半步，将靠近水流的路让给自己。"}],"choices":[{"text":"约定下次同行","gainAffection":true,"body":[{"speaker":"我","text":"下一次找到旧殿，我们一同查。进去以前把路线和退路都说清。"},{"speaker":"沈砚","text":"按你说的办。"},{"speaker":"我","text":"沈砚，你也得把自己的伤算进去。"},{"speaker":"旁白","text":"沈砚低头看了一眼掌心的新布条，轻轻应声。回营要踏过湿石，他先走到水中，伸出未受伤的手。"},{"speaker":"沈砚","text":"这几块石面很滑。"},{"speaker":"旁白","text":"我握住他的手腕，越过溪流。站稳后，沈砚很快松开，掌心残留的温度被夜风吹凉。"}]},{"text":"先各自查证线索","gainAffection":false,"body":[{"speaker":"我","text":"我核对名简，你继续查残阵。三日后交换记录。"},{"speaker":"旁白","text":"沈砚把最旧的卷号清单分给我，又在背面写下藏书阁钥牌所在。"},{"speaker":"沈砚","text":"遇见封存红印，先停下。等我来看。"},{"speaker":"旁白","text":"两份记录在溪边分开。沈砚收走的那一份更薄，上面标满了险处。"}]},{"text":"暂缓追查旧殿","gainAffection":false,"body":[{"speaker":"我","text":"魂息还在发冷。我准备回宗门后再查。"},{"speaker":"沈砚","text":"先缓一缓也好。"},{"speaker":"旁白","text":"沈砚把拓纸收入防潮袋，另放进一枚定魂符。他起身走到营地外侧，步子始终落在靠近水流的一边。"},{"speaker":"沈砚","text":"今夜别单独离营。"}]}]},{"id":"shen-07","maleKey":"shen","male":"沈砚","title":"明日之前","length":"长","unlock":"完成主线《筑基之争》","place":"栖云院","stage":"信任","intro":[{"speaker":"旁白","text":"进入水镜的前一夜，栖云院早早熄了灯。校阵钟隔一刻响一次，竹影被月色压在石阶上。风里带着新磨问天石的涩味，吸进肺腑时微微发凉。"},{"speaker":"旁白","text":"沈砚送来校验过的弟子令，停在院门外。令牌下压着一张窄幅护脉符，四角磨得平整，握在手中不会割伤掌心。"},{"speaker":"沈砚","text":"水镜震动两次，退回上一阶。听见熟人的声音，先看影子。"},{"speaker":"我","text":"（把弟子令收进袖中）我记得。"},{"speaker":"旁白","text":"沈砚未走。他看着院中那盏灯，指尖轻搭剑鞘，像在等我还有什么话。"},{"speaker":"我","text":"沈砚，我有些怕。"},{"speaker":"沈砚","text":"看得出来。"},{"speaker":"我","text":"你怎么知道？"},{"speaker":"旁白","text":"竹风骤起，细叶擦过墙头。沈砚的目光落到我紧握令牌的手上。"},{"speaker":"沈砚","text":"你怕时，右手会冷。"},{"speaker":"旁白","text":"他把一只小食盒放在门槛内，桂花暖香从盒缝里透出来。淡茶装在一旁，壶身仍热。"},{"speaker":"沈砚","text":"出镜后再吃。"},{"speaker":"我","text":"若我出来得很晚呢？"},{"speaker":"沈砚","text":"我守出口。"},{"speaker":"旁白","text":"沈砚退回竹影，距门槛仍有几步。远处水镜传来低沉轰鸣，他的白衣隐在夜色中，只余剑上寒光始终未动。"},{"speaker":"旁白","text":"院里晾着明日入镜要穿的外袍，衣角被风吹得轻轻摆动。沈砚抬手加固晾绳，指尖避开衣料，只将松开的结重新系紧。"},{"speaker":"我","text":"沈砚，你已经检查三遍弟子令了。"},{"speaker":"旁白","text":"沈砚停了停，将令牌翻到背面。竹叶的影子掠过他肩背，白衣在灯下冷得近乎霜雪。"},{"speaker":"沈砚","text":"边角还有一道裂纹。"},{"speaker":"我","text":"这道裂纹不会影响入镜。"},{"speaker":"沈砚","text":"会磨伤手。"},{"speaker":"旁白","text":"他取出细砂，将那处微小的毛边一点点磨平。校阵钟再次响起，沈砚把令牌递来，指尖仍避开我的掌心。"}],"choices":[{"text":"请沈砚陪我走走","gainAffection":true,"body":[{"speaker":"我","text":"（走下石阶）陪我沿竹廊走一圈吧。我想说说出镜以后要做的事。"},{"speaker":"旁白","text":"沈砚沉默片刻，转身与我并肩。我们走过药圃与练剑坪，我说起第九名简、想学的术法，也说起筑基后想看的江河。"},{"speaker":"旁白","text":"沈砚听得很安静。我的步子快时，他便快半步；走到湿滑石阶前，他先停下来，让我自己看清脚下。"},{"speaker":"我","text":"沈砚，你觉得我能走到那里吗？"},{"speaker":"沈砚","text":"你能走到。"},{"speaker":"我","text":"答得这么快？"},{"speaker":"沈砚","text":"我看过你的剑。你不会停在这里。"},{"speaker":"旁白","text":"校阵钟响过最后一遍。回到院门时，沈砚将护脉符放进我掌心，指尖尚未触到便已收回。"}]},{"text":"独自在院中静坐","gainAffection":false,"body":[{"speaker":"我","text":"我想独自在院里坐一阵。"},{"speaker":"沈砚","text":"我在院外等。"},{"speaker":"旁白","text":"沈砚把食盒与护脉符留在石阶上，转身走到院外。竹叶被风吹得急响，墙外的剑穗偶尔擦过衣料，声音很轻。"},{"speaker":"旁白","text":"灯芯将尽时，一枚新灯芯从门缝下递了进来。沈砚始终守着我想要的安静，也守在我唤一声便能听见的地方。"}]},{"text":"继续询问水镜","gainAffection":false,"body":[{"speaker":"我","text":"（摊开空白纸页）把常见幻象再讲一遍吧。进镜后，我怕自己想不起来。"},{"speaker":"旁白","text":"沈砚站在案边，写下声音、影子与魂息的辨认方法。话很少，每一处退路都标得清楚。"},{"speaker":"我","text":"这些是水镜教习说过的？"},{"speaker":"旁白","text":"沈砚停了停，将纸页翻到背面，又补上一条辨认阵门的办法。"},{"speaker":"沈砚","text":"教习讲过大半。阵纹变化是今夜新测的。"},{"speaker":"旁白","text":"纸上最后一行写着：若灯火全灭，向有风的地方走。沈砚将笔搁下，独自留下那张写满退路的纸。"}]}]},{"id":"shen-08","maleKey":"shen","male":"沈砚","title":"此生之名","length":"短","unlock":"完成主线《第九归者》","place":"栖云院院门","stage":"信任","intro":[{"speaker":"旁白","text":"水镜关闭时，山间将明。冷雾沿石阶漫上栖云院，草叶凝着露水，鞋底踏过去会发出细碎轻响。沈砚站在院门外，肩头湿了一片。"},{"speaker":"旁白","text":"他把疗伤药递来，另有一包桂花糕。纸包贴在掌心，仍带着暖意。"},{"speaker":"我","text":"（接过纸包）你在这里站了多久？"},{"speaker":"沈砚","text":"从水镜开门起。"},{"speaker":"我","text":"中途也不曾离开？"},{"speaker":"沈砚","text":"换过一次药。"},{"speaker":"旁白","text":"沈砚回答得平静，嗓音比往日更哑。我说起黑色石阶、第九枚名简，还有名简上重叠的两道灵印。晨雾从两人之间缓缓流过。"},{"speaker":"我","text":"其中一道灵印与你的剑意很像。沈砚，你知道原因吗？"},{"speaker":"旁白","text":"沈砚握着药瓶，指节一点点发白。远处晨钟响起，他眼中的寒意散开一瞬，露出整夜未眠的倦色。"},{"speaker":"沈砚","text":"头还疼得厉害吗？"},{"speaker":"我","text":"有一点。更多的是难过。"},{"speaker":"旁白","text":"沈砚抬手，像要碰一碰我的额头。指尖停在半空，最后只替我拂去发间一片湿叶。"},{"speaker":"沈砚","text":"先回屋歇一会儿。"},{"speaker":"我","text":"那道灵印呢？"},{"speaker":"旁白","text":"晨光越过院墙，落在他的白衣上。沈砚垂下眼，停了停才回答。"},{"speaker":"沈砚","text":"我会查清。"},{"speaker":"我","text":"查到以后会告诉我吗？"},{"speaker":"沈砚","text":"查清以后，我会告诉你。"},{"speaker":"旁白","text":"桂花香从纸包里升起，温热得让人鼻尖发酸。沈砚仍站在门外，清冷的身影近在晨雾里，进院的一步始终留给我决定。"}],"choices":[{"text":"从今共同追查","gainAffection":true,"body":[{"speaker":"我","text":"（握紧纸包，站到门槛边）名简与灵印，我们一起查。沈砚，你查到的线索也告诉我。"},{"speaker":"旁白","text":"沈砚看着我，晨雾在他身后渐渐散开。那双眼依旧清冷，他最终取出一枚空白木签。"},{"speaker":"沈砚","text":"好。你问，我答。"},{"speaker":"我","text":"若有些话很难说呢？"},{"speaker":"沈砚","text":"难说也会回答。"},{"speaker":"旁白","text":"我们隔着门槛写下第一行：第九名简，仍待查证。沈砚把笔交给我，自己站在一旁。写下此生姓名的人始终是我。"},{"speaker":"旁白","text":"纸页收好后，我侧身让出进院的路。沈砚停了一瞬，终于跨过门槛，把温茶放在案上。"}]},{"text":"先去查阅旧录","gainAffection":false,"body":[{"speaker":"我","text":"我想先读完封存记录。等线索更清楚，再来问你。"},{"speaker":"沈砚","text":"藏书阁东库，第三列。钥牌午后在我这里。"},{"speaker":"旁白","text":"沈砚把卷号写在纸包背面，连残页被裁去的方向也标了出来。他停笔后将纸推给我，未替我决定先读哪一册。"},{"speaker":"沈砚","text":"看累了便停，明日再查。"}]},{"text":"暂且稳固境界","gainAffection":false,"body":[{"speaker":"我","text":"我今日不想再追问。先让我把水镜里的事放一放。"},{"speaker":"沈砚","text":"今日先不追问。"},{"speaker":"旁白","text":"沈砚替我推开院门，将药瓶与淡茶放在石桌上。他退回门外前，把被露水打湿的剑穗拧干。"},{"speaker":"我","text":"你也回去歇息。"},{"speaker":"沈砚","text":"看你进屋，我就走。"},{"speaker":"旁白","text":"我回身合门时，沈砚仍站在晨光里。门扇落下后，外面的脚步才缓缓远去。"}]}]},{"id":"xie-01","maleKey":"xie","male":"谢临川","title":"山路重逢","length":"长","unlock":"完成主线《百草外巡》","place":"百草谷山道","stage":"久别重逢","intro":[{"speaker":"旁白","text":"百草谷刚下过雨，石阶间积着浅水。远处传来巡防弟子的短哨，一长两短，紧接着是妖兽撞动灌木的闷响。"},{"speaker":"旁白","text":"我背着药篓赶到岔路时，一道人影从坡上跃下。谢临川落地便转身护住后方采药弟子，刀背一横，将冲出草丛的獠兽逼回警戒线内。"},{"speaker":"谢临川","text":"西边围栏开了口，伤员已经送走。你们沿白石标往回走，别碰地上的赤藤。"},{"speaker":"旁白","text":"谢临川交代完巡防，抬头看见我。山风卷着青草与泥土气扑过来，他眉眼一下亮了，方才沉稳的神情转眼化成藏不住的笑。"},{"speaker":"谢临川","text":"师姐！真的是你。"},{"speaker":"我","text":"（扶住差点被他撞歪的药篓）你先站稳。方才还在巡防，这么跑过来做什么？"},{"speaker":"谢临川","text":"我看见你了，总不能装作没看见。"},{"speaker":"旁白","text":"谢临川笑得很开心，伸手接过我肩上的药篓，又低头检查我衣摆沾到的赤藤汁。确认皮肤完好，他才松了口气。"},{"speaker":"谢临川","text":"你还是喜欢往最难走的地方钻。幸好这回我就在谷里。"},{"speaker":"我","text":"我也没想到会在这里遇见你。你何时进的太清宗？"},{"speaker":"谢临川","text":"比你早一年。原想等巡防结束再去找你，今日先碰上了，算我运气好。"},{"speaker":"旁白","text":"后方又响起短哨。谢临川立刻回头辨清方向，把药篓稳稳放到路边干石上。"},{"speaker":"谢临川","text":"东坡在叫人。我去一趟，很快回来。师姐在白石标内等我，别走到雾里。"},{"speaker":"旁白","text":"他说完奔向东坡，片刻后背着扭伤脚踝的弟子回来。额前碎发全被雨水打湿，见我仍在原地，他又弯起眼睛。"}],"choices":[{"text":"与谢临川同路","gainAffection":true,"body":[{"speaker":"我","text":"（取出药布替他擦去手背血迹）我陪你送伤员。等交接完，再慢慢说这一年的事。"},{"speaker":"谢临川","text":"好。师姐走我右边，路上那道泥沟很深。"},{"speaker":"旁白","text":"谢临川背稳伤员，脚下每一步都踩得扎实。经过窄坡时，他仍能空出一只手替我拦开湿漉漉的树枝。"},{"speaker":"我","text":"你在巡防队过得怎么样？"},{"speaker":"谢临川","text":"忙是真忙，学会的东西也多。等回了谷口，我把新画的撤离图给你看。"},{"speaker":"旁白","text":"伤员交到医修手中后，谢临川才靠着木柱喘气。见我打开水囊，他很自然地俯身凑近。"},{"speaker":"谢临川","text":"好师姐，给我喝一口吧。我方才跑得嗓子都干了。"},{"speaker":"旁白","text":"我把水囊递过去。谢临川喝完仍舍不得走，又陪我把整篓药材送进百草园，沿途说了许多宗门里的新鲜事。"}]},{"text":"请他先送药篓","gainAffection":false,"body":[{"speaker":"我","text":"你先带伤员回去。我把这篓药送到采药点，再去巡防营找你。"},{"speaker":"谢临川","text":"那我在营门口等。白石标有两处被雨冲歪了，师姐只沿挂着青绳的路走。"},{"speaker":"旁白","text":"谢临川背着伤员走出几步，又回头朝我挥手。林间哨音响起，他很快收起笑意，稳稳答了巡防暗号。"}]},{"text":"约好改日再叙","gainAffection":false,"body":[{"speaker":"我","text":"阿阮还在前面采药，我得先去接她。晚些再说话。"},{"speaker":"谢临川","text":"我送你到岔路。东坡刚有妖兽经过，别单独走。"},{"speaker":"旁白","text":"谢临川提起药篓走在前面，把新鲜爪印逐一指出。看见阿阮的身影后，他才把药篓还给我。"},{"speaker":"谢临川","text":"晚上若不累，来巡防营找我。我把从故城带来的米糕留给你。"}]}]},{"id":"xie-02","maleKey":"xie","male":"谢临川","title":"灯市旧约","length":"短","unlock":"完成主线《灵墟初市》及事件《山路重逢》","place":"灵墟灯街","stage":"重新熟络","intro":[{"speaker":"旁白","text":"灵墟灯街挤满行人，糖桂香混着灯油气在风里打转。巡防队临时加派人手，谢临川刚替一名走散的孩子找到家人，又被桥头商贩叫去扶摇晃的灯架。"},{"speaker":"我","text":"（替他按住灯架底座）这里我守着，你去桥下看看。方才有人喊木板松了。"},{"speaker":"谢临川","text":"我吹三声短哨就回来。师姐听见以后，往桥内侧站。"},{"speaker":"旁白","text":"谢临川钻进人群，没过多久，桥下传来木楔敲紧的声音。第三声短哨落下，他果真从另一头跑回，先看我的肩背和手腕，再扶正灯架。"},{"speaker":"谢临川","text":"等久了吗？"},{"speaker":"我","text":"只到第三声。你答应得很准。"},{"speaker":"旁白","text":"谢临川听得眼睛弯起来，从袖中摸出两张被压得平整的鱼灯签。旧时故城灯会，我们也曾约好一起看完河上的最后一盏灯。"},{"speaker":"谢临川","text":"巡防换班了。旧约还算数吗？"},{"speaker":"我","text":"你连灯签都备好了，还问我？"},{"speaker":"谢临川","text":"想听师姐亲口答应。"}],"choices":[{"text":"陪他看完灯市","gainAffection":true,"body":[{"speaker":"我","text":"（接过鱼灯签）算数。走吧，河边最后一排灯该亮了。"},{"speaker":"旁白","text":"谢临川立刻笑开，挨着我走进人群。有人从侧面撞来，他抬手护住灯签，自己被撞得往前趔趄半步。"},{"speaker":"谢临川","text":"灯签保住了。师姐也在，今晚圆满。"},{"speaker":"旁白","text":"河面映着满城灯火。谢临川把外侧的位置让给自己，衣袖偶尔擦过我的手背，亲近得像分别的这一年从未横在中间。"},{"speaker":"我","text":"明年还来吗？"},{"speaker":"谢临川","text":"来。往后师姐肯来，我就陪你。"}]},{"text":"留下帮忙修灯","gainAffection":false,"body":[{"speaker":"我","text":"灯架还剩两处未查。先把巡防的事做完。"},{"speaker":"谢临川","text":"听你的。师姐替我看底座，我去上面查绳结。"},{"speaker":"旁白","text":"我们一前一后查完灯架。值守木签交出去时，河上的鱼灯已经漂远，谢临川仍把那张灯签塞进我袖中。"},{"speaker":"谢临川","text":"今日看不完，明年接着看。约定不怕晚。"}]},{"text":"先从侧巷离开","gainAffection":false,"body":[{"speaker":"我","text":"今日人太多，先送走散的孩子回去。灯会以后还有。"},{"speaker":"谢临川","text":"好，我熟悉这条街。师姐牵着孩子，我在前面开路。"},{"speaker":"旁白","text":"孩子回到家人身边时，灯市已经散去大半。谢临川买来一盏小鱼灯，放到我掌心。"},{"speaker":"谢临川","text":"大的没赶上，小的带回去。也算我们看过灯了。"}]}]},{"id":"xie-03","maleKey":"xie","male":"谢临川","title":"丹火余温","length":"长","unlock":"完成主线《丹火初燃》","place":"丹霞峰偏廊","stage":"熟稔","intro":[{"speaker":"旁白","text":"丹房的火刚压下去，偏廊仍烫得像盛夏。焦苦药味黏在衣袖上，铜炉偶尔发出收缩的脆响。谢临川领着巡防弟子封好外门，转身便朝我走来。"},{"speaker":"谢临川","text":"让我看看手。"},{"speaker":"我","text":"只是擦伤，医修已经洗过了。"},{"speaker":"旁白","text":"谢临川弯腰看了看包好的手背，确认药布边缘干净，紧绷一路的肩膀才松下来。他额角也有一道浅伤，血珠被汗水冲到鬓边。"},{"speaker":"我","text":"你自己也受伤了。坐下。"},{"speaker":"谢临川","text":"这道碰伤不碍事。方才丹炉炸开时，我在门外听见响声，心都快跳出来了。"},{"speaker":"我","text":"（用湿帕替他擦去血迹）巡防队长若看见你这副样子，大概又要罚你抄规程。"},{"speaker":"谢临川","text":"抄就抄。师姐平安出来，抄十遍也值。"},{"speaker":"旁白","text":"偏廊石阶还留着余温。谢临川挨着我坐下，手臂轻轻贴在我袖边。他跑了太久，呼吸到这时才显出疲惫。"},{"speaker":"谢临川","text":"师姐，让我靠一会儿吧。等医修出来，我再去交封门记录。"},{"speaker":"旁白","text":"他说完看着我，眼里明明带着倦意，笑意仍亮。廊外风一阵阵吹来，焦苦药味终于淡了些。"},{"speaker":"旁白","text":"医修仍在门内清点药材。谢临川闲不住，伸脚把廊下散落的碎木片拢到一旁，免得后来的人踩伤。额角刚擦净，又沁出一层细汗。"},{"speaker":"我","text":"坐着也要管门外的路？"},{"speaker":"谢临川","text":"看见了就顺手收掉。巡防时养成的习惯。"},{"speaker":"我","text":"以前你只顾往前跑，摔倒了才知道路上有石头。"},{"speaker":"谢临川","text":"所以现在先替师姐看清。小时候让你拉过我那么多回，总得长进一些。"},{"speaker":"旁白","text":"谢临川抬脚把最后一块碎木拨开，转头朝我笑。旧事落在两人之间，带来的只有熟悉与共同长大的踏实。"}],"choices":[{"text":"替谢临川上药","gainAffection":true,"body":[{"speaker":"我","text":"（放松肩膀，让他靠过来）只到医修出来。之后你的伤也要上药。"},{"speaker":"谢临川","text":"好。师姐说多久就多久。"},{"speaker":"旁白","text":"谢临川将重量收得很轻，只让额角贴住我的肩侧。安静片刻后，他又抬起我的手检查药布。"},{"speaker":"谢临川","text":"方才怕不怕？"},{"speaker":"我","text":"丹火冲过来时怕。听见你在门外应巡防暗号，就安定多了。"},{"speaker":"旁白","text":"谢临川抿住笑，眼睛愈发明亮。他靠回原处，指尖仍轻护着我受伤的手。"},{"speaker":"谢临川","text":"以后听见我的声音，就知道退路有人守着。"},{"speaker":"旁白","text":"医修推门时，谢临川立刻坐直，先把我送进去，又老实站到旁边等自己的药。"}]},{"text":"一起去药堂包扎","gainAffection":false,"body":[{"speaker":"我","text":"医修快出来了。你坐近些，我替你把额角的伤包好。"},{"speaker":"旁白","text":"谢临川低下头，方便我绕过发带缠药布。平日总停不下的人，此刻难得安静，只在我系结时轻轻吸了口气。"},{"speaker":"谢临川","text":"师姐的手还是很稳。小时候我从树上摔下来，也是你替我包的。"},{"speaker":"我","text":"那次你哭得整条巷子都听见。"},{"speaker":"谢临川","text":"这回我长大了。疼也只告诉师姐。"}]},{"text":"先回院中报平安","gainAffection":false,"body":[{"speaker":"我","text":"封门记录要紧。我们去找医修，处理完伤口再核对。"},{"speaker":"谢临川","text":"走。师姐跟在我旁边，地上还有碎丹砂。"},{"speaker":"旁白","text":"谢临川提灯照着脚下，遇见滚烫碎石便先用刀鞘拨开。记录交完后，他仍等到医修确认我的擦伤无碍，才肯坐下处理额角。"}]}]},{"id":"xie-04","maleKey":"xie","male":"谢临川","title":"风铃引路","length":"短","unlock":"完成主线《忘却之夜》","place":"第四阵眼外山径","stage":"熟稔","intro":[{"speaker":"旁白","text":"第四阵眼外的雾漫到膝上，松针与湿石气息混在一起。远处巡防哨声被雾吞得断断续续，脚下路标也只剩模糊一角。"},{"speaker":"旁白","text":"谢临川蹲在石边，把两枚小风铃分别系在我们腕上。绳结打得牢，铃舌裹着软布，平时行走不会乱响。"},{"speaker":"谢临川","text":"走散时拉一下绳结，铃才会响。师姐听见我的铃，就在原地答一声。"},{"speaker":"我","text":"若风太大，声音传错方向呢？"},{"speaker":"谢临川","text":"我认得你的声音。雾再厚也认得。"},{"speaker":"旁白","text":"谢临川说得自然，站起身检查前方地面。他用刀鞘探过每一块湿石，确定能落脚才回头示意。"},{"speaker":"我","text":"巡防规程里还教这个？"},{"speaker":"谢临川","text":"规程只教风铃。认出师姐，是我自己的本事。"},{"speaker":"旁白","text":"谢临川又取出一截红绳，系在最容易走错的岔路上。鲜亮颜色穿过白雾，回程时隔着很远也能看见。"},{"speaker":"谢临川","text":"风铃找人，红绳找路。两样都备着，心里踏实。"}],"choices":[{"text":"与他并肩探路","gainAffection":true,"body":[{"speaker":"我","text":"（握住腕间细绳）那就一起走。你探左侧，我看右侧阵痕。"},{"speaker":"谢临川","text":"好。师姐离我一臂远，跨石缝时叫我一声。"},{"speaker":"旁白","text":"风铃一路安静，彼此的脚步始终近在身侧。经过最浓的一段雾时，谢临川伸手护住我的手肘，等我站稳便松开。"},{"speaker":"旁白","text":"阵痕尽头露出断裂围栏。谢临川先封住缺口，又把回程路标钉深三寸，后来的人也能循着铃声平安下山。"}]},{"text":"留在后方接应","gainAffection":false,"body":[{"speaker":"我","text":"我留在这里记录阵痕。你沿巡线走一圈，每到一处便吹哨。"},{"speaker":"谢临川","text":"可以。听见一长一短，就是路上平安。三声短哨，我立刻回来。"},{"speaker":"旁白","text":"谢临川的身影消失在雾中，哨音始终准时传来。他回来时先亮出完整巡图，随后低头看我的风铃。"},{"speaker":"谢临川","text":"铃还在，师姐也好好的。今日巡线很顺。"}]},{"text":"先标记塌陷处","gainAffection":false,"body":[{"speaker":"我","text":"先把路标补好。雾散后再查阵痕，免得后来的人走错。"},{"speaker":"谢临川","text":"我去搬石桩，师姐写方向。这里回程更暗，字要刻深。"},{"speaker":"旁白","text":"两人沿路重立石标。谢临川手上沾满泥水，仍把我的那份干燥刻刀留在袖中护好。"}]}]},{"id":"xie-05","maleKey":"xie","male":"谢临川","title":"一袋青梅","length":"长","unlock":"完成主线《山庄来信》","place":"裴氏山庄后园","stage":"默契","intro":[{"speaker":"旁白","text":"裴氏山庄后园的雨刚停，青梅叶上挂着水珠。廊下守阵灯忽明忽暗，谢临川踩着湿草回来，怀里多了一只油纸袋。"},{"speaker":"谢临川","text":"后坡那棵老梅树还在。我问过庄丁，摘一袋不碍事。"},{"speaker":"我","text":"（接过纸袋）你怎么知道我在找这个？"},{"speaker":"谢临川","text":"方才路过梅树，你回头看了两次。小时候每到这个月份，你都要挑最青的。"},{"speaker":"旁白","text":"纸袋一开，清酸气息立刻散出来。谢临川拣出一颗最圆的，在衣袖上擦干雨水，递到我面前。"},{"speaker":"我","text":"你先尝。若酸得厉害，我就不吃了。"},{"speaker":"谢临川","text":"师姐又拿我试酸。行，我尝。"},{"speaker":"旁白","text":"谢临川咬下一口，眉头立刻皱起，仍装作若无其事地点头。雨水从檐角落下，他含着酸意看我，眼睛里全是熟悉的笑。"},{"speaker":"谢临川","text":"挺甜的。师姐放心吃。"},{"speaker":"我","text":"你的眼泪都快酸出来了。"},{"speaker":"旁白","text":"谢临川终于笑出声，把剩下半颗塞回自己口中。守阵灯又晃了一下，他立刻起身调紧灯绳，手上动作利落，纸袋仍稳稳护在怀里。"},{"speaker":"谢临川","text":"灯绳受了潮。等它稳住，我们再分。"},{"speaker":"旁白","text":"后园深处传来庄丁修补篱笆的敲击声。谢临川听了片刻，辨出东侧木桩受潮，随手在巡图背面记下一笔。"},{"speaker":"我","text":"到山庄做客也忘不了巡防？"},{"speaker":"谢临川","text":"这里住着许多人。下回山雨再来，篱笆倒了会堵住后门。"},{"speaker":"旁白","text":"他说起正事时神情专注，纸上很快画出一条绕开梅林的撤离小路。画完以后，他又把青梅袋推近，催我挑一颗。"},{"speaker":"谢临川","text":"路记好了。现在轮到师姐告诉我，这一袋里哪颗最甜。"},{"speaker":"旁白","text":"可靠与亲近在他身上从不冲突。方才还在看山势的人，此刻已经满眼期待地等着同我分一颗青梅。"}],"choices":[{"text":"分他一颗青梅","gainAffection":true,"body":[{"speaker":"我","text":"（挑出一颗青梅递给他）这一颗一人一半。上回你替我试酸，这回公平些。"},{"speaker":"谢临川","text":"好。师姐咬哪边，我就吃剩下那边。"},{"speaker":"旁白","text":"我掰开青梅，酸汁沾到指尖。谢临川很自然地接过我手里那半，靠着廊柱坐到身旁。"},{"speaker":"旁白","text":"我们说起故城溪边的老桥、夏夜晒热的石阶，还有他第一次学会吹巡防哨时惊飞的一树麻雀。旧事全是两人共同走过的日子。"},{"speaker":"谢临川","text":"等这卷任务结束，我们回故城看看吧。那条河我重新画了撤离图，正想带你走一遍。"},{"speaker":"我","text":"好。到时再买一袋真正甜的青梅。"},{"speaker":"旁白","text":"谢临川笑着碰了碰我的肩，纸袋在两人膝间轻响。守阵灯终于稳定，暖光把湿漉漉的后园照亮。"}]},{"text":"带回栖云院","gainAffection":false,"body":[{"speaker":"我","text":"阿阮喜欢熟一些的。我们挑几颗软的带回去。"},{"speaker":"谢临川","text":"我来挑。她怕酸，颜色发黄的放上面。"},{"speaker":"旁白","text":"谢临川把青梅分成两包，阿阮那份仔细垫了树叶。留给我的一包藏着两颗最圆的，打结时还多绕了一圈。"}]},{"text":"分给值守同门","gainAffection":false,"body":[{"speaker":"我","text":"守阵的弟子忙了一日，青梅分给大家解渴吧。"},{"speaker":"谢临川","text":"行。师姐在这里等我，我送一圈就回来。"},{"speaker":"旁白","text":"谢临川挨个把青梅送到值守处，回来时从袖中摸出最后一颗。"},{"speaker":"谢临川","text":"这一颗先前滚进袖子里了。既然只剩一颗，归师姐。"},{"speaker":"旁白","text":"他说得一本正经，袖中分明还露着空纸包的一角。我接过青梅，没拆穿他。"}]}]},{"id":"xie-06","maleKey":"xie","male":"谢临川","title":"灯下巡图","length":"短","unlock":"完成主线《灵矿归途》","place":"山雨营地","stage":"向信任过渡","intro":[{"speaker":"旁白","text":"山雨打得营帐噼啪作响，湿绳、泥水与止血药的气味挤在一处。最后一名伤员被抬进药帐后，谢临川才解下腰间救援绳。掌心被粗麻磨得通红。"},{"speaker":"旁白","text":"他蹲到巡图前，用炭笔重新圈出塌桥与积水最深的山沟。灯火被风压低，他一只手护住图纸，声音仍稳。"},{"speaker":"谢临川","text":"北岭桥索撑得到天亮，东坡已经封路。失联的两名弟子在回程，半刻钟后入营。"},{"speaker":"我","text":"你的手在流血。先上药。"},{"speaker":"谢临川","text":"等他们进营。人数对上，我就坐下。"},{"speaker":"旁白","text":"帐外响起两声长哨。谢临川立刻站起来，亲自掀帘确认人影。两名弟子平安回来，他才转身把手伸给我。"},{"speaker":"谢临川","text":"好了，听师姐的。"},{"speaker":"我","text":"（替他清洗掌心）方才救人时倒镇定，现在知道疼了？"},{"speaker":"谢临川","text":"刚才顾不上。坐到师姐旁边，才敢觉得累。"}],"choices":[{"text":"与他守完后夜","gainAffection":true,"body":[{"speaker":"我","text":"（包好他的手，往旁边让出位置）热汤在炉边。喝完以后，靠着我歇一会儿。"},{"speaker":"旁白","text":"谢临川端起汤碗，眼睛一下亮了。他喝得很快，又怕烫到似的放慢，最后抱着空碗挨到我肩边。"},{"speaker":"谢临川","text":"师姐说的话要算数。让我靠到换岗钟响。"},{"speaker":"我","text":"只要别睡得滑到地上。"},{"speaker":"旁白","text":"谢临川笑着应下，真正靠过来时仍收着力道。帐外雨势凶急，他的呼吸渐渐平稳，受伤的手始终护在不碰到我的一侧。"},{"speaker":"旁白","text":"换岗钟响前，他已经睁开眼，重新核对伤员名册。休息时亲近自然，起身处理巡防时也从未含糊。"}]},{"text":"先照看伤员","gainAffection":false,"body":[{"speaker":"我","text":"伤员记录由我补。你去桥边看最后一次水位，回来再一起核图。"},{"speaker":"谢临川","text":"好。师姐守药帐，我很放心。"},{"speaker":"旁白","text":"谢临川带人冒雨离营，回程时把每处水位刻在木签上。两份记录对合后，失联弟子与伤员名单一人不少。"}]},{"text":"先回报宗门","gainAffection":false,"body":[{"speaker":"我","text":"雨势还在涨，传讯主峰增派人手。我们不能只靠这一队撑到天亮。"},{"speaker":"谢临川","text":"我也正想发讯。东坡需要两名阵修，北岭再添一队担架。"},{"speaker":"旁白","text":"谢临川口述位置，我落笔写传讯符。灵光飞出营帐后，他把自己的巡防令放到图角压住风，转身去接下一批伤员。"}]}]},{"id":"xie-07","maleKey":"xie","male":"谢临川","title":"扶我一程","length":"长","unlock":"完成主线《筑基之争》","place":"问天石路","stage":"信任","intro":[{"speaker":"旁白","text":"问天石路的阵压尚未散尽，每往前一步，耳边便响起细微嗡鸣。我走到第三道石阶时气海发紧，鞋底一滑，旁边的人立刻托住我的手臂。"},{"speaker":"谢临川","text":"别急。先站稳。"},{"speaker":"旁白","text":"谢临川收起方才一路说笑的神情，半蹲下来查看我的脚踝，又用巡防令确认阵纹已经停转。"},{"speaker":"我","text":"脚踝没事，气海有些乱。阿川，你扶我走到前面的石亭。"},{"speaker":"旁白","text":"这一声落下，谢临川抬起头，眼睛亮得像骤然接住一束日光。他唇角扬起来，顾着我的呼吸，只把笑压得很轻。"},{"speaker":"谢临川","text":"好。你靠着我，走得多慢都行。"},{"speaker":"旁白","text":"谢临川把手臂送到我掌下，另一只手握住巡防短杖，逐阶探过前路。他不催我，也不替我迈步，只在阵压重新涌来时稳住肩背。"},{"speaker":"我","text":"叫一声阿川，就这么高兴？"},{"speaker":"谢临川","text":"当然高兴。很久没听你这样叫我了。"},{"speaker":"旁白","text":"山风从石壁间穿过，带来松针清气。谢临川的笑意一路留在眉眼间，脚下仍稳得让人安心。"},{"speaker":"旁白","text":"石亭外立着一块新换的巡防牌，风把木牌吹得来回晃动。谢临川经过时伸手扶正，确认背面刻着最近的医棚方位。"},{"speaker":"谢临川","text":"下次阵压再乱，别硬撑到第三道石阶。第二道旁边有传讯绳，一拉就能叫人。"},{"speaker":"我","text":"你是在提醒我，还是准备把这条也写进巡防规程？"},{"speaker":"谢临川","text":"都要。师姐今日遇到的险，后来的人能少遇一次。"},{"speaker":"旁白","text":"谢临川说完低头看我，眼里担忧清楚，也尊重我仍想自己走完余下路程的决定。他只把手臂留在身侧，等我需要时再扶。"},{"speaker":"我","text":"阿川如今真的能照顾很多人了。"},{"speaker":"旁白","text":"谢临川脚步一顿，耳尖被山风吹得发红，眼睛又亮起来。"},{"speaker":"谢临川","text":"师姐看见了就好。"}],"choices":[{"text":"请他扶我一程","gainAffection":true,"body":[{"speaker":"我","text":"（握稳他的手臂）那便再走慢一点，阿川。等气海平复，我自己走。"},{"speaker":"旁白","text":"谢临川眼睛又亮了一回，连应声都带着笑。他随着我的呼吸停步，每到阵纹前便先报清石阶高度。"},{"speaker":"谢临川","text":"前面还有七步。走完就到石亭，那里背风。"},{"speaker":"旁白","text":"走到最后两步时，我已经能自己站稳。谢临川仍把手臂留在原处，直到我主动松开。"},{"speaker":"我","text":"辛苦你了。"},{"speaker":"谢临川","text":"师姐再叫一声阿川，我还能陪你走回栖云院。"},{"speaker":"旁白","text":"他说得带笑，先替我铺好石亭里的软垫，又认真把阵压复发的时辰记进巡防簿。"}]},{"text":"先在原地调息","gainAffection":false,"body":[{"speaker":"我","text":"先在原地调息。石亭只剩几步，也不急在这一刻。"},{"speaker":"谢临川","text":"行。我挡着风，你照自己的气息来。"},{"speaker":"旁白","text":"谢临川坐到迎风一侧，把水囊放在我伸手可及的地方。有人沿路催问进度，他只抬手示意绕行，始终未出声打断。"}]},{"text":"请他先去点名","gainAffection":false,"body":[{"speaker":"我","text":"接应弟子已经来了。你把巡防记录送回去吧，别耽误换岗。"},{"speaker":"谢临川","text":"我看着你走到石亭，再回头。"},{"speaker":"旁白","text":"谢临川同接应弟子逐项交代阵压与脚下裂纹，目送我坐稳后才沿原路折返。走出很远，他仍回头朝我挥了一次手。"}]}]},{"id":"xie-08","maleKey":"xie","male":"谢临川","title":"风台同归","length":"短","unlock":"完成主线《第九归者》","place":"水镜台外风台","stage":"信任","intro":[{"speaker":"旁白","text":"水镜台外云海翻涌，风从石栏间灌过来，带着山雪的冷气。谢临川守在风台入口，肩上披着巡防斗篷，手中热饼被灵符护得仍有温度。"},{"speaker":"旁白","text":"我走出水镜，他先快步迎上来。目光从我的脸看到手腕，确认魂息平稳后，笑意才从眼底漫开。"},{"speaker":"谢临川","text":"师姐，你出来了。"},{"speaker":"我","text":"你等了多久？"},{"speaker":"谢临川","text":"从水镜开门到现在。中间换过两次值，第三次轮到我时，你正好出来。"},{"speaker":"旁白","text":"谢临川把热饼塞到我手里，又解下斗篷挡住风口。他想问水镜里的事，话到嘴边停住，只轻轻碰了碰我的肩。"},{"speaker":"谢临川","text":"先吃一点。想说什么，等暖和了再说。"},{"speaker":"我","text":"（望向他）阿川，你还在这里。"},{"speaker":"旁白","text":"谢临川整个人都顿了一下，随即转过头看我。那双眼睛亮得惊人，欢喜从眉梢一直落到笑里。"},{"speaker":"谢临川","text":"我在。师姐再叫一次也行。"},{"speaker":"旁白","text":"风声穿过高台，他仍凑近了一点，像怕刚才那声称呼被山风吹走。"}],"choices":[{"text":"与他一同归院","gainAffection":true,"body":[{"speaker":"我","text":"（把热饼分给他一半）阿川，我们一起回去。路上我慢慢说给你听。"},{"speaker":"旁白","text":"谢临川接过半张热饼，笑得连耳尖都泛起薄红。他走在我身侧，肩膀替我挡住高台最冷的一阵风。"},{"speaker":"我","text":"水镜里有一条很长的黑阶。我走到一半时，听见了故城的河声。"},{"speaker":"谢临川","text":"那条河还在。等你想回去，我们就去看。"},{"speaker":"旁白","text":"谢临川听我说完每一段，只在石阶难走时扶一下手肘。下到栖云院岔路，他仍未松开同行的步子。"},{"speaker":"谢临川","text":"今日先送师姐回院。明日醒来还想说，我照旧来听。"},{"speaker":"旁白","text":"天边露出晨光，两人的影子一同落在山路上。久别后的称呼终于回到唇边，亲近也回到今生共同走过的路上。"}]},{"text":"先去见阿阮","gainAffection":false,"body":[{"speaker":"我","text":"我想先去看阿阮。水镜里见到的事，晚些再告诉你。"},{"speaker":"谢临川","text":"我送你到丹房。你若不想细说，只报一句平安也好。"},{"speaker":"旁白","text":"谢临川提着热水走在外侧，进丹房前又替我拍去肩上沾到的细霜。阿阮迎出来时，他安静退到门边。"}]},{"text":"独自在风台静坐","gainAffection":false,"body":[{"speaker":"我","text":"风台很安静，我想独自坐一会儿。"},{"speaker":"谢临川","text":"那我到入口等。风太冷时就叫我，我带了第二件斗篷。"},{"speaker":"旁白","text":"谢临川把热饼与水囊放在石栏内侧，退到听得见呼唤的地方。每次回头，他看见我安稳坐着，眉眼便重新弯起来。"}]}]},{"id":"mo-01","maleKey":"mo","male":"墨无咎","title":"残符余墨","length":"长","unlock":"完成主线《灵墟初市》","place":"灵墟坊市","stage":"初识","intro":[{"speaker":"旁白","text":"灵墟午市人声鼎沸，烤栗甜香与朱砂气混在一处。旧货摊上压着几张褪色灵符，纸边受潮发卷，其中一张的印泥颜色格外新。"},{"speaker":"旁白","text":"墨无咎倚在隔壁柜边转着一枚旧铜钱，像只是在等伙计包货。摊主看见他，脸上笑意顿时僵了几分。"},{"speaker":"我","text":"（拿起那张灵符）纸是旧纸，封印刚补过。摊主，这张符从哪里来的？"},{"speaker":"旁白","text":"摊主连连摆手，只说祖上传下来的旧物经不得这样的猜疑。"},{"speaker":"墨无咎","text":"既是祖传，总该认得背面的乌藤印。翻给姑娘看看。"},{"speaker":"旁白","text":"摊主下意识按住箱底。墨无咎唇边仍带着温和笑意，手中铜钱已经压在账簿边缘。那一瞬的慌乱比任何回答都清楚。"},{"speaker":"我","text":"墨公子早知道箱底藏着东西？"},{"speaker":"墨无咎","text":"只知道他昨日进了一批见不得光的旧货。藏在哪儿，刚刚才看出来。"},{"speaker":"我","text":"所以你等我把残符拿起来。"},{"speaker":"墨无咎","text":"我猜你会留意印泥。猜对了。"},{"speaker":"旁白","text":"两名商号伙计悄然停在巷口，巡市弟子的木牌也从人群后露出来。墨无咎把所有人都安排在恰好的位置，唯独未替我说下一句话。"},{"speaker":"墨无咎","text":"姑娘若不喜欢被人借势，现在放下残符也来得及。余下的事，我换个办法。"},{"speaker":"旁白","text":"摊前风铃被人群撞响。墨无咎仍笑着，眼神已经沉下来，静静等我自己决定。"},{"speaker":"旁白","text":"旧货摊后的茶炉正烧着劣质炭，烟气呛人。墨无咎往旁边挪了半步，站位恰好替我挡住烟，也让摊主看不清我们交换的眼神。"},{"speaker":"我","text":"巷口那两名伙计，是何时到的？"},{"speaker":"墨无咎","text":"比我早半刻钟。他们只认铜钱落地的声音。"},{"speaker":"我","text":"方才铜钱一直在你手里。"},{"speaker":"墨无咎","text":"因为姑娘还未选。你若放下残符，这枚铜钱就不会落地。"},{"speaker":"旁白","text":"墨无咎张开掌心，旧铜钱静静躺在指间。他设好了局，也把最后一步留给我。摊主催问价钱时，他仍等着我的回答。"}],"choices":[{"text":"请墨无咎教我验符","gainAffection":true,"body":[{"speaker":"我","text":"（将残符翻到背面）既然都走到这里了，墨公子教我认完这枚乌藤印吧。"},{"speaker":"墨无咎","text":"乐意之至。先看印尾，旧印的第三笔会向内收。"},{"speaker":"旁白","text":"墨无咎站到我身侧，用铜钱压平卷曲纸边。他讲得细，摊主每一次想插话，都被他一句看似随意的追问堵回去。"},{"speaker":"我","text":"墨公子今日赚到什么？"},{"speaker":"墨无咎","text":"一条进货路，还有姑娘愿意留下听我说话。两样都难得。"},{"speaker":"旁白","text":"巡市弟子封箱时，墨无咎把那枚旧铜钱放进我掌心。"},{"speaker":"墨无咎","text":"留着。下回再遇见补过的旧符，用它压住纸角，墨色会显得更清楚。"}]},{"text":"换去正规符铺","gainAffection":false,"body":[{"speaker":"我","text":"这批灵符牵涉商路，交给巡市弟子查验更稳妥。"},{"speaker":"墨无咎","text":"正合适。证人、账簿和进货木牌都在这里，他们省得再跑一趟。"},{"speaker":"旁白","text":"他说着退开半步。巡市弟子上前时，我才看见账簿早已翻到进货那页，连红绳都系好了。"}]},{"text":"请巡市弟子查验","gainAffection":false,"body":[{"speaker":"我","text":"我今日只想买符纸。旧货的事留给墨公子处理。"},{"speaker":"墨无咎","text":"可以。前面第二家符铺货真，掌柜脾气差些，报我的名字会更差。姑娘报自己的就好。"},{"speaker":"旁白","text":"我忍不住回头看他。墨无咎笑着目送我离开，手中铜钱翻面，巷口伙计随即合上退路。"}]}]},{"id":"mo-02","maleKey":"mo","male":"墨无咎","title":"檐下账声","length":"短","unlock":"完成事件《残符余墨》","place":"灵墟坊市长檐","stage":"初识","intro":[{"speaker":"旁白","text":"骤雨压住坊市叫卖声，长檐下挤满避雨的人。湿布、药草与泥土气息混在一起，墨无咎坐在最里侧拨算盘，珠声清脆，三册进货簿摊得整齐。"},{"speaker":"我","text":"百草园的清水符一夜涨了三成。墨公子这里也跟着涨？"},{"speaker":"墨无咎","text":"我的价格还在昨日。数目有限，每人只取眼下够用的。"},{"speaker":"我","text":"你提前收了货。"},{"speaker":"墨无咎","text":"山雨连下两日，山路总会出问题。多备一箱，睡得安稳。"},{"speaker":"旁白","text":"墨无咎说得轻松，柜后已经按药堂、巡防与散客分成三堆。有人想高价全收，他抬眼一笑，伙计便把货箱合上。"},{"speaker":"墨无咎","text":"这位客人来迟了。今日银子太多也买不到。"},{"speaker":"旁白","text":"客人悻悻离开。墨无咎把最厚的一叠清水符推到我面前，数量刚好对应百草园临时加开的药棚。"},{"speaker":"我","text":"你连药棚增了几处也知道？"},{"speaker":"墨无咎","text":"雨里来买符的人，鞋底会带不同颜色的泥。百草园来了三拨，第二拨最急。"}],"choices":[{"text":"与他核对清单","gainAffection":true,"body":[{"speaker":"我","text":"用量由我核，坊市这边劳烦墨公子守住价格。"},{"speaker":"墨无咎","text":"成交。你管他们真正缺多少，我管谁想趁雨抬价。"},{"speaker":"旁白","text":"我们并肩核过清单，墨无咎忽然从最下层抽出两张备用符。"},{"speaker":"我","text":"这两张不在账上。"},{"speaker":"墨无咎","text":"给核账的人留的。她若淋病了，明日谁来替我抓错？"},{"speaker":"旁白","text":"雨水从檐边溅进来，墨无咎将自己的外袍搭到我身后挡住湿气，仍低头拨着算盘，像这份照顾只是顺手。"}]},{"text":"只买所需符纸","gainAffection":false,"body":[{"speaker":"我","text":"先按每人限取一份。药堂若有缺口，再凭木签补领。"},{"speaker":"墨无咎","text":"好法子。我再添一条，今日买过的人，伙计记鞋不记脸。换衣回来也无用。"},{"speaker":"旁白","text":"长檐下响起几声低笑。墨无咎把木签交给我，自己坐回最显眼的位置，等着那些心虚的人来试。"}]},{"text":"去查上游灵砂","gainAffection":false,"body":[{"speaker":"我","text":"我去上游仓看看存货，免得这一箱撑不到天晴。"},{"speaker":"墨无咎","text":"带上这枚路签。仓主若说无货，让他开北窗看看。"},{"speaker":"我","text":"北窗后藏着什么？"},{"speaker":"墨无咎","text":"一间他以为无人知道的小仓。"},{"speaker":"旁白","text":"墨无咎笑得温和，指尖轻敲算盘。显然他早把坊市每一条退路都算过。"}]}]},{"id":"mo-03","maleKey":"mo","male":"墨无咎","title":"炉外新茶","length":"长","unlock":"完成主线《丹火初燃》","place":"丹霞峰炉廊","stage":"相熟","intro":[{"speaker":"旁白","text":"丹霞峰封炉后仍热气蒸腾，焦香药味贴在回廊里。墨无咎坐在炉门外，脚边堆着验退木牌，手里只提一只青瓷茶壶。"},{"speaker":"我","text":"商号的退货单都在你这里，墨公子还有闲心喝茶？"},{"speaker":"墨无咎","text":"茶等了三壶，姑娘总算出来了。"},{"speaker":"我","text":"你已经换过三壶茶？"},{"speaker":"墨无咎","text":"第一壶太早，第二壶被管事拖凉。第三壶的时辰刚好。"},{"speaker":"旁白","text":"他揭开壶盖，淡淡竹叶香冲散炉廊的焦气。茶盏先用热水温过，杯口干净，温度也刚好。"},{"speaker":"我","text":"你知道我会从这道门出来？"},{"speaker":"墨无咎","text":"丹房正门围着查验弟子。你不爱挤人，自然走偏廊。"},{"speaker":"旁白","text":"墨无咎替我斟茶，脸上笑意从容。送货伙计抱着账册赶来，刚要开口，又被他一个眼神止在十步外。"},{"speaker":"墨无咎","text":"茶凉以前，只谈茶。"},{"speaker":"我","text":"那批问题药材呢？"},{"speaker":"墨无咎","text":"封在门外，跑不了。你今日忙得够久，容我偷半刻钟。"},{"speaker":"旁白","text":"炉火余温从石壁透出来，茶香一阵阵散开。墨无咎难得放下算盘，也未用一句玩笑遮掩想见我的心思。"},{"speaker":"旁白","text":"青瓷壶身绘着一枝细竹，釉面被炉火映得温润。我认出这是城南茶庄限量烧制的旧器，寻常商号很少拿来待客。"},{"speaker":"我","text":"墨公子带着这样的茶壶来丹霞峰，只为等半刻钟？"},{"speaker":"墨无咎","text":"好茶装在粗陶里也能喝。我今日想讲究一些。"},{"speaker":"我","text":"墨公子今日为何这样讲究？"},{"speaker":"墨无咎","text":"第一次单独请姑娘喝茶，总该留点好印象。"},{"speaker":"旁白","text":"他说得从容，指腹在杯沿轻轻一转，暴露出一点少见的紧张。丹炉又发出一声脆响，墨无咎抬眼等我回应，未拿笑话替自己解围。"},{"speaker":"我","text":"印象已经留下了。茶也很好。"},{"speaker":"旁白","text":"墨无咎唇边笑意加深，终于端起自己的茶盏。远处伙计抱着账册站得腿酸，也不敢上前打断。"}],"choices":[{"text":"请墨无咎同饮","gainAffection":true,"body":[{"speaker":"我","text":"（接过茶盏）半刻钟可以。账册留给伙计，我们只喝茶。"},{"speaker":"墨无咎","text":"姑娘开口，我自然听。"},{"speaker":"旁白","text":"墨无咎把账册推回伙计怀中，顺手摘下对方腰间报时的铜铃。回廊终于安静，只剩茶水落盏的细声。"},{"speaker":"我","text":"你连铜铃都要收？"},{"speaker":"墨无咎","text":"半刻钟太短，经不起人提醒。"},{"speaker":"旁白","text":"他说完低头喝茶，笑意藏在杯沿后。报时沙漏落尽，两人仍坐在原处，谁也未急着起身。"},{"speaker":"墨无咎","text":"下一回换姑娘挑地方。我只负责准时到。"}]},{"text":"询问茶叶来处","gainAffection":false,"body":[{"speaker":"我","text":"茶我收下。问题药材还得尽快查清，边喝边看木牌吧。"},{"speaker":"墨无咎","text":"也行。姑娘看批次，我查送货人。错处遇上了，便算我们有默契。"},{"speaker":"旁白","text":"两只茶盏夹在木牌中间，热气缓缓上升。墨无咎核得很快，每逢我抬眼，他总恰好将下一张推到手边。"}]},{"text":"喝完去核货","gainAffection":false,"body":[{"speaker":"我","text":"药堂缺退火茶。我去仓口取货，回来再喝。"},{"speaker":"墨无咎","text":"仓口的人已经来了。"},{"speaker":"旁白","text":"墨无咎抬了抬手，十步外的伙计立即送上封好的茶箱。批次、数量与药堂木签分毫相合。"},{"speaker":"墨无咎","text":"现在能坐下了吗？茶再换第四壶，竹叶就该怪我糟蹋它了。"}]}]},{"id":"mo-04","maleKey":"mo","male":"墨无咎","title":"旧仓封痕","length":"短","unlock":"完成主线《灵矿归途》","place":"灵墟旧货仓","stage":"相熟","intro":[{"speaker":"旁白","text":"灵墟旧货仓木门受潮，推开时发出低沉吱呀声。尘灰与陈年麻布气息扑面而来，半枚旧运签压在门槛下，边缘还留着新鲜刮痕。"},{"speaker":"旁白","text":"墨无咎举灯照过夹层，伸手摸到第二道暗格。他取出一串钥匙，挑中最不起眼的一枚。"},{"speaker":"我","text":"仓主说钥匙遗失，墨公子手里为何还有一把？"},{"speaker":"墨无咎","text":"他说的是正门钥匙。暗格这一把，他没问。"},{"speaker":"我","text":"你也没告诉他。"},{"speaker":"墨无咎","text":"问得不够仔细，吃些亏才会长记性。"},{"speaker":"旁白","text":"锁芯轻响，暗格里露出一叠旧运签。墨无咎抽出最下层那张，封蜡同残符上的乌藤印完全一致。"},{"speaker":"我","text":"原件交给谁保管？"},{"speaker":"墨无咎","text":"交到你我都够不着的地方。宗门封库，巡市弟子见证。"},{"speaker":"我","text":"墨公子也防自己？"},{"speaker":"墨无咎","text":"我若想反悔，当然也该拦住。"},{"speaker":"旁白","text":"灯火照着他含笑的眼睛，认真藏在笑意深处。他把运签递给我，自己只捏着封蜡拓片。"}],"choices":[{"text":"与他封存运签","gainAffection":true,"body":[{"speaker":"我","text":"我们各落一半灵印，再交宗门封存。拆封时，两个人都要在场。"},{"speaker":"墨无咎","text":"这个办法好。原件安全，我也多了一个见姑娘的正当理由。"},{"speaker":"我","text":"正事办完以前，理由只值一半。"},{"speaker":"墨无咎","text":"那另一半留到下回。"},{"speaker":"旁白","text":"两道灵印在运签边缘相合。墨无咎俯身落印时，衣袖擦过我的手腕，旋即守礼地退开。"},{"speaker":"旁白","text":"仓门重新封上，他把完整编号抄给我，自己的那份只留半号。再擅长留后路的人，也把这一份退路交到了我手里。"}]},{"text":"交给宗门封存","gainAffection":false,"body":[{"speaker":"我","text":"原件直接交宗门，见证名单写全。"},{"speaker":"墨无咎","text":"稳妥。商族想取回来，得先问过三处印鉴。"},{"speaker":"旁白","text":"墨无咎补齐流转记录，亲自把木匣送到值守弟子手中。离开前，他将暗格钥匙折断，断口一并封存。"}]},{"text":"继续查找旧钥","gainAffection":false,"body":[{"speaker":"我","text":"再查一遍夹层。设计暗格的人常会留第二处出口。"},{"speaker":"墨无咎","text":"姑娘已经学会怀疑我的行当了。抬头看第三根梁。"},{"speaker":"旁白","text":"梁后果然藏着半卷运路图。墨无咎早已看见，仍等我自己找到，眼里笑意带着一点赞许。"}]}]},{"id":"mo-05","maleKey":"mo","male":"墨无咎","title":"一碗清汤","length":"长","unlock":"完成主线《人间灯火》","place":"清河镇医棚","stage":"相熟","intro":[{"speaker":"旁白","text":"清河镇医棚挤满烧伤病患，湿药布、姜片与浓烟气味久久不散。墨无咎坐在门边核对赔付木签，指间算盘珠拨得飞快，手边清汤已经凉透。"},{"speaker":"我","text":"从起火到现在，你吃过东西吗？"},{"speaker":"墨无咎","text":"喝过半盏茶。"},{"speaker":"我","text":"茶不算饭。"},{"speaker":"旁白","text":"墨无咎笑了一下，想把话题转回木签。我把账册合上，他的手停在封面上，终究未再翻开。"},{"speaker":"墨无咎","text":"姑娘今日管得很宽。"},{"speaker":"我","text":"医棚少一个倒下的人，大家都省事。"},{"speaker":"旁白","text":"炉边新盛的清汤冒着热气。我摸过碗沿，挑了一碗姜味最淡的递给他。墨无咎接碗时低咳一声，浓烟熏过的嗓音已经发哑。"},{"speaker":"墨无咎","text":"你记得我不爱姜？"},{"speaker":"我","text":"上回炉外新茶，你把姜片全挑到碟边。"},{"speaker":"旁白","text":"墨无咎垂眼看着汤面，脸上的笑淡了些。他算得清许多人的习惯，轮到自己被人记住，反倒安静下来。"},{"speaker":"墨无咎","text":"这一碗，我会喝完。"},{"speaker":"旁白","text":"医棚外忽然传来争吵，一名货主拿着烧毁的木牌，咬定自家赔付数目少了一半。墨无咎放下汤碗，嗓音仍哑，神情已经清醒。"},{"speaker":"墨无咎","text":"木牌给我。你的货走西门，昨夜西门先封，损失该比东街少。"},{"speaker":"旁白","text":"货主拍着木牌，咬定账棚写错在先，不肯认下少报货损的说法。"},{"speaker":"旁白","text":"墨无咎把木牌迎着灯转了一圈，火烤过的背面显出第二道押印。货主的声音当即低下去。"},{"speaker":"墨无咎","text":"少赔的一半在另一张木牌上。两张都领，才是全数。别在医棚门口吵伤者。"},{"speaker":"旁白","text":"货主离开后，墨无咎重新坐下，汤面已经结了薄薄一层油花。我替他换来一碗热的，他未推辞。"},{"speaker":"我","text":"忙起来很利落，喝汤便一直拖。"},{"speaker":"墨无咎","text":"所以才需要姑娘坐在这里看着。"}],"choices":[{"text":"与墨无咎分汤","gainAffection":true,"body":[{"speaker":"我","text":"（另取一碗坐到对面）我陪你喝。账册等汤见底再开。"},{"speaker":"墨无咎","text":"有人作陪，我大概会喝得慢些。"},{"speaker":"旁白","text":"墨无咎当真一口一口喝得很慢。医棚外雨丝斜落，账册压在两人手边，谁也没去碰。"},{"speaker":"我","text":"你咳了多久？"},{"speaker":"墨无咎","text":"从火场出来开始。原想瞒到镇医忙完。"},{"speaker":"我","text":"这件事没瞒住。"},{"speaker":"墨无咎","text":"败在姑娘手里，勉强算输得体面。"},{"speaker":"旁白","text":"他喝完最后一口，主动去镇医处领了润肺药。回来时把一包同样的梨膏放在我桌边，理由只说烟尘人人都吸了。"}]},{"text":"先核对木签","gainAffection":false,"body":[{"speaker":"我","text":"你喝汤，我核对伤者木签。等我查完这一页，再换你。"},{"speaker":"墨无咎","text":"这回听姑娘安排。错签压在左边，赔付不足的放右边。"},{"speaker":"旁白","text":"汤碗渐空，木签也分成整齐两摞。墨无咎接回账册时，先将温着的另一碗推给我。"}]},{"text":"将清汤送给伤者","gainAffection":false,"body":[{"speaker":"我","text":"角落里的孩子一直咳。这碗先送给他，我们再盛。"},{"speaker":"墨无咎","text":"我去。孩子的赔付木签也在这里，正好一起补全。"},{"speaker":"旁白","text":"墨无咎端汤走进医棚深处，回来时托盘上多了两碗新汤。我的那一碗姜片最少，他自己的药味更重。"}]}]},{"id":"mo-06","maleKey":"mo","male":"墨无咎","title":"灯火旧账","length":"短","unlock":"完成主线《人间灯火》及事件《一碗清汤》","place":"清河镇临时账棚","stage":"向信任过渡","intro":[{"speaker":"旁白","text":"清河镇临时账棚点着三盏油灯，雨水顺棚布淌成细线。墨无咎将烧焦的货单逐张铺平，算盘珠难得安静，夹页里多了一张空白纸。"},{"speaker":"我","text":"这张纸为何夹在总账中间？"},{"speaker":"墨无咎","text":"给一个不方便留下姓名的人。"},{"speaker":"我","text":"火场的目击者？"},{"speaker":"旁白","text":"墨无咎抬眼，笑意很浅。他用空白纸覆住货单上的一行小字，灯光一透，背面的暗记便显了出来。"},{"speaker":"墨无咎","text":"他看见有人换过灯油封签。名字写进账册，今夜就会有人找上门。"},{"speaker":"我","text":"所以你让这一页看起来空着。"},{"speaker":"墨无咎","text":"空白最容易被忽略。真正要记的东西，藏在纸背。"},{"speaker":"旁白","text":"棚外脚步声靠近，墨无咎顺手把空白纸折进袖中，又拨响算盘。来人探头时，只看见一个忙着算损失的商人。"},{"speaker":"旁白","text":"脚步远去，他把纸重新铺开，神情已经收敛。"}],"choices":[{"text":"留下帮他清账","gainAffection":true,"body":[{"speaker":"我","text":"目击者的证词由我另抄一份，原纸还放在你这里。两边对得上，才交给镇衙。"},{"speaker":"墨无咎","text":"好。你写，我守门。"},{"speaker":"旁白","text":"墨无咎挪到棚口，挡住透进来的风与来往视线。我誊写时，纸背暗记一点点显出完整时辰。"},{"speaker":"我","text":"你为何肯把藏法告诉我？"},{"speaker":"墨无咎","text":"因为姑娘看见空白，也会问一句。这样的人适合替我保住真话。"},{"speaker":"旁白","text":"两份证词封好后，墨无咎把更危险的原件留在自己袖中，只将副本和逃生路线交给目击者。灯火照着他侧脸，笑意已被认真取代。"}]},{"text":"协助登记伤者","gainAffection":false,"body":[{"speaker":"我","text":"先核对赔付名单。目击者的事等镇衙值夜换岗后再办。"},{"speaker":"墨无咎","text":"时辰合适。子时后门换人，新来的那位欠我一顿酒。"},{"speaker":"旁白","text":"两边记录合拢时，墨无咎已经备好封袋与路引。等待从来不耽误他布置下一步。"}]},{"text":"先追查下游货栈","gainAffection":false,"body":[{"speaker":"我","text":"下游货栈最可能留下旧封签。我去查一趟。"},{"speaker":"墨无咎","text":"带我的商号印。掌柜若装糊涂，问他三年前那场水灾是谁替他补的货。"},{"speaker":"旁白","text":"墨无咎递来印鉴，掌心收得很稳。这枚印足以调动半条商路，他交给我时未加一句限制。"}]}]},{"id":"mo-07","maleKey":"mo","male":"墨无咎","title":"袖上石尘","length":"长","unlock":"完成主线《旧殿留字》","place":"云泽营地","stage":"信任","intro":[{"speaker":"旁白","text":"云泽旧殿外墙忽然坍塌，碎石裹着尘土砸进窄道。墨无咎一把将我拉到石柱后，自己肩背擦过断墙，衣袖立刻渗出血色。"},{"speaker":"我","text":"（扶住他的手臂）先出去。这里还会塌。"},{"speaker":"墨无咎","text":"左侧风向变了，出口还通。跟紧我。"},{"speaker":"旁白","text":"他收起惯常笑意，借灯火辨认石缝，一路将落脚处报得清楚。直到营地风灯照过来，他才靠着木箱坐下，袖上尽是石尘。"},{"speaker":"我","text":"你早知道暗格后面有夹道？"},{"speaker":"墨无咎","text":"知道有路，不知道墙会塌。"},{"speaker":"我","text":"还藏了多少事？"},{"speaker":"旁白","text":"墨无咎望着我，片刻后从破损袖袋里取出一枚玄水旧印。边缘硌进掌心，留下深红印子。"},{"speaker":"墨无咎","text":"还藏了这个。若在殿里拿出来，跟着我们的墨家人会先抢。"},{"speaker":"我","text":"所以你拿自己作饵，把人引去另一道门。"},{"speaker":"墨无咎","text":"原想做得更漂亮些。如今看来，有些狼狈。"},{"speaker":"旁白","text":"他又想笑，伤口牵动肩背，笑意只停了一瞬。风灯照亮那枚旧印，也照出他将最危险的一步留给自己的事实。"},{"speaker":"旁白","text":"镇医剪开染血衣料时，从袖袋里落出一张折成三层的夹道图。图上两处出口都用朱砂圈过，最后一处正是方才坍塌的位置。"},{"speaker":"我","text":"你连第二处出口也早已查到。"},{"speaker":"墨无咎","text":"只查到方位。开门需要玄水旧印，我原想拿到以后再告诉你。"},{"speaker":"我","text":"怕我不同意你拿自己引开墨家人？"},{"speaker":"墨无咎","text":"怕姑娘看穿以后，陪我一起冒险。那样我会更难办。"},{"speaker":"旁白","text":"他说完望向营外。追兵已经被巡防扣下，危险暂时过去，墨无咎仍把夹道图推给我，请我亲自补上坍塌时辰。"},{"speaker":"墨无咎","text":"这一回是我少算一处。记录写明白，下回才不会再让人受伤。"}],"choices":[{"text":"替他收好印记","gainAffection":true,"body":[{"speaker":"我","text":"（替他剪开染血袖口）旧印放在我这里。你先把伤处理好，后面的事我们一起担。"},{"speaker":"旁白","text":"墨无咎安静下来，任我用清水冲去伤口里的灰。药粉落下，他的手指扣紧木箱边缘，仍未把手臂抽回。"},{"speaker":"墨无咎","text":"姑娘收了旧印，墨家最先来问的人会是我。"},{"speaker":"我","text":"我知道他们会来。"},{"speaker":"墨无咎","text":"那便好。你知道风险，仍愿意同我站在一边。"},{"speaker":"旁白","text":"他把旧印放进我掌心，指腹沾着血与石尘。两人的手短暂相触，墨无咎这回未用玩笑带过。"}]},{"text":"先交给宗门封存","gainAffection":false,"body":[{"speaker":"我","text":"旧印交宗门封存。墨家人想取，也得走明面手续。"},{"speaker":"墨无咎","text":"这条路最稳，也最让他们头疼。"},{"speaker":"旁白","text":"墨无咎亲手写明发现地点与见证人，把自己诱开追兵的经过一字不漏地添进记录。"}]},{"text":"继续检查塌陷处","gainAffection":false,"body":[{"speaker":"我","text":"夹道里还有第二层石门。我回去核对裂缝，你留在营地治伤。"},{"speaker":"墨无咎","text":"姑娘若要回去，我也去。站在石门外，不往里走。"},{"speaker":"我","text":"伤口缝好以后再说。"},{"speaker":"旁白","text":"墨无咎看了看镇医手里的针线，识趣地闭上嘴。等伤口包好，他果真只站在警戒线外举灯，未踏进半步。"}]}]},{"id":"mo-08","maleKey":"mo","male":"墨无咎","title":"未入总账","length":"短","unlock":"完成主线《第九归者》","place":"灵墟旧商号","stage":"信任","intro":[{"speaker":"旁白","text":"旧商号闭门后，檐下只亮着一盏灯。风吹动褪色木牌，发出轻轻碰响。墨无咎将二十七年前的玄水运单放在桌上，原件未盖族印，也未写进总账。"},{"speaker":"墨无咎","text":"一旦补进总账，族中便能收走。留在外面，它还能打开一道门。"},{"speaker":"我","text":"代价是什么？"},{"speaker":"墨无咎","text":"我不再是这条商路的继承人。"},{"speaker":"旁白","text":"墨无咎说得平静，指尖一直压着运单边缘。窗外有人叩了三次暗号，他未应声，只把族印推远。"},{"speaker":"我","text":"你早就算过这一步。"},{"speaker":"墨无咎","text":"算过。每一次结果都差不多。"},{"speaker":"我","text":"还在犹豫？"},{"speaker":"旁白","text":"灯芯轻晃，他抬眼看我。笑意仍在，往日藏在其中的周旋与试探已经淡去。"},{"speaker":"墨无咎","text":"从前会。今日不想犹豫了。"},{"speaker":"旁白","text":"墨无咎取下族印，只用自己的灵印压住运单。檐外暗号再次响起，他将灯火拨亮，亲手截断了家族替他留下的退路。"}],"choices":[{"text":"与他共守此证","gainAffection":true,"body":[{"speaker":"我","text":"我同你守住这份证据。明日一早，一起送去宗门。"},{"speaker":"墨无咎","text":"好。今夜这间商号恐怕不太安静。"},{"speaker":"我","text":"那就把门关好。"},{"speaker":"旁白","text":"墨无咎起身落闩，又把临街的灯换到后窗，让外面看不清屋内人影。做完这些，他在我对面坐下，递来一盏热茶。"},{"speaker":"墨无咎","text":"今日别叫墨公子了。听着像还在同我谈生意。"},{"speaker":"我","text":"无咎，我留下。"},{"speaker":"旁白","text":"墨无咎指尖停在杯沿，眼里笑意缓缓展开。窗外风声仍紧，屋内那一刻安静得只剩茶水热气。"},{"speaker":"墨无咎","text":"这声称呼，我收下了。"}]},{"text":"收下运单原件","gainAffection":false,"body":[{"speaker":"我","text":"原件由我带走。族中若来问，先让他们找不到东西。"},{"speaker":"墨无咎","text":"他们会先盯住我。姑娘从后门走，路引已经放在第二盏灯下。"},{"speaker":"旁白","text":"我掀开灯座，果然找到备好的路引。墨无咎早算到这一种选择，也早把最安全的路留给我。"}]},{"text":"补入家族总账","gainAffection":false,"body":[{"speaker":"我","text":"我们现在去见总账管事，当面核验旧印。"},{"speaker":"墨无咎","text":"好。该问的话我来问，姑娘只看他右手。那人说谎时，会捻袖口。"},{"speaker":"旁白","text":"旧商号重新点亮两盏灯。墨无咎走在前面，脸上恢复温和笑意，每一句寻常问话都把管事逼向更完整的答案。"}]}]},{"id":"gu-01","maleKey":"gu","male":"顾长清","title":"雨后收旗","length":"长","unlock":"完成主线《天衡问剑》","place":"天衡问剑台","stage":"初识","intro":[{"speaker":"旁白","text":"问剑台阵雨初歇，湿旗在山风里猎猎作响。石缝积着薄水，阵压尚未散尽，每走近一步，胸口便像压上一层潮气。"},{"speaker":"旁白","text":"顾长清逐面检查阵旗，发现南角旗骨开裂，便先用灵力卸去余压，再抬手示意台下弟子停步。声音温和，四周很快安静下来。"},{"speaker":"顾长清","text":"南角先别动。旗骨受力不均，贸然拔出会折断。"},{"speaker":"我","text":"（绕到阵纹外侧）东南两面互相牵着。先松东旗，南角的压力会小一些。"},{"speaker":"顾长清","text":"我也这样想。师妹看东旗，我守阵心。发现水纹倒流，立刻出声。"},{"speaker":"旁白","text":"我们隔着阵纹同时落手。水珠从旗面滑到腕间，凉意钻进袖口。顾长清始终配合我的节奏，未曾越过阵心替我完成那一半。"},{"speaker":"我","text":"东旗松了。"},{"speaker":"顾长清","text":"看见了。做得很好。"},{"speaker":"旁白","text":"南角阵压散开，湿旗终于安静。顾长清收起阵盘，才注意到我手背被旗绳磨红。他递来一块干净软布，自己袖口也湿透大半。"},{"speaker":"我","text":"顾师兄比我淋得更久，这块布该自己用。"},{"speaker":"顾长清","text":"我还有一块。师妹若不信，可以看。"},{"speaker":"旁白","text":"他当真从袖中取出另一块，眼里带着淡淡笑意。雨后天光从云隙落下，压抑许久的问剑台终于亮起来。"},{"speaker":"旁白","text":"阵堂教习赶来时，先问是哪一面旗出了差错。顾长清将阵盘递给我，让我亲自指出东南两道互牵的水纹。"},{"speaker":"我","text":"这里先出现倒流，南角旗骨才开始震。"},{"speaker":"顾长清","text":"我看到的也是这一处。师妹继续说。"},{"speaker":"旁白","text":"教习听完，在记录上落下复核印。顾长清未代我总结，也未把判断归到自己名下，只在我漏掉时补充一处风向。"},{"speaker":"旁白","text":"雨水沿台阶往下流，阵旗一面面收入木匣。对一个初入问剑台的弟子而言，被认真听完本身就是一份温和而郑重的认可。"}],"choices":[{"text":"陪顾长清收完阵旗","gainAffection":true,"body":[{"speaker":"我","text":"（接过软布擦干手腕）剩下两面旗，我们一起收。顾师兄守阵心，我来记编号。"},{"speaker":"顾长清","text":"好。方才那道倒流纹也记上，明日复阵会用到。"},{"speaker":"旁白","text":"顾长清抬旗，我逐一报出编号。山风把纸页吹得乱动，他放慢动作，等我每一笔写稳才走向下一处。"},{"speaker":"我","text":"顾师兄做事一向这么有耐心？"},{"speaker":"顾长清","text":"也分人。有人愿意认真看阵纹，我自然愿意等。"},{"speaker":"旁白","text":"最后一面阵旗入匣，顾长清替我托住沉重的另一端。两人沿湿石阶下台，他与我说起第一次学阵时也曾弄错旗序，语气坦然，未把自己摆在遥不可及的位置。"}]},{"text":"只收近处阵旗","gainAffection":false,"body":[{"speaker":"我","text":"药棚在叫人。我先过去，余下的旗劳烦顾师兄。"},{"speaker":"顾长清","text":"去吧。这里收好后，我把复阵记录送去药棚，你也能看一遍。"},{"speaker":"旁白","text":"顾长清把伤情木签交给我，又替我指出一条避开积水的近路。再回头时，他已经独自抬起南角阵旗。"}]},{"text":"先去查看伤员","gainAffection":false,"body":[{"speaker":"我","text":"先封住问剑台。旗骨裂痕查清前，谁也别再入阵。"},{"speaker":"顾长清","text":"正该如此。我去请阵堂落印，师妹把方才所见写进记录。"},{"speaker":"旁白","text":"顾长清未因我只是外门弟子而轻看这份判断。封印落下时，他将我的名字同自己并列写入见证栏。"}]}]},{"id":"gu-02","maleKey":"gu","male":"顾长清","title":"藏卷微光","length":"短","unlock":"完成事件《雨后收旗》","place":"藏书阁旧卷室","stage":"初识","intro":[{"speaker":"旁白","text":"旧卷室只点着一盏灯，防虫草的清苦气味积在木架间。高处卷册受潮发涨，我踩上踏凳去取，木板忽然晃了一下。"},{"speaker":"旁白","text":"顾长清及时扶稳凳脚，另一只手托住落下的旧卷。细灰扑进灯光，他偏过脸咳了一声，仍把卷册护得平整。"},{"speaker":"顾长清","text":"师妹先下来。这只踏凳有一条腿松了。"},{"speaker":"我","text":"还差最上面两册。"},{"speaker":"顾长清","text":"我取。师妹在灯下告诉我卷号，免得拿错。"},{"speaker":"旁白","text":"我落地后才发现他掌心被木刺划开一道细口。顾长清看见我的目光，轻轻合拢手指。"},{"speaker":"顾长清","text":"小伤。旧卷若摔散，重排更麻烦。"},{"speaker":"我","text":"手伸过来。我有药。"},{"speaker":"旁白","text":"顾长清依言摊开掌心，神色温和。灯芯轻爆，草木药香压过旧纸霉气，他静静等我把布条系好。"}],"choices":[{"text":"与他查到闭阁","gainAffection":true,"body":[{"speaker":"我","text":"高处由顾师兄取，我在下面核页码。若卷册太重，我们便一同托。"},{"speaker":"顾长清","text":"听师妹安排。卷号从庚字三十七开始。"},{"speaker":"旁白","text":"顾长清登上木梯，我仰头报号。每取下一册，他都先念一遍封面题记，等我确认才交到手中。"},{"speaker":"旁白","text":"查到末卷时，旧纸间掉出一片干枫叶。顾长清捡起来，夹回原处。"},{"speaker":"我","text":"一片叶子也要留下？"},{"speaker":"顾长清","text":"它在这里待了许多年，或许也是某个人想留住的东西。"},{"speaker":"旁白","text":"他说着看向我，灯火映在眼中，暖得平静。离开旧卷室前，他把那册卷号单独记下，约我修复后再一起翻看。"}]},{"text":"只查修缮日期","gainAffection":false,"body":[{"speaker":"我","text":"我坐在灯下抄录，顾师兄按年份取卷。这样省些时间。"},{"speaker":"顾长清","text":"好。字看不清的地方留白，别在夜里猜。"},{"speaker":"旁白","text":"两人一取一记，木架间只余翻页轻响。夜深以后，顾长清把灯挪近半尺，暖光恰好落在我笔下。"}]},{"text":"申请封存旧卷","gainAffection":false,"body":[{"speaker":"我","text":"踏凳坏了，今夜到这里。明日带工具来修好再查。"},{"speaker":"顾长清","text":"师妹说得对。线索值得查，犯不着拿自己冒险。"},{"speaker":"旁白","text":"顾长清把已取下的旧卷重新封好，又将松动踏凳横放在门口，免得后来的人误踩。"}]}]},{"id":"gu-03","maleKey":"gu","male":"顾长清","title":"一纸回音","length":"长","unlock":"完成主线《忘却之夜》","place":"主峰传讯廊","stage":"相熟","intro":[{"speaker":"旁白","text":"主峰传讯廊夜雾深重，纸鹤穿过檐角时，翅上凝着细小水珠。阿阮仍在丹房昏睡，我捏着药堂值夜名单站在灯下，字迹被雾气洇得发软。"},{"speaker":"旁白","text":"顾长清从值守处回来，把一封盖好阵印的回信放到我手边。他未立刻开口，先看了一眼名单上被我反复划过的时辰。"},{"speaker":"顾长清","text":"阿阮今夜由谁守？"},{"speaker":"我","text":"前半夜是我，后半夜还缺一人。药堂那边抽不开身。"},{"speaker":"顾长清","text":"我替你问过天衡峰医修。陆师叔后半夜会来，他认得失忆后的惊厥症状。"},{"speaker":"我","text":"顾师兄何时问的？"},{"speaker":"顾长清","text":"方才看见你第三次改名单时。"},{"speaker":"旁白","text":"廊外纸鹤振翅，带起一阵凉雾。顾长清将回信推近，封面写着阵眼查验结果，另夹了一张用寻常纸写的小笺。"},{"speaker":"我","text":"这张小笺写什么？"},{"speaker":"顾长清","text":"陆师叔问阿阮醒来后喜欢吃什么。我答不上来，留给师妹写。"},{"speaker":"旁白","text":"他能安排值守，也肯把自己不熟悉的地方坦然留给我。温热粥香从廊角传来，传讯弟子放下一只食盒便走。"},{"speaker":"顾长清","text":"粥是我请人送的。我们边吃边理名单，免得字越写越乱。"},{"speaker":"旁白","text":"传讯廊另一头有人送来阿阮的药方。顾长清看过药名，先把纸递给我，等我确认同温鹤丹先前开的方子一致。"},{"speaker":"我","text":"顾师兄也懂医理？"},{"speaker":"顾长清","text":"只认得常用药。真正拿主意的人是医修和陪着阿阮的你。"},{"speaker":"旁白","text":"他在回信末尾添上送药时辰，又把决定用哪一种安神草的位置空下来。笔墨有分寸，关心也有分寸。"},{"speaker":"我","text":"用月见草吧。阿阮熟悉这个气味。"},{"speaker":"顾长清","text":"我记下了。陆师叔到时也会看见。"},{"speaker":"旁白","text":"纸鹤衔着回信飞入夜雾。顾长清站在檐下看它越过主峰，直到灵光平稳落向丹房才收回目光。"}],"choices":[{"text":"当面谢过顾长清","gainAffection":true,"body":[{"speaker":"我","text":"（打开食盒，将一只空碗递给他）顾师兄也一起吃。值夜名单我们一人核一半。"},{"speaker":"顾长清","text":"好。我看时辰，师妹看阿阮熟悉的人。"},{"speaker":"旁白","text":"雾气贴着长廊流过，粥碗暖在掌心。顾长清不曾追问阿阮为何失忆，只听我讲她醒来时害怕什么、听见谁的声音会安心。"},{"speaker":"顾长清","text":"这些比阵法记录更要紧。医修知道以后，夜里会少惊动她。"},{"speaker":"我","text":"顾师兄总能顾到很多地方。"},{"speaker":"顾长清","text":"也会漏。师妹看见了，提醒我便好。"},{"speaker":"旁白","text":"名单核完时，两只碗都空了。顾长清将写有阿阮习惯的小笺单独封好，郑重程度同主峰公文毫无差别。"}]},{"text":"补充阵眼新线索","gainAffection":false,"body":[{"speaker":"我","text":"阵眼异动的形状，我想趁记忆还清楚先画下来。"},{"speaker":"顾长清","text":"师妹画，我替你记时辰与方位。想不起的地方留着，明日再补。"},{"speaker":"旁白","text":"顾长清压住被雾吹动的纸角，逐一核对我说出的细节。画到最后，食盒里的粥仍被保温符护着。"}]},{"text":"只取回信与名单","gainAffection":false,"body":[{"speaker":"我","text":"回信先送回丹房。阿阮醒来前，我想守在她身边。"},{"speaker":"顾长清","text":"去吧。名单和纸鹤留给我，天亮前送到药堂。"},{"speaker":"旁白","text":"顾长清替我推开传讯廊的侧门。离开时，我听见他重新向值守弟子确认陆医修的到院时辰。"}]}]},{"id":"gu-04","maleKey":"gu","male":"顾长清","title":"雾中封台","length":"短","unlock":"完成主线《九峰问道》","place":"九峰封阵台","stage":"相熟","intro":[{"speaker":"旁白","text":"九峰封阵台寒雾弥漫，铜铃被水汽冻得发涩。顾长清按水镜回落的时序复核阵纹，每过一道裂缝，便停下同值守弟子确认。"},{"speaker":"顾长清","text":"第五声以后，西侧石缝才会闭合。师妹重走一次，我在外圈记。"},{"speaker":"我","text":"（踏入第二道阵纹）水声停下再抬脚，对吗？"},{"speaker":"顾长清","text":"对。胸口若发闷，直接退出来。"},{"speaker":"旁白","text":"第三次走到阵心，雾水已经浸湿发梢。阵压忽然加重，我呼吸一滞，顾长清立刻按停铜铃，伸手扶住阵外石栏。"},{"speaker":"顾长清","text":"师妹看着我。现在能说话吗？"},{"speaker":"我","text":"能。只是气海发紧。"},{"speaker":"顾长清","text":"那便到这里。今日记录足够了。"},{"speaker":"旁白","text":"他的语气仍温和，停阵的动作毫不迟疑。阵堂弟子想赶在天亮前再试一次，顾长清只把记录摊开，请对方亲眼看我紊乱的气息。四周很快安静。"}],"choices":[{"text":"陪他复核阵台","gainAffection":true,"body":[{"speaker":"我","text":"等气息恢复，我们一起重走最后一遍。顾师兄照旧在外圈，别替我落脚。"},{"speaker":"顾长清","text":"好。师妹自己走，我只报时序。"},{"speaker":"旁白","text":"顾长清递来温水，耐心等到我呼吸平稳。重走阵纹时，他每次都在我抬脚前报出铃声，不多一步，也不少一声。"},{"speaker":"我","text":"这一次顺了。"},{"speaker":"顾长清","text":"是师妹自己稳住的。记录上也该这样写。"},{"speaker":"旁白","text":"封台落锁后，顾长清将我的名字写在共同复核一栏。雾气在杯口凝成细珠，掌心的寒意也一点点退去。"}]},{"text":"先照看受伤弟子","gainAffection":false,"body":[{"speaker":"我","text":"药棚还有受伤弟子。今日封台，先去看他们。"},{"speaker":"顾长清","text":"好。我把停阵原因写清，免得明日有人催你补走。"},{"speaker":"旁白","text":"顾长清封住现场，又让值守弟子清理湿滑石阶。我们离台时，医修传来的药香正从山道下方飘来。"}]},{"text":"封存旧令痕迹","gainAffection":false,"body":[{"speaker":"我","text":"旧令留下的灵光正在散。先封存痕迹，复核改到明日。"},{"speaker":"顾长清","text":"我来托拓纸，师妹落印。手指已经发冷，握印时别用蛮力。"},{"speaker":"旁白","text":"三方值守共同落印，旧令痕迹完整封入木匣。顾长清替我托住沉重匣底，回程时仍让步子随着我的呼吸。"}]}]},{"id":"gu-05","maleKey":"gu","male":"顾长清","title":"灯骨未折","length":"长","unlock":"完成主线《人间灯火》","place":"清河镇河岸","stage":"相熟","intro":[{"speaker":"旁白","text":"清河镇火势熄灭后的清晨，河岸飘着焦黑灯纸。湿木、灯油与烫伤药的气味交织在风里，碎灯骨随水拍上石阶，发出轻轻碰响。"},{"speaker":"旁白","text":"顾长清沿河岸逐处查看，身后跟着坊市管事与镇中里正。他听完三方说法，先把伤者安置、灯油批次与担保印分成三张纸。"},{"speaker":"里正","text":"昨夜损失已经登记，北街还有三户屋顶烧穿。"},{"speaker":"顾长清","text":"临时住处先拨。赔付与追责等证据齐全再定，伤者今日就要有地方休息。"},{"speaker":"旁白","text":"他说完蹲下，从水边捡起一截灯骨。竹条外层焦黑，折口仍有韧性，灯油沿着纹理渗进深处。"},{"speaker":"我","text":"灯骨落水前响过一声。火也许沿油线往东窜，屋主未必来得及看清。"},{"speaker":"顾长清","text":"师妹陪我重走一遍。看见的、听见的分开记。"},{"speaker":"旁白","text":"我们从桥口走到东街。顾长清每到一处都先请当事人说完，语气平和，从不替受惊的人整理答案。"},{"speaker":"我","text":"顾师兄问得很慢。"},{"speaker":"顾长清","text":"受过惊的人需要喘口气。我们来查原因，也要让他们知道往后的日子有人照应。"},{"speaker":"旁白","text":"日光升上河面，医棚传来伤者平安的消息。顾长清紧了一夜的眉间终于松开，先把临时住处的木签交给老人，才收起记录。"},{"speaker":"旁白","text":"老人领到临时住处的木签，仍站在河边舍不得走。顾长清陪他望了一会儿烧黑的屋梁，等老人自己开口说起屋内尚未取出的祖牌。"},{"speaker":"顾长清","text":"火场封锁解除后，我请巡防陪您回去找。今日先去暖和的地方。"},{"speaker":"旁白","text":"老人紧握木签，终于点头。顾长清替他提起湿透的行囊，只送到街口便交还家人，未让这份帮助显得居高临下。"},{"speaker":"我","text":"顾师兄连他想回去取什么也不问。"},{"speaker":"顾长清","text":"等他愿意说，比追问更快。"}],"choices":[{"text":"与他重走火场","gainAffection":true,"body":[{"speaker":"我","text":"我陪顾师兄重走火场。昨夜我听见的声音，由我逐处指认。"},{"speaker":"顾长清","text":"好。师妹记声音，我核灯油流向。彼此发现不合处，当场停下重看。"},{"speaker":"旁白","text":"我们沿焦痕走过三条街。顾长清在每一处停留，听我辨认木梁断裂、灯骨落水与人群奔跑的声音。"},{"speaker":"旁白","text":"最后一道焦痕封存后，河岸早市重新响起蒸饼叫卖。顾长清买来两只热饼，将温度更足的那只递给我。"},{"speaker":"我","text":"顾师兄也一夜未睡。"},{"speaker":"顾长清","text":"所以买了两只。坐在这里吃完，再回去交记录。"},{"speaker":"旁白","text":"我们坐在河阶上分食热饼。人间烟火一点点盖过焦苦气息，顾长清同我谈起复建后的灯市，语气里终于有了轻松笑意。"}]},{"text":"先封存灯骨","gainAffection":false,"body":[{"speaker":"我","text":"灯骨上的油渍还在扩散。先封存原物，免得日头晒过以后失真。"},{"speaker":"顾长清","text":"我请里正、坊市管事与宗门弟子共同落印。师妹记录取样位置。"},{"speaker":"旁白","text":"木匣封好后，顾长清亲手送入阴凉处。他把我的听证记录附在外层，未让任何一种证据压过另一种。"}]},{"text":"去医棚帮忙","gainAffection":false,"body":[{"speaker":"我","text":"医棚人手仍紧。我先去看伤者，火场记录晚些补。"},{"speaker":"顾长清","text":"去吧。昨夜经过我已经记下，伤情若有变化，请镇医把时辰留给我。"},{"speaker":"旁白","text":"我离开河岸时，顾长清正同老人确认临时住处。午后他提着一壶梨汤来到医棚，先问完伤者，才在门外等我。"}]}]},{"id":"gu-06","maleKey":"gu","male":"顾长清","title":"旧账夹页","length":"短","unlock":"完成主线《外门旧账》","place":"主峰旧档房","stage":"向信任过渡","intro":[{"speaker":"旁白","text":"主峰旧档房尘味沉重，翻页声在高墙间回响。顾长清从停用账簿里取出一张夹页，上面仍写着领取玄水阵材的旧名，领取年份一路延续到去年。"},{"speaker":"我","text":"这项工程十五年前已经停用。谁还在领料？"},{"speaker":"顾长清","text":"借旧项目转走物资。白玉令延期到明晨，使用记录也会一并留下。"},{"speaker":"旁白","text":"夜色渐深，档房炭火将要熄灭。顾长清重新添了两块银炭，又把温茶放到我翻页的右手边。"},{"speaker":"顾长清","text":"十五年的账一时查不完。师妹眼睛已经发涩，先闭目歇半刻钟。"},{"speaker":"我","text":"顾师兄自己也看了一夜。"},{"speaker":"顾长清","text":"那便轮流。你歇半刻钟，下一轮换我。"},{"speaker":"旁白","text":"他说得坦然，未将关心变成命令。高窗外雨声渐密，夹页上的朱砂批注在灯下微微反光。"}],"choices":[{"text":"与他守到天明","gainAffection":true,"body":[{"speaker":"我","text":"这一页由我抄录，顾师兄封存原册。我们守到交接的人来。"},{"speaker":"顾长清","text":"好。师妹抄得慢些，字迹清楚比时辰要紧。"},{"speaker":"旁白","text":"我落笔抄录，顾长清坐在对面核对年份。每翻过一页，他都将温茶往我这边推一点。"},{"speaker":"我","text":"说好轮流休息，顾师兄怎么还醒着？"},{"speaker":"顾长清","text":"在等师妹写完这一行。下一刻钟，我听你的。"},{"speaker":"旁白","text":"两份副本核对无误后，顾长清当真靠着椅背闭目休息。我替他守住炭火，也第一次看见温润从容之外，属于他的疲惫。"},{"speaker":"旁白","text":"晨光透进档房时，他醒来接过我手中的原册，声音还带着一点倦意。他先向我道谢，才低头查看封印。"}]},{"text":"先抄录夹页","gainAffection":false,"body":[{"speaker":"我","text":"我去医棚登记伤者，顾师兄核对账页。两边时辰可以互证。"},{"speaker":"顾长清","text":"好。医棚若留有阵材批号，请一并抄下。路上雨大，带这把伞。"},{"speaker":"旁白","text":"顾长清递来的伞柄仍带掌心温度。半夜两边记录合拢时，夹页上的批号终于对应到同一批灯油。"}]},{"text":"申请三方复核","gainAffection":false,"body":[{"speaker":"我","text":"赔付已经落印。我先去下游货栈追查阵材，账册留给顾师兄。"},{"speaker":"顾长清","text":"带上我的查验木签。沿水路走，遇见阻拦便回来，不必同人争执。"},{"speaker":"旁白","text":"我收下木签，顾长清又补了一张货栈方位图。图上未替我圈定路线，只把三处可能的入口标得清楚。"}]}]},{"id":"gu-07","maleKey":"gu","male":"顾长清","title":"阶前缓行","length":"长","unlock":"完成主线《筑基之争》","place":"问天石阶","stage":"信任","intro":[{"speaker":"旁白","text":"选拔散场后，问天石阶仍透着寒意。阵纹一层层向下延伸，我每走几步，气海便被余压攥紧，呼吸也跟着发涩。"},{"speaker":"旁白","text":"顾长清抱着待送主峰的封阵文书走在前方。听见我的脚步变轻，他回头看了一眼，随即将文书交给传讯鹤，自己走回我身侧。"},{"speaker":"顾长清","text":"气息还能顺着走吗？"},{"speaker":"我","text":"能走。每过一道阵纹，要缓一缓。"},{"speaker":"顾长清","text":"那便照这个速度。主峰的文书迟半刻钟也无妨。"},{"speaker":"旁白","text":"山风迎面压来，纸鹤振翅飞远。顾长清走在外侧，遇见阵纹前先停一步，等我自己调匀气息。"},{"speaker":"我","text":"顾师兄总陪着我，会耽误自己的行程。"},{"speaker":"顾长清","text":"今日行程本就留有余地。陪师妹下山，也在余地之中。"},{"speaker":"旁白","text":"石阶旁的松枝被风压低，清苦松香漫进冷空气。走到下一道阵纹时，我脚下发虚，顾长清抬起手臂停在身侧，等我决定要不要借力。"},{"speaker":"旁白","text":"半山传来钟声，石阶旁几株晚梅被风吹落花瓣。顾长清俯身拾起一片，随手夹进文书空白处，动作里多了几分闲适。"},{"speaker":"我","text":"顾师兄送公文也会看花？"},{"speaker":"顾长清","text":"走得慢，才发现这里有一株晚梅。以往总从它身边匆匆过去。"},{"speaker":"旁白","text":"他将夹着花瓣的空白页递给我看。花香极淡，混着山风与纸墨气息，给冷硬石阶添了一点春意。"},{"speaker":"顾长清","text":"今日陪师妹缓行，我也有所得。"},{"speaker":"我","text":"那这一程算不得耽误。"},{"speaker":"顾长清","text":"自然算不得。"},{"speaker":"旁白","text":"顾长清眼中浮起笑意。两人继续往下走，阵压仍在，山路已经不再显得漫长。"}],"choices":[{"text":"请他再慢些","gainAffection":true,"body":[{"speaker":"我","text":"（轻轻搭住他的手臂）借顾师兄一点力。等过了这道阵纹，我再自己走。"},{"speaker":"顾长清","text":"好。师妹照自己的步子，我跟着。"},{"speaker":"旁白","text":"顾长清放稳手臂，既未拉我，也未催促。衣袖带着晒过松木的清淡气息，扶起来安稳而有分寸。"},{"speaker":"我","text":"顾师兄不问我为何一定要走完全程？"},{"speaker":"顾长清","text":"师妹想自己走，自然有自己的理由。需要我知道时，你会告诉我。"},{"speaker":"旁白","text":"越过阵纹，我松开手。顾长清仍同我并肩，谈起山下新开的茶摊与今日云色，让漫长石阶不再只剩阵压与喘息。"},{"speaker":"旁白","text":"走到山脚，他将纸鹤带回的回信交给我看。主峰未催，文书也未误，他预留的余地足够安放这一段同行。"}]},{"text":"留在石亭调息","gainAffection":false,"body":[{"speaker":"我","text":"在石亭歇一会儿。等气息彻底平稳再下山。"},{"speaker":"顾长清","text":"正好。我也想看看方才的封阵记录，师妹若有力气，替我核一处时辰。"},{"speaker":"旁白","text":"顾长清把温茶分成两杯，文书摊在两人之间。这段休息也成了平等安静的共事。"}]},{"text":"请他先送文书","gainAffection":false,"body":[{"speaker":"我","text":"文书要紧。顾师兄先送主峰，我在这里等接应弟子。"},{"speaker":"顾长清","text":"我请两名值守上来，再动身。看见他们以前，我留在这里。"},{"speaker":"旁白","text":"顾长清传出纸鹤，未把我的拒绝当作逞强，也未独自离开。接应弟子现身石阶下方后，他才郑重交代阵压变化，转身赶往主峰。"}]}]},{"id":"gu-08","maleKey":"gu","male":"顾长清","title":"名简复核","length":"短","unlock":"完成主线《第九归者》","place":"水镜台名籍室","stage":"信任","intro":[{"speaker":"旁白","text":"水镜台名籍室寒气沉重，第九名简悬在阵盘上方，青光一次次扫过我的魂印。登记弟子的笔迟迟未落，门外传来压低的争执声。"},{"speaker":"顾长清","text":"名简暂缓入库。魂印相合只能证明有关联，改名、封存与归档都要问过本人。"},{"speaker":"我","text":"（看着阵盘上的旧名）若旧籍记着另一个名字呢？"},{"speaker":"顾长清","text":"旧籍记录从前。此刻站在这里的人是师妹。"},{"speaker":"旁白","text":"阵盘再次扫过魂印，寒光照得指尖发白。顾长清将暖玉放在案边，位置离我半掌远，既方便取用，也未擅自塞进手中。"},{"speaker":"我","text":"顾师兄不想知道第九名简是谁？"},{"speaker":"顾长清","text":"想知道。更在意你愿不愿意接受查到的答案。两件事可以分开。"},{"speaker":"旁白","text":"他说得平静，随后请三方值守重新落印。每一道手续都在保护名简，也在给我留下反悔与重选的余地。"}],"choices":[{"text":"与他共同复核","gainAffection":true,"body":   function giveGift(maleKeyValue,item){const male=maleByKey(maleKeyValue);if(!male||!inventoryCount(item))return;const refused=(XM_GIFT_DATA.refused[male.name]||[]).includes(item),compatible=XM_GIFT_DATA.matches[male.name]===item,alreadyYear=state.giftYearState[male.key]===state.currentYear;const record=state.giftRecords[male.key]||[];const firstEver=!record.some(entry=>entry.item===item);const reaction=refused?`${male.name}婉言谢绝了这份礼物。`:(firstEver?XM_GIFT_DATA.dialogues[item]?.[male.name]||`${male.name}收下了礼物。`:`${male.name}记得你曾送过这件东西，仍认真收下了。`);const settle=()=>{if(!refused)consumeItem(item);let gain=0;if(!refused&&compatible&&!alreadyYear&&state.affinities[male.key]<15){gain=1;state.affinities[male.key]++;state.giftYearState[male.key]=state.currentYear;}state.giftRecords[male.key].push({item,year:state.currentYear,reaction:reaction.replace(/\n+/g,' ').slice(0,150),gain});autosave();renderRomance(male.key);updateMainUI();toast(refused?'礼物未消耗':gain?`${male.name}好感＋1`:'对方收下了礼物，好感不变');};const showReaction=()=>showConfirm(`${male.name} · 收礼`,reaction.split(/\n\s*\n/).map(text=>`<p>${escapeHtml(text)}</p>`).join(''),[{label:refused?'收回礼物':'结束赠礼',className:'primary',onClick:settle}]);if(alreadyYear)showConfirm('本年度赠礼已结算',`<p>本次赠礼不会增加好感。${refused?'若被婉拒，礼物不会消耗。':'若对方收下，物品仍会消耗。'}</p>`,[{label:'取消',onClick:()=>{}},{label:'仍然赠送',className:'primary',onClick:showReaction}]);else showReaction();}

  function startRomanceEvent(eventId,review=false){
    const event=romanceEventById(eventId);if(!event)return;
    if(!review&&state.completedRomanceEvents.includes(event.id))return startRomanceEvent(event.id,true);
    if(!review&&!romanceEventAvailable(event)){toast('尚未满足事件前置条件');return;}
    const begin=()=>{state.narrative={kind:'romanceEvent',eventId:event.id,phase:'intro',introIndex:0,choiceIndex:null,resultIndex:0,pageIndex:0,review};autosave();playTrack('haogan');renderNarrative();};
    if(review)return begin();
    showConfirm(`《${escapeHtml(event.title)}》`,`<p>${escapeHtml(event.place)} · ${escapeHtml(event.stage)}</p><p>进入事件消耗1行动、2体力。剧情中只有一个选项增加好感。</p>`,[{label:'返回',onClick:()=>{}},{label:'进入事件',className:'primary',onClick:()=>performAction({cost:{actions:1,stamina:2},pending:{type:'romanceEvent',eventId:event.id},apply:begin})}]);
  }
  function romanceNarrativeEntry(event,n){return n.phase==='intro'?event.intro[n.introIndex]:event.choices[n.choiceIndex]?.body[n.resultIndex];}
  function renderRomanceNarrative(){
    const n=state.narrative,event=romanceEventById(n.eventId);if(!event)return exitStory();
    const background=romanceBackground(event);
    if(n.phase==='intro'&&n.introIndex>=event.intro.length){n.phase='choice';n.pageIndex=0;autosave();return renderRomanceNarrative();}
    if(n.phase==='choice'){showStoryPage({text:'请选择你的回应。',background,progress:`${event.male}纪事 · 《${event.title}》 · 选择`,choices:event.choices.map((choice,index)=>({text:choice.text,onClick:()=>chooseRomanceOption(index)}))});return;}
    if(n.phase==='result'&&n.resultIndex>=event.choices[n.choiceIndex].body.length)return finishRomanceEvent(event);
    const entry=romanceNarrativeEntry(event,n);if(!entry)return finishRomanceEvent(event);
    const pages=paginate(entry.text,210),text=pages[n.pageIndex]||pages[0],speaker=entry.speaker==='我'?currentName():entry.speaker;
    showStoryPage({text,speaker,char:entry.speaker==='我'?'player':'',background,progress:`${event.male}纪事 · 《${event.title}》 · ${n.phase==='intro'?'相逢':'结果'}`});
  }
  function advanceRomanceNarrative(){
    const n=state.narrative,event=romanceEventById(n.eventId);if(!event||n.phase==='choice')return;
    const entry=romanceNarrativeEntry(event,n),pages=paginate(entry?.text||'',210);
    if(n.pageIndex<pages.length-1)n.pageIndex++;
    else{n.pageIndex=0;if(n.phase==='intro')n.introIndex++;else n.resultIndex++;}
    autosave();renderRomanceNarrative();
  }
  function chooseRomanceOption(index){const n=state.narrative,event=romanceEventById(n.eventId);if(!event||!event.choices[index])return;n.phase='result';n.choiceIndex=index;n.resultIndex=0;n.pageIndex=0;autosave();renderRomanceNarrative();}
  function finishRomanceEvent(event){
    const n=state.narrative,choice=event.choices[n.choiceIndex],review=!!n.review,already=state.completedRomanceEvents.includes(event.id);let gain=0;
    if(!review&&!already){state.completedRomanceEvents.push(event.id);state.romanceEventChoices[event.id]=n.choiceIndex;if(choice?.gainAffection&&state.affinities[event.maleKey]<15){state.affinities[event.maleKey]++;gain=1;}}
    state.pendingResolution=null;state.narrative=null;autosave();showScreen('main');playTrack('main');updateMainUI();
    if(review){openPanel('romance');renderRomance(event.maleKey);toast(`回顾完《${event.title}》`);return;}
    showConfirm(`《${event.title}》完成`,`<p>${gain?`${escapeHtml(event.male)}好感＋1。`:'本次选择未增加好感。'}</p><p>当前关系：${escapeHtml(romanceStageFor(event.maleKey))} · 好感 ${state.affinities[event.maleKey]}</p>`,[{label:'返回主界面',onClick:()=>{}},{label:'返回人物纪事',className:'primary',onClick:()=>{openPanel('romance');renderRomance(event.maleKey);}}]);
  }

  function renderNarrative(){const kind=state.narrative?.kind;if(kind==='prologue')renderPrologue();else if(kind==='chapter')renderChapter();else if(kind==='explore')renderExploreNarrative();else if(kind==='romanceEvent')renderRomanceNarrative();}
  function advanceNarrative(){const kind=state.narrative?.kind;if(kind==='prologue')advancePrologue();else if(kind==='chapter')advanceChapter();else if(kind==='explore')advanceExploreNarrative();else if(kind==='romanceEvent')advanceRomanceNarrative();}
  function recoverPending(){if(state.narrative)return renderNarrative();const pending=state.pendingResolution;if(!pending)return;if(pending.type==='noEvent')showNoEvent(pending.mapId);else if(pending.type==='task'){const task=TASKS.find(item=>item.id===pending.taskId)||state.activeTask;if(task)showTaskChoices(task);}else if(pending.type==='exploreEvent'){const event=XM_EXPLORE_EVENTS.find(item=>item.id===pending.eventId);if(event)startExploreEvent(event);}else if(pending.type==='romanceEvent'){const event=romanceEventById(pending.eventId);if(event){state.narrative={kind:'romanceEvent',eventId:event.id,phase:'intro',introIndex:0,choiceIndex:null,resultIndex:0,pageIndex:0,review:false};autosave();playTrack('haogan');renderNarrative();}}else state.pendingResolution=null;}

  async function loadAndResume(key){const loaded=readState(key);if(!loaded){toast('没有可读取的存档');return;}await ensureAssetsForState(loaded);setState(loaded);hideConfirm();closePanel();if(state.narrative){renderNarrative();playTrack(state.narrative.kind==='chapter'?CHAPTER_MOOD[state.narrative.chapterIndex]||'richang':state.narrative.kind==='explore'?'forest':state.narrative.kind==='romanceEvent'?'haogan':'richang');}else{showScreen(state.prologueCompleted?'main':'character');playTrack('main');recoverPending();}toast('存档已读取');}
  function restartGame(){state=normalizeState(defaultState());window.playerState=state;localStorage.removeItem(STORAGE.auto);hideConfirm();closePanel();randomizeCharacter();showScreen('character');playTrack('main');}

  let passwordChecking=false;
  dom.passwordForm.addEventListener('submit',async event=>{
    event.preventDefault();
    if(passwordChecking)return;
    const value=dom.passwordInput.value;
    if(!value){dom.passwordError.textContent='请输入访问密码';dom.passwordInput.focus();return;}
    passwordChecking=true;
    dom.passwordSubmit.disabled=true;
    dom.passwordSubmit.textContent='正在核验…';
    dom.passwordError.textContent='';
    try{
      const digest=await passwordDigest(value);
      if(digest===ACCESS_HASH)await enterLoginAfterPassword();
      else{dom.passwordError.textContent='密码不正确，请重新输入';dom.passwordInput.select();}
    }catch{
      dom.passwordError.textContent='当前浏览器无法完成验证，请刷新后重试';
    }finally{
      passwordChecking=false;
      dom.passwordSubmit.disabled=false;
      dom.passwordSubmit.textContent='叩问山门';
    }
  });

  $('#newGameButton').addEventListener('click',()=>{if(characterDraftPrepared)renderCharacterDraft();else randomizeCharacter();showScreen('character');playTrack('main');});
  $('#continueButton').addEventListener('click',()=>loadAndResume(STORAGE.auto));
  $$('[data-go-login]').forEach(button=>button.addEventListener('click',()=>{showScreen('login');playTrack('main');}));
  $('#randomCharacterButton').addEventListener('click',randomizeCharacter);
  $('#previousPortrait').addEventListener('click',()=>{characterDraft.portrait=(characterDraft.portrait-1+XM_PLAYER_PORTRAITS.length)%XM_PLAYER_PORTRAITS.length;renderCharacterDraft();});
  $('#nextPortrait').addEventListener('click',()=>{characterDraft.portrait=(characterDraft.portrait+1)%XM_PLAYER_PORTRAITS.length;renderCharacterDraft();});
  $('#confirmCharacterButton').addEventListener('click',()=>{const name=dom.nameInput.value.trim();if(!name||name.length>4){toast('请输入一至四字姓名');return;}state=normalizeState(defaultState());state.player={name,portrait:characterDraft.portrait,origin:characterDraft.origin,root:characterDraft.root};window.playerState=state;autosave();playTrack('richang');enterPrologueScene('mountain_view');});
  $$('[data-panel]').forEach(button=>button.addEventListener('click',()=>openPanel(button.dataset.panel)));
  $('#closePanelButton').addEventListener('click',()=>closePanel());
  dom.panelOverlay.addEventListener('click',event=>{if(event.target===dom.panelOverlay)closePanel();});
  dom.musicQuick.addEventListener('click',toggleMusic);
  $('#leaveStoryButton').addEventListener('click',()=>{if(!state.prologueCompleted){showConfirm('序章尚未完成','<p>入门名籍尚未登记完毕，可以继续阅读或重新开始。</p>',[{label:'继续阅读',onClick:()=>{}},{label:'重新开始',className:'danger',onClick:restartGame}]);return;}showConfirm('暂离剧情','<p>当前阅读位置已经自动保存。返回主界面后，重新进入相应功能即可继续。</p>',[{label:'继续阅读',onClick:()=>{}},{label:'返回主界面',className:'primary',onClick:()=>{showScreen('main');playTrack('main');}}]);});
  dom.storyDialogue.addEventListener('click',advanceNarrative);
  window.addEventListener('resize',()=>{
    const draftSrc=dom.portrait.getAttribute('src');if(dom.character.classList.contains('active')&&draftSrc)placePortrait(dom.portrait,draftSrc,'draft',false);
    const storySrc=dom.storyPortrait.getAttribute('src');if(dom.story.classList.contains('active')&&storySrc)placePortrait(dom.storyPortrait,storySrc,'story',storySrc.includes('/male/'));
  },{passive:true});

  dom.panelContent.addEventListener('change',event=>{if(event.target.matches('[data-farm-plan]')){state.farmPlans[event.target.dataset.farmPlan]=event.target.value;autosave();}if(event.target.matches('[data-volume]')){state.settings.volume=Number(event.target.value);dom.bgm.volume=state.settings.volume;autosave();}if(event.target.matches('[data-text-size]')){state.settings.textSize=Number(event.target.value);updateMainUI();autosave();}});
  dom.panelContent.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.sectView)renderSect(target.dataset.sectView);
    else if(target.dataset.startChapter)startChapter(Number(target.dataset.startChapter));
    else if(target.hasAttribute('data-resume-story')){playTrack(state.narrative?.kind==='chapter'?CHAPTER_MOOD[state.narrative.chapterIndex]||'richang':state.narrative?.kind==='romanceEvent'?'haogan':'forest');renderNarrative();}
    else if(target.dataset.reviewChapter)startChapter(Number(target.dataset.reviewChapter),true);
    else if(target.dataset.startRomanceEvent)startRomanceEvent(target.dataset.startRomanceEvent);
    else if(target.dataset.reviewRomanceEvent)startRomanceEvent(target.dataset.reviewRomanceEvent,true);
    else if(target.dataset.map)beginMap(target.dataset.map);
    else if(target.dataset.revealTask!==undefined){const index=Number(target.dataset.revealTask);if(!state.taskBoard.revealed.includes(index))state.taskBoard.revealed.push(index);autosave();renderSect();}
    else if(target.dataset.acceptTask!==undefined)acceptTask(Number(target.dataset.acceptTask));
    else if(target.hasAttribute('data-abandon-task'))showConfirm('放弃当前任务','<p>放弃后本旬不能重新抽取任务签，但可以从剩余签中另选。</p>',[{label:'取消',onClick:()=>{}},{label:'确认放弃',className:'danger',onClick:()=>{state.activeTask=null;autosave();renderSect();}}]);
    else if(target.hasAttribute('data-farm'))doFarm();
    else if(target.hasAttribute('data-rest'))doRest();
    else if(target.hasAttribute('data-breakthrough'))doBreakthrough();
    else if(target.hasAttribute('data-next-period'))nextPeriod();
    else if(target.dataset.useItem)useItem(target.dataset.useItem);
    else if(target.dataset.buy)buyItem(target.dataset.buy);
    else if(target.dataset.sell)sellItem(target.dataset.sell,Math.max(0,(SHOP.find(item=>item.name===target.dataset.sell)?.price||1)-1));
    else if(target.dataset.sellCrop)sellItem(target.dataset.sellCrop,Number(target.dataset.price));
    else if(target.dataset.romance)renderRomance(target.dataset.romance);
    else if(target.hasAttribute('data-romance-back'))renderRomance();
    else if(target.hasAttribute('data-romance-close'))closePanel();
    else if(target.hasAttribute('data-romance-music')){toggleMusic();renderRomance();}
    else if(target.dataset.giftMale)giveGift(target.dataset.giftMale,target.dataset.giftItem);
    else if(target.dataset.saveSlot){saveState(STORAGE[target.dataset.saveSlot]);renderSave();toast('存档已保存');}
    else if(target.dataset.loadSlot)loadAndResume(STORAGE[target.dataset.loadSlot]);
    else if(target.hasAttribute('data-restart'))showConfirm('重新开始','<p>自动存档将被清空，两个手动存档不会删除。</p>',[{label:'取消',onClick:()=>{}},{label:'重新开始',className:'danger',onClick:restartGame}]);
    else if(target.hasAttribute('data-toggle-music')){toggleMusic();renderSettings();}
  });

  function init(){
    updateMainUI();
    const auto=readState(STORAGE.auto);
    $('#continueButton').disabled=!auto;
    const granted=accessGranted();
    showScreen('password');
    playTrack('main');
    if(granted)enterLoginAfterPassword();
    else setTimeout(()=>dom.passwordInput.focus(),80);
  }
  init();
})();

  </script>
</body>
</html>
